name: tests
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev libtbb-dev cmake
      - uses: r-lib/actions/setup-renv@v2
      - name: Run tests
        run: Rscript scripts/run_tests.R
      - name: Step 1 summary
        run: Rscript scripts/02_validate_step1.R && Rscript scripts/02_validate_step1.R k2020
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-and-results
          path: |
            logs/
            results/step1/
            results/step1_k2020/
