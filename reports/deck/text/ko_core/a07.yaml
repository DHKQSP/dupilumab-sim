A7:
  kicker: "별첨 A7 · 채혈 일정"
  title: "현행 B0(Day {last}까지 {n}회 채혈)를 유지한다: 채혈 후보 어느 것도 두 모델에서 결정 기준 (a)~(d)를 충족하지 못했다"
  table:
    head: ["후보 일정: 추가 채혈일\n(각 칸 2016 / 2020 모델;\nv1.0 일정 모의)", "(a) AUClast {ci}% 신뢰구간 평균 폭 감소 (%, 음수 = 넓어짐)", "(b) 선형 소실 ×{ke} 제품의 AUClast 통과율 변화 (%p)", "(c) AUCinf 신뢰 충족률 변화, 세트 (ii) (%p)", "(d) NCA 외삽 {x}% 초과 비율 (B0 대비 배)", "참고: 신뢰할 수 있는 AUCinf 변화, 세트 (iii) (%p)"]
    crit: ["추가 권고 기준 (하나라도)", "{a} 이상", "+{b} 이상", "+{c} 이상", "{d} 이하", "기준 아님"]
    added: "{s}: Day {d}"
    removed: "B-: Day {d} 제거"
    na: "미산출"
  bullets:
    - "D1~D4와 Day {d50} 제거(B-)는 어느 기준도 충족하지 않았다. B-는 외삽 {x}% 초과 비율을 B0의 {bmd1}배로 늘리고, 판정 기록은 AUCinf 2차 평가변수와 대응안에 쓸 말단 점으로 Day {d50}을 남긴다."
    - "민감도 변형(양 군 최대 소실 속도(Vmax) ×{vm})에서는 D3가 기준 (d)를 충족했으나({d1}, {n1}명; {n2}명 재평가 {d2}), 판정 기록은 B0를 유지했다."
  caption: "Vmax ×{vm} 변형의 B0 유지 사유(판정 기록 D-031): 부트스트랩 95% 구간 {ci}가 {d} 포함, 감소 arm당 {ab}명, 추가 방문 {vis}회, 규칙에 절대 하한 없음. 결정 규칙은 첫 일정 모의 뒤, 결과 보고 전에 정했다(사전 규정 아님). (a)·(b)는 합동 t 검정(M0)의 시험 수준, (c)·(d)·세트 (iii)은 대상자 수준 결과다."
  notes: |
    현행 B0는 Syneos 기본 일정으로 {n}회 채혈한다(투여 {h}시간 뒤와 연구일 Day {b0}; Day 1 = 투여일). 후보 D1~D4는 후반에 두~네 점을 더하고, B-는 Day {d50}을 뺀다. 추가 채혈점 하나는 시험 전체에서 방문 {cost}회다(D1, D2, D3, D4, B- 순으로 {vis}회). 자료는 모델마다 대상자 {nsub}명, 시험 {ntr}회다.
    결정 규칙(보고서 3.9절, DECISIONS D-026): B0 대비 (a) AUClast {ci}% 신뢰구간 평균 폭이 {a}% 이상 감소, (b) 선형 소실 속도상수(ke) ×{ke} 제품 시나리오의 AUClast 통과율이 +{b}%p 이상 증가, (c) AUCinf 신뢰 충족률(세트 (ii), 원래 정의)이 +{c}%p 이상 증가, (d) NCA 외삽 {x}% 초과 비율이 B0의 {d}배 이하 중 하나라도 충족하면 추가 채혈을 권고하고, 모두 미충족이면 B0를 유지한다. 판정 기록(config/schedule_decision.yaml, {date})의 최종 일정은 B0다.
    규칙의 시점(사전 명시 등록부, regulatory/tables/prespecification_register.csv): '{st}'({sd}). 첫 일정 모의 뒤, 결과 보고 전에 정했으므로 사전 규정이라 부르지 않는다.
    (a)·(b)는 시험 수준 결과로, 일정 판정 모의 때 설계의 분석법(합동 t 검정, M0)으로만 계산했다(체중 층을 넣은 M1로 다시 계산하지 않음). (a)는 양수가 폭이 좁아지는 쪽이다: 추가 채혈 D1~D4 중 폭이 좁아진 것은 2020 모델 D3뿐이고 가장 큰 감소도 {amax}%로 기준 {a}%에 못 미친다. (c)·(d)는 대상자 수준이라 분석 모형과 무관하다.
    (c)의 세트별 범위(D1~D4, 두 모델): 세트 (i) {irng}%p, 세트 (ii) {iirng}%p(최대 {cii}%p). 참고 열의 세트 (iii)(이 덱의 신뢰할 수 있는 AUCinf)은 같은 대상자 {n3}명(모델마다)에서 B0 {b16}(2016 모델), {b20}(2020 모델) 대비 {r3}%p 바뀐다: D1, D2, D4에서는 오히려 줄고, 주 두 번 채혈(D3)에서만 {d3} 오른다(S6). B-의 세트 (iii)은 계산하지 않았다.
    (d) D3: {dboot}(2016 모델 / 2020 모델, 부트스트랩 95% 구간). {n200}명 재평가: 2016 모델 {e16}, 2020 모델 {e20}으로 기준 {d} 미충족이다.
    민감도 변형(판정 기록 D-031, D-037): 모든 곡선·잔차·체중 변형 가운데 규칙상 추가 채혈이 권고된 곳은 양 군 Vmax ×{vm} 변형의 D3 하나다(기준 (d) 단독: {d1}, {n1}명, 부트스트랩 95% 구간 {ci}). 같은 변형의 {n2}명 재평가는 {d2}({d2ci})로 기준 {d}를 넘었다. 판정 기록(config/schedule_decision.yaml)은 규칙을 주 모델(2016 모델)에 적용하고 변형은 견고성 평가로만 쓰며, 이 권고를 판단으로 받아들이지 않았다: (a)·(b)·(c)는 모든 변형에서 미충족, 부트스트랩 구간이 {d}를 포함, 외삽 {x}% 초과 대상자의 절대 감소가 arm당 {ab}명으로 한 명에 못 미침, 대가는 추가 방문 {vis}회. 기록은 발생률이 낮은 사건의 상대 감소 기준에 절대 하한(예: arm당 최소 인원)이 필요했다는 교훈도 적고, 이번 판정에는 소급하지 않았다.
    v1.0 결과: 일정 판정 모의와 판정 기록({date})은 v1.0.1 사전 등록({pd})보다 앞선 v1.0 결과다. 참고 열의 세트 (iii) 변화만 핵심 덱 사전 등록(config/prereg_20260929.yaml)으로 새로 계산했다. B0의 신뢰할 수 있는 AUCinf 비율은 {b16}(2016 모델), {b20}(2020 모델)이다.
    Day {d50} 제거(B-): 판정 기록의 사유는 AUCinf 2차 평가변수와 대응안(fallback)에 쓸 말단 점 확보다. 빼면 신뢰구간 평균 폭은 {bma}% 좁아지지만(기준 (a) {a}%에 못 미침) NCA 외삽 {x}% 초과 비율이 B0의 {bmd}배가 되고 세트 (ii) 신뢰 충족률이 {bmc}%p 바뀐다(2016 모델 / 2020 모델).
    Day {last} 이후 채혈 일정은 어느 결과 파일에서도 모의하지 않았다(DECISIONS D-016에서 철회한 연장안 포함).
    관련 보고서: 3.9절, 5.7절(Table 5-14), 6.4절.
