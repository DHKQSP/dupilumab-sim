S7:
  kicker: "③ 판정 성능: 1종 오류와 2종 오류"
  xref: "세부: 별첨 A5a(경계 칸 분류), A5b(분석 모형), A5c(운용특성 곡선 전체), A5d~A5f(가이드라인 기본 구성의 오류 원인)"
  title:                                        # 사전 등록 규칙(config/prereg_20260929_oc.yaml section8 wording)으로 고른다
    prefix: "AUClast + Cmax만 두 오류를 모두 통제한다:"
    f3_cost: "AUCinf를 더하면 동등 제품 입증 실패가 늘고"
    f3_cost_ellipsis: "AUCinf를 더하면 동등 제품 입증 실패가"          # 뒤 절이 "는다"로 끝날 때(g2_both, g2_type1)
    f3_small: "AUCinf를 더해도 얻는 보호가 없고"
    g2_both: "대신 쓰면 비동등 제품 통과가 는다"
    g2_type1: "대신 쓰면 비동등 제품 통과가 는다"
    g2_none: "대신 써도 두 오류는 비슷하다"
  fig:
    sub: "동등 판정 확률: {model}, 표적 매개 소실만 바꾼 시험약"
    xlab: "참 AUCinf 비(로그 눈금). 양 끝 점 = 1종 오류, 점선 = 이상적 판정"
    out: "여기서 통과\n= 1종 오류"
    inn: "여기서 실패 = 2종 오류"
    cfg:
      P2: "AUClast + Cmax"
      F3A_iii: "+ AUCinf"
      G2A_iii: "AUCinf + Cmax"
  tab:
    title: "요약: 두 모델 범위, 1종 오류는 경계 {n}칸 최대"
    head: ["판정 구성", "1종 오류\n최대", "2종 오류\n동일 제품", "2종 오류\n참 비 {a}·{b}"]
    rows:
      P2: "AUClast + Cmax"
      F3A_iii: "+ AUCinf"
      G2A_iii: "AUCinf + Cmax"
    dagger: "†"
    ddagger: "‡"
    note2: "‡ 2020 모델 말초 분포 칸: 추정 대상 차이(별첨 A5b)."
    note: "† 흡수 속도 {t} 칸(참 Cmax 비 {cr})."
  body:
    f3_some: "AUCinf를 더하면 1종 오류가 {k1}칸에서 {thp} 이상 줄지만({k2}칸은 이미 {nom} 이하) 2종 오류가 는다(동일 제품 {y})."
    f3_none: "AUCinf를 더하면 1종 오류는 거의 줄지 않고(최대 {x}) 2종 오류만 늘어난다(동일 제품 {y}, 최대 {z})."
    f3_small: "AUCinf를 더해도 얻는 보호는 없고 비용은 작다(1종 오류 감소 최대 {x}, 동일 제품 2종 오류 증가 {y})."
    g2_both: "AUCinf로 바꾸면 신뢰 기준 적용 시 두 오류가 모두 커지고, 적용하지 않아도 1종 오류가 커진다(별첨 A5d)."
    g2_type1: "AUCinf로 바꾸면 1종 오류가 커진다(신뢰 기준 적용 여부와 무관, 별첨 A5d)."
    g2_none: "AUCinf로 바꾸어도 두 오류는 크게 다르지 않다(별첨 A5d)."
  caption: "분석 모형 M1. AUCinf = 신뢰 기준(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%) 충족자만. 기전 하나만 바꾼 가상 제품, 조건당 시험 {ro}회 이상."
  yn:
    "TRUE": "충족"
    "FALSE": "미충족"
  notes: |
    문구 규칙(사전 등록, 결과 전 고정; 두 모델 모두 충족해야 주장): 제목 앞부분(P2 1종 오류 최대 {thT} 이하이고 동일 제품 2종 오류가 가장 낮음) {ruleT}, 규칙 4a(G2의 동일 제품 2종 오류가 P2보다 {th4} 이상 큼) {r4a}, 규칙 4b(F3의 2종 오류 증가가 모든 조건에서 {th4} 미만) {r4b}, '거의 줄지 않음'(F3의 1종 오류 감소 최대 {thp} 미만) {rpr}.
    AUClast + Cmax의 1종 오류 최대 {p2max}는 주 모델의 말초 분포 증가 칸이며, AUClast 비가 참 AUCinf 비보다 1 쪽으로 치우친 추정 대상 차이다(별첨 A5b). 같은 칸에서 AUCinf를 더하면 1종 오류가 줄어드는 것도 이 때문이다.
    민감도: 규칙 B(λz 산출 전원)로 바꾸면 AUCinf + Cmax의 1종 오류 최대는 {g2bmax}, 세 지표는 {f3bmax}다(별첨 A5c). 참 비 {c4a}~{c4b}에서 AUCinf + Cmax가 AUClast + Cmax보다 더 자주 통과하는 칸(사전 등록 규칙 4c, 쌍대 95% 구간 하한이 양수)은 {n4c}개다{c4det}. 좋은 성능이 아니라 AUCinf가 1 쪽(동등 판정 쪽)으로 치우친 결과이며, 같은 기전의 경계 칸에서는 이 치우침이 1종 오류로 나타난다(별첨 A5c, A5d).
    본문 첫 줄 세부: AUCinf를 더하면 1종 오류 감소는 최대 {x}(2020 모델 말초 분포 증가 칸, AUClast + Cmax가 {nom}를 넘는 유일한 칸), 2종 오류 증가는 최대 {z}다.
    조건당 시험: 경계·동일 제품 {rb}회 이상(연장 칸 {rx}회), 참 비 {a}·{b} {rn}회, 그 밖 {ro}회. 본문의 2종 오류 증가 최대는 동일 제품과 참 비 {c}·{a}·{b}·{d} 칸(참 Cmax 비도 한계 안) 중 최댓값이다(별첨 A5c).
    AUCinf 정의: 신뢰할 수 있는 AUCinf(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%)를 얻은 대상자만 쓴다(규칙 A, 세트 (iii)). 곡선은 주 모델의 표적 매개 소실 기전이다. 다른 기전과 2016 모델은 별첨 A5c.
