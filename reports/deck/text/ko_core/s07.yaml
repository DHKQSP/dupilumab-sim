S7:
  kicker: "② 총노출 포착"
  title: "AUClast/AUCinf는 대표 대상자에서 {med}, 가장 불리한 대상자도 {min}다"
  fig:
    head: "AUClast/AUCinf = {v}%"
    role:
      median: "중앙값 대상자"
      p05: "5번째 백분위수 대상자"
      min: "최솟값 대상자"
    xlab: "연구일"
    tlast: "tlast"
    ratio: "비구획 외삽 면적은\n실제의 {r}배"
    no_lz: "λz 산출 불가:\n비구획 외삽 없음"
  body:
    - "파랑은 AUClast(Day 1~마지막 정량 시점 tlast), 주황은 tlast 이후 외삽 면적이다. 세 대상자는 {nsub}명 중 AUClast/AUCinf의 중앙값·5번째 백분위수·최솟값이다."
  caption: "참 AUCinf는 모델 적분값이다. 비구획 AUCinf는 외삽 면적을 오히려 과대추정한다(2016 모델 외삽 비율 중앙값 {nca} 대 실제 {true})."
  notes: |
    대상자(2016 모델, 건강인 {wt} kg, 현행 채혈): 중앙값 id {i1}, 5번째 백분위수 id {i2}, 최솟값 id {i3}. 관측 tlast는 각각 Day {t1}, {t2}, {t3}이다. 선택 규칙은 사전 등록(동률이면 작은 id)이고, 대상자 곡선은 저장된 결과와 같은 시드로 다시 만들어 NCA 값이 저장된 값과 일치함을 확인했다(scripts/63).
    삽입도: 로그 눈금으로 tlast 직전 방문부터 절벽 이후까지. 점선은 비구획 외삽선(Clast x exp(-λz(t - tlast))), 빗금은 그 아래 면적(비구획 외삽), 주황은 참 곡선 아래 면적(참 외삽)이다. 배수는 무한대까지의 두 면적의 비다: 중앙값 대상자 비구획 {a1} 대 참 {b1} mg·day/L.
    최솟값 대상자는 비구획 외삽이 오히려 작다({a3} 대 {b3}, {q3}배): tlast 직후 참 곡선이 비구획 외삽선보다 천천히 떨어지기 때문이다. 이 대상자의 adjusted R²는 {r3}, 비구획 외삽 비율은 {e3}로 신뢰할 수 있는 AUCinf 기준에 못 미친다.
    모집단(2016 모델): 비구획 외삽 비율 95번째 백분위수 {p95n}, 참 외삽 비율 95번째 백분위수 {p95t}.
