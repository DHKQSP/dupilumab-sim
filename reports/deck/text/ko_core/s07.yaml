S7:
  kicker: "② 총노출 포착"
  title: "AUClast/AUCinf는 중앙값 대상자에서 {med},\n모의 대상자 중 최솟값도 {min}다"
  fig:
    head: "AUClast/AUCinf = {v}%"
    role:
      median: "중앙값 대상자"
      p05: "5번째 백분위수 대상자"
      min: "최솟값 대상자"
    xlab: "연구일"
    tlast: "tlast"
    sub: "{role} · 농도(mg/L)"
    ratio: "비구획 외삽 면적은\n참값의 {r}배"
    no_lz: "λz 산출 불가:\n비구획 외삽 없음"
  body:
    - "참 곡선 아래 파랑 = AUClast(Day 1~마지막 정량 시점 tlast), 주황 = tlast 이후 참 곡선 아래 면적(참 외삽)."
  caption:
    - "참 AUCinf는 모델 적분값이다. 비구획 AUCinf는 외삽 비율을 대체로 과대추정한다(중앙값 {nca} 대 참 {true})."
    - "신뢰할 수 있는 AUCinf 충족자도 비구획 외삽 면적이 참값의 중앙값 {rr}배다. 최솟값 대상자({q3}배)는 예외(노트)."
    - "2016 모델 {nsub}명 중. 선 = 참 농도, 점 = 관측(빈 점 = 정량한계 미만), 세로 점선 = 관측 tlast. 삽입도: 점선 = 비구획 외삽선, 빗금 = 비구획 외삽."
  notes: |
    대상자(2016 모델, 건강인 {wt} kg, 현행 채혈): 중앙값 id {i1}, 5번째 백분위수 id {i2}, 최솟값 id {i3}. 관측 tlast는 각각 Day {t1}, {t2}, {t3}이다. 선택 규칙은 사전 등록(동률이면 작은 id)이고, 대상자 곡선은 저장된 결과와 같은 시드로 다시 만들어 NCA 값이 저장된 값과 일치함을 확인했다(scripts/63).
    삽입도: 로그 눈금으로 tlast 직전 방문부터 절벽 이후까지. 점선은 비구획 외삽선(Clast × exp(-λz(t - tlast))), 빗금은 그 아래 면적(비구획 외삽), 주황은 참 곡선 아래 면적(참 외삽)이다. 배수는 무한대까지의 두 면적의 비다: 중앙값 대상자 비구획 {a1} 대 참 {b1} mg·day/L.
    최솟값 대상자는 비구획 외삽이 오히려 작다({a3} 대 {b3} mg·day/L, {q3}배). 관측 Clast({cobs} mg/L)가 측정 잔차로 같은 시점 참 농도({ctrue} mg/L)의 {cr}배였기 때문이다. 참 농도에서 같은 λz로 외삽하면 참 외삽 면적의 {xr}배다.
    세 대상자 모두 신뢰할 수 있는 AUCinf 기준에 못 미친다(adjusted R² {r1}, {r2v}, {r3}; 최솟값 대상자의 비구획 외삽 비율 {e3}). 대표 대상자는 창 포착률로 골랐기 때문이다. 모집단에서 비구획 외삽 면적 / 참 외삽 면적은 λz 산출 전원 중앙값 {ea}배, 신뢰할 수 있는 AUCinf 충족자 중앙값 {rr}배이고, 비구획 쪽이 작은 대상자는 충족자의 {b1p}(2016 모델), {b2p}(2020 모델)뿐이다(results/core_deck/extrap_ratio_by_group.csv, 추가 사전 등록).
    외삽 비율 중앙값의 모수: 비구획 {nca}는 λz를 산출한 대상자, 참 {true}는 전원이다. 정량한계 선(회색 점선)은 선형 눈금의 본 그림에서는 가로축에 겹쳐 보이지 않아 삽입도에만 보인다. 점은 관측 농도(측정 잔차 포함)라 참 곡선에서 벗어난다. 제목의 최솟값은 한 번의 모의 추출(2016 모델 {nsub}명)의 값이다(S2 노트).
    모집단(2016 모델): 비구획 외삽 비율 95번째 백분위수 {p95n}, 참 외삽 비율 95번째 백분위수 {p95t}.
