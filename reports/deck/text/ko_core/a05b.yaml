A5b:
  kicker: "별첨 A5b · ③ 세부: 분석 모형과 AUClast + Cmax의 점추정 {nom} 초과 한 칸"
  title: "AUCinf + Cmax는 M0·M1 모두 {n}칸 중 {k}칸의 점추정이 {nom}를 넘고,\nAUClast + Cmax의 점추정 {nom} 초과 한 칸은 AUClast 편향에서 나온다"   # \n: 줄 나눔 자리(core_title)
  head_a: "(a) 경계 {n}칸 중 점추정 {nom} 초과 칸 수 · 최대"
  head_b: "(b) AUClast + Cmax 한 칸의 분해"
  table:
    head: ["판정 구성", "M0\n층 없음", "M1\n체중 층", "M2\nlog 체중"]   # \n: 머리글 칸 안 줄바꿈
    cell: "{k} · {mx}"
    na: "미산출"
    rows:
      P2: "AUClast + Cmax"
      A_iii: "AUCinf + Cmax, 규칙 A (iii)"
      A_i: "AUCinf + Cmax, 규칙 A (i)"
      A_ii: "AUCinf + Cmax, 규칙 A (ii)"
      B: "AUCinf + Cmax, 규칙 B"
      C_i: "AUCinf + Cmax, 규칙 C (i)"
  fig:
    sub: "2020 모델 말초 분포 증가 칸, M1\n가로선: Wilson 95% 구간"
    xlab: "경계 1종 오류 (%)"
    nom: "명목 {v}"
    rows:
      ref: "참 AUCinf로 판정\n(편향 없는 기준)"
      last: "AUClast 단독"
      p2: "AUClast + Cmax"
    d_last: "AUClast 편향 효과 {d}%p"
    d_cmax: "Cmax 추가 효과 {d}%p"
    ci: "95% 구간 {lo}~{hi}"
  body:
    - "점추정이 {nom}를 넘는 AUClast + Cmax 한 칸(M1·M2는 Wilson 초과, M0는 명목)은 AUClast 기하평균비(GMR)가 동등 쪽으로 {bias} 치우친 결과로, {n}칸 중 이 칸뿐이다."
  mech:
    - "기전(M1): 표적 소실 증가 칸(참 비 {tvx})에서 비구획 AUCinf GMR이 1 쪽으로 {bi16}·{bi20} 치우친다(2016/2020 모델; λz 산출 전원 {bb16}·{bb20})."
  caption:
    - "규칙 A: 미달자 제외, 세트 (i) adjusted R² ≥ {r2i}·외삽 ≤ {ex}%, (ii) (i) + span ≥ 반감기 {span}배, (iii) 신뢰할 수 있는 AUCinf"
    - "규칙 B: λz 산출 전원 · 규칙 C: 미달자에 AUClast 대입 · M1: 체중 층(주분석 후보) · 미산출: 사전 등록 범위(M0·M1) 밖"
  notes: |
    (a) 분석 모형: M0는 로그 척도 합동 t 검정(현행), M1은 투여군과 무작위배정 체중 층(층 경계 {split} kg)을 고정 효과로 둔 분산분석(주분석 후보, 의뢰자 결정), M2는 log 체중 공분산분석(민감도)이다. 칸 수는 경계 1종 오류 점추정이 {nom}를 넘는 칸이다. Wilson 하한까지 {nom}를 넘는 칸(초과)은 M1에서 규칙 A (iii) {lo_iii}칸, 규칙 B {lo_b}칸이다. 기준 세트별 구성(criteria_g2_type1.csv)은 사전 등록에서 M0와 M1만 돌려 M2 칸은 미산출이다. 규칙 A (ii)는 사전 명시 원래 정의다. 참고로 규칙 A (iv)는 M1에서 {aiv}칸(최대 {aivx}), 규칙 C (iv)는 최대 {civ}다. 규칙 A (iii)의 신뢰할 수 있는 AUCinf = adjusted R² ≥ {r2}, 외삽 ≤ {ex}%.
    AUCinf 쪽 기전(규칙 A (iii), M1; criteria_bias.csv): 시험약이 표적 매개 소실에서 다르면(표적 소실 증가 칸, 참 AUCinf 비 {tvx}) 비구획 AUCinf 기하평균비가 참 비보다 1 쪽으로 2016 모델 {bi16}, 2020 모델 {bi20} 치우치고, λz 산출 전원(규칙 B)으로 구해도 {bb16}, {bb20} 치우친다. 그래서 동등 한계에 있는 제품이 동등으로 판정된다(S9 노트와 같은 값).
    (b) 초과 칸: 2020 모델(민감도 모델)에서 시험약의 말초 분포용적만 ×{m20}(참 AUCinf 비 {tr}). 같은 참 비를 만드는 2016 모델 칸(×{m16})의 AUClast + Cmax는 M1 {p16}로 보수적이다. 같은 칸의 AUCinf + Cmax(규칙 A (iii))는 {g2v}.
    AUClast + Cmax, 시험 {ntr}회: M0 {p0}(명목), M1 {p1}(초과), M2 {p2m}(초과). 사전 명시 {reps}회 값: M0 {k0}, M1 {k1}. M0의 {reps}회 구간이 {nom}를 포함해 이 칸을 {ntr}회로 늘렸고(DECISIONS D-048 확대 규칙, 사후 추가), 세 분석 모형을 모두 {ntr}회로 보고한다.
    같은 시험 안의 분해(%p, M1 / M0): 참 AUCinf 판정과 {nom}의 차 {t1} / {t0}, AUClast 효과(AUClast 단독과 참 AUCinf 판정의 차) {a1} / {a0}, Cmax 효과 {c1} / {c0}, 합계(AUClast + Cmax와 {nom}의 차) {s1} / {s0}. M1: 참 AUCinf 판정 {r1}, AUClast 단독 {l1}, AUClast + Cmax {p2}.
    AUClast 기하평균비 편향(참 AUCinf 비 대비): M1 {bci}, M0 {b0}로 거의 같다. M1이 M0보다 높은 것은 새 편향이 아니라 표준오차 보정 때문이다: 참 AUCinf 판정이 M0 {r0}에서 M1 {r1}로 오르고, 그 시험 간 표준편차 / 시험 내 표준오차가 M0 {sd0}, M1 {sd1}이다(DECISIONS D-060).
