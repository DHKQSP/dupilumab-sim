A11:
  kicker: "별첨 A11 · 견고성 점검: 체중 범위와 아토피 피부염 성인(근거 아님), 모델 가정"
  title: "체중이 무거울수록 AUCinf 신뢰 기준 미달은 늘지만(최대 {hi}), AUClast/AUCinf {th}% 미만은 두 모델의 모든 체중 구간에서 {lt} 이하다"
  not_evidence: "**그림은 근거가 아니다**: 근거는 시험 모집단({wt} kg)뿐"
  fig:
    panel_wt: "(a) 체중 구간(균일 분포)\n주황: 세트 (i)"
    panel_at: "(b) 아토피 피부염 성인\n주황: 세트 (iii)"
    xlab: "체중 (kg)"
    cov: "AUClast/AUCinf\n5번째 백분위수"
    fail_i: "AUCinf 신뢰 기준\n미달 (세트 (i))"
    fail_iii: "신뢰할 수 있는 AUCinf\n미확보 (세트 (iii))"
  table:
    head: ["바꾼 모델 가정", "결과 (1종 오류: 경계 조건, 분석 모형 M1)"]
    cond:   # \n: 표 칸 안 줄바꿈
      - "구조 모델\n2016 / 2020 모델"
      - "곡선 모양\n(양 군 공통)"
      - "정량한계\n{lg} mg/L"
      - "비례 잔차\n{s24} → {s12}"
      - "분석 모형\nM0 / M1 / M2"
    result:   # \n: 칸 안 줄바꿈(값·조건이 줄 끝에서 갈라지지 않게)
      - "AUClast + Cmax 최대 {p16} / {p20}.\nAUCinf + Cmax는 {n}개 중 {k}개 조건에서 {nom} 초과"
      - "AUClast/AUCinf 5번째 백분위수 {p05} 이상,\n{th}% 미만 {lt}(S8). 1종 오류 미산출"
      - "AUClast + Cmax {p1}.\nAUCinf + Cmax {g1}(세트 (ii)만 계산)"
      - "신뢰할 수 있는 AUCinf 미확보 {f24} → {f12}.\n1종 오류 미산출"
      - "AUClast + Cmax의 {nom} 초과는 2020 모델\n말초 분포용적(V2) 증가 조건뿐(별첨 A5)"
  caption: "회색 띠: 연구 체중 범위, 점선 오른쪽({k} kg 이상)은 모델 외삽일 수 있음. AUClast/AUCinf {th}% 미만 대상자: 두 패널, 두 모델의 모든 구간에서 {lt} 이하. 세트 (i): adjusted R² ≥ {r2i}, 외삽 ≤ {ex}%; 세트 (iii) = 신뢰할 수 있는 AUCinf(adjusted R² ≥ {r2}). 표의 AUCinf + Cmax는 세트 (iii)(정량한계 행만 세트 (ii)). 1종 오류는 점추정; M0 층 없음, M1 체중 층 포함(주분석 후보), M2 log 체중 공분산분석. 표의 행은 S8, S9, 별첨 A5의 근거를 요약한다."
  notes: |
    왼쪽 그림(체중 범위, 아토피 피부염 성인)은 평가변수 선택의 근거가 아니다. 오른쪽 표의 모델 가정 행은 S8, S9, 별첨 A5에 있는 근거를 요약한 것이다. 근거는 시험 모집단(건강인 {wt} kg, 체중 층화 배정, 현행 채혈 B0)뿐이며, 연구 범위 밖 체중과 아토피 피부염 성인 체중 분포의 결과는 의뢰자 결정으로 별첨의 견고성 점검으로 옮겼다(분석은 바뀌지 않고 보고 위치만 바뀜, 보고서 부록 D·부록 I). 핵심 덱에서 아토피 환자 모집단 결과를 쓰는 곳은 이 슬라이드뿐이다.
    (a) 체중 구간(구간 안 균일 분포, 구간당 {nb}명; 구간 폭은 같지 않다, 점은 구간 체중 중앙값): 무거운 구간일수록 신뢰 기준(세트 (i), adjusted R² ≥ {r2i}) 미달이 늘어난다. 2016 모델 {a1} → {a6}, 2020 모델 {b1} → {b6}. 이 결과 파일에는 세트 (iii)이 없다. AUClast/AUCinf 5번째 백분위수는 2016 모델 {ca1} → {ca6}, 2020 모델 {cb1} → {cb6}이고, 80% 미만 대상자는 구간마다 {wlt} 이하다. 모델 개발 자료의 체중 범위는 보고되지 않아 {k130} kg 이상 구간(점선 오른쪽)은 모델 외삽일 수 있다.
    (b) 아토피 피부염 성인 체중 분포는 Kamal 2022, Kovalenko 2021, NCT03389893 요약에서 만든 가정 분포(자리표시자)다(로그정규, 평균 {m} kg, SD {s} kg, {tr} kg 절단). 3상 원자료 체중은 분석 환경에서 확인할 수 없었다. 모의 20,000명 중 연구 범위 밖은 {out}, {k100} kg 초과는 {a100}이다. 점은 구간 평균 체중이며 구간은 {k60} kg 미만, 60~90 kg, 90~100 kg, {k100} kg 초과다.
    신뢰할 수 있는 AUCinf 미확보(세트 (iii)): 아토피 분포 전체 2016 모델 {f16}, 2020 모델 {f20}(세 모델 변형 {f3})로 시험 모집단({t16}, {t20})과 비슷하다. 무거운 환자에 몰린다: 2016 모델 {k60} kg 미만 {lo16}, {k100} kg 초과 {hi16}; 2020 모델 {lo20}, {hi20}. 민감도 체중 분포 두 개에서는 {sens}(세 모델 변형)다.
    제목 수치: 그린 자료(두 모델)에서 신뢰 기준 미달의 최대는 {hi}(아토피 분포, 가장 무거운 구간, 세트 (iii))이고, AUClast/AUCinf {th}% 미만 대상자는 (a)의 모든 체중 구간과 (b)의 모든 구간에서 {lt} 이하다. 세트 (iii) 미달 환자의 AUClast/AUCinf(참 AUClast / 참 AUCinf) 최솟값은 세 모델 변형 중 가장 작은 값 {z}(내림)로, S8이 쓰는 EMA 기준 {th}%보다 낮은 환자가 드물게 있다. 2016 모델 {wm16}, 2020 모델 {wm20}; 중앙값 {wmed}, 5번째 백분위수 {w05}. 전체 환자 중 80% 미만은 {alt} 이하다. 세 모델 변형: 2016 모델, 2020 모델(Model 1), 2016 모델에 성인 3상 공변량(Kovalenko 2020: 선형 소실에 BMI, 중심 분포 용적에 체중)을 넣은 변형.
    평균 체중이 높은 모집단의 모의 시험(스트레스 시험, 보고서 부록 I): 엔진의 기본 신뢰 표시(세트 (ii))를 못 넘은 탈락자가 유지자보다 {dw} kg 무겁다(세 모델 변형, 시나리오, arm 전체의 범위). 아토피 분포의 모의 시험(시나리오당 {ntr}회, M0): AUClast 기하평균비(GMR) 편향 {bl}, AUCinf 규칙 A 세트 (iii) 편향 {bai}; AUClast + Cmax와 AUCinf + Cmax(규칙 A, 세트 (iii))의 판정 일치 {ag}; Vmax 증가 시나리오(VM125)에서 세트 (iii) 미달의 arm 간 차이(시험 - 대조) {ad}%p.
    오른쪽 표(결과보고 덱 S21 요약, 핵심 덱 용어): 구조 모델은 모델마다 경계 조건 {npm}개(조건당 시험 {n10}회, 2020 모델 V2 조건만 {n20}회). 신뢰할 수 있는 AUCinf + Cmax의 최대는 {imax}(S9). 분석 모형: 2020 모델 V2 증가 조건의 AUClast + Cmax는 M0 {m0}(명목: Wilson 95% 구간이 {nom} 포함), M1 {m1}와 M2 {m2}(둘 다 초과: Wilson 하한 > {nom})이고, 원인 분해는 별첨 A5에 있다.
    곡선 모양은 2016 모델만, 대상자 수준(창 포착 분포)으로 모의했고 경계 1종 오류는 계산하지 않았다(S8). 정량한계는 2016 모델 경계 3개 조건(흡수량 감소, 표적 매개 소실 감소·증가), 조건당 {nt}회: AUClast + Cmax M0 {p0}; AUCinf 쪽은 세트 (ii)(adjusted R² ≥ {r2i}, 외삽 ≤ {ex}%, span 조건)만 계산했다. 잔차 12%는 신뢰 기준 미달만 계산했다(세트 (i) {i24} → {i12}; 세트 (iii)은 표). 결론: 계산한 범위에서 AUClast + Cmax 점추정의 {nom} 초과는 2020 모델 V2 조건뿐이고, AUCinf 쪽의 신뢰 기준 미달과 {nom} 초과는 조건을 바꿔도 남는다.
    관련 보고서: 5.2절, 5.3절, 5.8절, 5.9절, 5.10절, 6.5절, 부록 I(Table I-1, Table I-2, Figure I-1, Figure I-2); 예상 질의 Q16, Q20.
