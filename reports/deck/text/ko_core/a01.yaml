A1:
  kicker: "별첨 A1 · 모델 적격성"
  title: "두 모델은 연구 제형의 관측 AUClast 평균을 ±{tol}% 안에서 재현한다"
  fig:
    xlab: "AUClast 모의/관측 (모의 평균 / 관측 평균)"
    vals: "2016 / 2020"
    g_gate: "연구 제형: 적격성 기준(gate) 판정"
    dev: "속이 빈 표식: 그 모델의 개발 자료(일부 포함)"
    g_ext: "{dose} mg 제형: 외부 점검 (gate 제외)"
    gate_lab: "{dose} mg {ds}"
    ds:
      clot300_nonasian_pooled: "비아시아인 통합"
      clot300_japanese_TDU12265: "일본인"
      clot300_chinese: "중국인"
      clot600_chinese: "중국인"
      clot600_japanese: "일본인"
      PKM14271_200mg_test: "PKM14271 시험약"
      PKM14271_200mg_reference: "PKM14271 대조약"
      Cohen2022_200mg_AI: "Cohen 2022 자동주사기"
      Cohen2022_200mg_PFSS: "Cohen 2022 프리필드 시린지"
  body:
    - "**연구 제형 적격성 기준(gate)**: 자료 {n}개({conc} mg/mL {vol} mL, {d600} mg은 두 번 주사)의 모의/관측이 2016 모델 {r16}, 2020 모델 {r20}이다. 그중 {d300} mg 자료 {n3}개는 {r16_3}, {r20_3}이다(S3)."
    - "**{d200} mg 제형**(회색 표식, gate 제외; {conc2} mg/mL): 최고 농도 도달 시간(tmax)이 관측 {to}일, 모의 {ts}일로 빠른 흡수를 재현하지 못해 첫 비교 뒤 gate에서 뺐다."
  caption:
    - "각 모델의 개발 자료를 뺀 완전 외부 재판정은 두 모델 모두 불합격이다(불합격 항목 2016 모델 {f16}/{n16}, 2020 모델 {f20}/{n20}). 불합격 항목은 모두 체중 미보고로 {w0} kg을 가정한 Li 2020 arm이다(D-030)."
    - "음영: gate 허용 범위 ±{tol}%(비교 전 고정). 속이 빈 표식: 비아시아인 통합은 두 모델 개발 자료 일부, 일본인은 2020 모델 개발 자료. 회색: {d200} mg 제형(외부 점검)."
    - "모의/관측 = 코호트 평균 체중으로 모의한 평균 AUClast / 공개 관측 평균(Clot 2021, Li 2020, Cohen 2022). 모델 파라미터는 조정하지 않았다. Cmax는 gate 밖(노트)."
  notes: |
    합격 기준(비교 전에 고정, config/design_clot2021.yaml gate): 코호트 평균 체중으로 모의한 평균 AUClast가 관측 평균의 ±{tol}% 안, 모의 로그 척도 변동계수(CV) {cvr}%, 관측 코호트 중앙값 tlast가 모의 분포의 5~95백분위 안, 체중 효과의 부호와 크기. 두 모델 모두 모든 기준을 통과했다. 모델 파라미터는 논문 값 그대로이며 검증 자료에 맞춰 조정하지 않았다. 모의 로그 척도 CV는 2016 모델 {cv16}%, 2020 모델 {cv20}%다.
    연구 제형의 모의/관측은 두 모델을 합쳐 {rng}이다. 자료별(2016 모델 / 2020 모델): 비아시아인 통합 {x1}, 일본인 {d300} mg {x2}, 중국인 {d300} mg {x3}, 중국인 {d600} mg {x4}, 일본인 {d600} mg {x5}. 검증 코호트는 모델 신뢰성의 근거이며, 평가변수에 관한 결론은 시험 모집단 모의에서만 세운다.
    {d200} mg 제형(외부 점검): 모의/관측 2016 모델 {e16}, 2020 모델 {e20}(2016 모델 z 값 {z}). 최고 농도 도달 시간은 관측 {to}일, 모의 {ts}일로 흡수 속도를 재현하지 못한다. gate 범위를 연구 제형으로 좁힌 결정은 첫 비교 결과를 본 뒤의 사후 결정이다(커밋 {cmt}, 사전 명시 등록부).
    Cmax(gate 밖, 한계): 연구 제형 모의/관측은 2016 모델 {c16}, 2020 모델 {c20}로 대부분 과대 예측이다. 최대는 {cmx} 코호트(2016 모델)이고, 2020 모델에는 과소 예측도 하나 있다(최솟값 {cmin20}).
    {d300} mg 단일 arm 여섯 개(Li 2020, 체중 미보고라 {w0} kg 가정; 외부 점검): 모의 평균 / 공개 arm 산술평균은 2016 모델 {a16}, 2020 모델 {a20}. 각 모델의 개발 자료를 뺀 항목만으로 같은 평균 기준을 다시 적용한 완전 외부 재판정의 불합격은 2016 모델 {f16}/{n16}, 2020 모델 {f20}/{n20}이며 모두 체중 미보고 단일 arm이다(두 모델의 개발 자료가 달라 항목 수가 다르다).
    문헌 AUClast/AUCinf 평균비(공개 비구획 값 대 같은 조건 모의; 모의는 2016 모델 / 2020 모델): Clot 2021 {d300} mg 문헌 {l300}, 모의 비구획 {n300}, 모의 참값 {t300}. PKM12350 대조군 문헌 {lpk}, 모의 비구획 {npk}. Clot 2021 {d600} mg 문헌 {l600}, 모의 비구획 {n600}, 모의 참값 {t600}. {d300} mg 두 자료는 ±{lt}%p 안에서 일치하고, {d600} mg에서는 모의 참값도 문헌보다 낮아 AUClast/AUCinf를 낮게 보는 보수적 방향이다.
    관련 보고서: 4.2절, Table 4-1, 4.3절, 4.4절, Table 4-2, 부록 D.
