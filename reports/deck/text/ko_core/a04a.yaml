A4a:
  kicker: "별첨 A4a · ② 세부: 2020 모델 대표 대상자"
  title: "2020 모델도 AUClast/AUCinf는 대표 대상자 {med}, 최솟값도 {min}다"
  fig:
    head: "AUClast/AUCinf = {v}%"
    role:
      median: "중앙값 대상자"
      p05: "5번째 백분위수 대상자"
      min: "최솟값 대상자"
    xlab: "연구일"
    tlast: "tlast"
    sub: "{role} · 참 농도(mg/L)"
    ratio: "비구획 외삽 면적은\n참값의 {r}배"
    no_lz: "λz 산출 불가:\n비구획 외삽 없음"
  body:
    - "중앙값·5번째 백분위수 대상자는 신뢰할 수 있는 AUCinf 기준을 충족하지만 비구획 외삽 면적은 참값의 {q1}배, {q2}배다. 최솟값 대상자는 λz를 산출하지 못해 비구획 AUCinf 자체가 없다."
  caption:
    - "파랑: AUClast, 주황: tlast 이후 참 외삽(모델 적분), 세로 점선: 관측 tlast. 삽입도: 점선 = 비구획 외삽선, 빗금 = 비구획 외삽."
    - "세 대상자: 2020 모델 {nsub}명 중 중앙값·5번째 백분위수·최솟값. 외삽 비율 중앙값은 비구획 {nca} 대 참 {true}(2016 모델은 S7)."
  notes: |
    대상자(2020 모델, 건강인 {wt} kg, 현행 채혈): 중앙값 id {i1}, 5번째 백분위수 id {i2}, 최솟값 id {i3}. 관측 tlast는 각각 Day {t1}, {t2}, {t3}이다. 선택 규칙은 사전 등록(동률이면 작은 id)이고, 대상자 곡선은 저장된 결과와 같은 시드로 다시 만들어 NCA 값이 저장된 값과 일치함을 확인했다(scripts/63). 그림 구성은 S7과 같다.
    삽입도: 로그 눈금으로 tlast 직전 방문부터 절벽 이후까지. 점선은 비구획 외삽선(Clast × exp(-λz(t - tlast))), 빗금은 그 아래 면적(비구획 외삽), 주황은 참 곡선 아래 면적(참 외삽)이다. 배수는 무한대까지의 두 면적의 비다: 중앙값 대상자 비구획 {a1} 대 참 {b1}, 5번째 백분위수 대상자 {a2} 대 {b2} mg·day/L.
    중앙값·5번째 백분위수 대상자의 adjusted R²는 {r1}, {r2}, 비구획 외삽 비율은 {e1}, {e2}로 신뢰할 수 있는 AUCinf 기준(adjusted R² ≥ {r2iii}, 외삽 ≤ {exiii}%)을 충족한다. 기준을 충족해도 외삽 면적 자체는 참값의 몇 배로 추정된다.
    최솟값 대상자(AUClast/AUCinf {c3})는 최고 농도 뒤 정량 시료가 {np}개뿐이어서 λz 최소 점 수({mp}점)에 못 미쳐 λz를 산출하지 못했다. 따라서 비구획 외삽선과 빗금이 없고, 참 외삽 면적은 {b3} mg·day/L다. 이 대상자는 기준 미달자를 빼는 규칙 A에서도, λz 산출 가능자를 모두 쓰는 규칙 B에서도 AUCinf가 없다.
    모집단(2020 모델): 비구획 외삽 비율 95번째 백분위수 {p95n}, 참 외삽 비율 95번째 백분위수 {p95t}.
