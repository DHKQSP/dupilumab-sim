A5e:
  kicker: "③ 판정 성능 · 가이드라인 기본 구성의 1 쪽 치우침 분해"
  title: "AUCinf의 1 쪽 치우침은 외삽에서 생기고, 기준 미달자를 빼면 더 커진다:\n표적 매개 소실 칸 {b20} → {a20}(2020 모델), {b16} → {a16}(2016 모델)"
  fig:
    xlab: "1 쪽 치우침 (기하평균비의 참 AUCinf 비 대비, %)"
    ep:
      AUClast: "AUClast"
      AUCinf_B: "AUCinf(B): 외삽"
      AUCinf_Aiii: "AUCinf(A): 외삽 + 기준 미달자 제외"
  body1: "λz 산출 전원(B)의 AUCinf도 표적 매개 소실 칸에서 1 쪽으로 치우친다(비구획 외삽)."
  body2: "기준 미달자를 빼면(A, 화살표) 흡수량·표적 매개 소실 칸이 모두 1 쪽이고 1종 오류가 {nom}를 넘는다(별첨 A5d)."
  caption: "(A) = 신뢰할 수 있는 AUCinf(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%)만, (B) = λz 산출 전원. 치우침 = 로그 기하평균비 시험 평균의 참 AUCinf 비 대비 차이(1 쪽 = 양수). 칸마다 시험 {reps}회 이상, 분석 모형 M1."
  notes: |
    치우침은 로그 기하평균비의 시험 평균이 참 AUCinf 비보다 1 쪽으로 간 양(%)이다(results/oc_curves/oc_bias_relation.csv, scripts/65, 칸마다 시험 {reps}회 이상). λz 산출 전원(B)의 치우침은 비구획 외삽이 만든 것이고, (A)와 (B)의 차이는 신뢰할 수 있는 AUCinf(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%) 기준에 못 미친 대상자를 뺀 효과(탈락)다.
    표적 소실 증가 칸: (B) {b20} → (A) {a20}(2020 모델), {b16} → {a16}(2016 모델). 같은 칸의 AUClast는 반대쪽이다({lv20}, {lv16}): AUClast는 참 AUCinf 비보다 한계 바깥쪽에 있어 1종 오류가 명목 아래다.
    2020 모델 말초 분포 증가 칸은 반대로 기준 미달자 제외가 치우침을 한계 쪽으로 옮긴다((B) {v2b}, (A) {v2a}). 흡수 속도 감소 칸의 큰 치우침((A) 2020 모델 {ka20}, 2016 모델 {ka16})은 참 Cmax 비가 한계 밖이라 판정 결과에는 나타나지 않는다.
    치우침과 1종 오류의 관계식은 별첨 A5d, 2종 오류 분해는 별첨 A5f.
