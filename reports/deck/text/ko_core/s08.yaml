S8:
  kicker: "결론과 제안"
  xref: "세부: 별첨 A7(채혈 일정), A9(표본 수), A10(SAP와 대응안)"
  title: "1차는 AUClast + Cmax, AUCinf는 2차로 계산·보고하며,\n현행 채혈 {nB0}회를 유지한다"
  boxes:
    - head: "1차 평가변수"
      main: "AUClast + Cmax"
      sub: "두 지표가 모두 동등 기준을 통과해야 동등"
    - head: "2차 평가변수"
      main: "AUCinf 계산·보고"
      sub: "두 분석군으로: λz 산출 전원, 신뢰 기준 충족자"   # 2026-09-30: 한 줄(아래 줄 상자에 높이를 더 줌)
    - head: "채혈 일정"
      main: "현행 유지"
      sub: "Syneos {nB0}회, Day {last}까지. 추가·제거 후보는\n정해 둔 변경 기준에 모두 못 미침(두 모델, 별첨 A7)"
    - head: "AUCinf를 공동 1차로 요구받으면"
      main: "AUClast를 유지한 채 추가"
      sub: "AUCinf는 λz 산출 전원으로 사전 명시,\nAUCinf만 남기지 않음(근거 별첨 A10)"   # 2026-09-30 정정: 대응안의 비용이 작은 조건 명시(D-065)
  body:
    - "근거: ① 신뢰 기준 미달 {fail} ② AUClast/AUCinf 최솟값 {cmin}"
    - "③ {e3}"                                    # 2026-09-30: "만"을 뺀 ③이 한 줄을 넘어 두 문단으로(D-065)
  ev3:
    ruleT: "AUClast + Cmax는 두 오류를 명목 수준 근처로 지킨다(S7)"   # 2026-09-30 정정: "만" 삭제(S7 부제와 같은 주장, D-065)
    type1: "경계 1종 오류 최대 {t_inf}(AUCinf 구성) 대 {t_last}(AUClast 구성)"
  notes: |
    2차 평가변수: AUCinf는 λz를 산출한 대상자 전원과 신뢰할 수 있는 AUCinf(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%)를 얻은 대상자, 두 분석군으로 각각 요약·비교해 보고한다.
    채혈: 현행 Syneos 일정(B0)을 유지한다. 채혈을 더하는 후보 D1~D4와 한 점을 빼는 후보 모두, 첫 일정 모의 뒤 결과 보고 전에 정한 기준 (a)~(d)를 하나도 충족하지 못했다(두 모델; 기준 (a)·(b)는 합동 t 검정 시험 결과; 별첨 A7). 민감도 변형 하나에서 기준 (d)만 충족한 일정이 있었고 판정 기록은 B0 유지다(별첨 A7).
    공동 1차 요구 시: EMA 단클론항체 바이오시밀러 지침의 기본값은 AUCinf 1차다(S3). 규제기관이 이를 요구하면 AUClast + Cmax를 유지한 채 λz 산출 전원의 AUCinf를 더한다(세 지표 공동 1차). AUCinf + Cmax만 남기면 경계 1종 오류가 커지고(신뢰 기준 적용 시 최대 {g2t1}, λz 산출 전원이면 {g2bt1}, AUClast + Cmax {p2t1}) 기준 미달이 노출과 연관된다(별첨 A10). 대응안(세 지표 공동 1차, AUCinf는 λz 산출 전원으로 사전 명시)의 2종 오류 비용은 작다: 동일 제품을 동등으로 판정하지 못할 확률 {f3bid}(AUClast + Cmax {p2id}; 별첨 A10). 신뢰 기준을 적용한 AUCinf를 더하면(S7의 F3) 동일 제품 {f3id}로 늘고, 1종 오류 최대는 {p2t1}에서 {f3t1}로 준다(S7). AUCinf + Cmax의 동일 제품 2종 오류는 {g2id}다. 2차 보고에는 두 분석군의 인원과 기준 미달 사유를 함께 적는다.
