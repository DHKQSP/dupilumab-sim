S8:
  kicker: "② 보강: 조건을 바꿔도"
  title: "AUClast/AUCinf는 기본 조건 최소 {bmin},\n모든 경우 {e80}% 미만 {lt80} 이하, 5번째 백분위수 {p05} 이상이다"
  fig:
    xlab: "AUClast/AUCinf (참값). 점: 중앙값, 막대: 5~95백분위, 세로 표식: 최솟값, ■: 문헌 비구획 평균비"
    ema: "EMA 기준 {v}%"
    groups:
      base: "기본"
      curve: "곡선 모양"
      lloq: "정량한계"
      resid: "잔차"
      wt: "체중 층"
      lit: "문헌"
    rows:
      k2016_base: "2016 모델"
      k2020_base: "2020 모델"
      vmax: "Vmax ×{v}"
      km: "Km ×{v}"
      lloq: "LLOQ {v} mg/L"
      resid: "비례 잔차 {v}%"
      wt_lo: "{v} kg 이하"
      wt_hi: "{v} kg 초과"
      lit_clot: "Clot 2021 300 mg"
      lit_pkm: "PKM12350 대조군"
  body:
    - "유럽 의약품청(EMA) 생동 지침: AUClast는 AUCinf의 {e80}% 이상을 덮어야 한다."
  caption:
    - "문헌 값(Clot 2021 Table 3, FDA BLA 761055 리뷰 Table 4.2.c)은 비구획 평균비라 실제 커버리지의 하한이다. EMA 지침은 검색 발췌."
    - "곡선 모양: 최대 소실 속도(Vmax)와 반포화 농도(Km)를 두 군 모두 바꿈. 기본 외 조건은 2016 모델."
  notes: |
    케이스: 곡선 모양(Vmax 최대 소실 속도, Km 반포화 농도; 시험약·대조약 모두)·정량한계·비례 잔차·체중 층은 2016 모델 기본 조건에서 한 가지씩 바꿨다.
    제목 규칙(사전 등록 section7, 결과 전 고정): 모든 경우의 최솟값이 {t84}% 이상이면 "모든 경우 {t84}% 이상"이라고 쓰고, 아니면 기본 조건 최솟값, 모든 경우의 {e80}% 미만 비율 최댓값, 모든 경우의 5번째 백분위수 최솟값을 쓴다. 결과는 두 번째다: 정량한계 {lq} mg/L {mlq}, Vmax ×{vm} {mv}, Km ×{km} {mk}, 비례 잔차 {rs}% {mr}가 {t84}% 아래다. 하한('이상')은 내림, 상한('이하')은 올림으로 적었다.
    기본 조건 최솟값: 2016 모델 {m16}, 2020 모델 {m20}. {e80}% 미만은 정량한계 {lq} mg/L에서 {lt}({nsub}명 중 {nlt}명)뿐이다. 5번째 백분위수가 가장 낮은 경우는 Vmax ×{vm}({p05v})다. 곡선 모양 연구 자체의 기본 조건 재추출(참고)의 최솟값은 {mcb}다.
    문헌: 공개된 평균 AUClast / 평균 AUCinf(비구획). Clot 2021 {cd} mg {clot}(같은 조건 모의 참값 평균비 {clots}), PKM12350 대조군 {pkm}(모의 참값 {pkms}). 비구획 AUCinf가 외삽을 과대추정하므로(S7) 공개 값은 실제 커버리지보다 낮게 나온다.
    EMA 생동 지침(CPMP/EWP/QWP/1401/98 Rev. 1)은 AUClast가 AUCinf의 {e80}% 미만인 관측이 {e20}%를 넘으면 시험 타당성을 논의하게 한다. 제네릭 생동성 시험 지침이다. 바이오시밀러 요건이 아니라 AUClast 적정성의 관행 기준으로 인용했다.
