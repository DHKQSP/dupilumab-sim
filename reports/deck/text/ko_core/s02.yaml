S2:
  kicker: "결론"
  xref: "세부: ① 별첨 A3a, A3b, 보강 A-①  ·  ② 별첨 A4a, A4b, 보강 A-②  ·  ③ 별첨 A5a~A5f"
  title: "AUCinf는 1차 평가변수로 적절하지 않다:\n셋 중 한 명꼴로 신뢰할 값이 없고, AUClast로 충분하며, 판정 오류가 커진다"
  cards:
    c1:
      head: "① AUCinf 신뢰 기준 미달"
      label: "신뢰할 수 있는 AUCinf를 얻지 못한 대상자(두 모델)\n기준: adjusted R² ≥ {r2}\n그리고 외삽 ≤ {ex}%"
    c2:
      head: "② AUClast/AUCinf (참값)"
      value: "{v}"
      label: "2020 모델(주 모델) 모의 대상자\n{nsub}명 중 최솟값\n중앙값 대상자 {med}"
    c3:
      vs: "  대  "
      inf: "  AUCinf + Cmax"
      last: "  AUClast + Cmax"
      type2:                                    # 규칙 4a 성립(v1.2 기본): 동일 제품 2종 오류(주 모델)가 큰 숫자
        head: "③ 동등 제품의 입증 실패"
        label: "2종 오류: 동일 제품, 2020 모델\n경계 1종 오류 최대 {g1} 대 {p1}"
      type1:                                    # 규칙 4a 불성립: 1종 오류 최대가 큰 숫자
        head: "③ 경계 1종 오류 최대"
        label: "참 AUCinf 비를 동등 한계에 맞춘 경계 조건 {n}개 중 최댓값(명목 {nom}). AUCinf는 기준 충족자만 분석"
  c3note:
    type2: "카드 3(v1.2): 본문 S7의 동일 제품 2종 오류다(사전 등록 문구 규칙 4a 성립: 두 모델 모두 AUCinf(A) + Cmax가 AUClast + Cmax보다 기준 이상 크다, config/prereg_20260929_oc.yaml)."
    type1: "카드 3(v1.2): 사전 등록 규칙 4a가 성립하지 않아 경계 1종 오류 최대를 큰 숫자로 적었다."
  conclusion: "AUCinf는 계산해서 보고하되, 1차 평가변수는 AUClast + Cmax"
  notes: |
    카드 1: 신뢰할 수 있는 AUCinf는 adjusted R² ≥ {r2} 그리고 외삽 ≤ {ex}%다(기준 세트 (iii)). 미달 비율은 2020 모델 {fail20}, 2016 모델 {fail16}이다(건강인 {wt} kg, 현행 채혈, 모델마다 대상자 {nsub}명). 2020 모델 값이 삼분의 일에 조금 못 미쳐 "삼분의 일 이상" 대신 범위로 적었다.
    카드 2: 본문 S6의 주 모델(2020 모델) 대표 대상자 값이다(v1.2 지시: 결론 카드에는 본문 수치만). AUClast/AUCinf는 참값 기준이다(관측 마지막 정량 시점까지의 참 AUC / 모델 적분 참 AUCinf). 최솟값은 한 번의 모의 추출(모델별 {nsub}명)의 값이며 시험 모집단 요약에서도 2020 모델 {min20}, 2016 모델(민감도 모델) {min16}이다(S6, 별첨 A4a). 2016 모델의 같은 기본 조건을 곡선 모양 연구에서 따로 추출하면 최솟값이 {redraw}였다(보강 A-② 노트). 곡선 모양·정량한계·잔차를 바꾼 경우는 보강 A-②.
    {c3} 동일 제품을 동등으로 판정하지 못할 확률은 2020 모델(주 모델) AUCinf(A) + Cmax {g2id20} 대 AUClast + Cmax {p2id20}(카드의 큰 숫자, S7 표의 값), 두 모델 범위 {g2id} 대 {p2id}다. AUCinf(A)는 신뢰할 수 있는 AUCinf(세트 (iii)) 충족자만으로 판정한 AUCinf다(M1: 체중 층 포함 분석 모형).
    부제: 경계 1종 오류 = 참 AUCinf 비가 동등 한계에 놓인 가상 시험약을 동등으로 판정한 비율. 카드 부제는 S7 표의 두 모델 경계 16칸 최대(AUCinf(A) + Cmax {g1}, AUClast + Cmax {p1})이고, 모델별로는 AUCinf(A) + Cmax {g1r}, AUClast + Cmax 2016 모델 {p1_16}이다. AUCinf 구성은 {n_inf}개 조건에서 점추정이 {nom}를 넘고 AUClast + Cmax는 {n_last}개 조건이다(원인 분해 별첨 A5b, A5d~A5f). 흡수 속도 감소 두 조건은 참 Cmax 비가 동등 한계 밖이라 두 구성 모두 동등 판정이 나오지 않는다(별첨 A5d).
