A9:
  kicker: "별첨 A9 · 표본 수"
  title: "arm당 무작위배정 {n_rand}명 유지를 제안한다: 프로토콜 변동계수에서 AUClast\u00a0+\u00a0Cmax 동시 통과 검정력 {p_b}"   # \u00a0: 평가변수 묶음이 줄 끝에서 갈라지지 않게
  head: "동시 통과 검정력(%, M1, 참 기하평균비 {g}) · 열 = arm당 평가 가능 인원"
  table:
    h_cv: "AUClast\n변동계수(CV)"   # \n: 머리글 칸 안 줄바꿈
    h_n: "{n}명"
    h_now: "{n}명\n(현행)"
    row: "{cv}%"
    base: "(프로토콜)"
    sens: "(민감도)"
  cards:
    base:
      head: "CV {cv}%(프로토콜) · 현행 {n_arm}명"
      label: "{tgt}% 검정력: 평가 가능 {ne}명 필요"
    sens:
      head: "CV {cv}%(민감도) · 현행 {n_arm}명"
      label: "{tgt}% 검정력: 평가 가능 {ne}명 필요"
  body:
    - "참 기하평균비 {g}에서 현행 {n_arm}명(무작위배정 {n_rand}명; 중도 탈락은 모의하지 않음)은 CV {cv_ok}%까지 검정력 {tgt}% 이상이다."
    - "목표 검정력과 표본 수는 의뢰자가 정한다."
  caption:
    - "분석식 근사, 참 기하평균비 {g}. 입력은 사전 등록대로 2016 모델(민감도 모델)이며, 2020 모델(주 모델) 입력과의 차이는 {d20}%p 이내다."
    - "Cmax: 변동계수 {cvc}(모의값 고정), 참 Cmax 비 = 참 AUClast 비(보수적 가정). M1 = 투여군 + 무작위배정 체중 층 분산분석(주분석 후보)."
    - "CV 근거: PK 모델 {cv20}(2020 모델), {cv16}(2016 모델), Li 2020 표준편차/평균 {li}%, Cohen 2022 약 {coh}(다른 제형)."
  notes: |
    표는 보고서 5.11절의 분석식 근사(두 평가변수 이변량 정규, 분석 모형 M1)로 계산한 AUClast + Cmax 동시 통과 검정력이다. 입력은 표본 수 사전 등록(config/prereg_20260926.yaml section3)의 주 입력인 2016 모델(이 덱의 민감도 모델; 현행 채혈, 시험 체중 범위)이다: AUClast 변동계수 {cv16}, Cmax 변동계수 {cvc}, 두 지표 로그값 상관 {rho}. 2020 모델(주 모델) 입력(AUClast 변동계수 {cv20}, Cmax 변동계수 {cvc20}, 상관 {rho20})으로 계산한 같은 표는 칸마다 {d20}%p 이내로 같고, 현행 {n_arm}명·CV {cv_b}%의 M1 검정력은 {p_b20}, 목표 검정력에 필요한 평가 가능 인원은 CV {cv_b}% {ne_b20}명, CV {cv_s}% {ne_s20}명이다(분석식 근사, 같은 Cmax 가정). Cmax의 참 비는 AUClast와 같다고 두었다(보수적 가정).
    표의 n은 arm당 평가 가능 인원이다. {n130}명 열은 평가 가능 {n130}명이며 무작위배정 {n130}명이 아니다(CV {cv_s}%에서 {p130}). 현행 가정은 arm당 무작위배정 {n_rand}명 중 평가 가능 {n_arm}명이고 중도 탈락 자체는 모의하지 않았다.
    현행 평가 가능 {n_arm}명: CV {cv_b}%에서 M1 {p_b}, M0 {p_b0}; CV {cv_s}%에서 M1 {p_s}, M0 {p_s0}. 목표 검정력에 필요한 인원(M1, 카드)은 CV {cv_b}%에서 평가 가능 {ne_b}명(무작위배정 {nr_b}명), CV {cv_s}%에서 {ne_s}명(무작위배정 {nr_s}명)이고, M0에서는 평가 가능 인원이 CV {cv_b}% {n_b0}명, CV {cv_s}% {n_s0}명이다. 유지 제안의 근거는 프로토콜 CV에서 목표를 넘는다는 점이며, 민감도 CV에서도 목표를 원하면 카드의 인원이 필요하다(의뢰자 결정).
    참 기하평균비가 {g90r}이면 현행 평가 가능 {n_arm}명, CV {cv_b}%에서 M1 검정력은 {p90}(통계 모의 {p90mc})로 목표에 크게 못 미친다(2016 모델 입력). 유지 제안은 참 비 {g}를 가정한다.
    분석식 점검: 통계 모의(칸당 {mc_tr}회)와 비교해 {mc_n}칸 중 {mc_in}칸이 Wilson 95% 구간 안이고 최대 차이는 {mc_max}%p다. PK 모델 시험과 비교하면 참 기하평균비 {g95}에서 {amax}%p 이내이고, {g90}에서는 분석식이 {rng90}%p 높아 낙관적이다.
    관련 보고서: 3.12절, 5.11절, Table 5-19; SAP 제안 6절, 7절.
