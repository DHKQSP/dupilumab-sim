A3b:
  kicker: "별첨 A3b · ① 세부: 미달은 구조적이고 무작위가 아니다"
  title: "2016 모델에서 잔차를 절반으로 줄이면 세트 (iii) 미달은 {r3a}에서 {r3b}로 줄지만 남고, arm 간 미달 차이는 제품 차이의 기전이 정한다"
  bullets:
    - "**구조적**: 잔차를 줄여도 미달이 남고, 정량한계를 낮추면 세트 (i) 충족이 오히려 {dlq}%p 줄어든다."
    - "**무작위가 아님**: 참 AUCinf는 미달자가 충족자의 {gmr}배, 무거운 체중 층의 미달 비율이 {sd}%p 높다."
    - "**arm마다 다름**: 동일 제품이면 평균 {s0}%p 이내, 참 비 {r80} 시험약은 최대 {mxi}%p다. 흡수 속도 감소 칸({mx}%p)은 Cmax 비가 {cmx}으로 늘 불통과라 요약 최댓값에서 뺐다."
  caption: "세트 (iii) = 신뢰할 수 있는 AUCinf(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%), (i) = adjusted R² ≥ {r2i}·외삽 ≤ {ex}%, (iv) = (iii) + span ≥ {sp4}."
  fig:
    sub1: "세트별 미달 (2016 모델):\n비례 잔차를 절반으로 줄이면"
    xres: "비례 잔차"
    res:
      k2016: "{s}%\n추정값"
      resid12: "{s}%\n절반"
    sets:
      iii: "세트 (iii)"
      iv: "세트 (iv)\n+ span ≥ {v}"
    sub2: "세트 (iii) 미달 비율의 arm 간 차이 (시험군 - 대조군)\n동일 제품과, 참 AUCinf 비 {r}인 가상 시험약(기전 하나를 바꿈)"
    xlab: "%p, 시험 {n}회 평균. 양수 = 시험군이 더 미달"
    vhead: "2016 / 2020 모델"
    ka_note: "참 Cmax 비 {c}"
    s00: "동일 제품"
    mech:
      ka_down: "흡수 속도 감소"
      Vmax_up: "표적 소실 증가"
      F_down: "흡수량 감소"
      ke_up: "선형 소실 증가"
      V2_up: "말초 분포 증가"
  notes: |
    시험 모집단(건강인 {wt} kg, 체중 층화 배정, 현행 채혈 B0) 결과다. 세트 (iii)(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%)이 이 덱의 신뢰할 수 있는 AUCinf이며, 결과 파일에 있는 곳은 모두 세트 (iii)으로 적었다.
    구조적 원인, 잔차(그림 왼쪽): 2016 모델 구조에서 비례 잔차를 {s24}에서 {s12}로 줄이면 세트 (iii) 미달은 {r3a}에서 {r3b}로 줄지만 여전히 크고, 세트 (iv)(span ≥ {sp4})는 {r4a}에서 {r4b}로 그대로다(Wilson 95% 구간 {ci4a} 대 {ci4b}; 대응 비교 구간은 없다). adjusted R² 중앙값: {ar2a} → {ar2b}. 잔차가 줄면 adjusted R² 미달로 빠지던 대상자가 span 미달로 옮겨 간다(세트 (iii)은 충족하고 span만 미달하는 몫 {spa}%p → {spb}%p). λz 구간이 절벽 앞 채혈점에 묶여 span 중앙값({spm})이 기준 {sp4}에 가깝기 때문이다(λz 구간 끝의 중앙값이 정량한계 도달일 중앙값보다 앞선다). 잔차를 줄인 변형은 2016 모델 구조에만 있다(2020 모델 세트 (iii) 미달 {m20}).
    구조적 원인, 정량한계: 정량한계를 {lq}에서 {lqm} mg/L로 낮추면 세트 (i)(adjusted R² ≥ {r2i}) 충족이 2016 모델 {c16}, 2020 모델 {c20} 바뀐다(같은 대상자 대응 비교). 가법 잔차를 정량한계에 비례시켜도 {cs16}, {cs20}로 떨어진다. 마지막 정량 시점이 늦어지면서 adjusted R² {r2i} 미달이 는다(2016 모델 {f0} → {f1}, 2020 모델 {g0} → {g1}); 보고서 5.10절은 정량한계 근처의 잡음이 정량되기 때문이라고 설명한다. 정량한계 격자는 세트 (i)·(ii)만 계산했으므로 세트 (iii)으로 넓히지 않는다.
    무작위가 아님(세트 (iii)): 기준 미달자 대 충족자의 참 AUCinf 기하평균비는 2016 모델 {g16}, 2020 모델 {g20}, 관측 AUClast 기하평균비는 {al}이다. 체중 차이(미달자 - 충족자)는 {w16}, {w20}이다. 층별 미달: 가벼운 층 {l16}, 무거운 층({split} kg 초과) {h16}(2016 모델); {l20}, {h20}(2020 모델); 차이 {d16}, {d20}(Newcombe 구간). 그 결과 동일 제품 시험 {ntr}회에서 세트 (iii) 분석군의 arm 간 무거운 층 비율 차이가 {thr}%p를 넘는 시험이 {gt}이고(5~95백분위 {pr}), AUClast 분석군에서는 그런 시험이 {z}다(무작위배정의 층 구성 유지; 층 내 1:1 배정에서 두 arm의 차이는 최대 {rb}%p, 한 명).
    arm마다 다름(그림 오른쪽): 시험 {ntr}회를 운용 특성 시드로 다시 만들어 arm별 세트 (iii) 미달 비율의 차이(시험군 - 대조군)를 평균했다. 동일 제품 {s00}%p(대조군 평균 미달 {fr}); 이것은 시험 {ntr}회의 평균이며, 개별 시험의 arm 간 차이는 동일 제품이어도 5~95백분위 {sp}로 퍼진다. 참 AUCinf 비 {r80} 경계 칸(기전 하나를 바꾼 가상 시험약): 흡수 속도 감소 {ka}, 표적 소실 증가 {vm}, 흡수량 감소 {fd}, 선형 소실 증가 {ke}, 말초 분포 증가 {v2}(두 모델, %p). 참 비 {r125} 경계 칸: 표적 소실 감소 {vmd}, 흡수량 증가 {fu}, 선형 소실 감소 {ked}. 흡수 속도 감소 칸은 참 Cmax 비가 {cmx}으로 동등 범위 밖이라 Cmax를 넣은 판정 구성은 이 칸에서 통과한 시험이 하나도 없다(results/oc_models/type1_models.csv). 그래서 판정에 의미 있는 칸(참 Cmax 비가 범위 안)의 최대 차이 {mxi}%p(말초 분포 증가, 2020 모델)를 요점에 적었다. 평균의 95% 구간 폭은 최대 {w}%p로 표식보다 좁다. 로그 참 비에 대한 선형 적합의 R²는 {r2f}로, 차이는 참 비가 아니라 기전이 정한다. 인원 수 기반 결과라 분석 모형(M0/M1)과 무관하다.
    사전 등록: 층 구성과 arm 간 차이는 section6 등록 후 처음 계산했다(DECISIONS.md D-059). 관련 보고서: 5.3절(Table 5-6, Table 5-7, Figure 5-5, Figure 5-6), 5.10절, 6.5절.
