S1:
  kicker: "사내 검토용 핵심 덱 · 임상약리·임상개발"
  title: "두필루맙 바이오시밀러 1상 비교 PK 시험: AUCinf는 1차 평가변수로 적절하지 않다"
  subtitle: "원개발사 공개 모집단 PK 모델로 계획 시험을 모의한 정량 근거(건강인 {wt} kg, {dose} mg 단회 피하, 현행 채혈 일정)"
  glossary:
    - "PK 약동학 · Cmax 최고 혈중농도"
    - "AUClast 마지막 정량 시점까지의 곡선하 면적 · AUCinf 무한대까지 외삽한 곡선하 면적"
  meta: "{version}  ·  {date}"
  notes: |
    이 덱은 결과보고 덱(32장, 기술 백업)의 결론을 한 흐름으로 줄인 핵심 덱이다. 흐름: 전제(말단 절벽) → ① 신뢰할 수 있는 AUCinf를 얻지 못하는 대상자가 많다 → ② AUClast가 이미 총노출의 대부분을 담는다 → ③ AUCinf를 1차로 쓰면 유사성 판정이 흔들린다 → 결론.
    모든 수치는 결과 파일에서 자동으로 읽었고 슬라이드별 출처는 core_deck_traceability.csv에 있다. 새 시험 모의는 없고, 핵심 덱에 새로 필요한 요약(케이스별 창 포착률, 대표 대상자)은 scripts/63이 저장된 결과를 요약하거나 원래 시드 규칙으로 다시 만들어 커밋된 결과와 대조했다.
    근거 모집단은 계획 시험 모집단(건강인, 체중 층화 배정)이다. 체중 범위 밖과 다른 모집단의 결과는 별첨 A11의 견고성 확인이며 근거가 아니다.
