A5d:
  kicker: "③ 판정 안정성"
  title: "경계 조건에서 AUClast 대신 AUCinf로 판정하면\n1종 오류가 최대 {max}로 오른다"
  fig:
    xlab: "경계 1종 오류 (동등으로 판정한 비율, %). 점선: 명목 {v}"
    nom: "명목 {v}"
    ka: "Cmax가 한계 밖: 두 구성 모두 0%"
    cell: "{mech} → {tgt}"
    cfg:
      last: "AUClast + Cmax"
      inf: "AUCinf + Cmax (신뢰할 수 있는 AUCinf만)"
    mech:
      F_down: "흡수량 감소"
      F_up: "흡수량 증가"
      ke_up: "선형 소실 증가"
      ke_down: "선형 소실 감소"
      Vmax_up: "표적 소실 증가"
      Vmax_down: "표적 소실 감소"
      V2_up: "말초 분포 증가"
      ka_down: "흡수 속도 감소"
  body:
    - "AUCinf 구성은 경계 조건 {n}개 중 {k}개에서 점추정이 {nom}를 넘는다(최대 {max})."
    - "AUClast 구성은 {z}개에서 {nom} 이하다(최대 {p2max}, 원인 분해 별첨 A5)."
    - "기준 미달자를 빼지 않고 λz 산출 전원으로 판정해도 {kb}개에서 점추정이 {nom}를 넘는다(최대 {maxb})."
  caption: "경계 조건: 시험약의 기전 하나를 바꿔 참 AUCinf 비를 동등 한계({tgt})에 맞춘 가상 제품. 조건마다 시험 {reps}회 이상, 분석 모형 M1(체중 층 포함)."
  notes: |
    두 구성: AUClast + Cmax는 두 지표가 모두 동등 기준을 통과해야 동등이다. AUCinf + Cmax는 신뢰할 수 있는 AUCinf(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%)를 얻은 대상자만으로 AUCinf를 판정하고 Cmax와 함께 통과해야 동등이다(규칙 A, 세트 (iii)).
    최댓값: AUCinf 구성은 2016 모델 {i16}, 2020 모델 {i20}(모두 표적 매개 소실 칸). AUClast 구성의 {nom} 초과 한 조건은 2020 모델 말초 분포 증가 칸 {ci}이다(원인 분해는 별첨 A5).
    기전: 시험약이 표적 매개 소실에서 다르면(표적 소실 증가 칸) 신뢰할 수 있는 AUCinf만으로 구한 비구획 AUCinf 기하평균비가 참 비보다 1 쪽으로 {bi16}(2016 모델), {bi20}(2020 모델) 치우치고, λz 산출 전원으로 구해도 {bb16}, {bb20} 치우친다(criteria_bias.csv, M1). 그래서 동등 한계에 있는 제품이 동등으로 판정된다.
    칸 수 세부: {n}개 = 두 모델 x 기전·방향 조합. 흡수 속도 감소 두 칸은 참 Cmax 비가 동등 한계 밖이라 두 구성 모두 동등 판정이 없어 정보가 없다. AUCinf 구성의 {k}개는 점추정 기준이다(2016 모델 선형 소실 증가 칸 {ke}는 95% 구간이 5%를 포함). 확장 칸(2020 모델 말초 분포 증가)은 시험 {ext}회다.
    AUClast 구성이 {nom} 아래인 이유 하나: 경계 조건은 참 AUCinf 비로 정의했는데, 비구획 AUClast 기하평균비는 {naw}개 조건에서 참 AUCinf 비보다 한계 바깥쪽에 있다(치우침 {aw}; p2_decomposition_models.csv, M1). 1 쪽으로 치우친 한 조건(2020 모델 말초 분포 증가, {tw})이 AUClast 구성의 유일한 {nom} 초과 조건이다. AUClast 구성의 낮은 1종 오류는 이 추정 대상 차이를 포함한 값이다.
    분석 모형: M1(체중 층 포함)은 주분석 후보이며 의뢰자 결정 전이다. 현행 설계의 기본 분석은 합동 t 검정(M0)이다.
    참조: 참 AUCinf 하나로(Cmax 없이) 판정하면 경계 1종 오류는 {ref}다. 체중 층을 넣지 않은 분석 모형(M0)에서는 AUCinf 구성 {i0}개, AUClast 구성 {p0}개 조건이 {nom}를 넘는다(별첨 A5).
