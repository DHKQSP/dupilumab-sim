A8:
  kicker: "별첨 A8 · Km(Michaelis-Menten 반포화 농도)은 PK로 보이지 않는다"
  title: "시험약의 표적 매개 소실 Km을 {m}배로 바꿔도 참 AUCinf 비는 {r}(두 모델)에 머물러 PK로 검출되지 않는다"
  fig:
    xlab: "시험약 Km 배율 (대조약 대비, 로그 눈금)"
    ylab: "참 AUCinf 비 (시험약 / 대조약)"
    reach: "빈 표식: 목표 {t} 도달\n×{m16} / ×{m20}"
    band: "동등성 범위"
  table:
    head: ["시험약 기전 배율\n(2016 모델 / 2020 모델)", "참 비 {lo}\n도달", "참 비 {hi}\n도달"]
    none: "도달 못함"
    mech:
      F: "생체이용률 F"
      ka: "흡수 속도상수 ka"
      ke: "선형 소실 속도상수 ke"
      Vmax: "최대 소실 속도 Vmax"
      V2: "말초 분포용적 V2"
      Km: "반포화 농도 Km"
  body:
    - "Km 변화로 닿는 사전 규정 목표는 {t} 하나다(×{m16}, ×{m20}). 참 최고 농도(Cmax) 비도 {cm}에 머문다. 다른 기전은 표의 배율에서 동등 경계에 닿는다."
  caption: "시험약 arm의 한 기전만 바꾸고 대조약은 그대로 둔 참값 역산(공통 가상 대상자 {n}명, 잔차 없는 모델 적분). 음영: 동등성 범위 {lo}."
  notes: |
    방법: 시험약 arm의 Km만 곱하고 대조약은 그대로 두어 참 AUCinf 비를 계산했다(공통 가상 대상자 {ntruth}명, 체중 {wt} kg, 잔차 없는 모델 적분). 곡선은 선별 {nscr}명으로 계산한 로그 간격 배율이고, 빈 표식(도달 목표)은 {ntruth}명으로 확인한 값이다. 탐색 범위는 {m}배다.
    범위 끝의 참 AUCinf 비: 2016 모델 {a16d}(가장 작은 배율), {a16u}(가장 큰 배율); 2020 모델 {a20d}, {a20u}. 모델별 범위는 2016 모델 {r16}, 2020 모델 {r20}이며 제목의 범위는 둘을 합친 것이다. 가장 큰 배율에서 참 Cmax 비는 {c16u}, {c20u}이다.
    사전 규정 목표 비 {nt}개({tr}) 가운데 Km 변화로 닿는 목표는 하나뿐이다(배율 ×{q16}, ×{q20}). 동등성 경계에는 어느 방향으로도 닿지 않으므로 Km 경계 시나리오는 없다. 다른 기전(F, ka, ke, Vmax, V2)은 ×{olo}~×{ohi} 사이의 배율에서 경계에 닿는다. '도달 못함'은 탐색 범위(Km {kmx}, 다른 기전 {othx}) 끝에서도 목표에 닿지 않았다는 뜻이다.
    해석 주의: Km은 표적 매개 소실을 Michaelis-Menten 식으로 근사한 반포화 농도이며 결합 친화도 그 자체가 아니다. 두 모델 모두 Km은 {kv} mg/L, {kv20} mg/L로 고정되어 있고 개인간 변동이 없다. 이 값은 정량한계({lq} mg/L)보다 낮다.
    결합 유사성은 모의 결과가 아니라 분석적 유사성 평가(결합 동역학, 기능 분석)가 담당한다는 것이 의뢰자 입장이다(M&S 보고서 5.6절, 예상 질의 Q10).
