A8:
  kicker: "별첨 A8 · Km(Michaelis-Menten 반포화 농도) 민감도: 두 모델 모두 정량한계 아래 고정값"
  title: "두 모델에서 시험약 Km을 {m}배로 바꿔도 참 AUCinf 비는 {r}로 동등 범위 안이다: Km 차이는 AUCinf로도 드러나지 않는다"
  fig:
    xlab: "시험약 Km 배율 (대조약 대비, 로그 눈금)"
    ylab: "참 AUCinf 비 (시험약 / 대조약)"
    reach: "빈 표식: 목표 {t} 도달\n2020 모델 ×{m20}, 2016 모델 ×{m16}\n(두 모델의 곡선과 표식이 거의 겹친다)"
    band: "동등성 범위"
  table:
    head: ["시험약 기전 (2020 / 2016 모델)", "참 비 {lo} 도달", "참 비 {hi} 도달"]
    none: "도달 못함"
    mech:
      F: "생체이용률 F"
      ka: "흡수 속도상수 ka"
      ke: "선형 소실 속도상수 ke"
      Vmax: "최대 소실 속도 Vmax"
      V2: "말초 분포용적 V2"
      Km: "반포화 농도 Km"
  body:
    - "Km은 두 모델 모두 {kv} mg/L 고정값(정량한계 {lq} mg/L 아래, 개인 간 변동 없음)이라, 이 결과는 모델 구조에서 나온다."
    - "사전 규정 목표 중 Km 변화로 닿는 것은 {t} 하나뿐이고, 참 Cmax 비는 {cm}에 머문다."
  caption: "시험약 arm의 한 기전만 바꾸고 대조약은 그대로 둔 참값 역산(공통 가상 대상자 {n}명, 잔차 없는 모델 적분). 음영: 동등성 범위 {lo}."
  notes: |
    방법: 시험약 arm의 Km만 곱하고 대조약은 그대로 두어 참 AUCinf 비를 계산했다(공통 가상 대상자 {ntruth}명, 체중 {wt} kg, 잔차 없는 모델 적분). 곡선은 선별 {nscr}명으로 계산한 로그 간격 배율이고, 빈 표식(도달 목표)은 {ntruth}명으로 확인한 값이다. 탐색 범위는 {m}배다.
    범위 끝의 참 AUCinf 비: 2020 모델 {a20d}(가장 작은 배율), {a20u}(가장 큰 배율); 2016 모델 {a16d}, {a16u}. 모델별 범위는 2020 모델 {r20}, 2016 모델 {r16}이며 제목의 범위는 둘을 합친 것이다. 가장 큰 배율에서 참 Cmax 비는 2020 모델 {c20u}, 2016 모델 {c16u}이다.
    사전 규정 목표 비 {nt}개({tr}) 가운데 Km 변화로 닿는 목표는 하나뿐이다(배율 2020 모델 ×{q20}, 2016 모델 ×{q16}). 동등성 경계에는 어느 방향으로도 닿지 않으므로 Km 경계 시나리오는 없다. 다른 기전(F, ka, ke, Vmax, V2)은 ×{olo}~×{ohi} 사이의 배율에서 경계에 닿는다. '도달 못함'은 탐색 범위(Km {kmx}, 다른 기전 {othx}) 끝에서도 목표에 닿지 않았다는 뜻이다.
    해석 주의: Km은 표적 매개 소실을 Michaelis-Menten 식으로 근사한 반포화 농도이며 결합 친화도 그 자체가 아니다. Km은 2020 모델 {kv20} mg/L, 2016 모델 {kv} mg/L로 고정되어 있고 두 모델 모두 개인간 변동이 없다. 이 값은 정량한계({lq} mg/L)보다 낮아 관측 농도로는 식별되지 않는다(두 문헌 모두 추정하지 않고 고정). 따라서 이 결과는 Km 차이가 없다는 근거가 아니라, 이 모델 구조에서 AUCinf가 Km에 둔감하다는 뜻이다. 제목의 범위는 두 모델을 합친 것이다.
    결합 유사성은 모의 결과가 아니라 분석적 유사성 평가(결합 동역학, 기능 분석)가 담당한다는 것이 의뢰자 입장이다(M&S 보고서 5.6절, 예상 질의 Q10).
