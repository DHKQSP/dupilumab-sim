A14:
  kicker: "별첨 A14 · 재현성"
  title: "핵심 덱 입력 대조 {neq}개가 모두 일치했고 v1.0 재현 항목 {ni}개는 새 러너에서 통과했으나, v1.0.1 결과는 아직 새 러너에서 재현하지 않았다"
  cards:
    c1:
      head: "① 핵심 덱 입력 (scripts/63)"
      unit: " 일치"
      label: "곡선 모양 추출(기본과 변형) {ncs}개, 대표 대상자 모집단, S4 절벽 대상자를 원래 시드 규칙으로 다시 만들어 커밋된 결과와 대조.\n입력 {nin}개는 SHA-256으로 기록"
    c2:
      head: "② v1.0 결과 재현 (새 러너)"
      unit: " 통과"
      label: "{when}, 재현 워크플로 첫 실행.\n환경은 renv.lock으로 복원했고, 다시 계산한 값은 로컬 실행과 유효숫자 {sig}자리까지 같다"
    c3:
      head: "③ 자동 시험 (GitHub Actions)"
      ok: " 성공  "
      fail: " 실패"
      label: "실행 {fx1}~{lastd}(취소 {nc}). 실행 {r1}은 환경 설정에서 멈춤.\n실패 원인: 건너뛴 시험을 실패로 센 규칙({rf}), 환경 설정({rd}). 둘 다 다음 실행에서 고침"
  body:
    - "사전 등록(config/prereg_20260929.yaml, {regd})을 커밋한 뒤 계산했다. 난수는 고정 시드와 태그에서 파생하며(주 시드 {seed}), 패키지 버전은 renv.lock으로 고정했다(R {rv}, rxode2 {rx})."
  run_clean: "마지막 scripts/63 실행(커밋 {cm63})은 코드·설정에 커밋 전 변경이 없는 상태였고(이전 실행 가운데 스크립트 수정을 커밋하기 전에 돌린 실행은 git_code_clean이 거짓이었으나, 커밋 뒤 다시 실행한 산출이 바이트 단위로 같았다: D-063),"
  run_dirty: "마지막 scripts/63 실행(커밋 {cm63})의 사전 등록 파일은 커밋된 상태였다. 다만 그 실행에는 커밋 전 변경({unc})이 있어 커밋 해시만으로 실행 코드를 특정할 수 없다. 이 실행의"
  caption: "새 러너 재현 항목은 v1.0 결과(운용 특성 모의 시험, 경계 배율 탐색, 외삽 비율 중앙값)이며 v1.0.1 사전 등록 분석은 없다. 핵심 덱 입력은 저장된 결과의 요약과 S7의 새 시험(scripts/64)이다(노트)."
  notes: |
    핵심 덱 입력(scripts/63, 사전 등록 config/prereg_20260929.yaml 7절, 결정 기록 D-063): scripts/63에는 새 시험 모의가 없다. 저장된 대상자 수준 결과를 요약하고, 개체 수준 파일이 없는 곡선 모양 변형과 대표 대상자의 관측값은 원래 시드 규칙(주 시드 {seed}, 태그별 파생)으로 다시 만들었다. S4 절벽 대표 대상자(2020 모델, 사전 등록 7절 g항목)는 절벽 연구의 시드 규칙(R/cliff.R)으로 다시 만들어 정량한계 도달 시점을 저장값과 대조했다. 다시 만든 값이 커밋된 요약·저장된 비구획 분석과 다르면 멈추게 했다(허용 오차는 사전 등록에 적음).
    대조 {neq}개(results/core_deck/provenance.csv, 모두 equal): 곡선 모양 연구의 추출 {ncs}개(기본 추출과 변형 {ncsv}개), 대표 대상자 모집단(두 모델, 모델마다 {nind}명)의 비구획 분석 {ncol}개 열 대조 {nnca}개(결측 형태와 값), 대표 대상자 대조 {nsub}개(관측 tlast의 참 누적 AUC, 참 농도 재계산), 저장 요약 대조 {nsum}개(기본 두 모델, 정량한계 두 경우, 비례 잔차, 세트 (iii) 미달 비율 두 모델, λz 산출 인원 두 모델), 2020 모델 절벽 대조 {ncl}개(절벽 요약과 S4 대표 대상자, 사전 등록 7절 g항목). 입력 파일 {nin}개는 SHA-256으로 기록했다.
    사전 등록은 계산 전에 커밋했다: {run63} 로그에 적힌 사전 등록 파일의 SHA-256이 현재 파일과 같다.
    S7 판정 성능(사전 등록 config/prereg_20260929_oc.yaml 8절, D-064, D-065): scripts/64가 경계·동일 제품 밖 칸의 새 시험을 scripts/44의 시드 규칙으로 만들고, 시험 1~2,000회의 M0 결과를 저장된 운용특성 시험과 대조했다(다르면 중단, 실행 기록 logs/oc_curves_*). scripts/65는 저장된 경계·동일 제품 시험을 시험별로 다시 판정해 기존 요약(type1_models, criteria_g2_type1, power_models) {noc}개를 시험 수와 통과 수까지 그대로 재현했다(results/oc_curves/oc_identity_checks.csv). 2020 모델 실행은 컨테이너 재시작으로 한 번 끊겨 완료된 시험 뒤부터 이어서 돌렸고, 끊기기 전 시험 하나를 다시 만들어 저장된 행과 같음을 확인했다(D-065).
    멈춘 실행(DECISIONS D-063): 기록된 실행 전에 세 번의 실행이 결과를 내기 전에 멈추거나 대체됐다. 하나는 스크립트에 premise 함수가 없어 멈췄고, 하나는 대표 대상자에 'λz 산출 가능'이라는 전제를 두었다가 멈췄다. 그 전제는 사전 등록에 없는 조건이었고(2020 모델 최솟값 대상자는 λz 산출 불가) 빼고 다시 실행했다. 나머지 하나는 추적 파일에 값을 그대로 적어 파일이 너무 커져 개수와 해시로 바꿨다. 세 실행의 로그는 지웠고, D-063은 계산 규칙과 값이 바뀌지 않았다고 적는다.
    v1.0.1 결과: 새 러너에서 다시 계산한 기록이 아직 없다(아래). 로컬 대조(카드 ①)와 자동 시험(카드 ③)만 있다.
    v1.0 재현: 재현 워크플로 첫 실행(커밋 {cm}, {when} UTC)은 새 GitHub 러너({os})에서 renv.lock으로 환경을 복원한 뒤 허용 오차를 미리 정한 항목(config/repro_check.yaml)을 다시 계산했다. 항목 {ni}개가 로컬 실행({nl}개 통과)과 새 러너({pg}) 모두에서 통과했고 값은 유효숫자 {sig}자리까지 같다. 이 실행은 v1.0.1 사전 등록보다 앞서므로 v1.0.1 결과(M1, 기준 세트, 시험 모집단)를 새 러너에서 다시 계산한 기록은 없다.
    자동 시험(tests 워크플로): 실행 {r1}은 시험 전 환경 설정 단계에서 멈췄다(renv.lock 없음 {a}회, JUnit 보고기의 xml2 없음 {b}회). 실행 {fx1}~{lastd}: 성공 {ns}, 취소 {nc}(같은 브랜치의 새 push로 대체), 실패 {nf}. 실패는 건너뛴 시험을 실패로 세는 규칙({rf})과 환경 설정({rd})이었고 실행 {fx2}, {fx3}에서 고쳤다. 기록(ci_runs_*.csv, GitHub Actions API)의 마지막 실행 {lastd}은 성공이며, 그 뒤의 실행은 기록에 없다.
    난수와 환경: 난수는 고정한 주 시드와 태그에서 derive_seed(시드, 태그, 구성 요소)로 파생하며(R/seeds.R), 규칙 버전은 실행 로그에 남는다. 패키지 버전은 renv.lock(R {rv}, rxode2 {rx}, renv {renv})으로 고정했다.
    관련 보고서: 4.1절, 부록 C, 부록 G; 결정 기록 D-063.
