B2:
  kicker: "② 보강: 조건을 바꿔도"
  title: "AUClast/AUCinf는 기본 조건 최소 {bmin},\n모든 경우 {e80}% 미만인 대상자 {lt80} 이하, 5번째 백분위수 {p05} 이상"
  fig:
    xlab: "AUClast/AUCinf (참값). 점: 중앙값, 막대: 5~95백분위, 세로 표식: 최솟값, 검은 네모: 문헌 비구획 평균비"
    ema: "EMA 기준 {v}%"
    groups:
      base: "기본"
      vmax: "최대 소실 속도\n(Vmax)"
      km: "반포화 농도\n(Km)"
      lloq: "정량한계"
      resid: "잔차"
      wt: "체중 층"
      lit: "문헌(비구획)"
    rows:
      k2016_base: "2016 모델"
      k2020_base: "2020 모델"
      vmax: "×{v}"
      km: "×{v}"
      lloq: "LLOQ {v} mg/L"
      resid: "비례 잔차 {v}%"
      wt: "{a}~{b} kg"
      lit_clot: "Clot 2021 300 mg"
      lit_pkm: "PKM12350 대조군"
  body:
    - "EMA 생물학적 동등성 지침(제네릭 대상, 검색 발췌): AUClast는 AUCinf의 {e80}% 이상이어야 한다."
    - "비구획 값(λz 산출 대상자)으로도 {e80}% 미만은 {nca80}로, 지침이 타당성 논의를 요구하는 {e20}%보다 훨씬 낮다."
  caption: "문헌 값은 비구획 평균비라 참값보다 낮은 경향이 있다(같은 조건 모의에서 {gap} 낮음). 기본 외 조건은 2016 모델."
  notes: |
    케이스: 곡선 모양(Vmax 최대 소실 속도, Km 반포화 농도; 시험약·대조약 모두 바꿈)·정량한계·비례 잔차·체중 층은 2016 모델 기본 조건에서 한 가지씩 바꿨다.
    제목 규칙(사전 등록 section7, 케이스별 요약 계산 전 고정; 기본 조건 최솟값은 이미 알려져 있었다): 모든 경우의 최솟값이 {t84}% 이상이면 "모든 경우 {t84}% 이상"이라고 쓰고, 아니면 기본 조건 최솟값, 모든 경우의 {e80}% 미만 비율 최댓값, 모든 경우의 5번째 백분위수 최솟값을 쓴다. 결과는 두 번째다: 정량한계 {lq} mg/L {mlq}, Vmax ×{vm} {mv}, Km ×{km} {mk}, 비례 잔차 {rs}% {mr}가 {t84}% 아래다. 하한('이상')은 내림, 상한('이하')은 올림으로 적었다.
    기본 조건 최솟값: 2016 모델 {m16}, 2020 모델 {m20}. {e80}% 미만은 정량한계 {lq} mg/L에서 {lt}({nsub}명 중 {nlt}명, 관측 비율)뿐이다. 5번째 백분위수가 가장 낮은 경우는 Vmax ×{vm}({p05v})다. 곡선 모양 연구 자체의 기본 조건 재추출(참고)의 최솟값은 {mcb}다.
    문헌: 공개된 평균 AUClast / 평균 AUCinf(비구획; Clot 2021 Table 3, FDA 리뷰 Table 4.2.c). Clot 2021 {cd} mg {clot}(같은 조건 모의 참값 평균비 {clots}), PKM12350 대조군 {pkm}(모의 참값 {pkms}). 비구획 AUCinf가 외삽을 과대추정하므로(S7) 공개 값은 실제 커버리지보다 낮게 나온다.
    EMA 생동 지침(CPMP/EWP/QWP/1401/98 Rev. 1)은 AUClast가 AUCinf의 {e80}% 미만인 관측이 {e20}%를 넘으면 시험 타당성을 논의하게 한다. 제네릭 생동성 시험 지침이다. 바이오시밀러 요건이 아니라 AUClast 적정성의 관행 기준으로 인용했다.
