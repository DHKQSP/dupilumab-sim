A12:
  kicker: "별첨 A12 · 한계와 검증 상태"
  title: "곡선 모양과 반포화 농도(Km) {km} mg/L 고정은 민감도 분석으로만 확인했고, 실제 Phoenix 대조와 독립 품질 점검(QC)은 아직 하지 않았다"
  table:
    head: ["상태", "항목", "내용과 다음 조치"]
    status:
      - "민감도 분석으로만 확인"
      - "재현 안 됨"
      - "미실시"
      - "대기"
      - "원문 미대조"
      - "일치"
      - "의뢰자 결정 대기"
    item:
      - "정량한계 아래 곡선 모양,\nKm {km} mg/L 고정(개인차 없음)"
      - "{d200} mg 제형({c175} mg/mL)의\n빠른 흡수"
      - "실제 Phoenix WinNonlin과의 대조"
      - "담당자의 독립 QC"
      - "문헌·지침 인용 {nlit}건 (검색 발췌)"
      - "핵심 덱 새 요약(scripts/63) 재생성"
      - "정량한계, 잠정 설계값,\n주분석 모형, 목표 검정력"
    detail:
      - "양 군 최대 소실 속도(Vmax) ×{v}, Km ×{k}에서\nAUClast/AUCinf 5번째 백분위수 {p05} 이상(S8, 별첨 A8)"
      - "최고 농도 도달 시간(tmax) 관측 {to}일 대 모의 {ts}일.\n시험 제형 {d300} mg은 노출 재현(별첨 A1): 두 군 모두 이 제형인지 확인"
      - "NCA 엔진은 NonCompart·PKNCA와만 대조(λz 창 {lz} 일치).\n대표 프로필 일부를 Phoenix로 돌려 λz 창과 AUCinf를 대조"
      - "검증 기록 결과 칸 '{qc}', 서명 페이지 공란 → 수치·본문을 한 줄씩 대조"
      - "FDA BLA 761055 리뷰의 문구와 쪽({page}쪽) 미확인, EMA 생동 지침의 {e80}% 기준,\n선례 시험과 EMA 2012 지침: 모두 원문과 대조"
      - "원래 시드 규칙으로 재생성해 커밋된 결과와 대조 {n34}개 모두 일치(provenance.csv)"
      - "LLOQ {lloq} mg/L와 설계값은 가정. 주분석 제안 M1(체중 층 포함), M0(층 없음) 병기.\n목표 검정력 {tg90}%면 arm당 평가 가능 {n90}명, {tg85}%면 {n85}명(현행 {n_arm}명)"
  caption: "별첨 A13(규제 업무(RA) 포지션 페이퍼 7절 대응표)은 싣지 않았다: 포지션 페이퍼와 직전 지시의 결과가 저장소에 없다(DECISIONS D-063)."
  notes: |
    곡선 모양과 Km: 정량한계 아래 말단 곡선은 관측할 수 없고, Km(표적 매개 소실의 Michaelis-Menten 상수, 결합 친화도 자체가 아님)은 두 모델 모두 {km} mg/L로 고정되어 개인 간 변동이 없다. 이 가정은 민감도 분석으로만 확인했다: 곡선 모양 변형(2016 모델, 양 군 공통 Vmax ×{v}, Km ×{k}) {ce}개 모두 AUClast/AUCinf 80% 미만 대상자가 없고 5번째 백분위수는 {p05} 이상이다(S8). Km 변형의 참 외삽 중앙값은 {kmed}다. 시험약 Km만 ×{im}로 바꿔도 참 AUCinf 비는 {kr}로 동등 한계({lims}%) 안에 머문다. 곧 Km 차이는 AUC로 검출되지 않으며 결합 유사성은 비교 분석적 평가로 입증한다(별첨 A8).
    {d200} mg({c175} mg/mL) 제형: 관측 tmax {to}일인데 모의는 {ts}일이고, AUClast 모의/관측은 {a16}(2016 모델), {a20}(2020 모델)이다. 연구 제형이 아니어서 외부 점검으로만 보고했다. 시험 제형 {d300} mg({c150} mg/mL) 자료는 AUClast 모의/관측 {g300a}(2016 모델), {g300b}(2020 모델)로 노출 확인 범위 ±{gate}% 안이다(별첨 A1). 시험약과 대조약이 모두 이 제형인지 시험 계획에서 확인한다.
    NCA 엔진: 검증 범위는 NonCompart·PKNCA 두 참조 구현뿐이다(λz 창 {lz} 일치, 최대 상대 차이 {mx}). results/nca_engine에 Phoenix 출력이 없다. 보고서 3.4절은 'Phoenix 규칙 재현'이라고 적었고, Phoenix 미대조는 보고서 한계 목록(6.5절, 부록 B)에 없는 새 항목이다. 제출 전 대표 프로필 일부를 실제 Phoenix WinNonlin으로 돌려 λz 창과 AUCinf를 대조하는 것을 제안한다(미실시).
    독립 QC: regulatory/tables/verification_qc.csv의 해당 행 결과가 '{qc}'(의뢰자 검토 대기)이고 보고서 서명 페이지는 공란이다. 이 덱과 보고서는 AI 코딩 도우미의 도움으로 작성되었으므로 담당자가 수치는 추적표(core_deck_traceability.csv, regulatory/traceability.csv)와, 본문은 결과 파일과 대조해야 한다.
    인용 상태(config 파일의 status 값): config/literature_core_deck.yaml의 FDA BLA 761055 임상약리 리뷰({rdate}) '{s_fda}', EMA 생동 지침 '{s_ema}'; config/literature_precedents.yaml의 MSB11456 시험 '{s_msb}', EMA 2012 단클론항체 바이오시밀러 지침 '{s_mab}'. 원문 PDF와 학술지 페이지는 분석 환경의 네트워크 정책으로 열리지 않아 검색 요약으로만 확인했다. FDA 리뷰의 쪽 번호({page}쪽, 지시문 값)와 문구 'very steep target-mediated phase'는 확인되지 않았고, 같은 내용은 Kovalenko 2020 결과 절에도 있다(S4). 외부 사용 전 원문과 대조한다.
    재생성 대조(scripts/63, 사전 등록 config/prereg_20260929.yaml section7, DECISIONS D-063): 개체 수준 파일이 git 밖에 있는 곡선 모양 변형과 대표 대상자 관측값을 원래 시드 규칙(scripts/10, scripts/21과 같은 기준 시드)으로 다시 만들고, 커밋된 요약·저장된 비구획 분석 결과와 대조했다. provenance.csv에는 입력 파일 해시 {nin}개와 대조 {n34}개가 있고 대조는 모두 일치했다(대표 대상자 관련 {nrep}개 포함). 새 모의는 없다.
    의뢰자 결정 대기(결과보고 덱 S26, 보고서 7절·부록 B): 분석법 LLOQ {lloq} mg/L는 원개발사 분석법 값을 빌린 가정이다(격자 {grid} mg/L에서 AUClast/AUCinf {thr}% 미만 {cov}, 2016 모델). 잠정 설계값(모두 config 상태 assumption): 첫 채혈 Day 1 투여 후 {t1}일, 체중 평균 {wm} kg·SD {wsd} kg, 남성 비율 {male}%, 층 경계 {split} kg, 방문 허용 범위. 주분석 모형: 이 덱의 제안은 M1(체중 층 포함)이고 M0(층 없음)를 함께 보고한다. 목표 검정력과 n: arm당 무작위배정 {n_rand}명, 평가 가능 {n_arm}명; CV {cv}%, 참 GMR {g}에서 AUClast + Cmax 검정력 {pw1}(M1), {pw0}(M0). 목표 {tg90}%에 평가 가능 {n90}명(M1), {n90_0}명(M0), 목표 {tg85}%에 {n85}명(M1), {n85_0}명(M0). 값이 정해지면 config 한 곳을 바꾸고 전체를 다시 만든다.
    그 밖에 보고서가 적은 한계: Cmax 과대예측(연구 제형 자료의 모의/관측 Cmax {gc16}(2016 모델), {gc20}(2020 모델); 1종 오류와 검정력 계산에 모의 Cmax를 그대로 씀), 항약물항체(ADA) 영향은 유사 하위군 민감도 분석으로만 모의, 문헌 모델(개인 자료 없음), λz 수동 검토와 중도 탈락은 모의하지 않음.
    별첨 A13(규제 업무 포지션 페이퍼 7절 대응표)은 넣지 않았다. 직전 지시(포지션 페이퍼 연계 보완)의 결과와 포지션 페이퍼 자체가 저장소에 없어 대응 내용을 만들 수 없다(DECISIONS D-063, 지시 "없으면 생략").
    관련 보고서: 3.4절, 4.1절, 4.2절, 5.2절, 5.6절, 5.10절, 5.11절, 6.5절, 7절, 부록 B.
