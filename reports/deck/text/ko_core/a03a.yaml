A3a:
  kicker: "별첨 A3a · ① 세부: 기준 세트별 결과"
  title: "이 덱의 기준인 세트 (iii)은 대상자 {iii}가 미달하고, 기준이 가장 느슨한 세트 (i)도 {i}가 미달한다"
  sets:
    i: "(i)"
    ii: "(ii)"
    iii: "(iii)"
    iv: "(iv)"
  table:
    head: ["기준 세트\n(외삽 ≤ {ex}% 공통)", "모델", "미달\n(Wilson 95% 구간)", "λz 산출 불가", "λz 산출, 기준 미달", "그중 R² 미달", "그중 외삽 초과", "그중 span 미달", "arm당 충족 인원 (5~95백분위)"]
    set: "{s} R² ≥ {r2}"
    span: "+ span ≥ {v}"
    deck: "이 덱의 정의"
    no_span: "조건 없음"
  bullets:
    - "세트 (iii) 미달은 대부분 λz가 산출되나 R² 기준에 못 미친 경우다(R² 미달 {r2h}, λz 산출 불가 {lz}). 공개 통계분석계획(SAP) {nsap}건이 R² {r2}을 쓴다(S5)."
  caption: "R² = adjusted R², span = λz 구간 길이 ÷ 반감기. 사유는 λz 산출 불가, R², 외삽, span 순으로 하나만 센다(합 = 미달). 미달은 대상자 수준(모델마다 {n}명), arm당 충족({na}명 중)은 동일 제품 시험 {ntr}회에서 센 인원이다."
  notes: |
    시험 모집단(건강인 {wt} kg, 현행 채혈 B0) 모델마다 {n}명의 대상자 수준 결과다. 네 기준 세트는 모두 외삽 ≤ {ex}%를 요구하고, (i) adjusted R² ≥ {r2i}, (ii) = (i) + span ≥ {sp2}, (iii) adjusted R² ≥ {r2}, (iv) = (iii) + span ≥ {sp4}다(span = λz 구간 길이 ÷ 반감기). 세트 (iii)이 이 덱의 '신뢰할 수 있는 AUCinf'다.
    미달(두 모델 범위): 세트 (i) {i}, (ii) {ii}, (iii) {iii}, (iv) {iv}. 표의 괄호는 Wilson 95% 구간이다. 세트 (i)은 adjusted R² 기준이 가장 낮고 span 조건이 없어 네 세트 중 가장 느슨하므로, 그 미달 비율이 관행 기준에서의 하한이다.
    사유는 계층 분류(λz 산출 불가, adjusted R² 미달, 외삽 초과, span 미달 순으로 하나만 셈)라 네 칸의 합이 미달과 같고, 뒤 세 칸의 합이 'λz 산출, 기준 미달'이다. 세트 (iv)의 span 미달은 계층 분류로 {sp4h}, 다른 사유와 겹치는 대상자까지 세면 {sp4a}다. 외삽 {ex}% 초과는 겹침을 포함해도 {exa}로 작다.
    arm당 충족: 동일 제품 시험 {ntr}회(모델마다)에서 arm마다 기준을 충족한 평가 가능 대상자 수(arm당 {na}명 중)의 중앙값과 5~95백분위다. λz 산출만 요구하면 중앙값 {lam}명, 세트 (i) {ri}명, 세트 (iii) {ri3}명이고, 세트 (iii) 충족 인원이 가장 적은 시험은 {rmin}명이었다.
    공개 SAP({ncts})는 adjusted R² {r2}을 쓴다(NCT04700163은 {s3} 초과, 사이트 접근이 막혀 검색 발췌로 확인). 이 덱은 그래서 세트 (iii)을 신뢰 기준으로 삼는다.
    관련 보고서: 5.3절, Table 5-5, Figure 5-4.
