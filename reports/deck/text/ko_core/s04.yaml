S4:
  kicker: "전제: 말단 절벽"
  title: "농도가 약 {c} mg/L 아래로 내려가면 {len}일 만에 정량한계에 닿는다"
  fig:
    xlab: "연구일 (Day 1 = 투여일)"
    ylab: "참 농도 (mg/L, 로그 눈금)"
    cliff: "절벽 {len}일"
    start: "시작 농도 {c} mg/L\n(순간 반감기 {d1}일 미만)"
    lloq: "정량한계(LLOQ) {v} mg/L"
    blq: "정량한계 미만 채혈점"
    legend: "대표 대상자 1명(2016 모델)의 참 농도 곡선과 현행 채혈일"
  body:
    - "절벽 = 순간 반감기가 {d1}일 아래로 떨어진 뒤 정량한계(LLOQ, {lloq} mg/L)에 닿을 때까지."
    - "채혈 간격({int}일)보다 짧아, 절벽 위에 채혈점이 하나라도 있는 대상자는 {ge1}, 둘 이상은 {ge2}다."
  caption:
    - "미국 식품의약국(FDA) 생물의약품 허가신청(BLA) 761055 임상약리 리뷰 p.{pg}: \"very steep target-mediated phase\" (검색 발췌, 원문·쪽수 미대조)"
    - "Kovalenko 2020: 정량한계에 가까워질수록 말단 기울기가 음의 무한대로 가며 표적 매개 구간은 거의 수직선이다."
  notes: |
    그림: 2016 모델(주 모델), 건강인 {wt} kg 절벽 분석 모집단({nsub}명)에서 정량한계 도달일이 중앙값({pc}백분위)인 대상자(id {id})의 참 농도 곡선이다. 이 대상자는 Day {lday}에 정량한계에 닿는다. 점은 현행 채혈일(B0)의 참 농도이고, 정량한계 미만 점은 그림 아래쪽에 빈 점으로 그렸다.
    절벽 정의: 최고 농도 이후 순간 반감기(ln2 / (-d ln C/dt))가 처음 1일 미만이 된 시점부터 참 농도가 정량한계에 닿는 시점까지. 기울기는 ODE 상태값으로 정확히 계산했다.
    두 모델: 절벽 시작 농도 중앙값 2016 모델 {c16} mg/L, 2020 모델 {c20} mg/L; 절벽 길이 중앙값 {l16}일, {l20}일(2016 모델 5~95백분위 {p95}일); 정량한계 도달 연구일 중앙값 Day {d16}, Day {d20}.
    인용: FDA 쪽은 검색 요약에서 확인한 문구이며 리뷰 원문 PDF는 분석 환경에서 열리지 않아 쪽수와 정확한 문구를 대조하지 못했다(config/literature_core_deck.yaml). 같은 내용은 원개발사 논문 Kovalenko 2020 결과 절에 있다.
