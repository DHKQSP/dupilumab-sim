A10:
  kicker: "별첨 A10 · SAP 제안과 대응안"
  title: "1차는 AUClast + Cmax다. AUCinf 공동 1차를 요구받으면 AUClast를 유지한 채 더하며, 이 대응안의 경계 1종 오류는 최대 {fb}다"
  cards:
    - head: "제안 SAP"
      lines:
        - "1차: AUClast + Cmax"
        - "2차: AUCinf(두 분석군)"
    - head: "AUCinf 공동 1차 요구 시 (대응안)"
      lines:
        - "AUClast + AUCinf(규칙 B) + Cmax"
        - "규칙 A: 통과율이 더 줄고 노출 낮은 대상자 제외(표)"
    - head: "권하지 않음: AUCinf + Cmax"
      lines:
        - "점추정 {nom} 초과: {n}칸 중 {k}칸"
        - "노출이 낮은 미달자가 빠진다"
  table:
    head: ["판정 구성", "점추정 {nom}\n초과 칸(M1)", "최대", "통과율\n감소", "arm당\n빠지는 인원", "빠지는/남는\n참 AUCinf 비"]
    rows:
      P2: "AUClast + Cmax (제안)"
      F3B: "세 지표, AUCinf 규칙 B (대응안)"
      F3A: "세 지표, AUCinf 규칙 A 세트 (ii)"
      Aiii: "AUCinf + Cmax: 신뢰할 수 있는 AUCinf만"
      B: "AUCinf + Cmax: λz 산출 전원(규칙 B)"
      Ai: "AUCinf + Cmax: 세트 (i) 충족자만"
    units:
      na: "해당 없음"
      nc: "미산출"
      lost: "{k}명"
      lost_inf: "{k}명 (AUCinf만)"
      gmr: "{g}"
      ref: "기준"
  caption:
    - "규제 기본값(이 제안과 다름): EMA {ey} 단클론항체 지침은 단회 투여 시험에서 AUCinf 1차(피하면 Cmax 공동 1차), 선례 MSB11456 정맥 시험은 AUClast 1차(검색 발췌). 세 지표 = AUClast + AUCinf + Cmax; 규칙 A = 미달자 제외, B = λz 산출 전원(규칙 A 세트 (iii)의 세 지표 구성은 미산출). 통과율 감소: AUClast + Cmax 대비, 참 비 {fcr} 제품 세 개(2016 모델, M0, v1.0 대응안 모의; M1에서 규칙 B {pd}%p)."
  notes: |
    [제안 SAP] 1차 평가변수는 AUClast + Cmax(두 지표 모두 동등 기준 통과), 주분석 후보는 M1(투여군 + 무작위배정 체중 층, 의뢰자 결정 대기). 2차 평가변수 AUCinf는 동등성 판정에 쓰지 않고 두 분석군으로 보고한다: λz를 산출한 대상자 전원, 신뢰할 수 있는 AUCinf(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%)를 얻은 대상자. 두 분석군의 인원, 빠진 대상자의 체중과 AUClast를 함께 제시한다.
    [대응안] 규제기관이 AUCinf 공동 1차를 요구할 때만 쓴다. AUClast를 빼지 않고 AUCinf를 더한 세 지표 공동 1차(구성 F3B). AUCinf는 규칙 B(λz 산출 전원 포함; 기준 미달자는 제외하지 않고 표시만)다. 경계 1종 오류는 M1에서 {n}칸 모두 보수적이고 최대 {fbci}, M0 최대 {fb0}. 참고로 AUCinf를 규칙 A(세트 (ii) 미달자 제외)로 더하면 최대 {fa}, 규칙 C(미달자에 AUClast 대입)로 더하면 최대 {fcx}(점추정 {nom} 초과 {fcn}칸)다. 규칙 A가 아니라 규칙 B를 쓰는 이유: 규칙 A는 1종 오류가 조금 더 낮지만 동시 통과율 손실이 커지고(표) 기준 미달자, 곧 참 AUCinf가 낮은 대상자를 체계적으로 뺀다. 규칙 A를 세트 (iii)으로 적용한 세 지표 구성은 계산하지 않았다.
    대응안의 비용(v1.0 대응안 모의: 같은 시험에서 AUClast + Cmax 대비 동시 통과율 감소, 2016 모델, 체중 층 없는 합동 t 검정 M0, 제품당 시험 {ntrf}회): 동일 제품 {c0}(동시 통과율 {p0} → {p3}), 참 AUCinf 비 {rk} 제품 {ck}, {rf} 제품 {cf9}. F097 제품에서 AUClast + Cmax만의 검정력은 {ep}다. AUCinf를 규칙 A(세트 (ii))로 더하면 감소가 {ca}%p로 커진다. M1 운용 특성 모의(두 모델, 동일 제품과 F097 제품)에서도 검정력 차이는 {pd}%p다. 표본 수는 AUClast + Cmax 기준(별첨 A9)으로 정한다.
    [AUCinf + Cmax만] AUClast 없이 AUCinf + Cmax로 판정하는 안은 권하지 않는다. M1 경계 1종 오류: 신뢰할 수 있는 AUCinf만(규칙 A 세트 (iii)) 최대 {gi}, Wilson 하한까지 {nom} 초과 {gil}칸; 규칙 B 최대 {gb}, {gbl}칸. 신뢰 기준을 쓰면 AUCinf 분석에서 빠지는 대상자가 많고(세트 (iii) 미달 {fail3}, arm당 남는 인원 중앙값 {ret3}명(시험 {ntr}회); 세트 (i) {r2i} 기준 미달 {fail1}) 빠지는 대상자는 참 AUCinf가 낮아(표의 비) 노출이 낮은 쪽이 체계적으로 빠진다. 규칙 B는 λz 산출 불가({lz})만 빠져 인원 손실은 작지만 {n}칸 중 {kb}칸의 점추정이 {nom}를 넘는다.
    [표] 점추정 {nom} 초과 칸: 경계 {n}칸(M1) 중 통과율 점추정이 {nom}를 넘는 칸 수. arm당 빠지는 인원 = 평가 가능 {n_arm}명 - AUCinf 분석 인원(시험 {ntr}회의 중앙값, 두 모델 범위). 빠지는/남는 참 AUCinf 비 = 빠지는 대상자와 남는 대상자의 참 AUCinf 기하평균 비(두 모델). 세트 (i) = adjusted R² ≥ {r2i}, 외삽 ≤ {ex}%.
    규제 맥락: EMA 단클론항체 바이오시밀러 지침(EMA/CHMP/BMWP/403543/2010)의 기본값은 단회 투여 시험에서 AUCinf 1차, 피하 투여면 Cmax 공동 1차다. 선례로 토실리주맙 바이오시밀러 MSB11456의 건강인 단회 정맥 투여 시험은 AUClast를 1차, Cmax와 AUCinf를 2차로 두었다. 두 출처 모두 검색 발췌로만 확인했다(config/literature_precedents.yaml, 원문 미대조). 이 덱의 제안은 이 기본값에서 벗어나며, 그 근거가 S4~S9다.
    관련 보고서: 5.9절, 6.2절, 6.3절, 7절; SAP 제안 1절~7절; 예상 질의 Q9, Q11.
