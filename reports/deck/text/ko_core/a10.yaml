A10:
  kicker: "별첨 A10 · SAP 제안과 대응안"
  title: "1차는 AUClast + Cmax다. AUCinf 공동 1차를 요구받으면 AUClast를 유지한 채 더하며, 이 대응안의 경계 1종 오류는 최대 {fb}다"
  why:
    - "**대응안을 기본으로 두지 않음**: 낮은 1종 오류는 교집합 판정 때문이고, 기준 미달 AUCinf({efl})도 들어간다."
    - "**대응안의 2종 오류 비용은 작다**: 동일 제품 {f3bid}(AUClast + Cmax {p2id}), 참 비 {c}~{d} 칸 증가 최대 {f3binc}."
    - "**AUCinf + Cmax만은 권하지 않음**(주황 행): {n}칸 중 {k}칸이 점추정 {nom} 초과, 빠지는 대상자는 노출이 낮다."
  table:
    head: ["판정 구성", "점추정 {nom}\n초과 칸(M1)", "최대", "통과율 감소\n(M0)", "arm당\n빠지는 인원", "빠지는/남는\n참 AUCinf 비"]
    rows:
      P2: "AUClast + Cmax (제안)"
      F3B: "세 지표, AUCinf 규칙 B (대응안)"
      F3A: "세 지표, AUCinf 세트 (ii) 충족자만"
      Aiii: "AUCinf + Cmax: 신뢰할 수 있는 AUCinf"
      B: "AUCinf + Cmax: λz 산출 전원(규칙 B)"
      Ai: "AUCinf + Cmax: 세트 (i) 충족자만"
    units:
      na: "해당 없음"
      nc: "미산출"
      lost: "{k}명"
      lost_inf: "{k}명 (AUCinf만)"
      gmr: "{g}"
      ref: "기준"
  caption:
    - "AUClast + Cmax의 점추정 {nom} 초과 1칸({p2m})은 AUClast 기하평균비가 참 비보다 1 쪽(동등 판정 쪽)으로 {bias} 치우친 추정 대상 차이다(별첨 A5b). 세트 (i) = adjusted R² ≥ {r2i}, 외삽 ≤ {exi}%, (ii) = (i) + span ≥ {sp2}. M1 = 체중 층 포함, M0 = 층 없음. 통과율 감소: AUClast + Cmax 대비, 참 비 {fcr} 제품 세 개, 2016 모델(민감도 모델) v1.0 모의. 규제 기본값: EMA {ey} 단클론항체 지침은 단회 투여에서 AUCinf 1차(피하면 Cmax 공동 1차), 선례 MSB11456 정맥 시험은 AUClast 1차(둘 다 검색 발췌, 원문 미대조)."
  notes: |
    [제안 SAP] 1차 평가변수는 AUClast + Cmax(두 지표 모두 동등 기준 통과), 주분석 후보는 M1(투여군 + 무작위배정 체중 층, 의뢰자 결정 대기). 2차 평가변수 AUCinf는 동등성 판정에 쓰지 않고 두 분석군으로 보고한다: λz를 산출한 대상자 전원, 신뢰할 수 있는 AUCinf(adjusted R² ≥ {r2}, 외삽 ≤ {ex}%)를 얻은 대상자. 두 분석군의 인원, 빠진 대상자의 체중과 AUClast를 함께 제시한다.
    [대응안] 규제기관이 AUCinf 공동 1차를 요구할 때만 쓴다. AUClast를 빼지 않고 AUCinf를 더한 세 지표 공동 1차(구성 F3B). AUCinf는 규칙 B(λz 산출 전원 포함; 기준 미달자는 제외하지 않고 표시만)다. 경계 1종 오류는 M1에서 {n}칸 모두 보수적이고 최대 {fbci}, M0 최대 {fb0}. 참고로 AUCinf를 규칙 A(세트 (ii) 미달자 제외)로 더하면 최대 {fa}, 규칙 C(미달자에 AUClast 대입)로 더하면 최대 {fcx}(점추정 {nom} 초과 {fcn}칸)다. 규칙 A가 아니라 규칙 B를 쓰는 이유: 규칙 A는 1종 오류가 조금 더 낮지만 동시 통과율 손실이 커지고(표) 기준 미달자, 곧 참 AUCinf가 낮은 대상자를 체계적으로 뺀다. 규칙 A를 세트 (iii)으로 적용한 세 지표 구성(S7의 "+ AUCinf")은 v1.2 운용특성 모의에서 계산했다: 1종 오류 최대 {f3a3}, 동일 제품 2종 오류 {f3aid}(대응안 {f3bid}, AUClast + Cmax {p2id}). 대응안(규칙 B)의 2종 오류 증가는 동일 제품과 참 비 {c}~{d} 칸에서 최대 {f3binc}, 참 Cmax 비가 한계 안인 경계 밖 모든 칸에서 최대 {f3ball}다(results/oc_curves/oc_paired.csv).
    대응안의 비용(v1.0 대응안 모의: 같은 시험에서 AUClast + Cmax 대비 동시 통과율 감소, 2016 모델(민감도 모델), 체중 층 없는 합동 t 검정 M0, 제품당 시험 {ntrf}회): 동일 제품 {c0}(동시 통과율 {p0} → {p3}), 참 AUCinf 비 {rk} 제품 {ck}, {rf} 제품 {cf9}. F097 제품에서 AUClast + Cmax만의 검정력은 {ep}다. AUCinf를 규칙 A(세트 (ii))로 더하면 감소가 {ca}%p로 커진다. M1 운용 특성 모의(두 모델, 동일 제품과 F097 제품)에서도 검정력 차이는 {pd}%p다. 표본 수는 AUClast + Cmax 기준(별첨 A9)으로 정한다.
    [AUCinf + Cmax만] AUClast 없이 AUCinf + Cmax로 판정하는 안은 권하지 않는다. M1 경계 1종 오류: 신뢰할 수 있는 AUCinf만(규칙 A 세트 (iii)) 최대 {gi}, Wilson 하한까지 {nom} 초과 {gil}칸; 규칙 B 최대 {gb}, {gbl}칸. 신뢰 기준을 쓰면 AUCinf 분석에서 빠지는 대상자가 많고(세트 (iii) 미달 {fail3}, arm당 남는 인원 중앙값 {ret3}명(시험 {ntr}회); 세트 (i) {r2i} 기준 미달 {fail1}) 빠지는 대상자는 참 AUCinf가 낮아(표의 비) 노출이 낮은 쪽이 체계적으로 빠진다. 규칙 B는 λz 산출 불가({lz})만 빠져 인원 손실은 작지만 {n}칸 중 {kb}칸의 점추정이 {nom}를 넘는다.
    [대응안을 기본으로 두지 않는 이유] 세 지표 판정은 AUClast + Cmax를 통과한 시험 가운데 AUCinf까지 통과한 시험만 통과시키므로(교집합), 경계 {n}칸 모두에서 통과율이 AUClast + Cmax와 같거나 낮다. 대응안의 1종 오류가 낮은 것(M1 최대 {fb})은 이 때문이며 AUCinf가 주는 정보 때문이 아니다: 같은 규칙 B의 AUCinf를 Cmax와만 쓰면 {n}칸 중 {kb}칸의 점추정이 {nom}를 넘는다. 또 규칙 B는 λz가 산출되면 신뢰 기준(세트 (iii))에 못 미쳐도 AUCinf를 쓰므로, λz는 산출되나 기준 미달인 대상자({efl})의 AUCinf가 1차 판정에 들어간다. 제안(AUClast + Cmax)의 점추정 {nom} 초과는 {p2x}칸({p2m}, 2020 모델 말초 분포용적(V2) 증가 칸)뿐이며, AUClast 기하평균비가 참 AUCinf 비보다 1 쪽으로 {bci} 치우친 결과로 AUClast와 AUCinf의 추정 대상 차이다(별첨 A5b). 그래서 대응안은 규제기관이 AUCinf 공동 1차를 요구할 때만 쓴다.
    [표] 점추정 {nom} 초과 칸: 경계 {n}칸(M1) 중 통과율 점추정이 {nom}를 넘는 칸 수. arm당 빠지는 인원 = 평가 가능 {n_arm}명 - AUCinf 분석 인원(시험 {ntr}회의 중앙값, 두 모델 범위). 빠지는/남는 참 AUCinf 비 = 빠지는 대상자와 남는 대상자의 참 AUCinf 기하평균 비(두 모델). 세트 (i) = adjusted R² ≥ {r2i}, 외삽 ≤ {ex}%; 세트 (ii) = 세트 (i) + span ≥ {sp2}. M1 = 투여군과 무작위배정 체중 층을 넣은 분산분석(주분석 후보, 의뢰자 결정 대기), M0 = 체중 층 없는 합동 t 검정. 세트 (i) 충족자만 쓰는 AUCinf + Cmax(규칙 A 세트 (i))도 표에 있다.
    규제 맥락: EMA 단클론항체 바이오시밀러 지침(EMA/CHMP/BMWP/403543/2010)의 기본값은 단회 투여 시험에서 AUCinf 1차, 피하 투여면 Cmax 공동 1차다. 선례로 토실리주맙 바이오시밀러 MSB11456의 건강인 단회 정맥 투여 시험은 AUClast를 1차, Cmax와 AUCinf를 2차로 두었다. 두 출처 모두 검색 발췌로만 확인했다(config/literature_precedents.yaml, 원문 미대조). 이 덱의 제안은 이 기본값에서 벗어나며, 그 근거가 S4~S7이다.
    관련 보고서: 5.9절, 6.2절, 6.3절, 7절; SAP 제안 1절~7절; 예상 질의 Q9, Q11.
