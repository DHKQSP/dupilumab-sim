S6:
  kicker: "② 총노출 포착"
  title: "AUClast/AUCinf는 중앙값 대상자에서 {med},\n모의 대상자 중 최솟값도 {min}다"
  xref: "세부: 별첨 A4a(2016 모델 대표 대상자), A4b(관측 대 참 비), 보강 A-②(조건을 바꾼 경우)"
  fig:
    head: "AUClast/AUCinf = {v}%"
    role:
      median: "중앙값 대상자"
      p05: "5번째 백분위수 대상자"
      min: "최솟값 대상자"
    xlab: "연구일"
    tlast: "tlast"
    sub: "{role} · 농도(mg/L)"
    ratio: "비구획 외삽 면적은\n참값의 {r}배"
    no_lz: "λz 산출 불가:\n비구획 외삽 없음"
  body:
    - "참 곡선 아래 파랑 = AUClast(Day 1~마지막 정량 시점 tlast), 주황 = tlast 이후 참 곡선 아래 면적(참 외삽)."
  caption:
    - "비구획 AUCinf는 외삽 비율을 대체로 과대추정한다(중앙값 {nca} 대 참 {true}). 기준을 충족한 두 대상자도 비구획 외삽 면적이 참값의 {q1}배, {q2}배다."
    - "2020 모델 {nsub}명 중 선택. 선 = 참 농도, 점 = 관측(빈 점 = 정량한계 미만), 세로 점선 = 관측 tlast. 삽입도: 점선 = 비구획 외삽선, 빗금 = 비구획 외삽."
  notes: |
    대상자(2020 모델, 주 모델, 건강인 {wt} kg, 현행 채혈): 중앙값 id {i1}, 5번째 백분위수 id {i2}, 최솟값 id {i3}. 관측 tlast는 각각 Day {t1}, {t2}, {t3}이다. 선택 규칙은 사전 등록(동률이면 작은 id)이고, 대상자 곡선은 저장된 결과와 같은 시드로 다시 만들어 NCA 값이 저장된 값과 일치함을 확인했다(scripts/63). 2016 모델(민감도 모델)의 대표 대상자는 별첨 A4a.
    캡션: 참 AUCinf는 모델 적분값이다. 외삽 비율 중앙값의 모수는 비구획 {nca}가 λz를 산출한 대상자, 참 {true}가 전원이다. 최솟값 대상자는 λz를 산출하지 못해 삽입도에 비구획 외삽이 없다.
    삽입도: 로그 눈금으로 tlast 직전 방문부터 절벽 이후까지. 점선은 비구획 외삽선(Clast × exp(-λz(t - tlast))), 빗금은 그 아래 면적(비구획 외삽), 주황은 참 곡선 아래 면적(참 외삽)이다. 배수는 무한대까지의 두 면적의 비다: 중앙값 대상자 비구획 {a1} 대 참 {b1}, 5번째 백분위수 대상자 {a2} 대 {b2} mg·day/L.
    중앙값·5번째 백분위수 대상자의 adjusted R²는 {r1}, {r2}, 비구획 외삽 비율은 {e1}, {e2}로 신뢰할 수 있는 AUCinf 기준(adjusted R² ≥ {r2iii}, 외삽 ≤ {exiii}%)을 충족한다. 기준을 충족해도 외삽 면적 자체는 참값의 몇 배로 추정된다.
    최솟값 대상자는 최고 농도 뒤 정량 시료가 {np}개뿐이어서 λz 최소 점 수({mp}점)에 못 미쳐 λz를 산출하지 못했다. 따라서 비구획 외삽선과 빗금이 없고, 참 외삽 면적은 {b3} mg·day/L다. 이 대상자는 기준 미달자를 빼는 규칙 A에서도, λz 산출 가능자를 모두 쓰는 규칙 B에서도 AUCinf가 없다.
    모집단: 비구획 외삽 면적 / 참 외삽 면적은 λz 산출 전원 중앙값 {ea}배, 신뢰할 수 있는 AUCinf 충족자 중앙값 {rr}배이고(두 모델), 비구획 쪽이 작은 대상자는 충족자의 {b2p}(2020 모델), {b1p}(2016 모델)뿐이다(results/core_deck/extrap_ratio_by_group.csv, 추가 사전 등록). 2020 모델 외삽 비율 95번째 백분위수는 비구획 {p95n}, 참 {p95t}.
