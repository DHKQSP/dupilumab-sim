S6:
  kicker: "① 보강: 채혈로 줄지 않고, 무작위로 빠지지 않는다"
  title: "후보 일정으로 채혈을 늘려도 신뢰할 수 있는 AUCinf 비율은\n{rng}만 바뀌고, 기준 미달자는 노출이 낮다"
  fig:
    concept: "절벽 폭과 채혈 간격 (대표 대상자, Day {d} 이후): ● 현행 채혈일, ○ 추가 후보(D3)"
    xlab: "연구일"
    interval: "현행 간격 {d}일"
    added: "추가해도 최소 {d}일"
    cliff: "절벽 {len}일"
    change: "채혈 추가 후 변화 (후보 D1~D4 대 현행, 별첨 A7)"
    dx: "신뢰할 수 있는 AUCinf 비율 변화 (%p)"
    ratio: "기준 미달자 / 충족자의 참 AUCinf (기하평균비)"
    rx: "기하평균비 (95% 신뢰구간)"
    equal: "같으면 1"
  body:
    - "후보 일정(D1~D4)의 최소 간격({min}일)도 절벽({len}일)보다 넓어, 절벽 위 두 점 이상은 {ge2} 이하다."
    - "기준 미달자의 참 AUCinf는 충족자의 {gmr}배다: 미달자를 빼면 노출이 낮은 쪽이 빠진다."
  notes: |
    개념도: S4의 대표 대상자 절벽(주황)을 현행 채혈일(검은 점, 후반 {iv}일 간격)과 추가 후보 D3(빈 점)에 겹쳐 그렸다. 후보 D1~D4는 후반에 두~네 점을 더하며 가장 가까운 두 점의 간격은 {gmin}일이다(config/trial_design.yaml). 매일 채혈처럼 간격이 절벽보다 짧아지면 절벽 위 두 점 이상이 생길 수 있으나(현행 방문 허용 범위 기준) 후보 일정에서는 생기지 않는다.
    변화: 같은 대상자 {nsub}명(모델마다)에서 현행 B0의 신뢰할 수 있는 AUCinf 비율은 2016 모델 {b16}, 2020 모델 {b20}이다. D1, D2, D4에서는 오히려 줄고, 주 두 번 채혈(D3)에서만 {d3} 오른다. 점을 더하면 λz 구간이 절벽 앞의 완만한 구간으로 길어져 adjusted R²가 떨어지는 대상자가 생기는 것으로 보이나, 이 기전은 결과 파일로 따로 확인하지 않았다.
    기준 미달자 특성(세트 (iii)): 미달자는 충족자보다 {w} kg 무겁고, 관측 AUClast의 비는 {al}이다. 기준 미달을 빼는 규칙(규칙 A)은 노출이 낮은 대상자를 빼므로 남은 대상자의 AUCinf가 모집단을 대표하지 않는다. 시험약과 대조약이 다르면 두 arm의 미달 비율도 기전에 따라 달라져(경계 칸, Cmax로 판정 가능한 칸: arm 간 차이 {ad}) 두 arm에서 빠지는 대상자가 같지 않다. 세부는 별첨 A3a, A3b.
