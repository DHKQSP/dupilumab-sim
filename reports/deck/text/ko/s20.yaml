S20:
  kicker: "제안의 실행 · 채혈 일정 판단 (사전 규정 결정 규칙)"
  title: "현행 B0({n}회 채혈, Day {last}까지)를 유지한다: 추가·제거 후보 {k}개 중 사전 기준 (a)~(d)를 충족한 일정은 두 모델 모두 없다"
  table:
    head: ["후보 일정 (각 칸: 2016 모델 / 2020 모델)", "추가 방문 (회)", "(a) AUC0-last {ci}% CI 평균 폭 감소 (%, M0) · 기준 ≥ {a}", "(b) ke ×{ke}에서 AUC0-last 통과율 변화 (%p, M0) · 기준 ≥ +{b}", "(c) AUC0-inf 신뢰 충족률 변화, 세트 (ii) (%p) · 기준 ≥ +{c}", "(d) NCA 외삽 {x}% 초과 비율, B0 대비 (배) · 기준 ≤ {d}", "충족 기준"]
    added: "{s} · Day {d} 추가"
    removed: "B- · Day {d} 제거"
    none: "없음"
  bullets:
    - "**어느 후보도 기준에 닿지 않았다.** 추가 채혈은 CI 폭을 최대 {amax}%만 줄이거나 넓히고, 세트 (i) 신뢰 충족률 변화는 최대 {ci}%p다(기준 +{c}%p)."
    - "**Day {d50} 제거(B-)도 비권고**: CI 폭 감소 {bma}%(기준 {a}%), NCA 외삽 {x}% 초과 비율 {bmd}배."
    - "**Day {last} 이후 채혈은 정량 가능한 시료를 거의 더하지 않는다.** Day {d58} 이후에도 참 농도가 LLOQ 위인 대상자는 {a16}(2016 모델), {a20}(2020 모델)이다."
  fig:
    xlab: "연구일 (Day). 회색 세로선: B0 채혈일"
    ylab: "참 농도가 LLOQ 위인 대상자 (%)"
    tail: "Day {d} 이후 LLOQ 위\n2016 모델 {a}\n2020 모델 {b}"
    last: "B0 마지막 채혈 Day {d}"
  caption: "Day {last} 이후 채혈 일정은 모의하지 않았다(연장안은 D-016에서 철회). 판단은 위 비율에 근거한다."
  notes: |
    사전 규정 결정 규칙(보고서 3.9절, DECISIONS D-026): B0 대비 (a) AUC0-last {ci}% CI 평균 폭이 {a}% 이상 감소, (b) ke ×{ke} 시나리오의 AUC0-last 통과율이 +{b}%p 이상 증가, (c) AUC0-inf 신뢰 충족률(세트 (ii))이 +{c}%p 이상 증가, (d) NCA 외삽 {x}% 초과 비율이 B0의 {d}배 이하 중 하나라도 충족하면 추가 채혈을 권고하고, 모두 미충족이면 B0를 유지한다. 추가 채혈점 하나는 방문 {cost}회다. 자료는 모델마다 대상자 {nsub}명, 시험 {ntr}회다.
    (a)·(b)는 시험 수준 결과로, 합동 t 검정(M0)으로만 계산했다. M1(체중 층 포함)으로 계산한 일정 판정 결과는 없다(미산출). (c)·(d)는 대상자 수준 결과라 분석 모형과 무관하다. (a)는 양수가 폭이 좁아지는 쪽이다.
    (c)를 세트 (i)로 보면 D3는 +{d3i16}(2016 모델), +{d3i20}(2020 모델)이다. D1~D4 전체 범위는 세트 (i) {irng}%p, 세트 (ii) {iirng}%p다(두 세트를 섞은 범위로 쓰지 않는다). 어느 세트로도 (c)는 충족되지 않는다.
    (d) D3: {dboot}(2016 모델 / 2020 모델, 부트스트랩 95% 구간). {n200}명 재평가: 2016 모델 {e16}, 2020 모델 {e20}으로 기준 {d} 미충족이다.
    민감도 변이 중 곡률 Vmax ×{vmx}(양 군)에서만 D3가 기준 (d) 하나로 권고되었으나({vmd}, 대상자 {nsub}명), {n200}명 재평가에서 {vm200}로 확인되지 않았다(arm당 절대 변화 {vmabs}명, 추가 방문 {vmv}회). 판정 기록(config/schedule_decision.yaml, {date}): 사전 규칙은 주모델에 적용하고 민감도 변이는 견고성 확인용이며 최종 일정은 B0다. 체중 {wr} kg 분포 변이는 시험 모집단 밖이라 이 슬라이드에서 뺐다(부록 A5).
    Day {last} 이후: 참 농도가 LLOQ에 닿는 연구일은 중앙값 Day {m16}(2016 모델), Day {m20}(2020 모델), 95번째 백분위수 Day {p16}, Day {p20}이다. Day {d58} 이후에도 LLOQ 위인 대상자는 {a16}, {a20}이고, 마지막 계획 채혈(Day {last}) 시료가 정량되는 대상자는 {q16}, {q20}이다(잔차 포함 관측값). 그림은 로컬 대상자 수준 결과에서 만든 results/deck_inputs/cliff_lloq_day_hist.csv이며 Day {d58} 이후 비율이 커밋된 요약과 같음을 확인했다.
    Day {last} 이후 채혈 일정(DECISIONS D-016에서 철회한 연장안 포함)은 어느 결과 파일에서도 모의하지 않았다. 연장 채혈이 불필요하다는 판단은 모의로 직접 보인 결과가 아니라 위 비율(참 농도가 이미 LLOQ 아래인 대상자)에서 나온 것이다.
    관련 보고서: 3.9절, 5.1절, 5.7절(Table 5-14), 6.4절, 7절; 예상 질의 Q3, Q4; DECISIONS D-016, D-026, D-031.
