S20:
  kicker: "결론 · 제안의 실행: 채혈 일정 판단 (결과 보고 전 정한 결정 규칙)"
  title: "현행 B0({n}회 채혈, Day {last}까지)를 유지한다: 두 모델 모두, 추가·제거 후보 {k}개 중 결과 보고 전 정한 기준 (a)~(d)를 하나라도 충족한 일정이 없다"
  table:
    head: ["후보 일정 (각 칸:\n2016 모델 / 2020 모델)", "시험 전체 추가 방문\n(점당 {cost}회)", "(a) AUC0-last {ci}% CI 평균 폭 감소 (%, M0)", "(b) AUC0-last 통과율 변화, ke ×{ke} (%p, M0)", "(c) AUC0-inf 신뢰 충족률 변화 (세트 (ii), %p)", "(d) NCA 외삽 {x}% 초과 비율 (B0 대비, 배)", "충족 기준"]
    crit: ["추가 권고 기준 (하나라도)", "", "{a} 이상", "+{b} 이상", "+{c} 이상", "{d} 이하", ""]
    added: "{s}: Day {d} 추가"
    removed: "B-: Day {d} 제거"
    none: "없음"
  foot: "(a)·(b)는 일정 판정 모의 때의 합동 t 검정(M0) 결과다(M1 재계산 없음). (c)·(d)는 대상자 수준이라 분석 모형과 무관하다."
  bullets:
    - "추가 채혈 D1~D4는 **어느 기준에도 닿지 않았다**: CI 평균 폭은 D3(2020 모델) 외에는 오히려 넓어졌고, 신뢰 충족률 변화는 최대 {cii}%p(세트 (ii), D3, 2016 모델)이며 세트 (i)로도 {ci}%p(D3, 2016 모델)다."
    - "**Day {d50} 제거(B-)도 권고하지 않는다**(판정 기록: AUC0-inf 2차 평가변수용 말단 점 확보). 빼면 외삽 {x}% 초과 비율이 B0의 {bmd1}배(두 모델)다."
    - "**Day 85 연장 채혈은 모의하지 않았다**(필요성 미산출). Day {d58} 이후 참 농도가 LLOQ 위인 대상자는 {a16}(2016 모델), {a20}(2020 모델)이다."
  fig:
    xlab: "연구일 (Day). 회색 세로선: B0 채혈일, 점선: 마지막 채혈"
    ylab: "참 농도가 LLOQ 위인 대상자 (%)"
    tail: "Day {d} 이후 LLOQ 위"
    m16: "2016 모델"
    m20: "2020 모델"
  notes: |
    결과 보고 전 정한 결정 규칙(보고서 3.9절, DECISIONS D-026): B0 대비 (a) AUC0-last {ci}% CI 평균 폭이 {a}% 이상 감소, (b) ke ×{ke} 시나리오의 AUC0-last 통과율이 +{b}%p 이상 증가, (c) AUC0-inf 신뢰 충족률(세트 (ii), 사전 명시(원래 정의))이 +{c}%p 이상 증가, (d) NCA 외삽 {x}% 초과 비율이 B0의 {d}배 이하 중 하나라도 충족하면 추가 채혈을 권고하고, 모두 미충족이면 B0를 유지한다. 이 규칙의 시점(사전 명시 등록부, regulatory/tables/prespecification_register.csv): 'specified after the first schedule simulations were run, before any result was reported'(2026-09-24, 커밋 c018729). 첫 일정 모의 뒤, 결과 보고 전에 정했으므로 사전 규정이라 부르지 않는다(보고서 3.9절 제목의 pre-specified도 같은 수정 대상). 추가 채혈점 하나는 방문 {cost}회(시험 전체)다. 자료는 모델마다 대상자 {nsub}명, 시험 {ntr}회다.
    (a)·(b)는 시험 수준 결과로, 합동 t 검정(M0)으로만 계산했다. 일정 판정 모의(D-026)는 분석 모형 재판정(D-053, M1 도입) 전에 설계의 분석법(trial_design.yaml be.method, 합동 t 검정)으로 수행했고, D-053의 사전 등록 범위(경계 칸, S00, F097)에 일정 비교 시험은 없어 M1으로 다시 계산하지 않았다. (c)·(d)는 대상자 수준 결과라 분석 모형과 무관하다. (a)는 양수가 폭이 좁아지는 쪽이다: 추가 채혈 D1~D4의 CI 평균 폭 변화는 두 모델 {arng}%로, D3(2020 모델)을 빼면 모두 폭이 조금 넓어지고 가장 큰 감소도 {amax}%로 기준 {a}%에 못 미친다.
    (c)를 세트 (i)로 보면 D3는 +{d3i16}(2016 모델), +{d3i20}(2020 모델)이다. D1~D4 전체 범위는 세트 (i) {irng}%p, 세트 (ii) {iirng}%p다(두 세트를 섞은 범위로 쓰지 않는다). 어느 세트로도 (c)는 충족되지 않는다.
    (d) D3: {dboot}(2016 모델 / 2020 모델, 부트스트랩 95% 구간). {n200}명 재평가: 2016 모델 {e16}, 2020 모델 {e20}으로 기준 {d} 미충족이다.
    Day {d50} 제거(B-): 판정 기록(config/schedule_decision.yaml의 day50_removal)의 사유는 AUC0-inf 2차 평가변수와, 규제기관이 AUC0-inf를 공동 1차 평가변수로 요구할 때의 대응안(fallback)에 쓸 말단 점 확보다. 슬라이드에는 2차 평가변수만 적었다. 빼면 CI 평균 폭은 {bma}% 좁아지지만(기준 (a) {a}%에 못 미침) NCA 외삽 {x}% 초과 비율이 B0의 {bmd}배가 되고 세트 (ii) 신뢰 충족률이 {bmc}%p 바뀐다(2016 모델 / 2020 모델).
    민감도 변이 중 곡률 Vmax ×{vmx}(양 군)에서만 D3가 기준 (d) 하나로 권고되었으나({vmd}, 대상자 {nsub}명), {n200}명 재평가에서 {vm200}로 확인되지 않았다(arm당 절대 변화 {vmabs}명, 추가 방문 {vmv}회). 판정 기록(config/schedule_decision.yaml, {date}): 결정 규칙은 주 모델에 적용하고 민감도 변이는 견고성 확인용이며 최종 일정은 B0다. 체중 {wr} kg 분포 변이는 시험 모집단 밖이라 이 슬라이드에서 뺐다(보고서 5.7절; 이 덱에는 싣지 않음).
    Day {last} 이후: 참 농도가 LLOQ에 닿는 연구일은 중앙값 Day {m16}(2016 모델), Day {m20}(2020 모델), 95번째 백분위수 Day {p16}, Day {p20}이다. Day {d58} 이후에도 LLOQ 위인 대상자는 {a16}, {a20}이고, 마지막 계획 채혈(Day {last}) 시료가 정량되는 대상자는 {q16}, {q20}이다(잔차 포함 관측값). 그림은 로컬 대상자 수준 결과에서 만든 results/deck_inputs/cliff_lloq_day_hist.csv이며 Day {d58} 이후 비율이 커밋된 요약과 같음을 확인했다. 그림의 점은 Day {d58} 값이며 같은 값을 오른쪽 위에 적었다.
    Day {last} 이후 채혈 일정(DECISIONS D-016에서 철회한 Day 85 연장안 포함)은 어느 결과 파일에서도 모의하지 않았다. 그래서 Day 85 채혈의 필요성은 산출하지 않았고(원 요청 항목 'Day 85 불필요'는 모의로 보이지 못함), 슬라이드에는 이 상태와 위 비율(Day {d58} 이후에도 참 농도가 LLOQ 위인 대상자)만 적었다.
    관련 보고서: 3.9절, 5.1절, 5.7절(Table 5-14), 6.4절, 7절; 예상 질의 Q3, Q4; DECISIONS D-016, D-026, D-031.
