S12:
  kicker: "논거 ① 신뢰할 수 있는 AUC0-inf를 못 얻는 대상자: 비무작위 탈락"
  title: "규칙 A는 노출이 낮은 대상자를 빼고 체중 층 균형을 깬다: 세트 (i) 탈락자의 참 AUC0-inf는 유지자의 {gmr}배다"
  card_gmr: "세트 (i) 탈락자 대 유지자의 참 AUC0-inf 기하평균비 (GMR, 두 모델). 탈락자의 노출이 {pl} 더 낮다. 세트 (iii)는 {g3}로 차이가 작다."
  card_strata: "무거운 층({split} kg 초과)의 세트 (i) 탈락 비율이 가벼운 층보다 높은 정도(두 모델; 세트 (iii) {sd3}%p). 세트 (i) 탈락자는 유지자보다 {wd} kg 무겁다."
  table:
    head: ["분석군(두 모델 범위)", "arm 간 무거운 층 비율 차이 (5~95백분위)", "|차이| > {thr}%p 시험 비율"]
    rows:
      auclast: "AUC0-last 분석군"
      i: "규칙 A · 세트 (i)"
      iii: "규칙 A · 세트 (iii)"
  takeaway: "AUC0-last 분석군은 무작위배정의 층 균형을 지킨다. 두 arm의 차이는 모든 시험에서 한 명({rb}%p) 이내다. 규칙 A 분석군은 동일 제품에서도 arm마다 층 구성이 달라진다."
  fig:
    xlab: "arm 간 무거운 층 비율 차이 (시험군 - 대조군, %p)"
    ylab: "시험 (%), 동일 제품 시험 {n}회; 회색 영역: |차이| > {thr}%p"
    sets:
      auclast: "AUC0-last 분석군"
      i: "규칙 A 분석군 · 세트 (i)"
      iii: "규칙 A 분석군 · 세트 (iii)"
  notes: |
    시험 모집단(건강인 {wt} kg, 체중 층화 배정, B0, {dose} mg) 결과다. 탈락자 특성과 층별 탈락은 모델당 {n}명의 개인 수준 NCA 결과(탈락자 대 유지자: Welch 95% 구간, 로그 척도)이고, 분석군의 층 구성은 동일 제품 시험(S00) {ntr}회(모델마다)를 운용 특성 시드로 다시 만든 시험 수준 결과다. 인원 수에 기반한 결과라 분석 모형(M0, M1)과 무관하다.
    탈락자 대 유지자의 참 AUC0-inf 기하평균비: 세트 (i) {g16}(2016 모델), {g20}(2020 모델), 즉 {pl} 낮다. 세트 (ii) {g2}, 세트 (iii) {g3}, 세트 (iv) {g4}(두 모델; 세트 (iii)·(iv)는 차이가 작다). 관측 AUC0-last 기하평균비도 세트 (i)에서 {al}(같은 방향)이다. 규칙 A는 노출이 낮은 대상자를 뺀다.
    탈락자 대 유지자의 체중 차이(Welch 95% 구간): 세트 (i) 2016 모델 {w16}, 2020 모델 {w20}. 세트 (iii)는 {w3}(두 모델)로 작다.
    층별 세트 (i) 탈락 비율: 가벼운 층 {l16}, 무거운 층 {h16}(2016 모델); {l20}, {h20}(2020 모델). 차이의 Newcombe 95% 구간 하한은 세트 (i)·(iii), 두 모델 모두 양수다. 세트 (i) 차이: 2016 모델 {c16}, 2020 모델 {c20}.
    arm 간 무거운 층 비율 차이 = 시험군 분석군의 무거운 층 비율 - 대조군 분석군의 무거운 층 비율. 층 내 1:1 무작위배정에서 이 차이는 최대 {rb}%p(arm당 {n_arm}명 중 한 명)다. 규칙 A 분석군의 중앙값은 {med}%p로 치우침이 거의 없다. 한쪽으로 기우는 것이 아니라 시험마다 두 arm의 층 구성이 달라진다는 뜻이다.
    그림은 커밋된 시험별 인원(results/trialpop/trialpop_counts_*.csv.gz)에서 보고서와 같은 식으로 다시 계산해 정수 %p에 중심을 둔 구간으로 그렸다. 요약값(tp_strata_composition.csv)과 results/deck_inputs/strata_armdiff_hist.csv를 코드에서 대조했다.
    사전 등록: 세트 (i) 탈락자의 참 AUC0-inf 비는 section6 등록 전에 보았고, 층 분할·arm × 층 구성·arm 간 차이는 등록 후 처음 계산했다(DECISIONS.md D-059).
    관련 보고서: 5.3절(Table 5-6, Figure 5-5), 3.13절, 5.4절, 6.3절, 7절.
