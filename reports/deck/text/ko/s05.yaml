S05:
  kicker: "전제 · 약의 특성: 말단 절벽"
  title: "말단은 절벽이다: 순간 반감기가 {d1}일 아래로 떨어진 뒤 중앙값 {len}일 만에 참 농도가 정량한계에 닿는다"
  fig:
    xlab: "연구일 (Day, 투여일 = Day 1)"
    ylab: "참 농도 (mg/L, 로그 눈금)"
    subj: "{p}백분위 (LLOQ 도달 Day {day})"
    legend: "대표 대상자 (2016 모델, LLOQ 도달일 백분위)"
    lloq: "정량한계(LLOQ)\n{v} mg/L"
    cliff: "절벽 (음영)"
    b0: "점: 현행 채혈일(B0) 중\nLLOQ 이상인 채혈"
  stat1:
    value: "{len}일"
    label: "절벽 길이 중앙값(두 모델): 순간 반감기가 {d1}일 아래로 떨어진 때부터 정량한계(LLOQ) 도달까지"
  stat2:
    value: "Day {day}"
    label: "참 농도가 LLOQ({lloq} mg/L)에 닿는 연구일 중앙값 (2016 모델; 2020 모델 Day {day20})"
  table:
    head: ["원개발사 문헌", "프로젝트에 기록된 서술 (문헌 발췌표; Kovalenko 2021을 뺀 셋은 보고서 1.1절에도 수록)"]
    src: ["Kovalenko 2020", "Kovalenko 2021", "Li 2020", "Cohen 2022"]
    k20: "표적 매개 약물 소실(TMDD) 구간은 거의 수직이다. 의미 있는 말단 반감기는 계산할 수 없고 제출하지 않았다."
    k21: "Km {km} mg/L이면 농도 {c90} mg/L에서 순환 표적의 {p90}%가 제거된다. 순간 반감기는 베타기 약 {hl}일에서 표적 매개기 {hl0} 근처로 바뀐다."
    li: "농도가 낮을수록 소실 기울기가 가팔라지고, AUC0-last가 용량 비례 이상으로 증가한다."
    cohen: "기기 비교 시험에서 말단 비선형 때문에 반감기와 AUC0-inf를 산출하지 않았다."
  notes: |
    절벽의 정의: tmax 뒤 순간 반감기 ln 2 / (-d ln C/dt)(모델 상태값으로 정확히 계산, 수치 미분 아님)가 처음 {d1}일(민감도 정의 {d2}일) 아래로 떨어진 때부터 참 농도가 LLOQ에 닿을 때까지. 시험 모집단(건강인 {wt} kg 기준 체중) 모델당 {nsub}명, 명목일.
    절벽 길이 중앙값은 2016 모델 {len16}일(5~95백분위 {p95}일)이고, {d2}일 정의로는 {len2}일이다. 두 모델이 같다. 절벽이 시작할 때의 참 농도 중앙값은 {cst} mg/L(2016 모델)이다.
    참 농도가 LLOQ에 닿는 연구일: 2016 모델 중앙값 Day {day16}(5~95백분위 {r16}), 2020 모델 Day {day20}({r20}). Day {d58} 뒤에도 LLOQ 위에 남는 대상자는 {a16}(2016 모델), {a20}(2020 모델)이다.
    현행 일정(B0)은 절벽이 오는 구간에서 채혈 간격이 {int}일이다. 절벽 안에 채혈이 1개 이상 들어가는 대상자는 {ge1}, 2개 이상은 {ge2}다(2016 모델, 명목일, {d1}일 정의). λz 창에는 {minpts}점 이상이 필요한데 절벽 안 채혈은 많아야 1점이므로 λz 창은 절벽 안에 놓일 수 없고, 창의 대부분은 절벽 앞 감소 구간이다(절벽 안의 1점은 창의 마지막 점으로 들어갈 수 있다).
    그림: 2016 모델 대상자 중 LLOQ 도달일이 {pc}백분위에 가장 가까운 세 명(보고서 Figure 5-2와 같은 대상자). 곡선 자료는 로컬 대상자 수준 결과에서 만든 results/deck_inputs/rep_profiles.csv이며 커밋된 요약과 대조했다(deck_inputs/checks.csv).
    LLOQ {lloq} mg/L는 원개발사 분석법 값을 쓴 가정이다(config/assay.yaml; 스폰서 분석법 확정 전).
    문헌: Kovalenko 2021 서술(Km {km} mg/L 조건)은 프로젝트 문헌 발췌표(literature_qualitative.csv)와 요약에만 기록되어 있고 M&S 보고서 1.1절과 참고문헌에는 없다. 'Li 2020: λz가 관찰 농도 구간에 의존'이라는 문구는 프로젝트에 기록이 없어, 기록된 서술(저농도에서 소실이 가팔라지고 AUC0-last가 용량 비례 이상)로 바꾸었다. Kovalenko 2016은 가파른 표적 매개 구간을 기술하려고 정량한계 미만 값을 M3 방법으로 포함했다.
    관련 보고서: 1.1절, 3.10절, 5.1절, Figure 5-1, Figure 5-2.
