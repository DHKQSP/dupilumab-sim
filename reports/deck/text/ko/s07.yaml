S07:
  kicker: "방법 · 모델 적격성"
  title: "연구 제형 검증 gate에서 두 모델은 AUC0-last를 관측 평균의 ±{tol}% 안에서 재현했지만, {d200} mg 제형의 빠른 흡수는 재현하지 못했다"
  fig:
    xlab: "AUC0-last 모의/관측 (산술평균 비)"
    band: "gate 허용 범위 ±{tol}%"
    tmax: "tmax 관측\n{to}일,\n모의 {ts}일"
    g1: "연구 제형: 검증 gate"
    g2: "{dose} mg 단일 arm (Li 2020, 체중 미보고)"
    g3: "{dose} mg 제형: 외부 점검 (gate 제외)"
    arm:
      test: "시험약"
      reference: "대조약"
    ds:
      clot300_nonasian_pooled: "비아시아인 통합"
      clot300_japanese_TDU12265: "일본인"
      clot300_chinese: "중국인"
      clot600_chinese: "중국인 (2회 주사)"
      clot600_japanese: "일본인 (2회 주사)"
      PKM14271_200mg_test: "PKM14271 시험약"
      PKM14271_200mg_reference: "PKM14271 대조약"
      Cohen2022_200mg_AI: "Cohen 2022 자동주사기"
      Cohen2022_200mg_PFSS: "Cohen 2022 프리필드 시린지"
  bullets:
    - "**연구 제형 gate 통과**: AUC0-last 비 2016 모델 {gr16}, 2020 모델 {gr20}. Cmax 비는 각각 {gc16}(최대 {cmx}), {gc20}로 대부분 과대 예측(한계)."
    - "**{d200} mg 제형**({vol} mL, {conc} mg/mL): 최고 농도 도달 시간 (tmax) 관측 {to}일, 모의 {ts}일. AUC0-last 비 2016 모델 {r16}, 2020 모델 {r20}. gate에서 제외(사후 결정)."
    - "- 흡수 진단(미채택): 흡수 속도상수(ka) ×{km}이면 tmax {tk}일, 용량 보정 {d200}:{dose} 비 {s1} → {s2}(관측 {o})."
    - "**{dose} mg 단일 arm**(Li 2020, 산술평균 비): 2016 모델 {a16}, 2020 모델 {a20}."
    - "**완전 외부 재판정**(모델별 개발 자료 제외) 불합격: 2016 모델 {f16}/{n16}, 2020 모델 {f20}/{n20}, 모두 체중 미보고({w0} kg 가정) 단일 arm."
    - "**PKM12350 연구 간 차이**(이질성 통계량 미산출): 두 arm의 관측 평균이 여섯 arm 중 최저({p1}, {p2} mg·day/L; 최대 {pmx}). 2016 모델의 시험약 비는 가정 체중 {wl} kg {rl} → {wh} kg {rh}로, 불합격 여부가 가정 체중에 달려 있다."
  notes: |
    합격 기준은 비교 전에 고정했다: 모의 평균 AUC0-last가 관측 평균의 ±{tol}% 안, 모의 로그 척도 CV {cvr}%, 관측 코호트 중앙값 tlast가 모의 코호트 중앙값의 5~95백분위 안, 체중 효과의 부호와 크기. 모델 파라미터는 조정하지 않았다. 모의 로그 척도 CV는 {cv16}%(2016 모델), {cv20}%(2020 모델)이다.
    검증 코호트(저체중 아시아인 코호트, 고용량 포함)는 모델 신뢰성 근거이며, 평가변수에 관한 근거는 시험 모집단(건강인, 체중 층화, B0) 결과에서만 세운다.
    다른 제형의 z 값은 {z}(2016 모델)이다. gate 범위를 연구 제형으로 좁힌 결정은 첫 비교 결과를 본 뒤의 사후 결정이다(커밋 c018729, 부록 D). 흡수 진단은 진단용 결과(appendix_absorption_diagnostic.csv)이며 채택하지 않았고 M&S 보고서에 인용되지 않는다.
    단일 arm 비는 모의 평균 AUC0-last를 공개된 arm 산술평균으로 나눈 값이며 기하평균 비가 아니다(관측 기하평균은 보고되지 않음). 여섯 arm 모두에서 2020 모델의 비가 2016 모델보다 높다. 통합 모의 평균 AUC0-last {m16}(2016 모델), {m20}(2020 모델) mg·day/L는 관측 arm 평균 범위 {rng} mg·day/L 안에 있다.
    완전 외부 재판정은 각 모델의 개발 자료에 들어가지 않은 항목(검증 데이터셋, Li 2020 arm, 코호트 tlast)만으로 같은 기준(평균 ±{tol}%)을 다시 적용한 것이다. 두 모델의 개발 자료가 달라 항목 수가 다르다(2016 모델 {n16}개, 2020 모델 {n20}개; config/design_clot2021.yaml의 external_only_gate). 불합격은 2016 모델 {f16}/{n16}, 2020 모델 {f20}/{n20}이며 모두 Li 2020 단일 arm이다. PKM12350 시험약 비는 판정 자료에서 {x16}, 체중 민감도 모의(별도 모의)에서 {w0} kg일 때 {x78}이다. 불합격은 가정 체중에 달려 있다.
    연구 간 이질성 통계량(PKM12350 대 다른 연구)은 계산하지 않았다. 비교 전에 고정한 합격 기준(평균, CV, tlast, 체중 효과)에 없는 항목이고 결과 파일에도 없다. 확인된 사실은 PKM12350 두 arm의 관측 평균이 여섯 arm 중 가장 낮다는 것과 가정 체중에 따른 비의 변화뿐이다. Cmax 비의 최대는 {cmx} 코호트(2016 모델)이고, 2020 모델의 최소 {cmin20}는 1보다 작다.
    관련 보고서: 4.2절, Table 4-1, 4.4절, Table 4-2, 6.5절, 부록 B, 부록 D.
