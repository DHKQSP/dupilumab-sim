A1:
  kicker: "부록 A1 · 문헌 정합성"
  title: "연구 용량 {dose} mg에서 모의 NCA 평균비는 문헌과 ±{tol}%p 안에서 일치하고, {d600} mg에서는 모의 참 평균비도 문헌보다 낮아 보수적이다"
  table:
    head: ["자료 (용량, 모의 체중)", "문헌 NCA 평균비", "모의 NCA 평균비\n(2016 모델 / 2020 모델)", "모의 참 평균비\n(2016 모델 / 2020 모델)", "해석: 모의 NCA와 문헌의 차이\n(반올림 전 값으로 계산, 일치 기준 ±{tol}%p)"]   # \n: 표 칸 안 줄바꿈
    src: "{lab}, {dose} mg, {wt} kg"
    ctrl: "대조군"   # PKM12350 행: 공개 값은 대조군 arm만(노트 참고)
  interp:
    agree: "일치: {d}%p."
    lower: "모의 낮음: {d}%p.\n참 평균비도 문헌보다 낮음(보수적)."
    ext: "연구와 다른 제형(외부 점검)."
    wt: "체중은 가정값."
  caption: "평균비 = 평균 AUC0-last / 평균 AUC0-inf(참 평균비: 같은 비를 모델 적분 참값으로 계산). 문헌 NCA 평균비는 참 창 포착률의 하한이다."
  qual_label: "원개발사 문헌의 정성 서술 (프로젝트 문헌 발췌표, 보고서 1.1절)"
  qual:
    - "**Kovalenko 2020**: 의미 있는 말단 반감기는 계산할 수 없어 규제기관에 반감기를 제출하지 않았다"
    - "**Kovalenko 2016**: 저농도 정량값이 적어 정량한계 미만(BLQ) 값을 M3 방법으로 적합에 포함했다"
    - "**Li 2020**: 농도가 낮을수록 소실 기울기가 가팔라지고 AUC0-last가 용량 비례보다 크게 증가한다"
    - "**Cohen 2022**: 말단 비선형 때문에 반감기·AUC0-inf 미산출"
    - "**Clot 2021**: 저농도일수록 표적 매개 소실 가속(다지수 감소)"
  notes: |
    평균비는 평균 AUC0-last를 평균 AUC0-inf로 나눈 값이다. 모의는 문헌과 같은 용량, 채혈 일정, 코호트 평균 체중으로 만들었다(Clot 2021 조건마다 {ns}명, 2016 모델). 모의 참 평균비는 모델 적분으로 구한 참 AUC0-tlast 평균을 참 AUC0-inf 평균으로 나눈 값으로, 평균 기준의 참 창 포착률이다. 문헌 NCA 평균비는 참 창 포착률의 하한이므로 모의 참 평균비가 그보다 낮으면 모델이 창 포착률을 과소평가하는 보수적 방향이다. 표의 차이(%p)는 반올림 전 평균비로 계산했으므로 표에 보이는 반올림 값끼리 뺀 차와 끝자리가 다를 수 있다. 두 모델 값은 2016 모델 / 2020 모델 순이다.
    일치 판정은 모의 NCA 평균비와 문헌 값의 차이가 두 모델 모두 ±{tol}%p 안인지로 했다(프로젝트 문헌 표의 판정 기준을 수치로 다시 계산해 결과 파일 판정과 같음을 확인).
    Clot 2021 300 mg: 신뢰 기준을 충족한 대상자만의 모의 NCA 평균비는 {n16}(2016 모델)이다. 모의 코호트 중앙값 tlast는 {t16}일(2016 모델), {t20}일(2020 모델)이고 문헌은 {lt}일이다.
    600 mg: 문헌 NCA 값은 AUC0-inf의 외삽이 부풀려져 참 창 포착률의 하한이다. 모의 참 평균비가 그보다 낮다는 것은 두 모델이 이 용량에서 마지막 채혈 뒤 꼬리를 관측보다 크게 예측한다는 뜻이고, 창 포착률을 과소평가하는 보수적 방향이다.
    PKM12350 대조군: 공개 값은 FDA BLA 임상약리 심사의 AUC0-t 대 AUC0-inf다. 시험군({pt})은 AUC0-inf 산출 대상자 수가 다를 가능성이 있어 공개 자료로 확인할 수 없으므로 쓰지 않았다. 체중은 공개되지 않아 가정값으로 모의했다.
    200 mg 행은 연구와 다른 제형이어서 외부 점검 성격이다.
    정성 서술은 프로젝트 문헌 발췌표(literature_qualitative.csv)에 기록된 것만 옮겼다. Kovalenko 2021의 표적 제거 서술은 슬라이드 5에 있다.
    관련 보고서: 1.1절, 4.3절, 4.4절, Table 4-2.
