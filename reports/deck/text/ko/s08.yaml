S08:
  kicker: "논리 구조"
  title: "말단 절벽이라는 전제 아래 세 논거가 각각 AUC0-last + Cmax 공동 1차 평가변수라는 결론을 뒷받침한다"
  steps:
    premise:
      label: "전제"
      claim: "말단 절벽: 정량한계 근처에서 표적 매개 소실로 농도가 급락한다. λz는 절벽 앞에서 추정된다."
      value: "{len}일"
      caption: "두 모델의 절벽 길이 중앙값"
      ref: "슬라이드 5"
    a1:
      label: "논거 ①"
      claim: "상당수가 신뢰할 수 있는 AUC0-inf를 얻지 못하고, 탈락은 무작위가 아니다."
      value: "{iii}"
      caption: "신뢰 AUC0-inf 미확보 비율, 세트 (iii), 두 모델. 세트 (i) 탈락자의 참 AUC0-inf는 유지자의 {gmr}배(기하평균비)"
      ref: "슬라이드 9부터"
    a2:
      label: "논거 ②"
      claim: "AUC0-inf의 판정이 처리 규칙에 좌우된다."
      value: "{a} / {ncell}칸"
      caption: "AUC0-inf + Cmax 경계 1종 오류가 점추정 {nom}를 넘는 칸, 규칙 A (i), M1. 이 중 초과(Wilson 하한 > {nom}) {aw}칸. 규칙 C (i)는 점추정 {c}칸, 명목."
      ref: "슬라이드 14부터"
    a3:
      label: "논거 ③"
      claim: "AUC0-last가 총노출을 거의 다 포착해 AUC0-inf를 사실상 대신한다."
      value: "{cov}"
      caption: "창 포착률(참 AUC0-tlast / 참 AUC0-inf) 중앙값, 두 모델. 모든 대상자 {cmin} 이상"
      ref: "슬라이드 16부터"
    concl:
      label: "결론"
      claim: "공동 1차 평가변수: AUC0-last + Cmax. 이차: AUC0-inf. 현행 B0 {ns}회 채혈 유지."
      value: "{n_cons} / {n_all}칸"
      caption: "AUC0-last + Cmax 경계 1종 오류가 보수적인 칸(Wilson 상한 < {nom}), M1. 2020 모델의 {n_exc}칸만 초과({p2max})"
      ref: ["슬라이드 15(칸 분류)", "슬라이드 19(초과 칸)"]
  notes: |
    전제(슬라이드 5): 참 농도가 약 {cst} mg/L에서 정량한계까지 떨어지는 절벽 길이의 중앙값은 {len}일(5~95 백분위 {len595}일, 두 모델, 시험 체중 범위)이다. 원개발사 분석은 의미 있는 말단 반감기를 계산할 수 없다고 했다(Kovalenko 2020).
    논거 ①(슬라이드 9부터 슬라이드 13까지): 세트 (iii) {iii}, 세트 (i) {i}가 신뢰할 수 있는 AUC0-inf를 얻지 못한다. 탈락자는 기준 미달로 AUC0-inf 분석에서 빠지는 대상자, 유지자는 나머지다. 세트 (i) 탈락자의 참 AUC0-inf는 유지자 대비 기하평균비 {gmr}다.
    논거 ②(슬라이드 14, 슬라이드 15): AUC0-inf + Cmax의 경계 1종 오류가 점추정 {nom}를 넘는 칸은 M1에서 규칙 A (i) {a}칸, 규칙 A (ii) {aii}칸, 규칙 B {b}칸, 규칙 C (i) {c}칸이다. Wilson 95% 구간으로 나누면 규칙 A (i)의 초과(하한 > {nom})는 {aw}칸이고, 규칙 C (i)의 점추정 초과 칸은 구간이 {nom}를 포함하는 명목이다(초과 {cw}칸). 같은 시험의 판정이 규칙과 기준 세트에 따라 바뀌는 비율은 중앙값 {inst}(M1), {inst0}(M0)이다.
    논거 ③(슬라이드 16부터 슬라이드 19까지): 창 포착률(참 AUC0-tlast / 참 AUC0-inf) 중앙값 {cov}, 가장 작은 대상자 {cmin}.
    결론: AUC0-last + Cmax는 M1에서 경계 {n_all}칸 중 보수적(Wilson 상한 < {nom}) {n_cons}칸, 초과(Wilson 하한 > {nom}) {n_exc}칸이다. 초과 칸은 2020 모델 말초 분포용적 증가로 {p2ci}다(슬라이드 19). M0에서는 보수적 {m0c}칸, 명목 {m0n}칸이다. 현행 채혈 일정(B0)은 {ns}회, Day {last}까지이며 추가 채혈은 정당화되지 않았다(보고서 5.7절). 주분석 모형, 분석법 정량한계, 목표 검정력은 의뢰자 결정 사항이다.
    관련 보고서: 요약(Synopsis), 2절, 5.1절, 5.2절, 5.3절, 5.4절, 5.9절, 6.1절, 7절.
