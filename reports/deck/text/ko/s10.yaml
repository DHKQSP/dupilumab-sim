S10:
  kicker: "논거 ① 신뢰할 수 있는 AUC0-inf를 못 얻는 대상자: 채혈로 해결되지 않음"
  title: "채혈을 추가해도 해결되지 않는다: 후보 일정에서 절벽 안 채혈 두 점 이상은 대상자의 {ge2} 이하이고, 신뢰 충족률은 최대 {gmax}%p 오른다"
  bullets:
    - "**절벽 위치**(LLOQ 도달일)는 Day {p16}(5~95백분위, 2016 모델)로 흩어지고 절벽은 중앙값 {len}\u2060일이다. 채혈 간격은 B0 {int}일, 추가 일정 {mi}일이다."
    - "추가 채혈은 **절벽 안 한 점**인 대상자만 늘린다(B0 {b0} → D3 {d3}). λz에 필요한 {minpts}\u2060점은 매일 채혈해도 {dly}다."
    - "**신뢰 충족률 변화**는 세트 (i) {ri}%p, 세트 (ii) {rii}%p다. 세트 (ii)는 {nall}칸 중 {ndown}칸에서 떨어지고, 사전 기준 +{thr}%p에 닿는 칸은 없다."
  table:
    head: "B0 대비 변화 (%p)"
    days: "추가 연구일 (Day)"
    i16: "세트 (i) · 2016 모델"
    i20: "세트 (i) · 2020 모델"
    ii16: "세트 (ii) · 2016 모델"
    ii20: "세트 (ii) · 2020 모델"
  fig:
    xlab1: "참 농도가 LLOQ에 닿는 연구일 (Day)"
    ylab1: "대상자 (%, 1일 간격)"
    b0: "점선: 현행 B0 채혈일"
    cmp_b0: "B0 채혈 간격 {v}일"
    cmp_add: "추가 일정 최소 간격 {v}일"
    cmp_cliff: "절벽 길이 중앙값 {v}일"
    ylab2: "절벽 안 채혈점 수별 대상자 (%, 명목일; 막대 위 숫자 = 한 점 이상)"
    k1: "절벽 안 {k}점"
    k2: "{k}점"
    k3: "{k}점 이상 (λz 최소)"
    daily: "매일\n(참고)"
  notes: |
    시험 모집단(건강인 {wt} kg, 현행 일정 B0), 모델당 {n}명의 개인 수준 결과다. 절벽 위치 = 참 농도가 LLOQ({lloq} mg/L)에 닿는 연구일: 2016 모델 중앙값 Day {m16}(5~95백분위 {r16}), 2020 모델 Day {m20}({r20}). 그림 분포는 로컬 대상자 수준 결과에서 만든 results/deck_inputs/cliff_lloq_day_hist.csv이며 커밋된 요약(중앙값, 백분위수)과 대조했다(deck_inputs/checks.csv).
    절벽 길이 중앙값 {len}일(순간 반감기 {d1def}일 정의, 두 모델). 채혈 간격: B0는 Day {d22} 이후 {int}일, 후보 일정 D1~D4는 최소 {mi}일, 매일 채혈(Day {dyr}, 참고용이며 후보 아님)은 {dmi}일.
    절벽 안 채혈점(명목일, {d1def}일 정의, 두 모델 범위): 한 점 이상 B0 {b0}, D1 {d1}, D2 {d2}, D3 {d3}, D4 {d4}. 두 점 이상은 모든 고정 일정에서 {g2n}이고, 채혈 허용창을 반영해도 최대 {g2w}다. 매일 채혈은 두 점 {dy2}, 세 점 이상 명목 {dy3}, 허용창 {dy3w}. {d2def}일 정의에서도 고정 일정의 두 점 이상은 명목 최대 {g2d2}, 허용창 최대 {g2d2w}다. λz 창은 최소 {minpts}점이므로 λz는 늘 절벽 앞에서 추정된다.
    신뢰 충족률 변화는 같은 대상자(모델당 {nrel}명)의 B0 대비 대응 비교다. D3(추가 네 점): 세트 (i) 2016 모델 {ci16}, 2020 모델 {ci20}; 세트 (ii) 2016 모델 {cii16}, 2020 모델 {cii20}. 세트 (ii) 최저는 2020 모델 D4 {mn}. 사전 규정 결정 규칙의 기준 (c)(+{thr}%p 이상)는 두 세트 모두 어느 칸에서도 충족되지 않았다.
    세트 (ii)가 떨어지는 이유: Best Fit가 추가된 늦은 점을 포함한 더 늦고 짧은 창을 고르고, 창이 짧으면 span 조건(반감기 {sp2}배)을 채우기 어렵다. Day {d22} 이후 가장 짧은 {minpts}점 창은 B0 {w0}일, 추가 일정 {w1}일이며, λz 창 중앙값은 B0 {wm0}일에서 D3 {wm3}일로 줄어든다(보고서 Figure 5-3).
    요청 문구의 범위는 세트 (ii) 최솟값과 세트 (i) 최댓값을 합친 것이라 세트별로 나누어 적었다. 보고서 5.3절·5.7절의 '세트 (ii)가 떨어지는 칸' 수는 여섯 민감도 변이까지 센 값이다(시험 체중 범위 밖 분포 포함). 이 슬라이드는 시험 모집단의 두 모델({nall}칸)만 센다: {ndown}칸.
    관련 보고서: 3.9절, 3.10절, 5.1절(Figure 5-1), 5.3절(Figure 5-3), 5.7절(Table 5-14), 6.4절.
