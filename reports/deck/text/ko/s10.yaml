S10:
  kicker: "논거 ① 신뢰할 수 있는 AUC0-inf를 못 얻는 대상자: 채혈로 해결되지 않음"
  title: "채혈을 추가해도 절벽 안 두 점 이상은 방문 허용창(채혈 허용 범위) 반영 {ge2} 이하이고, 신뢰 충족률은 최대 {gmax}%p(세트 (i), 2016 모델) 오르는 데 그친다"
  bullets:
    - "**절벽 길이** 중앙값 {len}일은 채혈 간격보다 짧고, 절벽 위치는 Day {p16}로 흩어진다(5~95백분위, 2016 모델)."
    - "추가 채혈로 늘어나는 것은 **절벽 안 한 점 이상**인 대상자다. B0와 D1~D4에서 두 점 이상은 명목일 {g2n}이고, 허용창을 반영해도 {ge2} 이하다."
    - "매일 채혈해도 λz 최소 {minpts}점이 절벽 안에 드는 대상자는 명목일 {dly}, 허용창 반영 {dy3w}다(순간 반감기 {d1def}일 정의)."
    - "**신뢰 충족률 변화**(B0 대비, 아래 표): 결과 보고 전에 정한 채혈 판단 기준(+{thr}%p 이상 상승)을 충족하는 조합은 없다."
  table:
    head: ["일정", "추가 연구일 (Day)", "세트 (i), 2016 모델", "세트 (i), 2020 모델", "세트 (ii), 2016 모델", "세트 (ii), 2020 모델"]
  fig:
    xlab1: "참 농도가 LLOQ에 닿는 연구일 (Day)"
    ylab1: "대상자 (%, 1일 간격); 회색 세로 점선: 현행 B0 채혈일"
    cmp_b0: "B0 채혈 간격 {v}일"
    cmp_add: "추가 일정 최소 간격 {v}일"
    cmp_cliff: "절벽 길이 중앙값 {v}일"
    ylab2: "절벽 안 채혈점 수별 대상자 (%, 명목일; 막대 위 = 한 점 이상; 매일은 후보 아님)"
    k1: "절벽 안 {k}점"
    k2: "{k}점"
    k3: "{k}점 이상 (λz 최소): 모든 일정 {v}"
    daily: "매일\n(참고)"
  notes: |
    시험 모집단(건강인 {wt} kg, 현행 일정 B0), 모델당 {n}명의 개인 수준 결과다. 절벽 위치 = 참 농도가 LLOQ({lloq} mg/L)에 닿는 연구일: 2016 모델 중앙값 Day {m16}(5~95백분위 {r16}), 2020 모델 Day {m20}({r20}). 그림 분포는 로컬 대상자 수준 결과에서 만든 results/deck_inputs/cliff_lloq_day_hist.csv이며 커밋된 요약(중앙값, 백분위수)과 대조했다(deck_inputs/checks.csv).
    절벽 길이 중앙값 {len}일(순간 반감기 {d1def}일 정의, 두 모델). 채혈 간격: B0는 Day {d22} 이후 {int}일, 후보 일정 D1~D4는 최소 {mi}일, 매일 채혈(Day {dyr}, 참고용이며 후보 아님)은 {dmi}일. 그림 위쪽의 회색 막대 세 개는 이 세 길이를 같은 눈금으로 비교한다.
    절벽 안 채혈점(명목일, {d1def}일 정의, 두 모델 범위): 한 점 이상 B0 {b0}, D1 {d1}, D2 {d2}, D3 {d3}, D4 {d4}. 두 점 이상은 모든 고정 일정(B0, D1~D4)에서 명목일 {g2n}이고, 채혈 허용창을 반영해도 최대 {g2w}다(제목). 매일 채혈은 두 점 이상 명목 {dy2}, 세 점 이상 명목 {dy3}, 허용창 반영 {dy3w}. {d2def}일 정의에서도 고정 일정의 두 점 이상은 명목 최대 {g2d2}, 허용창 최대 {g2d2w}다. 다만 {d2def}일 정의에서는 매일 채혈(참고용) 시 세 점 이상이 명목 {dy3d2}, 허용창 반영 {dy3d2w}다. 슬라이드 본문의 매일 채혈 값은 {d1def}일 정의다.
    λz 창(최소 {minpts}점)은 절벽 안에 놓일 수 없다: 고정 일정에서 절벽 안 채혈은 명목일 기준 많아야 한 점이므로 창의 점 대부분은 절벽 앞 감소 구간에 있다. 다만 B0에서도 대상자의 {b0}는 한 점이 절벽 안에 있고, 창은 마지막 점들로 이루어지므로 이 점이 창에 들어갈 수 있다.
    신뢰 충족률 변화는 같은 대상자(모델당 {nrel}명)의 B0 대비 대응 비교이고, 표의 단위는 %p다. 최대 상승은 세트 (i), 2016 모델 D3다. D3(추가 네 점): 세트 (i) 2016 모델 {ci16}, 2020 모델 {ci20}; 세트 (ii) 2016 모델 {cii16}, 2020 모델 {cii20}. 세트 (ii) 최저는 2020 모델 D4 {mn}. 채혈 판단 규칙의 기준 (c)(신뢰 충족률 +{thr}%p 이상 상승; 슬라이드의 '채혈 판단 기준')는 두 세트 모두 어느 조합에서도 충족되지 않았다. 이 판단 규칙(기준 a~d)은 첫 일정 모의를 돌린 뒤, 결과를 보고하기 전에 규정했다(사전 규정 기록부, 커밋 c018729).
    세트 (ii)가 떨어지는 이유: Best Fit가 추가된 늦은 점을 포함한 더 늦고 짧은 창을 고르고, 창이 짧으면 span 조건(반감기 {sp2}배)을 채우기 어렵다. Day {d22} 이후 가장 짧은 {minpts}점 창은 B0 {w0}일, 추가 일정 {w1}일이며, λz 창 중앙값은 B0 {wm0}일에서 D3 {wm3}일로 줄어든다(보고서 Figure 5-3).
    요청 문구의 범위는 세트 (ii) 최솟값과 세트 (i) 최댓값을 합친 것이라 세트별로 나누어 적었다(세트 (i) {ri}%p, 세트 (ii) {rii}%p). 보고서 5.3절·5.7절의 '세트 (ii)가 떨어지는 경우' 수는 여섯 민감도 변이까지 센 값이다(시험 체중 범위 밖 분포 포함). 이 슬라이드는 시험 모집단의 두 모델만 센다: 세트 (ii)는 {nall}개 조합(D1~D4, 두 모델) 중 {ndown}개에서 떨어진다(표의 음수 칸).
    관련 보고서: 3.9절, 3.10절, 5.1절(Figure 5-1), 5.3절(Figure 5-3), 5.7절(Table 5-14), 6.4절.
