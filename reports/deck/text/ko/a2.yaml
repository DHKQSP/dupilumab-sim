A2:
  kicker: "부록 A2 · 선례"
  title: "검색 발췌 기준, 토실리주맙 바이오시밀러 정맥 시험(MSB11456)은 AUC0-last를 1차 평가변수로 썼고 Cohen 2022는 AUC0-inf를 산출하지 않았다"
  toci:
    chip: "MSB11456 · 문헌(검색 발췌)"
    body:
      - "**기록된 것**: 토실리주맙 바이오시밀러. 건강인 {tn}명(시험 {tt}, 대조 {trf}), {tdose} mg/kg {tinf}시간 정맥 단회 투여, Day {tday}까지 채혈."
      - "**1차 평가변수 AUC0-last**, 이차 Cmax·AUC0-inf. 기하 최소제곱 평균비(90% CI): AUC0-last {tal}, AUC0-inf {tai}, Cmax {tcm}."
      - "**확인 범위**: 원문은 분석 환경에서 열지 못해 검색 발췌 두 건으로만 확인했다. 외부 인용 전 원문 대조가 필요하다."
  cohen:
    chip: "Cohen 2022 · 문헌 기록"
    body:
      - "**기록된 것**: {cd} mg({cc} mg/mL) 기기 비교. 자동주사기 {n1}명 대 프리필드 시린지 {n2}명, AUC0-last 평균 {ca1} / {ca2} mg·day/L."
      - "말단 비선형 때문에 반감기와 AUC0-inf를 산출하지 않았다(보고서 1.1절)."
      - "AUC0-last 기하평균비(GMR) {gmr} (90% CI {ci})."
      - "**프로젝트에서의 쓰임**: 다른 제형의 외부 점검, 표본 수 CV 근거(log SD {lsd})."
  pkm:
    chip: "PKM14161 · 부분 기록"
    body:
      - "**기록된 것**: 모델 검증 자료로만 쓰였다. Li 2020 Table 3의 {d300} mg 시험·대조 arm AUC0-last 평균 {at} / {ar} mg·day/L, tmax 중앙값 {tm}일(두 arm)."
      - "2016 모델 AUC0-last 모의/관측 {q16}(시험 / 대조; 외부 자료, ±{tol}% 기준 통과). 2020 모델은 이 시험을 개발 자료로 포함({q20})."
      - "**기록 없는 것**: 이 시험의 평가변수 선택과 AUC0-inf 처리. 선례로 인용하려면 원문 확인이 필요하다."
  bottom: "→ AUC0-last 1차(MSB11456, 검색 발췌)와 AUC0-inf 미산출(Cohen 2022) 선례가 있다. PKM14161은 평가변수 기록이 없다."
  notes: |
    PKM14161: 프로젝트는 이 연구를 Li 2020 Table 3의 {d300} mg arm(시험 {at}, 대조 {ar} mg·day/L)으로만 기록했다. 2016 모델 검증에서는 외부 자료로 모의/관측 {q16}이고 ±{tol}% 기준을 통과했다. 2020 모델은 이 연구를 개발 자료에 포함하므로 {q20}은 독립 검증이 아니다. {d300} mg 비아시아인 통합 자료(Clot 2021 Table 5)의 구성 연구이기도 하다. 이 연구의 1차 평가변수나 AUC0-inf 처리 방식은 프로젝트 어디에도 기록되어 있지 않다.
    Cohen 2022: 평균 체중 {wc} kg, 관측 tmax 중앙값 {tmc}일. 연구 제형이 아니어서 외부 점검으로만 보고했고, 2016 모델 모의/관측 AUC0-last는 {ca16}이다. GMR 신뢰구간에서 역산한 log SD {lsd}는 표본 수 CV 민감도의 근거 중 하나다. 프로젝트 사양서(SPEC)의 인원 표기는 config·영문 요약과 다르며 이 슬라이드는 config 값을 썼다.
    토실리주맙 MSB11456 정맥 시험(APTURA II): Expert Review of Clinical Immunology {yr}(온라인 {pon}), DOI {doi}, PubMed {pmid}. 기록은 config/literature_precedents.yaml에 있다(D-062). 학술지, PubMed, Europe PMC, Crossref는 분석 환경의 네트워크 정책으로 막혀 원문을 열지 못했고, 설계·평가변수·결과가 일치하는 검색 발췌 두 건으로 확인했다. 외부 문서에 인용하기 전에 원문과 대조한다. 이 시험이 AUC0-last를 1차로 고른 이유는 발췌에 없으므로 적지 않는다. 대조약은 미국 허가 토실리주맙이다.
    보고서에는 선례 절이 따로 없다. Cohen 2022는 보고서 1.1절, 4.2절(Table 4-1 외부 점검), 5.11절(CV 근거)에 나온다.
    관련 보고서: 1.1절, 4.2절, Table 4-1, 5.11절, 부록 D.
