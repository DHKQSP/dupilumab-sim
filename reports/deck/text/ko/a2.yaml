A2:
  kicker: "부록 A2 · 선례"
  title: "요청된 선례 세 건 중 프로젝트 기록으로 확인되는 것은 Cohen 2022의 AUC0-inf 미산출뿐이다"
  pkm:
    chip: "PKM14161 · 부분 기록"
    body:
      - "**기록된 것**: 모델 검증 자료로만. Li 2020 Table 3의 {d300} mg 시험·대조 arm AUC0-last 평균 {at} / {ar} mg·day/L, tmax 중앙값 {tm}일."
      - "2016 모델 모의/관측 {q16}(외부 자료, ±{tol}% 기준 통과). 2020 모델에는 개발 자료로 포함({q20})."
      - "**기록 없는 것**: 이 시험의 평가변수 선택과 AUC0-inf 처리. 선례로 인용하려면 원문 확인 필요."
  cohen:
    chip: "Cohen 2022 · 문헌 기록"
    body:
      - "**기록된 것**: {cd} mg({cc} mg/mL) 자동주사기 {n1}명 대 프리필드 시린지 {n2}명 기기 비교."
      - "말기 비선형 때문에 반감기와 AUC0-inf를 산출하지 않았다(보고서 1.1절)."
      - "AUC0-last 기하평균비(GMR) {gmr} (90% 신뢰구간 {ci}). 이 프로젝트에서는 다른 제형의 외부 점검과 CV 근거(log SD {lsd})로 썼다."
  toci:
    chip: "토실리주맙 MSB11456 정맥 시험"
    body:
      - "**프로젝트 기록 없음(확인 필요)**"
      - "보고서, config, 문헌 발췌표, SPEC, 결정 기록 어디에도 없다."
      - "인용하려면 출처 문헌을 확보해 문헌 발췌표에 넣고, 평가변수와 AUC0-inf 처리 내용을 기록해야 한다."
  bottom: "→ 지금 선례로 인용할 수 있는 것은 Cohen 2022뿐이다. PKM14161과 토실리주맙 시험은 원문 확인 전까지 선례로 쓰지 않는다."
  notes: |
    PKM14161: 프로젝트는 이 연구를 Li 2020 Table 3의 {d300} mg arm(시험 {at}, 대조 {ar} mg·day/L)으로만 기록했다. 2016 모델 검증에서는 외부 자료로 모의/관측 {q16}이고 ±{tol}% 기준을 통과했다. 2020 모델은 이 연구를 개발 자료에 포함하므로 {q20}은 독립 검증이 아니다. {d300} mg 비아시아인 통합 자료(Clot 2021 Table 5)의 구성 연구이기도 하다. 이 연구의 1차 평가변수나 AUC0-inf 처리 방식은 프로젝트 어디에도 기록되어 있지 않다.
    Cohen 2022: 평균 체중 {wc} kg, 관측 tmax 중앙값 {tmc}일. 연구 제형이 아니어서 외부 점검으로만 보고했고, 2016 모델 모의/관측 AUC0-last는 {ca16}이다. GMR 신뢰구간에서 역산한 log SD {lsd}는 표본 수 CV 민감도의 근거 중 하나다. 프로젝트 사양서(SPEC)의 인원 표기는 config·영문 요약과 다르며 이 슬라이드는 config 값을 썼다.
    토실리주맙 MSB11456 정맥 시험은 요청에 있었으나 저장소 전체 검색에서 기록이 없었다. 수치나 결론을 만들어 넣지 않았다. 외부 출처를 확보한 뒤 문헌 발췌표와 결정 기록에 추가해야 슬라이드에 쓸 수 있다.
    보고서에는 선례 절이 따로 없다. Cohen 2022는 보고서 1.1절, 4.2절(Table 4-1 외부 점검), 5.11절(CV 근거)에 나온다.
    관련 보고서: 1.1절, 4.2절, Table 4-1, 5.11절, 부록 D.
