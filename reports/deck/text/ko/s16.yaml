S16:
  kicker: "논거 ③ AUC0-last가 AUC0-inf를 대신한다 · 개인 수준"
  title: "AUC0-last는 총노출을 담는다: 채혈 구간이 담는 참 AUC0-inf의 몫은 중앙값 {med}, 두 모델 모든 대상자에서 {min} 이상이다"
  defs:
    - "**창 포착률** = 참 AUC0-tlast ÷ 참 AUC0-inf(채혈 구간 커버리지)로, 잔차 오차와 무관하고 마지막 정량 시점과 개인의 소실 속도로 정해진다."
    - "**관측 대 참 비** = 관측 AUC0-last 또는 NCA AUC0-inf ÷ 같은 대상자의 참 AUC0-inf. 잔차 오차와 사다리꼴 근사를 담고 두 arm에 같다."
  cov_table:
    head: ["창 포착률", "중앙값", "5번째 백분위수", "95번째 백분위수", "최소", "{thr}% 미만 대상자 (95% CI)"]
    lt: "{n}명 ({ci})"
    rows:
      k2016: "2016 모델"
      k2020: "2020 모델"
  ot_table:
    head: ["분석군 · 평가변수 (2016 모델 / 2020 모델)", "중앙값", "최대"]
    lz_last: "λz 산출 가능 · AUC0-last"
    lz_B: "λz 산출 가능 · NCA AUC0-inf 규칙 B"
    i_last: "세트 (i) 충족 · AUC0-last"
    i_A: "세트 (i) 충족 · NCA AUC0-inf 규칙 A"
  takeaway: "NCA AUC0-inf의 개인 최대 과대추정 {b16}배는 2016 모델 규칙 B에만 있다. 2020 모델 규칙 B는 {b20}배, 규칙 A 세트 (i)은 2016 모델 {a16}배, 2020 모델 {a20}배다."
  fig:
    cov_xlab: "창 포착률 (참 AUC0-tlast / 참 AUC0-inf, %)"
    cov_ylab: "대상자 (%, 로그 눈금)"
    cov_min: "{a}명 / {b}명"
    cov_leg: "대상자 (%, 로그 눈금)"
    ot_xlab: "관측 대 참 비 (÷ 참 AUC0-inf)"
    ot_ylab: "대상자 (%, 로그 눈금) · AUC0-last는 전체 대상자 · 표식: 가장 많은 구간"
    s_last: "AUC0-last"
    s_A: "NCA AUC0-inf 규칙 A (i)"
    s_B: "NCA AUC0-inf 규칙 B"
    ovf: "■ ≥{v}: {n}명 ({p}%)"
    ovf_tick: "≥{v}"
    cov_lab: "{a} / {b}"
  notes: |
    시험 모집단(건강인 {wt} kg, 체중 층화 배정, B0, {dose} mg), 모델당 {n}명의 개인 수준 결과다. 참값은 잔차 없는 모델 적분값이다. 창 포착률은 잔차 오차가 없는 참값끼리의 비라서 마지막 정량 시점(tlast)과 그 대상자의 농도 곡선(소실 속도, 표적 매개 소실)으로 정해진다.
    요청은 95번째 백분위수였으나 창 포착률의 위쪽 백분위수(p95: {p95a}, {p95b})는 거의 전부를 뜻해 정보가 적다. 표에 함께 싣고, 의미 있는 아래쪽 꼬리로 5번째 백분위수(p05)를 실었다. 창 포착률 p05는 참 외삽 비율(마지막 정량 시점 뒤의 참 면적 몫)의 p95({ex16}, {ex20})와 합이 총노출이 되는 같은 정보다. 참 외삽 비율 중앙값은 {exm16}(2016 모델), {exm20}(2020 모델)이다.
    창 포착률 {thr}% 미만인 대상자는 두 모델 모두 없다(최소가 {thr}%보다 크다; 괄호는 Wilson 95% 신뢰구간).
    분포 그림(왼쪽)은 모델을 회색 두 톤으로, 관측 대 참 비 그림(오른쪽)은 평가변수를 색으로 구분한다(파랑 AUC0-last, 주황 NCA AUC0-inf). 세로축은 로그 눈금이라 몇 명뿐인 아래쪽 꼬리도 보인다.
    관측 대 참 비의 분석군: λz 산출 가능군(규칙 B 분석군) 2016 모델 {nB16}명, 2020 모델 {nB20}명; 세트 (i)(adjusted R² ≥ {r2i}, 외삽 ≤ {exi}%) 충족군(규칙 A 분석군) {nA16}명, {nA20}명. 표는 같은 분석군 안에서 AUC0-last와 NCA AUC0-inf를 비교했고, 그림의 AUC0-last는 전체 대상자다. 그림의 표식은 가장 많은 대상자가 든 구간이고, {top} 이상은 한 구간으로 모았다(2016 모델 {o16}명, 2020 모델 {o20}명, 모두 규칙 B).
    로그 척도 표준편차: λz 산출 가능군 AUC0-last {sdl16} 대 규칙 B {sdB16}(2016 모델), {sdl20} 대 {sdB20}(2020 모델); 세트 (i) 충족군 {sdi16} 대 규칙 A {sdA16}(2016 모델). 퍼짐의 대부분은 잔차 오차이고 두 평가변수에 같게 들어간다. NCA AUC0-inf는 여기에 외삽 오차가 더해진다(외삽 배수 AUC0-inf/AUC0-last 최대 {fx16}, {fx20}).
    AUC0-last 관측 대 참 비의 가장 낮은 값({lmin16}, {lmin20})은 성긴 채혈에 붙은 비례 잔차 오차에서 오며 채혈 구간 때문이 아니다. AUC0-last 관측 대 참 비의 중앙값이 참값보다 조금 낮은 것도 잔차와 사다리꼴 근사 때문이고 두 arm에 같다. 시험 수준 GMR에서 이 차이가 어떻게 되는지는 슬라이드 17.
    개인 최대 과대를 인용할 때는 모델과 규칙을 함께 적는다: 2016 모델 규칙 B(λz 산출 가능군)만 {b16}배이고, 2020 모델 규칙 B와 규칙 A 세트 (i)의 최대는 표와 같이 훨씬 작다.
    분포 그림은 로컬 대상자 수준 결과에서 만든 results/deck_inputs/coverage_hist.csv이며 커밋된 요약(중앙값, 백분위수, 최소, 최대)과 대조했다(deck_inputs/checks.csv).
    관련 보고서: 3.6절, 5.2절(Table 5-1, Table 5-3), 6.1절, 7절, 부록 H(용어).
