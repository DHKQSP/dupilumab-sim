S09:
  kicker: "논거 ① 신뢰할 수 있는 AUC0-inf를 못 얻는 대상자: 규모"
  title: "adjusted R² {r2iii} 기준이면 대상자의 {iii}가 신뢰할 수 있는 AUC0-inf를 얻지 못한다"
  table:
    head: ["기준 세트 (정의)", "미달 (두 모델)", "λz 산출되나 미달", "arm당 잔류 중앙값 (5~95백분위), {n}명 중"]
    def: "adj R² ≥ {r2}, 외삽 ≤ {ex}%"
    def_span: "adj R² ≥ {r2}, 외삽 ≤ {ex}%, span ≥ {sp}"
  bullets:
    - "λz 산출 불가는 {lz}뿐이다. 나머지는 λz가 산출되나 기준에 못 미친다(주로 adjusted R² 미달)."
    - "세트 (i)의 탈락률은 관행 범위의 하한이다. 공개 통계분석계획(SAP) NCT04117607, NCT04441905, NCT04700163은 {r2iii}을 쓴다."
    - "잔차가 클수록 더 탈락한다: 2016 모델에서 비례 잔차 {s24} → {s12}이면 세트 (iii) 미달 {r24} → {r12}."
  fig:
    ylab: "신뢰할 수 있는 AUC0-inf 없음 (%)"
    est: "λz 산출되나 미달"
    lz: "λz 산출 불가"
  notes: |
    시험 모집단(건강인, 체중 층화 배정, B0, 모델당 {n_ind}명)의 개인 수준 결과다. 세트 (i) {i}, 세트 (iii) {iii}, 세트 (iv) {iv}가 미달한다(두 모델 범위).
    arm당 잔류 인원은 동일 제품 시험 {n_tr}회의 규칙 A 분석군에서 센 값이다.
    세트 (iv)는 잔차를 줄여도 그대로다({r4_24} → {r4_12}): λz 구간이 절벽 앞에 있어 반감기 {sp4}배 span을 채울 수 없는 구조적 원인이다(슬라이드 11).
    NCT04700163 문구는 사이트 접근이 막혀 검색 발췌로 확인했다(출처표에 기록).
    관련 보고서: 5.3절, Table 5-5, Figure 5-4.
