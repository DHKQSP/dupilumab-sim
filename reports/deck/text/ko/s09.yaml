S09:
  kicker: "논거 ① 신뢰할 수 있는 AUC0-inf를 못 얻는 대상자: 규모"
  title: "adjusted R² {r2iii} 기준이면 대상자의 {iii}가 신뢰할 수 있는 AUC0-inf를 얻지 못한다"
  table:
    head: ["기준 세트 (모두 외삽 ≤ {ex}%)", "미달\n(두 모델 범위)", "그중 λz 산출되나 미달", "arm당 유지자 ({n}명 중)\n중앙값 (5~95백분위)"]
    def: "adj R² ≥ {r2}"
    def_span: "adj R² ≥ {r2}, span ≥ {sp}"
  bullets:
    - "λz 산출 불가는 {lz}뿐이다. 나머지는 λz가 산출되나 기준에 못 미친다: 세트 (i)·(iii)은 대부분 adjusted R² 미달이고, span 조건이 있는 세트 (ii)·(iv)는 span 미달이 더해진다(세트 (iv) {sp4h})."
    - "세트 (i)은 네 세트 중 가장 느슨한 기준이어서 그 미달 비율이 하한이다. 공개 통계분석계획(SAP) {nsap}건은 {r2iii}을 쓴다: {ncts}(마지막은 검색 발췌로 확인)."
    - "잔차가 클수록 더 탈락한다: 2016 모델의 비례 잔차를 {s24}에서 {s12}로 줄이면 세트 (iii) 미달이 {r24}에서 {r12}로 준다."
  fig:
    ylab: "신뢰할 수 있는 AUC0-inf 없음 (%)\n오차 막대: Wilson 95% 구간"
  notes: |
    시험 모집단(건강인, 체중 층화 배정, B0, 모델당 {n_ind}명)의 개인 수준 결과다. 세트 (i) {i}, 세트 (iii) {iii}, 세트 (iv) {iv}가 미달한다(두 모델 범위). 막대의 오차 막대는 Wilson 95% 구간이다.
    미달 사유(계층 분류: λz 산출 불가, adjusted R² 미달, 외삽 초과, span 미달 순): 세트 (i)·(iii)의 adjusted R² 미달은 {r2h_i}, {r2h_iii}이고, 세트 (ii)의 span 미달은 {sp2h}, 세트 (iv)의 span 미달은 {sp4h}다(두 모델 범위). 2020 모델 세트 (iv)는 span 미달({sp4h20})이 adjusted R² 미달({r2h4_20})보다 크다.
    arm당 유지자 수는 동일 제품 시험 {n_tr}회(S00, 두 모델)의 규칙 A 분석군에서 센 값이다(arm당 {n}명 중).
    세트 (iv)는 잔차를 줄여도 그대로다({r4_24} → {r4_12}): λz 구간이 절벽 앞에 있어 반감기 {sp4}배 span을 채울 수 없는 구조적 원인이다(슬라이드 11).
    세트 (i)은 adjusted R² 기준이 가장 낮고 span 조건이 없어, 관행 기준 중 가장 느슨하다. 공개 SAP {nsap}건 중 NCT04700163 문구는 사이트 접근이 막혀 검색 발췌로 확인했다(출처표에 기록).
    관련 보고서: 5.3절, Table 5-5, Figure 5-4.
