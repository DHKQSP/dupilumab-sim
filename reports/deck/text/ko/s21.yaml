S21:
  kicker: "견고성 · 가정을 바꿔도 결론이 유지되는가"
  title: "다섯 가지 가정을 바꿔도 결론은 유지된다: 계산한 모든 조건에서 AUC0-last + Cmax가 {nom}를 넘은 곳은 2020 모델 V2 한 칸이다"
  table:
    head: ["바꾼 가정", "계산한 범위", "핵심 결과", "결론"]
    cond:
      - "구조 모델 두 개 (2016 모델 주, 2020 모델 민감도)"
      - "곡선 모양: Km·Vmax (양 군 공통 배율)"
      - "분석법 LLOQ {lg} mg/L"
      - "비례 잔차 {s12} (2016 모델 {s24})"
      - "분석 모형 M0 / M1 / M2"
    scope:
      - "경계 칸 모델당 {npm}칸, 칸당 시험 {n10}회(한 칸 {n20}회), M1·M0"
      - "2016 모델만: Km ×{k1}~×{k2}, Vmax ×{v1}·×{v2}, 대상자 {ncs}명씩(개인 수준). 시험약 Km ×{kmr} 역산은 두 모델"
      - "{nl}개 값, 2016 모델만, 경계 {nc}칸, 칸당 시험 {nt}회, M1·M0"
      - "2016 모델: 개인 수준 신뢰 기준, 일정 판정(D2만), B0 AUC0-last 통과율(시험 {ntr}회). 경계 1종 오류는 미산출"
      - "경계 {n}칸(두 모델)의 같은 시험, 칸당 {n10}회(한 칸 {n20}회)"
    result:
      - "AUC0-last + Cmax(M1) 최대 {p16}(2016 모델), {p20}(2020 모델 V2 칸). AUC0-inf 규칙 A (i) + Cmax는 {g16}칸·{g20}칸에서 {nom} 초과"
      - "창 포착률 {thr}% 미만 {lt}, 참 외삽 95번째 백분위수 {p95}. Km 역산의 참 AUC0-inf 비 {km}"
      - "AUC0-last + Cmax {p1}(M1), {p0}(M0), Wilson 하한 > {nom}인 칸 {k1}. AUC0-inf 규칙 A (ii) + Cmax(M1) {g1}, 하한 > {nom} {kg}"
      - "신뢰 기준 미달 세트 (iii) {f24} → {f12}, 세트 (iv) {g24} → {g12}. D2 추가 채혈 권고 안 함"
      - "AUC0-last + Cmax 범위 M0 {r0}, M1 {r1}, M2 {r2}. 보수적 {c0} / {c1} / {c2}칸. 분류가 바뀐 칸은 2020 모델 V2 칸뿐(명목 → 초과)"
    verdict:
      - "✓ 유지 (2020 모델 한 칸 공개, 슬라이드 19)"
      - "✓ 유지"
      - "✓ 유지"
      - "✓ 유지 (1종 오류 미산출)"
      - "✓ 유지 (같은 한 칸 공개)"
  bullets:
    - "**계산 범위의 한계**: 곡선 모양과 잔차 {s12}에서는 경계 1종 오류를 계산하지 않았고, LLOQ 시험은 2016 모델의 경계 {nc}칸만 계산했다. 초과 칸 값은 M0 {m0}, M1 {m1}, M2 {m2}."
  notes: |
    '결론 유지'의 뜻: 그 행에서 계산한 결과가 ① AUC0-last + Cmax의 경계 1종 오류가 {nom} 근처 이하, ② AUC0-inf의 신뢰 기준 미달 또는 AUC0-inf + Cmax의 {nom} 초과가 남음, ③ AUC0-last의 창 포착률이 높음 중 계산한 항목을 바꾸지 않는다는 것이다. 행마다 계산한 것만 적었고 계산하지 않은 것은 미산출로 적었다.
    구조 모델: 2016 모델(주분석)과 2020 모델(민감도) 경계 칸 각 {npm}칸. AUC0-last + Cmax 최대(M1) 2016 모델 {p16c}, 2020 모델 {p20c}(V2 칸, 슬라이드 19); M0 최대 {m016}, {m020}. AUC0-inf 규칙 A (i) + Cmax 최대(M1) {gm16}, {gm20}. 세트 (i) 신뢰 기준 미달 {fi16}, {fi20}. 보고서 6.5절: 두 모델에서 결론이 같다.
    곡선 모양(보고서 5.2절 Table 5-2, 2016 모델만, 독립 추출 대상자 {ncs}명씩): Km ×{k1}~×{k2}, Vmax ×{v1}·×{v2}에서 창 포착률 {thr}% 미만 대상자는 없고, 참 외삽 95번째 백분위수는 {p95}다(가장 큰 값 Vmax ×{v2} {p95v}, 가장 작은 값 Km ×{k2} {p95k}). 관측 노출과 맞지 않는 스트레스 테스트 Vmax ×{sx}(AUC0-last 모의/관측 {gs})에서는 {sp95}, {thr}% 미만 {slt}다.
    주의(노출 gate): Vmax ×{v1}(양 군) 변형은 AUC0-last 모의/관측 비가 {gv}로 노출 gate(±{gate}%) 밖이다(결과 파일 gate_note). 그러나 stress_test로 표시되지 않았고 보고서는 관측과 맞는 변형으로 센다. 이 변형을 빼도 표의 범위({p95}, {thr}% 미만 {lt})는 같다.
    Km 역산(보고서 5.6절, 슬라이드 18): 시험약 Km ×{kmr}에서 참 AUC0-inf 비는 {km}(두 모델)에 머문다.
    LLOQ(보고서 5.10절, Table 5-17, Table 5-18): {lg} mg/L의 {nl}개 값(연구 LLOQ {lloq} mg/L 포함), 2016 모델, 경계 {nc}칸(F 감소, Vmax 감소, Vmax 증가), 칸당 {nt}회, 잔차는 추정값 그대로. AUC0-last + Cmax: M1 {lp1}(하한 > {nom}: {lk1}), M0 {lp0}({lk0}). AUC0-inf 규칙 A (ii) + Cmax: M1 {lg1}, M0 {lg0}(하한 > {nom}: {lkg0}); 규칙 B + Cmax M1 {lb1}. 개인 수준(2016 모델): 창 포착률 {thr}% 미만 {lc}, 세트 (i) 신뢰 충족 {lr}. 2020 모델의 시험 수준 LLOQ 결과는 없다(미산출).
    잔차(2016 모델 비례 잔차 {s24} 대신 {s12}): 신뢰 기준 미달 세트 (i) {i24} → {i12}, 세트 (iii) {f24} → {f12}, 세트 (iv) {g24} → {g12}(span 조건은 구조적 원인이라 그대로). D2 일정 판정: (a) {ra}, (c) {rc}%p, (d) {rd}로 권고 안 함. B0 AUC0-last 통과율(시험 {ntr}회): 동일 제품 {s00}(기본 {s00b}), ke ×{kem} {ke}({keb}), F ×{fm} {f90}({f90b}). 이 변형으로 AUC0-last + Cmax나 AUC0-inf 구성의 경계 1종 오류는 계산하지 않았다(미산출).
    분석 모형(보고서 5.9절, Table 5-15): AUC0-last + Cmax 범위 M0 {r0}, M1 {r1}, M2 {r2}; 보수적 칸 {c0}, {c1}, {c2}. 같은 시험의 M1 - M0 차이 {dpc}%p(양수 {npos}칸). 불편 참조의 시험 간 SD / 시험 내 SE: M0 {sd0}, M1 {sd1}. 동일 제품 검정력(2016 모델): M0 {pw0}, M1 {pw1}. M1을 주분석으로 두는 것은 이 슬라이드 묶음의 제안이며, 보고서와 SAP 제안에서 주분석 모형은 의뢰자 결정 사항이다.
    관련 보고서: 4.4절, 5.2절(Table 5-2), 5.3절, 5.6절, 5.9절(Table 5-15, Figure 5-9), 5.10절(Table 5-17, Table 5-18, Figure 5-10), 6.5절; 예상 질의 Q5, Q17, Q18.
