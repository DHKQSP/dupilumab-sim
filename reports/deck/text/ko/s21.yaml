S21:
  kicker: "견고성 · 가정을 바꿔도 결론이 유지되는가"
  title: "구조 모델, 곡선 모양, LLOQ, 잔차, 분석 모형을 각각 바꿔도 결론은 유지된다: AUC0-last + Cmax 점추정 {nom} 초과는 계산한 곳 모두 2020 모델 V2 칸뿐이다"
  table:
    head: ["바꾼 가정", "계산한 범위", "핵심 결과", "결론"]
    cond:
      - "구조 모델 두 개 (2016 모델 주분석, 2020 모델 민감도)"
      - "곡선 모양 (양 군 공통 배율)"
      - "분석법 LLOQ {lg} mg/L"
      - "비례 잔차 {s24} → {s12} (2016 모델)"
      - "분석 모형 M0 / M1 / M2 (M2: log 체중 공분산분석)"
    scope:
      - "경계 칸 모델당 {npm}칸, 칸당 시험 {n10}회(V2 칸 {n20}회), M1·M0"
      - "Vmax ×{v1}·×{v2}(곡률), Km ×{k1}~×{k2}: 2016 모델만, 대상자 {ncs}명씩. 시험약 Km 역산 ×{kmr}은 두 모델"
      - "{nl}개 값, 2016 모델만, 경계 {nc}칸, 칸당 시험 {nt}회, M1·M0"
      - "개인 수준 신뢰 기준, 일정 판정(D2만), B0 AUC0-last 통과율(시험 {ntr}회)"
      - "두 모델 경계 {n}칸의 같은 시험, 칸당 {n10}회(V2 칸 {n20}회)"
    result:
      - "AUC0-last + Cmax(M1) 최대 {p16}(2016 모델), {p20}(2020 모델 V2 칸). AUC0-inf 규칙 A (i) + Cmax(M1) 점추정 {nom} 초과 2016 모델 {g16}칸, 2020 모델 {g20}칸(Wilson 하한 > {nom}: {w16}칸, {w20}칸)"
      - "창 포착률 {thr}% 미만 {lt}, 참 외삽 95번째 백분위수 {p95}. Km 역산의 참 AUC0-inf 비 {km}"
      - "AUC0-last + Cmax {p1}(M1), {p0}(M0), Wilson 하한이 {nom} 초과인 칸 {k1}. AUC0-inf 규칙 A (ii) + Cmax(M1) {g1}, 하한이 {nom} 초과인 칸 {kg}"
      - "신뢰 기준 미달 세트 (i) {i24} → {i12}, (iii) {f24} → {f12}, (iv) {g24} → {g12}. D2 추가 채혈 권고 안 함"
      - "V2 칸의 AUC0-last + Cmax: M0 {m0} 명목, M1 {m1}·M2 {m2} 초과. 나머지 {c}칸은 세 모형 모두 보수적"
    verdict:
      - "✓ 유지 (V2 칸 공개, 슬라이드 19)"
      - "✓ 유지 (1종 오류 미산출)"
      - "✓ 유지"
      - "✓ 유지 (1종 오류 미산출)"
      - "✓ 유지 (V2 칸 공개)"
  bullets:
    - "**결론 유지**: 계산한 항목에서 AUC0-last + Cmax 점추정은 V2 칸 밖에서 모두 {nom} 이하이고, AUC0-inf 구성의 {nom} 초과나 신뢰 기준 미달은 남는다. Wilson 95% 구간 분류: 보수적(상한 < {nom}), 명목({nom} 포함), 초과(하한 > {nom})."
    - "**계산 범위의 한계**: 곡선 모양과 잔차 {s12}에서는 경계 1종 오류를 계산하지 않았고, LLOQ 시험은 2016 모델의 경계 {nc}칸만 계산했다."
  notes: |
    '결론 유지'의 뜻(슬라이드의 첫 요점과 같음): 그 행에서 계산한 결과가 ① AUC0-last + Cmax의 경계 1종 오류가 {nom} 근처 이하, ② AUC0-inf의 신뢰 기준 미달 또는 AUC0-inf + Cmax의 {nom} 초과가 남음, ③ AUC0-last의 창 포착률이 높음 중 계산한 항목을 바꾸지 않는다는 것이다. 행마다 계산한 것만 적었고 계산하지 않은 것은 미산출로 적었다.
    구조 모델: 2016 모델(주분석)과 2020 모델(민감도) 경계 칸 각 {npm}칸. AUC0-last + Cmax 최대(M1) 2016 모델 {p16c}, 2020 모델 {p20c}(V2 칸, 슬라이드 19); M0 최대 {m016}, {m020}. AUC0-inf 규칙 A (i) + Cmax(M1): 최대 {gm16}(2016 모델), {gm20}(2020 모델), 점추정 {nom} 초과 {n}칸 중 {gt}칸(2016 모델 {g16}, 2020 모델 {g20}), Wilson 하한 > {nom} {wt}칸({w16}, {w20}). 세트 (i) 신뢰 기준 미달 {fi16}, {fi20}. 보고서 6.5절: 두 모델에서 결론이 같다.
    곡선 모양(보고서 5.2절 Table 5-2, 2016 모델만, 독립 추출 대상자 {ncs}명씩): 양 군 Km ×{k1}~×{k2}, 양 군 Vmax ×{v1}·×{v2}(곡률 변화; 슬라이드 13의 시험약만 바꾼 제품 시나리오와 다르다)에서 창 포착률 {thr}% 미만 대상자는 없고, 참 외삽 95번째 백분위수는 {p95}다(가장 큰 값 Vmax ×{v2} {p95v}, 가장 작은 값 Km ×{k2} {p95k}). 관측 노출과 맞지 않는 스트레스 테스트 Vmax ×{sx}(AUC0-last 모의/관측 {gs})에서는 {sp95}, {thr}% 미만 {slt}다.
    주의(노출 gate): Vmax ×{v1}(양 군) 변형은 AUC0-last 모의/관측 비가 {gv}로 노출 gate(±{gate}%) 밖이다(결과 파일 gate_note). 그러나 stress_test로 표시되지 않았고 보고서는 관측과 맞는 변형으로 센다. 이 변형을 빼도 표의 범위({p95}, {thr}% 미만 {lt})는 같다.
    Km 역산(보고서 5.6절, 슬라이드 18): 시험약 Km ×{kmr}에서 참 AUC0-inf 비는 {km}(두 모델)에 머문다.
    LLOQ(보고서 5.10절, Table 5-17, Table 5-18): {lg} mg/L의 {nl}개 값(연구 LLOQ {lloq} mg/L 포함), 2016 모델, 경계 {nc}칸(F 감소, Vmax 감소, Vmax 증가), 칸당 {nt}회, 잔차는 추정값 그대로. AUC0-last + Cmax: M1 {lp1}(하한 > {nom}: {lk1}), M0 {lp0}({lk0}). AUC0-inf 규칙 A (ii) + Cmax: M1 {lg1}, M0 {lg0}(하한 > {nom}: {lkg0}); 규칙 B + Cmax M1 {lb1}. 개인 수준(2016 모델): 창 포착률 {thr}% 미만 {lc}, 세트 (i) 신뢰 충족 {lr}. 2020 모델의 시험 수준 LLOQ 결과는 없다(미산출).
    잔차(2016 모델 비례 잔차 {s24} 대신 {s12}): 신뢰 기준 미달 세트 (i) {i24} → {i12}, 세트 (iii) {f24} → {f12}, 세트 (iv) {g24} → {g12}(span 조건은 구조적 원인이라 그대로). D2 일정 판정: (a) {ra}, (c) {rc}%p, (d) {rd}로 권고 안 함. B0 AUC0-last 통과율(시험 {ntr}회): 동일 제품 {s00}(기본 {s00b}), ke ×{kem} {ke}({keb}), F ×{fm} {f90}({f90b}). 이 변형으로 AUC0-last + Cmax나 AUC0-inf 구성의 경계 1종 오류는 계산하지 않았다(미산출).
    분석 모형(보고서 5.9절, Table 5-15): AUC0-last + Cmax 범위 M0 {r0}, M1 {r1}, M2 {r2}; 보수적 칸 {c0}, {c1}, {c2}. 2020 모델 V2 증가 칸은 M0 {m0}(명목: Wilson 구간이 {nom} 포함), M1 {m1}, M2 {m2}(초과: 하한 > {nom})이고 나머지 칸은 세 모형 모두 보수적(상한 < {nom})이다. M2는 log 체중 공분산분석(민감도)이다. 같은 시험의 M1 - M0 차이 {dpc}%p(양수 {npos}칸). 불편 참조의 시험 간 SD / 시험 내 SE: M0 {sd0}, M1 {sd1}. 동일 제품 검정력(2016 모델): M0 {pw0}, M1 {pw1}. M1을 주분석으로 두는 것은 이 슬라이드 묶음의 제안이며, 보고서와 SAP 제안에서 주분석 모형은 의뢰자 결정 사항이다.
    관련 보고서: 4.4절, 5.2절(Table 5-2), 5.3절, 5.6절, 5.9절(Table 5-15, Figure 5-9), 5.10절(Table 5-17, Table 5-18, Figure 5-10), 6.5절; 예상 질의 Q5, Q17, Q18.
