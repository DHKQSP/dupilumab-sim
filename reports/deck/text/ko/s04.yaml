S04:
  kicker: "배경 질문, 사용 맥락, 모델 위험: 국제의약품규제조화위원회(ICH) M15의 틀"
  title: "이 분석은 시험 모집단에서 AUC0-last가 AUC0-inf를 대신할 수 있는지 답하며, 동등성 판정은 시험 자료가 한다"
  table:
    head: ["ICH M15 요소", "이 분석"]
    rows:
      q1: ["평가변수 질문", "공동 1차 평가변수로서 AUC0-last가 Cmax와 함께 AUC0-inf를 대신할 수 있는가? 즉 AUC0-last가 총노출을 반영하고, 참 AUC0-inf 비가 동등성 한계인 제품의 동등 판정 확률을 AUC0-inf 사용 시와 같거나 더 낮게 통제하는가"]
      q2: ["채혈 질문", "결과 보고 전에 정한 판정 규칙으로 볼 때 Day {d_lo}~{d_hi} 사이 추가 채혈이 AUC0-last 정밀도, 제품 차이 민감도, AUC0-inf 신뢰성을 충분히 높이는가"]
      cou: ["사용 맥락", "공개 모집단 PK 모델로 계획 시험을 모의해 (a) AUC0-last의 총노출 포착, (b) 평가변수 구성과 AUC0-inf 처리 규칙의 운용 특성(경계 시나리오 동등 판정 확률, 검정력), (c) 추가 채혈을 평가한다. 결과는 제안을 뒷받침할 뿐 시험을 대신하지 않는다"]
      risk: ["모델 영향, 결정 결과,\n모델 위험", "세 요소 모두 중간으로 평가. 틀린 결정이면 한계 밖 제품을 동등으로 판정하거나 유사 제품이 불통과한다. 완화: Cmax를 공동 1차 평가변수로 유지, AUC0-inf 이차 보고, 표적 결합은 비교 분석 평가"]
      cred: ["신뢰성 활동\n(위험에 비례)", "코드 검증(해석해, 참조 비구획 분석 구현 두 가지), 독립 재구현, 시험 제형 외부 검증, 구조 모델 두 개, 민감도 분석, 사전 등록한 운용 특성 설계, 모든 수치의 출처 추적"]
  scope:
    - "**근거 범위: 시험 모집단**"
    - "건강인 {wt} kg, 체중 층화(두 층) 1:1 배정"
    - "{dose} mg 단회 피하 투여, 평행군"
    - "군당 무작위 {nr}명(평가 가능 {n}명)"
    - "현행 일정(B0): {ns}회 채혈, Day {last}까지"
    - "정량한계 {lloq} mg/L"
    - "주분석 M1(체중 층 포함, 의뢰자 결정 전), M0 병기"
  not:
    head: "이 분석이 답하지 않는 것"
    bullets:
      - "표적 결합(Km) 차이: AUC로 드러나지 않으므로 비교 분석 평가가 다룬다"
      - "Cmax 자체의 운용 특성"
      - "중도 탈락, 수동 λz 검토, 항약물항체(ADA): 모의하지 않음"
      - "동등성 판정 자체: 시험의 관측 자료가 정한다"
  notes: |
    보고서 2절 표(질문, 사용 맥락, 모델 영향, 결정 결과, 모델 위험, 신뢰성 활동)를 줄였다. 틀은 ICH M15(모델 기반 의약품 개발 일반 원칙)의 요소를 따른다.
    채혈 질문의 답(7절 결론): Day {d_lo}~{d_hi} 사이 추가 채혈은 정당화되지 않았고 현행 일정(B0)을 유지한다.
    근거 범위는 등록 원칙(prereg 6절)이다: AUC0-inf를 쓰지 않는 근거는 동등성을 입증하는 시험 모집단(건강인 {wt} kg, 체중 층화 배정)에서만 세운다. 범위 밖 체중과 다른 모집단 결과는 부록의 견고성 확인이다.
    표적 결합: Km을 {km_lo}~{km_hi}배로 바꿔도 참 AUC0-inf 비는 {km}에 머문다(보고서 5.6절). 그래서 결합 차이는 어떤 PK 평가변수로도 검출되지 않고 비교 분석 평가가 다뤄야 한다.
    주분석 모형(M0 또는 M1), 분석법 정량한계, 목표 검정력은 보고서에서 의뢰자 결정으로 남아 있다. 이 슬라이드 묶음은 M1(체중 층 포함)을 주분석으로 두고 M0(체중 층 미포함, 합동 t 검정)을 병기한다(의뢰자 결정 전). 중도 탈락(시험 중 이탈), 수동 λz 검토, 항약물항체(ADA)는 운용 특성 모의에 넣지 않았다. 여러 설계값(정량한계, 투여일의 투여 후 채혈 시각, 방문 허용창, 체중 분포, 층 경계)은 확정 전 가정이다(보고서 부록 B).
    관련 보고서: 1.2절, 1.3절, 2절, 3.13절, 4.4절, 5.6절, 6.5절, 7절.
