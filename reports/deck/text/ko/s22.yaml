S22:
  kicker: "결론 · 제안의 실행: 표본 수 권고"
  title: "현행 arm당 무작위배정 {n_rand}명(평가 가능 {n_arm}명)을 유지하는 안을 제안한다: AUC0-last + Cmax 검정력은 CV {cv_b}%에서 {p_b}, CV {cv_s}%에서 {p_s}"
  caption: "동시 통과(P2) 검정력(%), 참 GMR {g}, 2016 모델 입력, M1(마지막 열만 M0)"
  table:
    h_cv: "AUC0-last 변동계수(CV)"
    h_n: "평가 가능 {n}명"
    h_now: "평가 가능 {n}명 (현행)"
    h_m0: "M0 참고 (현행 {n}명)"
    row: "{cv}%"
    base: "(프로토콜)"
    sens: "(민감도)"
  bullets:
    - "**유지 근거**: 검정력 {tgt}% 이상은 격자 CV {cv_ok}%까지다. {tgt}%에 필요한 평가 가능 인원(M1)은 CV {cv_b}%에서 **{n_b}명**(무작위배정 {nr_b}명), CV {cv_s}%에서 **{n_s}명**({nr_s}명)."
    - "CV 근거: PK 모델 {cv16}(2016 모델), {cv20}(2020 모델), Li 2020 SD/평균 {li}%, Cohen 2022 약 {coh}(다른 제형)."
    - "목표 검정력과 표본 수는 의뢰자 결정 사항이다(SAP 제안 6절). 중도 탈락은 모의하지 않았다."
  caution: "**주의**: 표의 값은 분석식 근사다. 참 GMR {g90}에서는 분석식이 PK 모델 시험보다 **{rng}%p** 높아 낙관적이고, {g95}에서는 {amax}%p 이내다."
  fig:
    xlab: "참 GMR"
    ylab: "검정력 차이 (%p): 분석식에서 PK 모델 시험을 뺀 값\n0보다 크면 분석식이 낙관적 · 막대: Wilson 95% 구간\nPK 모델 시험: 평가 가능 {n}명, 모델 고유 CV"
    am:
      M1: "M1 (주분석)"
      M0: "M0"
  notes: |
    표는 보고서 5.11절의 분석식 근사(두 평가변수 이변량 정규)로 계산한 AUC0-last + Cmax 동시 통과(P2) 검정력이다. 입력은 2016 모델(B0, 시험 체중 범위): AUC0-last CV {cv16}, Cmax CV {cvc}, 두 평가변수 로그값 상관 {rho}, 체중 층이 설명하는 AUC0-last 분산 {r2s}. Cmax의 참 GMR은 AUC0-last와 같다고 두었다(보수적 가정).
    표의 n은 arm당 평가 가능 인원이다. {n130}명 열은 평가 가능 {n130}명이며 무작위배정 {n130}명이 아니다(CV {cv_s}%에서 {p130}). 현행 가정은 arm당 무작위배정 {n_rand}명 중 평가 가능 {n_arm}명이고, 중도 탈락 자체는 모의하지 않았다. 유지 제안의 근거는 프로토콜 CV {cv_b}%에서 검정력이 {tgt}% 이상({p_b})이라는 점이며, 민감도 CV {cv_s}%에서도 {tgt}%를 원하면 arm당 무작위배정 {nr_s}명(평가 가능 {n_s}명)이 필요하다. 목표 검정력은 의뢰자가 정한다.
    CV {cv_b}%, 평가 가능 {n_arm}명: M1 {p_b}, M0 {p_b0}. CV {cv_s}%: M1 {p_s}, M0 {p_s0}. 격자 CV 중 {cv_ok}%까지 {tgt}% 이상이며({cv_ok}%에서 {p_ok}), 격자 사이를 보간한 값이 아니다.
    {tgt}% 검정력에 필요한 평가 가능 인원(무작위배정): CV {cv_b}% M1 {n_b}({nr_b}), M0 {n_b0}({nr_b0}); CV {cv_s}% M1 {n_s}({nr_s}), M0 {n_s0}({nr_s0}).
    분석식 점검: 통계 모의(칸당 {mc_tr}회)와 비교해 {mc_n}칸 중 {mc_in}칸에서 분석식이 Wilson 95% 구간 안이고 최대 차이는 {mc_max}%p다. PK 모델 시험(평가 가능 {n_arm}명, 모델 고유 CV; F 감소 칸은 칸당 {ntr}회, 동일 제품 S00과 F097 칸은 {ntr2}회)과 비교하면 참 GMR {g95}에서 {amax}%p 이내이고, {g90}에서는 분석식이 {rng}%p 높다(두 모델, M0와 M1 모두).
    CV 근거: Li 2020 Table 3의 연구 용량 arm SD/평균 {li}%, Cohen 2022 역산 약 {coh}(다른 제형, 기기 비교), 프로토콜 가정 {cv_b}%(기본)와 {cv_s}%(민감도; SAP 제안 7절에서 확정).
    보고서 Figure 5-11의 연속 곡선은 결과 파일로 저장되지 않아 저장된 격자만 표로 보였다. 오른쪽 그림은 생체이용률 소폭 감소 시나리오(F097)를 빼고 그렸다(점검 범위 계산에는 포함). 세로축은 분석식 검정력에서 PK 모델 시험의 경험 검정력을 뺀 값이고, 막대는 경험 검정력의 Wilson 95% 구간을 옮긴 것이다. 0보다 크면 분석식이 낙관적이다.
    관련 보고서: 3.12절, 5.11절, Table 5-19, Figure 5-11, 7절; SAP 제안 6절, 7절; 예상 질의 Q12.
