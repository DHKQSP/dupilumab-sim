S15:
  kicker: "논거 ② 경계 1종 오류: 기전별 비교 (M1, M0 함께 제시)"
  title: "경계 {n}칸 중 1종 오류 점추정이 {nom}를 넘는 칸은 제안한 AUC0-last + Cmax가 {p2n}칸, 규칙 A (i)·(ii)·B의 AUC0-inf + Cmax가 {r}칸이다(M1)"
  fig:
    xlab: "경계 1종 오류 (%, M1). 점선: 명목 {nom}\n가로선: Wilson 95% 구간(짧은 구간은 표식에 가려짐)"
    ka: "Cmax 모든 시험 불통과"
    cell: "{mech} {dir} → {tgt}"
    ytag: "기전 변화 →\n참 AUC0-inf 비"
    mech:
      F: "F"
      ka: "ka"
      ke: "ke"
      Vmax: "Vmax"
      V2: "V2"
    dir:
      up: "증가"
      down: "감소"
    cfg:
      P2: "AUC0-last + Cmax (제안)"
      G2_Aii: "AUC0-inf + Cmax, 규칙 A (ii) 사전 명시"
      G2_B: "AUC0-inf + Cmax, 규칙 B"
  gloss:
    - "F 생체이용률 · ka 흡수 속도상수 · ke 선형 소실 속도상수"
    - "V2 말초 분포용적 · Vmax 표적 매개 소실 최대 속도"
    - "**Wilson 분류**: 보수적 = 상한 < {nom}, 명목 = {nom} 포함, 초과 = 하한 > {nom}"
  stat:
    value: "{k} / {n}칸"
    label: "AUC0-last + Cmax 명목 이하 경계 칸(M1, 모두 보수적). 초과 {exc}칸: 2020 모델 V2 증가 {p2}. M0: {m0} / {n}칸 명목 이하(점추정 {p2m0} 칸도 명목)."
  table:
    head: ["평가변수 · 규칙", "M1 점추정\n{nom} 초과 칸", "M1 최대", "M0 점추정\n{nom} 초과 칸", "M0 최대"]   # \n: 표 칸 안 줄바꿈
    rows:
      G2_Ai: "A (i) 제외"
      G2_Aii: "A (ii) 사전 명시"
      G2_B: "B λz 산출 전원"
      G2_Ci: "C (i) AUC0-last 대입"
      P2: "AUC0-last + Cmax"
  bullets:
    - "M1에서 AUC0-inf + Cmax는 Vmax 칸이 가장 높다(규칙 A (ii)에서 {vmax}). V2 칸에서는 A (i)·(ii)·B가 보수적이고, 2016 모델의 A (iii)·(iv)는 초과다({aiii16}, {aiv16})."
  notes: |
    경계 칸: 시험약의 기전(F, ka, ke, Vmax, V2)을 한 방향으로 바꿔 참 AUC0-inf 비가 {tgt}에 닿게 한 칸이다. 칸 이름의 증가·감소는 파라미터 변화 방향이다(예: 2016 모델 Vmax ×{vm} 증가 → 참 비 {vmt}). ka와 V2는 상한에 닿지 않고 Km은 어느 경계에도 닿지 않아 모델당 {npm}칸, 합 {n}칸이다.
    분류(Wilson 95% 구간): 보수적은 상한 < {nom}, 명목은 구간이 {nom}를 포함, 초과는 하한 > {nom}이다. 점추정이 {nom}를 넘어도 구간이 {nom}를 포함하면 명목이다. 표의 칸 수는 점추정 기준이다.
    AUC0-last + Cmax(M1): 보수적 {c1}칸, 명목 {n1}칸, 초과 {e1}칸, 범위 {rng}. 명목 이하 {k}칸은 모두 보수적(Wilson 상한 < {nom})이다. 초과 칸은 2020 모델(민감도) V2 ×{v2m} 증가(참 AUC0-inf 비 {v2r})로 {p2}, 시험 {n20}회다. 사전 등록 {reps}회에서 Wilson 구간이 {nom}를 포함한 칸만 {n20}회로 늘렸고(DECISIONS D-048, 두 분석 모형에 함께 적용), 처음 {reps}회의 값은 {p2k}였다. 2016 모델(주분석)의 같은 기전 칸(V2 ×{v2m16})은 {p216}로 보수적이다.
    M0: 보수적 {m0c}칸, 명목 {m0n}칸으로 {n}칸 모두 명목 이하다. 같은 칸은 {p2m0ci}로, 점추정은 {nom}를 넘지만 구간이 {nom}를 포함해 명목이다.
    ka 감소 두 칸은 참 Cmax 비({cmr})가 동등 하한 밖이어서 Cmax가 모든 시험에서 불통과하고, Cmax를 포함한 모든 구성이 {zero}다. 정보가 있는 칸은 {ninf}칸이다.
    AUC0-inf + Cmax 최대(M1): 규칙 A (ii)는 2020 모델 Vmax 감소 칸 {aii}, 규칙 B는 2016 모델 Vmax 증가 칸 {b}. M0: 규칙 A (ii) {aii0}, 규칙 B {b0}. 통상 규칙(A (i), A (ii), B)의 점추정 {nom} 초과 칸은 M1 {r}칸, M0 {r0}칸이다. Wilson 하한까지 {nom}를 넘는 칸은 M1 A (ii) {lo_aii}, A (i) {lo_ai}, B {lo_b}칸; M0 {lo_aii0}, {lo_ai0}, {lo_b0}칸이다. 규칙 C는 SAP 제안과 같은 세트 (i)을 실었다(M1 {ci1}, M0 {ci0}). 보고서 요약의 규칙 C 값은 세트 (ii)다(M1 {cii1}, M0 {cii0}). 규칙 A (iii), (iv)와 규칙 C 세트 (ii)~(iv)의 세트별 값은 슬라이드 14.
    V2 증가 칸에서 규칙 A (i)·(ii)·B는 NCA AUC0-inf GMR의 편향이 1에서 멀어지는 방향이어서(두 모델 x 세 규칙의 {nv2}칸 모두, M1) 보수적이다. 2016 모델 V2 칸의 규칙 A (iii)·(iv)는 편향이 동등 쪽이고 1종 오류가 {aiii16}, {aiv16}로 초과다(M1).
    불편 참조(참 AUC0-inf로 판정)는 M1에서 {ref}다. M0는 체중 층을 무시해 SE가 표본 변동보다 크다(불편 참조의 시험 간 SD / 시험 내 SE: M0 {sd0}, M1 {sd1}). 같은 시험에서 P2의 M1에서 M0를 뺀 차이는 {pc}%p다.
    그림은 M1만 그렸다. M0의 P2·AUC0-inf 구성 그림은 보고서 Figure 5-7(v1.0, M0), 분석 모형별 P2 그림은 Figure 5-9다.
    관련 보고서: 요약 헤드라인, 5.4절(Table 5-8, Table 5-9, Figure 5-7), 5.9절(Table 5-15, Figure 5-9), 6.2절, 7절; FDA 질의 Q7, Q8, Q17; DECISIONS D-048, D-060.
