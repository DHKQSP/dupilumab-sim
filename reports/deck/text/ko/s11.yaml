S11:
  kicker: "논거 ① 신뢰할 수 있는 AUC0-inf를 못 얻는 대상자: 구조적 원인"
  title: "세트 (iv) 탈락은 구조적이다: 잔차를 절반으로 줄여도 {a}에서 {b}로 그대로이고, LLOQ를 낮추면 세트 (i) 신뢰 충족이 오히려 떨어진다"
  head_left: "잔차를 절반으로 줄여도 세트 (iv) 탈락은 그대로다"
  head_right: "분석법 LLOQ가 낮을수록 신뢰 충족이 떨어진다(역설)"
  bullets_left:
    - "2016 모델 비례 잔차를 {s24}에서 {s12}로 줄이면 세트 (iii) 탈락은 {r3a}에서 {r3b}로 줄지만, span {sp4}배 미달 몫이 {spa}에서 {spb}%p로 늘어 세트 (iv)는 그대로다."
    - "span = λz 창 길이 ÷ 반감기. λz 창이 절벽 앞 B0 채혈점에 묶여 span 중앙값({spm})이 기준 {sp4}에 가깝고, span {sp4}배 미달이 {any}다(다른 사유와 중복 포함)."
  bullets_right:
    - "LLOQ를 {lq}에서 {lqm} mg/L로 낮추면 세트 (i) 신뢰 충족이 {d16}%p(2016 모델), {d20}%p(2020 모델) 변한다. 가법 잔차를 LLOQ에 비례시켜도 각각 {s16}%p, {s20}%p다."
    - "아주 낮은 농도의 잡음(가법 잔차 SD {sa} mg/L)까지 정량되어 adjusted R² 미달이 는다(2016 모델 {f0}에서 {f1}로). 세트 (ii)는 2016 모델(잔차 추정값)에서 변화가 없다: {ii16}."
  fig:
    ylab1: "신뢰할 수 있는 AUC0-inf 없음 (%, 2016 모델 구조, Wilson 95% 구간)"
    res:
      k2016: "비례 잔차 {s}% (추정값)"
      resid12: "비례 잔차 {s}% (민감도)"
    iv_note: "span ≥ {v} 조건"
    ylab2: "세트 (i) 신뢰 충족 (%, 높을수록 좋음; 끝 숫자 = 연구 LLOQ 대비 %p)"
    xlab2: "분석법 LLOQ (mg/L, 로그 눈금; 오른쪽일수록 낮음)"
    study: "연구 LLOQ {v} mg/L"
    resid:
      fixed: "잔차 추정값 그대로"
      scaled: "가법 잔차를 LLOQ에 비례"
  notes: |
    시험 모집단(건강인 {wt} kg, 현행 일정 B0), 모델당 {n}명의 개인 수준 결과다.
    잔차 민감도(2016 모델 구조, 비례 잔차 {s24} → {s12}): 탈락은 세트 (i) {r1a} → {r1b}, (ii) {r2a} → {r2b}, (iii) {r3a} → {r3b}, (iv) {r4a} → {r4b}(Wilson 95% 구간 {ci4a} 대 {ci4b}). adjusted R² 중앙값 {ar2a} → {ar2b}. 잔차를 줄인 변형은 2016 모델 구조에만 있고, 세트 (iv) 차이에 대한 대응 비교 신뢰구간은 없다(두 Wilson 구간이 겹치는 것만 확인). 2020 모델(비례 잔차 {s20m})은 구조가 달라 같은 비교가 아니다: 세트 (iii) {m20iii}, (iv) {m20iv}.
    세트 (iv) 탈락 빼기 세트 (iii) 탈락 = 세트 (iii)은 충족하나 span {sp4}배 조건에서 탈락하는 몫: {spa}%p → {spb}%p(파생값, 계산식은 추적표). 잔차가 줄면 adjusted R² 미달로 빠지던 대상자가 span 미달로 옮겨 가므로, 그대로인 것은 세트 (iv)의 전체 탈락이다(span 미달만의 몫은 오히려 는다). 세트 (ii)도 span 조건(반감기 {sp2}배)을 두지만 탈락이 {r2a} → {r2b}로 준다: 잔차와 무관한 것은 span {sp4}배 조건이다. 세트 (iv)의 span 미달은 계층 분류로 {h4}, 다른 사유와 겹침을 포함하면 {any}다(두 모델). 왼쪽 그림의 두 막대 색(진한 파랑, 옅은 파랑)은 두 잔차 수준이며 두 모델이 아니다.
    span 비 = λz 창 길이 ÷ 반감기. B0에서 만들 수 있는 가장 짧은 후반부 세 점 창은 {w3}일이고, λz 창 중앙값 {win}일, 반감기 중앙값 {hl}일, 대상자별 span 비의 중앙값 {spm}이다(두 모델). 중앙값끼리의 비(창 ÷ 반감기)는 span 비의 중앙값과 같지 않다: span 중앙값이 기준 {sp4}에 가까워 대상자의 큰 몫이 기준 아래에 놓인다. 보고서 5.3절은 λz 창이 절벽 앞에 있어 반감기 {sp4}배를 채울 수 없는 구조적 원인으로 설명한다.
    LLOQ 격자 {lqm}~{lqx} mg/L, 모델당 {nli}명, 같은 대상자와 같은 잔차 난수(대응 비교). 세트 (i)(adjusted R² ≥ {r2i}) 신뢰 충족, 잔차 추정값 그대로: 2016 모델 {i16a}(LLOQ {lqm}), {i16b}({lq}), {i16c}({lqx}); 2020 모델 {i20a}, {i20b}, {i20c}. 연구 LLOQ 대비 변화(LLOQ {lqm}, 오른쪽 그림 끝 숫자): 2016 모델 {c16}, 2020 모델 {c20}; 가법 잔차를 LLOQ에 비례시키면 2016 모델 {cs16}, 2020 모델 {cs20}. 두 모델, 두 잔차 변형 모두 LLOQ가 낮을수록 단조롭게 떨어진다.
    기전(2016 모델, 잔차 추정값, LLOQ {lq} → {lqm}): 마지막 정량 시점 중앙값 투여 후 {t0}일 → {t1}일, 마지막 계획 채혈에서 정량되는 대상자 {q0} → {q1}, adjusted R² {r2i} 미달 {f0} → {f1}(2020 모델 {g0} → {g1}). span 비 미달(세트 (ii) 조건)은 {fs0} → {fs1}로 오히려 준다. 보고서 5.10절은 가법 잔차 SD {sa} mg/L 수준의 잡음이 정량되기 때문이라고 설명한다.
    세트 (ii)에서는 역설이 일관되지 않다: 2016 모델 잔차 추정값 {ii16}(구간이 음수와 양수에 걸친다), 2020 모델 {ii20}, 가법 잔차 비례 2016 모델 {iis16}, 2020 모델 {iis20}. span 비 미달 감소가 adjusted R² 미달 증가를 일부 상쇄한다.
    세트 (iii)·(iv)는 LLOQ 격자에서 계산되지 않았다(결과 파일에 세트 (i)·(ii)만 있다). 역설을 세트 (iii)·(iv)로 넓히지 않는다.
    관련 보고서: 3.12절, 5.3절(Figure 5-4), 5.10절(Table 5-17, Figure 5-10), 6.5절.
