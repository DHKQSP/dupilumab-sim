S13:
  kicker: "논거 ① 신뢰할 수 있는 AUC0-inf를 못 얻는 대상자: 처리군에 따라 달라지는 탈락"
  title: "동일 제품이면 arm 간 탈락 차이는 약 {zero}이지만, 제품이 다르면 기전에 따라 비대칭으로 벌어진다(세트 (i) 최대 {mx}%p)"
  bullets:
    - "**동일 제품**: 시험군 - 대조군 {s00i}%p(세트 (i)), {s00iii}%p(세트 (iii)). 95% CI가 모두 {zero}을 포함한다."
    - "**제품이 다르면**(검정이 제 역할을 해야 할 때) 기전에 따라 한 arm이 더 탈락한다: Vmax ×{vmm} {vm}%p, 경계 칸 ka 감소 {ka}%p(세트 (i))."
    - "**방향도 기전이 정한다**: 같은 참 비 {r80}에서 V2 증가는 시험군이 {v2}%p 덜 탈락한다(세트 (iii) {v2iii}%p)."
    - "참 비로는 설명되지 않는다: 로그 참 비에 대한 선형 적합 R² {r2i}(세트 (i)), {r2iii}(세트 (iii))."
    - "**결과**: 규칙 A에서는 비교 대상자가 검정이 찾으려는 제품 차이에 따라 바뀐다."
  fig:
    xlab: "시험군 - 대조군 탈락 비율 (%p, 시험 {n}회 평균과 95% CI)"
    groups:
      s00: " "
      prod: "제품\n시나리오\n(참 비)"
      b080: "경계 칸\n참 비 {r}"
      b125: "경계 칸\n참 비 {r}"
    s00: "동일 제품"
    prod: "{mech} ×{mult} ({r})"
    bnd: "{mech} {dir}"
    dir:
      up: "증가"
      down: "감소"
  notes: |
    시험 모집단(건강인 {wt} kg, 체중 층화 배정, B0) 시험을 시나리오·모델마다 {ntr}회 운용 특성 시드로 다시 만들었다(원래 시험의 arm별 인원과 {nid}행 일치). 시험마다 시험군과 대조군의 기준 미달 비율(arm 합계)의 차이를 구해 평균했고, 막대는 평균의 95% 구간이다. 인원 수에 기반한 결과라 분석 모형(M0, M1)과 무관하다.
    대조군 평균 미달 비율: 세트 (i) {fr_i}, 세트 (iii) {fr_iii}(두 모델).
    제품 시나리오는 시험군 고정효과에 배율을 곱했다(F ×{f97}, ke ×{k110}, ke ×{k120}, Vmax ×{vm125}; 참 AUC0-inf 비 {pr}). 경계 칸은 한 기전을 조정해 참 AUC0-inf 비가 {r80} 또는 {r125}가 되게 한 칸이다(모델당 {nb}칸). 그림의 괄호 값은 두 모델 평균 참 비다.
    시험마다의 흩어짐은 크다: 동일 제품에서도 시험별 차이의 5~95백분위가 {p_s00}%p다(세트 (i)). 요점은 평균 차이가 제품 차이에 따라 체계적으로 생긴다는 것이다.
    주의: 세트 (i)에서 ke 시나리오는 약 {zero}이지만(ke ×{k120} {ke120}%p), 세트 (iii)에서는 ke ×{k110}·×{k120}에서도 시험군이 {ke_iii}%p 덜 탈락하고 95% CI가 {zero}을 포함하지 않는다. 발표할 때 "ke는 차이가 없다"고 하지 않는다.
    선형 적합(모델·세트마다 시나리오 평균 {nsc}개)은 서술용이다. 기울기 95% CI가 2020 모델 세트 (i)와 두 모델의 세트 (iii)에서 {zero}을 포함한다.
    사전 등록: 처리군 의존 탈락(arm 간 차이)은 section6 등록 후 처음 계산했다(DECISIONS.md D-059).
    관련 보고서: 5.3절(Table 5-7, Figure 5-6), 3.13절, 5.4절, 7절.
