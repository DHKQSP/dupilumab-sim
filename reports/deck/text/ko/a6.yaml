A6:
  kicker: "부록 A6 · 재현성"
  title: "새 GitHub 러너에서 재현 워크플로의 항목 {ni}개가 모두 통과했고, 자동 시험은 v1.0.1 패키지 커밋까지(실행 {fx2}~{last}) 모두 성공했다"
  ci_label: "자동 시험 기록 (GitHub Actions tests 워크플로, 실행 번호)"
  fig:
    success: "성공"
    failure: "실패"
    cancelled: "취소"
    xlab: "실행 번호"
    block: "{a}~{b}"
    before: "시험 전 중단 {n}회"
    strict: "건너뜀 규칙"
    setup: "환경 설정"
  bullets:
    - "실행 {fx1}~{lastd}: 성공 {ns}, 취소 {nc}, 실패 {nf}. 엄격 건너뜀 규칙에 걸린 실행 {rf}과 환경 설정에서 멈춘 실행 {rd}는 각각 다음 실행 {fx2}, {fx3}에서 고쳤다."
  reg_label: "등록 시각({yr}년 UTC): 표의 항목과 5절(부록 A5) 모두 첫 결과 전에 등록"
  table:
    head: ["사전 명시·등록 항목", "등록 (UTC, 커밋)", "첫 결과 (UTC, 커밋)"]
  reg_rows:
    oc: "운영 특성 설계 (사전 명시)"
    s1: "사전 등록 1절: 분석 모형 M0·M1·M2"
    s2: "사전 등록 2절: LLOQ 민감도"
    s3: "사전 등록 3절: 표본 수"
    s4: "사전 등록 4절: 기준 세트 (iii)·(iv)"
    s6: "사전 등록 6절: 시험 모집단 분석"
  card_repro: "재현 항목 통과: 새 GitHub 러너에서 재현 워크플로 실행 {run}({os}, R {rv}, renv로 환경 복원). 로컬도 {nl}개 통과, {nid}개 모두 로컬 값과 유효숫자 {sig}자리까지 같음. 이 실행의 자동 시험 케이스 {nt}개: 실패 {nft}개, 건너뜀 {nsk}개"
  count: "{n}개"
  card_trace: "추적되는 인쇄 수치: M&S 보고서 {ms}, FDA 질의응답 {fq}, SAP 문안 {sap}. 수치마다 출처 파일·행 조건·열이 남는다. 이 덱(문서 ID deck_ko)의 수치도 같은 추적표에 들어간다."
  card_trace_na: "추적표 규모: 문서별 수 파일(trace_summary.csv)이 없어 이 빌드에는 싣지 않았다. 이 덱(문서 ID deck_ko)의 수치도 같은 추적표에 들어간다."
  na: "미산출"
  notes_trace: "추적표 규모(trace_summary.csv, 덱 행을 합치기 전): 보고서는 인쇄 수치 {ms}개, 표 {tb_ms}개, 그림 {fg_ms}개, 출처 파일 {sf_ms}개다."
  notes_trace_na: "추적표 규모는 미산출이다: 문서별 수를 담는 regulatory/tables/trace_summary.csv(패키지 생성 스크립트가 덱 행을 합치기 전에 쓰는 파일)가 이 빌드의 작업 트리에 없었다. 전체 추적표를 직접 인용하면 덱을 만든 뒤 그 파일이 다시 쓰여 덱이 낡은 것으로 판정되므로 인용하지 않았다."
  notes: |
    자동 시험(tests 워크플로)은 코드·config·의존성이 바뀌는 커밋마다 빠른 범위의 시험을 돌린다. 실행 {r1}({n1}회, 그림에서는 한 덩어리)의 실패는 모두 시험 전 환경 설정 단계였고(renv.lock 없음 {a}회, JUnit 보고기에 필요한 xml2 없음 {b}회), 시험 실패·시간 초과·결과 파일 누락은 없었다(ci_failure_summary.csv). 실행 {fx1}부터는 시험이 돌았다.
    실행 {rf}의 실패 원인(결정 기록 D-058): 기준 세트 (i)·(ii) 동일성 시험이 저장소에 없는(.gitignore) 대상자 수준 NCA 파일을 읽어 CI 환경에서 건너뛰었고, 엄격 건너뜀 규칙은 이를 실패로 센다. 경계값 합성 시험과 소규모 모의 시험을 빠른 범위에 더하고 저장 파일 시험은 전체 범위로 옮겨 실행 {fx2}에서 고쳤다. 실행 {fx2}~{last}에서 모두 성공했으며, 이 범위의 마지막 실행({last})이 v1.0.1 패키지 커밋의 실행이다(ci_runs_v101.csv).
    그 뒤 결과보고 덱 작업의 기록(ci_runs_deck.csv): 실행 {rd}에서는 덱의 표 패키지(flextable)가 쓰는 gdtools를 소스로 빌드하다 cairo 헤더를 찾지 못해 renv 복원 단계에서 멈췄고(시험 전 환경 설정 실패), 시스템 의존성에 cairo·freetype 헤더를 더해 실행 {fx3}에서 고쳤다. 기록의 마지막 실행({lastd})도 성공했다. 기록 파일은 자기 커밋의 실행을 담을 수 없으므로 그 뒤의 실행은 이 슬라이드에 없다.
    취소 {nc}회는 같은 브랜치에 새 push가 와서 동시 실행 규칙으로 대체된 실행이다. 실행 기록은 GitHub Actions API에서 읽어 ci_runs_after_fix.csv, ci_runs_v101.csv, ci_runs_deck.csv에 저장했다.
    재현 워크플로 실행 {run}: 새 GitHub 러너({os}, R {rv}, rxode2 {rx})에서 renv로 환경을 복원한 뒤, 허용 오차를 미리 정한 항목(config/repro_check.yaml)을 다시 계산했다. 작업 시간 {js}초. 로컬 실행과 새 러너 모두 통과했고 값은 유효숫자 {sig}자리까지 같다. 같은 실행의 자동 시험은 시험 케이스 {nt}개 중 실패 {nft}개, 건너뜀 {nsk}개였다.
    {tr} 이 덱의 수치는 패키지 생성 스크립트가 같은 추적표에 문서 deck_ko, 슬라이드별 절로 넣으며, 덱을 만든 뒤 출처 파일이 바뀌었으면 멈춘다.
    표의 날짜는 모두 {yr}년(UTC)이고, 운영 특성 설계는 config/oc_design.yaml이다. 사전 명시 등록부 {nreg}건: 사전 명시 {nps}, 사전 등록 {npr}, 사후 {nph}, 그 밖의 변경·결정 {noth}. 사후 항목도 모두 표시해 보고한다. 운영 특성 설계 파일은 사전 명시 커밋 뒤 바뀌지 않았다. 표의 모든 항목은 첫 결과 전에 등록됐다. 사전 등록 5절(부록 A5의 체중 견고성 분석)은 표의 6행 한도 때문에 표에서 뺐으며, 4절과 같은 커밋에 등록했고(등록 {s5a}, 첫 결과 {s5b}) 역시 첫 결과 전이다.
    관련 보고서: 4.1절, 4.4절(Table 4-2), 부록 C(Table C-1), 부록 D(Table D-1), 부록 E(Table E-1, Table E-2), 부록 G; FDA 질의응답 Q13, Q14.
