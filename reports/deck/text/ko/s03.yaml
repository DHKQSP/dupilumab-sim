S03:
  kicker: "배경 규제 기대: 유럽 의약품청(EMA)과 미국 식품의약국(FDA)의 지침"
  title: "규제 지침은 단회 투여 PK 시험의 1차 평가변수로 AUC0-inf를 명시하지만, 두필루맙은 말단 절벽 때문에 이를 신뢰성 있게 구하기 어렵다"
  cards:
    ema:
      - "__EMA 2012__  원문 대조 전"
      - "단클론항체 바이오시밀러 가이드라인"
      - "단회 투여 시험의 1차 평가변수는 **AUC0-inf**이고, 피하 투여이면 **Cmax도 공동 1차 평가변수**다."
    fda16:
      - "__FDA 2016__  원문 대조 전"
      - "바이오시밀러 임상약리 자료 가이던스"
      - "단회 투여 PK 유사성 시험의 1차 평가변수는 **AUC0-inf와 Cmax**다."
      - "동등성 기준: 기하평균비(GMR)의 {ci}% 신뢰구간(CI)이 {lim}% 안"
    fda25:
      - "__FDA 2025 초안 가이던스__"
      - "비교 유효성 시험의 필요성 평가"
      - "분석적 유사성이 높고 PK 유사성 시험이 가능하며 임상적으로 적절하면 비교 유효성 시험이 필요하지 않을 수 있다."
      - "→ 총체적 근거에서 **PK 유사성 시험의 비중이 커진다.**"
  problem:
    label: "그러나 두필루맙에서는"
    bullets:
      - "정량한계 근처에서 표적 매개 소실이 빨라져 농도가 급락한다(말단 절벽). 절벽 앞에서 추정한 λz는 참 말단상을 나타내지 않는다."
      - "원개발사 모집단 PK 분석은 의미 있는 말단 반감기를 계산할 수 없다고 했다(Kovalenko 2020)."
      - "자동주사기·프리필드 시린지 비교 시험도 같은 이유로 반감기와 AUC0-inf를 구하지 않았다(Cohen 2022)."
      - "그래서 AUC0-last(FDA 용어 AUC0-t)와 Cmax를 공동 1차 평가변수로 쓰는 근거를 모의로 정량화한다."
  notes: |
    '원문 대조 전' 표시: EMA 2012와 FDA 2016 카드의 문구는 기관 누리집 접근이 막혀 원문과 직접 대조하지 못했고 검색 발췌로 확인했다. 제출 전에 두 문구를 현행판 원문과 대조한다.
    FDA 2016 가이던스와 FDA 2025 초안 가이던스는 M&S 보고서 1.2절과 8절 참고문헌에 있는 인용이다. 보고서는 FDA 2016 가이던스가 AUC0-inf와 Cmax를 1차 PK 변수로 명시한다고 적었다. FDA 2016 문구는 fda.gov 접근이 막혀 검색 결과로 확인했다(DECISIONS D-052). 보고서는 제출 전에 참고문헌 문구를 현행판과 다시 대조하라고 적었다. 프로젝트 기록의 FDA 2016 문구에는 투여 경로 조건이 없다.
    EMA 2012 단클론항체 바이오시밀러 가이드라인(피하 투여이면 Cmax도 공동 1차 평가변수라는 문구 포함)은 M&S 보고서에 없는 인용이다. ema.europa.eu 접근이 막혀 검색 발췌로만 확인했다.
    비교 유효성 시험 면제 흐름은 FDA 2025 초안 가이던스(최종본 아님, FDA 단독)만 근거로 했다. 보고서 표현은 총체적 근거에서 PK 유사성 시험의 비중이 커진다는 것이며, PK 시험이 유일한 확증 임상이 된다고 쓰지 않았다.
    동등성 기준 {lim}%, {ci}% 신뢰구간은 시험 설계 config와 같다. 말단 절벽(정량한계 근처에서 표적 매개 소실로 농도가 급락하는 구간)은 슬라이드 5, 방법은 보고서 1.3절과 3절. Cohen 2022는 두 투여 기기(자동주사기와 프리필드 시린지)를 비교한 시험이다.
    관련 보고서: 요약(배경), 1.1절, 1.2절, 8절.
