S06:
  kicker: "방법 · 개요"
  title: "계획된 시험을 그대로 모의했다: 공개 모델 두 개, 현행 채혈(B0), Phoenix 규칙 NCA, arm당 {n_arm}명 동등성 판정"
  steps:
    - head: "① 모델"
      body:
        - "**2016 모델**(주분석)"
        - "**2020 모델**(민감도): 흡수 전 이동 구획 {ntr}개"
        - "선형 + 표적 매개 소실, 재추정 없음"
    - head: "② 대상자·채혈"
      body:
        - "건강인 {wt} kg"
        - "체중 {split} kg 기준 층화, 층 안 1:1 배정"
        - "현행 일정(B0): 투여 후 {nb0}회, Day {last}까지"
    - head: "③ 비구획 분석"
      body:
        - "비구획 분석(NCA): Phoenix WinNonlin 규칙 재현"
        - "λz: Cmax 뒤 {minpts}점 이상, adjusted R² 최대"
        - "AUC0-inf = AUC0-last + Clast/λz"
    - head: "④ 가상 시험"
      body:
        - "arm당 {n_arm}명"
        - "{ci}% 신뢰구간(CI)이 {lim}% 안 (두 단측 검정, TOST)"
        - "**M1**(체중 층 포함) 주분석, M0 병기"
    - head: "⑤ 경계 1종 오류"
      body:
        - "참 AUC0-inf 비를 {b}에 맞춘 경계 {ncell}칸"
        - "칸당 {reps}회, 결과 전 사전 등록"
        - "{next}칸만 {ext}회로 연장(사후)"
  table:
    head: ["NCA 엔진 검증 자료", "프로파일", "λz 창 일치", "최대 상대 차이", "판정"]
    rows:
      theoph: "Theoph"
      indometh: "Indometh (혈관외 규칙)"
      dupi: "두필루맙 모의 (두 모델)"
    pass: "통과 ({k}쌍)"
  prereg: "**결과 전 사전 등록.** 경계 1종 오류 설계(기전, 목표 비, 반복 수, 구성): 커밋 {c1}. v1.0.1 분석 모형(M0, M1, M2)과 연장 규칙: 커밋 {c2}."
  notes: |
    모델: 두 모델 모두 두 구획 모델이며 선형 소실과 Michaelis-Menten(표적 매개) 소실이 병렬이고 Km {km} mg/L로 고정되어 있다. 2020 모델은 흡수 전 이동 구획이 있다. 비례 잔차는 2016 모델 {s16}, 2020 모델 {s20}. 어떤 파라미터도 검증 자료에 맞춰 다시 추정하지 않았다.
    가상 대상자: 체중은 정규분포(평균 {wm} kg, SD {wsd} kg)를 {wt} kg로 절단했고 남성 비율 {sex}다(체중 분포, 성비, 층 경계 {split} kg은 확정 전 가정). 개인 수준 분석은 모델당 {nind}명, 참값(추정 대상)은 공통 가상 대상자 {ntruth}명으로 계산했다.
    NCA: 첫 정량값 이전 정량한계 미만 값은 영, 정량값 사이는 결측, 마지막 정량값 뒤는 제외. λz 창은 adjusted R²가 가장 큰 창이고 차이가 {tie} 이내면 점이 많은 창을 고른다. AUC0-inf 신뢰 기준 세트는 Phoenix 기본값이 아니라 통계분석계획 관행이다.
    엔진 검증: NonCompart, PKNCA와 세 자료에서 비교한 {ncmp_all}건 중 {ncmp}건이 통과했다. λz 창은 {lz} 일치했고 파라미터의 최대 상대 차이는 {mx}이다.
    가상 시험: arm당 무작위배정 {n_rand}명 중 평가 가능 {n_arm}명(탈락 자체는 모의하지 않음). M0는 로그 척도 pooled t(자유도 {df0}), M1은 투여군 + 무작위배정 체중 층 ANOVA(ICH E9 5.7절), M2는 투여군 + log 체중 ANCOVA(민감도)다. 구성은 그 안의 평가변수가 모두 통과해야 통과다.
    경계 1종 오류: 시험약 기전(F, ka, ke, Vmax, Km, V2)을 양방향으로 바꿔 참 AUC0-inf 비가 경계에 닿는 배율을 역산했다. 도달 가능한 경계는 모델당 {npm}칸, 합 {ncell}칸이다(Km은 경계에 닿지 않음). 칸당 {reps}회는 사전 등록(커밋 {c1}) 값이다.
    연장: 사전 등록된 {reps}회에서 AUC0-last + Cmax의 Wilson 95% 구간이 {thr}%를 포함한 칸(2020 모델 V2 증가; M0 {m0})만 {ext}회로 연장했다. v1.0에서는 결과를 본 뒤 추가한 사후 규칙이고, v1.0.1은 같은 규칙을 분석 모형별로 적용하도록 사전 등록했다(커밋 {c2}).
    관련 보고서: 3.1절~3.7절, 3.12절, 4.1절, 부록 D.
