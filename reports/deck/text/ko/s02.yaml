S02:
  kicker: "핵심 결론"
  title: "AUC0-last와 Cmax를 공동 1차, AUC0-inf를 2차 평가변수로 제안한다"
  proposal_label: "제안"
  proposal:
    - "공동 1차 평가변수: **AUC0-last + Cmax**"
    - "2차: AUC0-inf(말단 소실 속도상수 λz 기준 사전 규정)"
    - "주분석 모형: M1(체중 층 포함, 의뢰자 결정 전)"
    - "함께 제시: M0(체중 층 미포함, 합동 t 검정)"
  summary:
    - "**한 문장 요약**  시험 모집단(건강인 {wt} kg, 체중 층화 배정)에서 비구획 분석의 AUC0-inf는 상당수 대상자에서 신뢰할 수 없고 처리 규칙에 따라 판정이 달라져 1차 평가변수로 부적합하며, AUC0-last가 총노출을 거의 다 포착해 그 역할을 대신한다."
  args:
    a1:
      label: "λz 기준 미달 비율, 세트 (iii), 두 모델"
      claim: "① 대상자 상당수에서 신뢰할 수 있는 AUC0-inf를 얻지 못한다"
      detail: "세트 (iii)은 공개 통계분석계획(SAP)의 관행 기준이다. 가장 관대한 세트 (i)에서도 기준 미달로 AUC0-inf 분석에서 빠지는 대상자(탈락자)의 참 AUC0-inf는 유지자의 {gmr2}배다."
    a2:
      value: "{a} / {ncell}칸"
      suffix: "AUC0-inf + Cmax"
      label: "1종 오류 점추정 {nom} 초과, 규칙 A (i), M1"
      claim: "② AUC0-inf 판정이 처리 규칙에 좌우된다"
      detail: "경계 칸: 참 AUC0-inf 비를 동등성 한계에 둔 모델 × 기전 × 방향. 세트 (i) 탈락자를 빼면(규칙 A) Wilson 초과 {alo}칸, 탈락자에 AUC0-last를 대입하면(규칙 C) 점추정 {c}칸(Wilson 명목)이다."
    a3:
      label: "AUC0-last 창 포착률 중앙값, 두 모델"
      claim: "③ AUC0-last가 AUC0-inf를 사실상 대신한다"
      detail:
        - "창 포착률은 두 모델 모든 대상자에서 {cmin} 이상이다."
        - "AUC0-last + Cmax(M1)의 Wilson 분류: 보수적 {n_cons}칸, 초과 {n_exc}칸(2020 모델)."
  gloss: "창 포착률: 참 AUC0-tlast/참 AUC0-inf · Wilson 분류: 보수적 = 95% 구간 상한 < {nom}, 명목 = 구간이 {nom} 포함, 초과 = 하한 > {nom}"
  notes: |
    공동 1차·2차 평가변수 제안은 M&S 보고서 요약(결론)과 7절 결론의 의뢰자 제안과 같다. 주분석 모형 M1(체중 층 포함 분산분석)은 이 슬라이드 묶음의 기준이며, 보고서와 통계분석계획 제안 문안에서 주분석 모형(M0 또는 M1), 분석법 정량한계, 목표 검정력은 아직 의뢰자 결정 사항이다. M0는 체중 층을 넣지 않은 합동 t 검정이고 값을 함께 적는다.
    용어: 탈락자는 λz 신뢰성 기준에 미달해 AUC0-inf 분석에서 빠지는 대상자이고, 나머지는 유지자다(시험 중도 탈락과 다르다). 경계 칸은 참 AUC0-inf 비를 동등성 한계에 맞춘 모델 × 기전 × 방향 시나리오로 경계 {ncell}칸이다. 경계 1종 오류는 그 칸에서 동등으로 판정할 확률이다. 칸 수는 두 기준으로 센다: 점추정 {nom} 초과 칸, 그리고 Wilson 95% 구간 분류(보수적: Wilson 상한 < {nom}, 명목: Wilson 구간이 {nom} 포함, 초과: Wilson 하한 > {nom}).
    ① 시험 모집단(건강인, 체중 층화 배정, B0, {dose} mg, 모델당 {n_ind}명)에서 가장 관대한 세트 (i)(adjusted R² ≥ {r2i})에서도 {i}, 세트 (iii)(adjusted R² ≥ {r2iii}, 공개 통계분석계획의 관행)에서 {iii}가 신뢰할 수 있는 AUC0-inf를 얻지 못한다(두 모델 범위). 세트 (i)은 관행 범위의 하한이다. 세트 (i) 탈락자의 참 AUC0-inf는 유지자 대비 기하평균비 {gmr}다(두 모델, 슬라이드 12). 탈락은 무작위가 아니다.
    ② 규칙 A는 탈락자를 분석에서 빼고, 규칙 B는 λz가 산출된 모든 대상자를 쓰고, 규칙 C는 탈락자에 AUC0-last를 대입한다. AUC0-inf + Cmax, M1, 경계 {ncell}칸에서 점추정이 {nom}를 넘는 칸: 규칙 A (i) {a}칸(최대 {a_max}), 규칙 A (ii) {aii}칸, 규칙 B {b}칸, 규칙 C (i) {c}칸. 같은 칸 중 Wilson 하한까지 {nom}를 넘는 칸(초과)은 규칙 A (i) {alo}칸, 규칙 C (i) {clo}칸이다. 규칙 C (i)의 점추정 초과 칸은 {c_ci}로 Wilson 명목이다. 판정 불안정(규칙 A, B, C와 기준 세트의 모든 조합 사이에서 판정이 바뀌는 시험의 비율, 경계 칸별 값의 중앙값): M1 {inst}, 최대 {inst_max}; M0 {inst0}, 최대 {inst0_max}. M1 불안정 값은 보고서에 인쇄되지 않았고 같은 결과 파일에서 읽었다.
    ③ 창 포착률(채혈 구간 커버리지 = 참 AUC0-tlast / 참 AUC0-inf; tlast는 관측 마지막 정량 시점) 중앙값 {cov}(두 모델), 최소 {cmin}(두 모델 중 작은 값). AUC0-last + Cmax(M1)는 Wilson 분류로 보수적 {n_cons}칸, 초과 {n_exc}칸이다. 초과 칸은 2020 모델(민감도) 말초 분포용적(V2) 증가(참 AUC0-inf 비 {tgt})로 {p2ci}, 시험 {ntr}회다(슬라이드 19). M0에서는 보수적 {m0c}칸, 명목 {m0n}칸이고 같은 칸이 {m0max}다. 모든 칸에서 통제된다고 쓰지 않는다.
    관련 보고서: 요약(Synopsis), 5.2절, 5.3절, 5.4절, 5.9절, 6.1절, 6.3절, 7절.
