S02:
  kicker: "핵심 결론"
  title: "AUC0-last와 Cmax를 공동 1차 평가변수로, AUC0-inf는 이차 평가변수로 제안한다"
  proposal:
    - "**제안**  공동 1차 평가변수: **AUC0-last + Cmax**"
    - "이차 평가변수: AUC0-inf (말기 소실 속도상수 λz의 신뢰성 기준을 사전 규정해 보고)"
    - "분석 모형: M1(체중 층 포함)을 주분석으로, M0 병기"
  summary:
    - "**한 문장 요약**  시험 모집단(건강인 {wt} kg, 체중 층화 배정)에서 비구획 분석의 AUC0-inf는 상당수 대상자에서 신뢰할 수 없고 처리 규칙에 따라 판정이 달라져 1차 평가변수로 부적합하며, AUC0-last가 총노출을 거의 다 포착해 그 역할을 대신한다."
  args:
    a1:
      label: "세트 (iii) 기준 미달, 두 모델"
      claim: "① 상당수가 신뢰할 수 있는 AUC0-inf를 얻지 못한다"
      detail: "공개 통계분석계획(SAP) 관행 기준(adjusted R² ≥ {r2iii})의 미달 비율이다. 가장 관대한 세트 (i)에서도 {i}이고, 탈락자는 참 AUC0-inf가 낮아 무작위 탈락이 아니다."
    a2:
      value: "{a} / {ncell}칸"
      label: "규칙 A (i)에서 {nom} 초과, M1"
      claim: "② 판정이 처리 규칙에 좌우되어 1차 평가변수로 부적합하다"
      detail: "경계 1종 오류(참 AUC0-inf 비가 동등성 한계일 때 동등 판정 확률)가 {nom}를 넘는 칸이 미달자를 빼면(규칙 A) {a}칸, AUC0-last로 대입하면(규칙 C) {c}\u2060칸이다. 규칙·기준에 따라 판정이 바뀌는 시험은 중앙값 {inst}다."
    a3:
      label: "AUC0-last 창 포착률 중앙값"
      claim: "③ AUC0-last가 AUC0-inf를 사실상 대신한다"
      detail: "창 포착률(참 AUC0-tlast / 참 AUC0-inf)은 모든 대상자에서 {cmin} 이상이다. AUC0-last + Cmax의 경계 1종 오류는 {n_all}칸 중 {n_cons}칸에서 보수적이고 {n_exc}\u2060칸이 {p2max}다."
  notes: |
    제안은 M&S 보고서 요약(결론)과 7절 결론의 의뢰자 제안과 같다. 주분석 모형은 이 슬라이드 묶음에서 M1(체중 층 포함 분산분석)으로 두고 M0(합동 t 검정)을 병기한다. 보고서에서 주분석 모형, 분석법 정량한계, 목표 검정력은 아직 의뢰자 결정 사항이다.
    ① 시험 모집단(건강인, 체중 층화 배정, B0, {dose} mg, 모델당 {n_ind}명)에서 세트 (i) {i}, 세트 (iii) {iii}가 신뢰할 수 있는 AUC0-inf를 얻지 못한다(두 모델 범위). 세트 (i)은 관행 범위의 하한이다. 세트 (i) 탈락자의 참 AUC0-inf는 유지자 대비 기하평균비 {gmr}다(슬라이드 12).
    ② 규칙 A는 기준 미달자를 분석에서 빼고, 규칙 B는 λz가 산출된 모든 대상자를 쓰고, 규칙 C는 미달자에 AUC0-last를 대입한다. AUC0-inf + Cmax, M1, 경계 {ncell}칸: 규칙 A (i) {a}칸(최대 {a_max}), 규칙 A (ii) {aii}칸, 규칙 B {b}칸, 규칙 C (i) {c}칸이 점추정 {nom}를 넘는다. 판정 불안정(규칙 A, B, C와 기준 세트의 모든 조합 사이에서 판정이 다른 시험의 비율): M1 중앙값 {inst}, 최대 {inst_max}; M0 중앙값 {inst0}, 최대 {inst0_max}. M1 불안정 값은 보고서에 인쇄되지 않았고 같은 결과 파일에서 읽었다.
    ③ 창 포착률 중앙값 {cov}, 최소 {cmin}. AUC0-last + Cmax(M1)는 보수적 {n_cons}칸, 초과 {n_exc}칸이다. 초과 칸은 2020 모델 말초 분포용적 증가(참 AUC0-inf 비 {tgt})로 {p2ci}, 시험 {ntr}회다(슬라이드 19). M0에서는 보수적 {m0c}칸, 명목 {m0n}칸이고 같은 칸이 {m0max}다. 모든 칸에서 통제된다고 쓰지 않는다.
    관련 보고서: 요약(Synopsis), 5.2절, 5.3절, 5.4절, 5.9절, 6.1절, 6.3절, 7절.
