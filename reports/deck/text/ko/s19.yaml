S19:
  kicker: "논거 ③ 투명성 · 제안 평가변수의 경계 1종 오류가 {nom}를 넘는 한 칸"
  title: "M1에서 AUC0-last + Cmax가 {nom}를 넘는 한 칸(2020 모델 V2 ×{m20})의 초과분은 AUC0-last가 이 칸에서만 동등 쪽으로 {bias} 치우친 결과다"
  cls:
    conservative: "보수적"
    nominal: "명목"
    exceeding: "초과"
  fig:
    xlab: "경계 1종 오류 (%, Wilson 95% 구간). 점선: 명목 {nom}"
    cfg:
      P2: "AUC0-last + Cmax (제안), {n}회"
      P2_10k: "AUC0-last + Cmax, 사전 명시 {n}회"
      AUClast_only: "AUC0-last 단독"
      AUCinf_true_only: "참 AUC0-inf 단독 (불편 참조)"
      G2_A_i: "AUC0-inf + Cmax, 규칙 A (i)"
      G2_A_ii: "AUC0-inf + Cmax, 규칙 A (ii)"
      G2_A_iii: "AUC0-inf + Cmax, 규칙 A (iii)"
      G2_A_iv: "AUC0-inf + Cmax, 규칙 A (iv)"
      G2_B: "AUC0-inf + Cmax, 규칙 B"
      G2_C_i: "AUC0-inf + Cmax, 규칙 C (i)"
      G2_C_ii: "AUC0-inf + Cmax, 규칙 C (ii)"
      G2_C_iii: "AUC0-inf + Cmax, 규칙 C (iii)"
      G2_C_iv: "AUC0-inf + Cmax, 규칙 C (iv)"
  bullets:
    - "**같은 칸 AUC0-inf + Cmax**(M1, 그림 아래): NCA GMR이 1에서 먼 쪽으로 치우친 규칙 A (i)~(iv)·B는 모두 보수적이다. 규칙 C는 동등 쪽(1 방향)으로 치우쳐 (i)만 명목, (ii)~(iv)는 초과다."
    - "**경계 {n}칸 전체**(M1): AUC0-last + Cmax는 이 칸만 {nom}를 넘는다. 점추정 {nom} 초과 칸은 규칙 A (i) {nai}칸, A (ii) {naii}칸, B {nbB}칸이고, 그중 초과(Wilson 하한 > {nom})는 각각 {wai}칸, {waii}칸, {wbB}칸이다."
  ext:
    - "**확대 경위** 사전 명시 {n10}회에서 M1은 이미 {m1k}로 초과였고, M0는 Wilson 95% 구간({m0ci})이 {nom}를 포함해 확대가 정해졌다. 확대 규칙대로 세 분석 모형을 모두 {n20}회로 늘렸고, 이 규칙은 결과를 본 뒤 추가한 사후 규칙이라 {n10}회 값도 함께 싣는다."
  mech:
    - "**기전** 시험약의 말초 분포용적 V2만 ×{m20}(2020 모델). 같은 참 AUC0-inf 비 {tr}을 만드는 2016 모델 칸(V2 ×{m16})의 AUC0-last + Cmax는 M1에서 {p16}로 보수적이다."
  table:
    head: ["같은 시험 안의 분해 (%p)", "M1", "M0"]
    rows:
      ref: "불편 참조(참 AUC0-inf 단독)와 {nom}의 차"
      last: "AUC0-last 효과(단독과 참조의 차; M1 GMR 편향 {bias}, 동등 쪽)"
      cmax: "Cmax 효과(Cmax를 더한 변화)"
      p2: "합계: AUC0-last + Cmax와 {nom}의 차"
  notes: |
    경계 칸은 시험약의 기전 하나를 한 방향으로 바꿔 참 AUC0-inf 비가 동등 한계에 닿게 한 칸이다(모델당 {npm}칸, 합 {n}칸). 이 칸은 2020 모델(민감도 모델)에서 시험약의 말초 분포용적만 ×{m20} 늘린 칸이다(구획 간 청소율 고정, 흡수·소실 불변). 참 AUC0-inf 비 {auc}, 참 Cmax 비 {cmr}. 같은 참 비를 2016 모델(주 모델)에서 만들려면 ×{m16}이 필요하고 그 칸은 M1에서 {p16}(보수적)이다.
    AUC0-last + Cmax, 시험 {n20}회: M0 {p0}({c0}), M1 {p1}({c1}), M2 {p2m}({c2}). 사전 명시 설계 {n10}회: M0 {k0}({ck0}), M1 {k1}({ck1}), M2 {k2}({ck2}). 분류는 Wilson 95% 구간 기준이다: 보수적(Wilson 상한 < {nom}), 명목(Wilson 구간이 {nom} 포함), 초과(Wilson 하한 > {nom}). M1에서 이 칸을 뺀 나머지 칸은 모두 보수적이다.
    확대 규칙(결정 기록 D-048의 사후 확대 규칙을 사전 등록 prereg section1에서 분석 모형마다 적용): 사전 명시 설계 {n10}회의 Wilson 구간이 {nom}를 포함하면 M0 또는 M1 어느 쪽이든 그 칸을 {n20}회로 늘리고 세 분석 모형을 모두 {n20}회로 보고하며 {n10}회 값을 함께 적는다. 이 칸은 M0 구간이 {nom}를 포함해 확대되었고, M1은 하한이 이미 {nom} 위여서 스스로 확대 조건을 만들지 않았다. 적응적 확대(D-048)는 사전 명시 설계(운용 특성 설계, 커밋 779e068) 뒤, 결과를 본 뒤에 정한 사후 항목이어서(보고서 3.7절, 부록 D; 사전 명시 등록부 상태 post hoc (data-dependent)) 두 값을 모두 보고한다. 용어: 운용 특성 설계는 사전 명시, prereg 절은 사전 등록, 확대는 사후다.
    원인(같은 시험 안의 정확한 분해): M1에서 AUC0-last GMR 편향 {b1}(동등 쪽, 곧 1 방향)이 불편 참조 {r1}를 AUC0-last 단독 {l1}로 올리고, Cmax 불통과가 조금 낮춘다. M0 편향은 {b0}로 거의 같다. AUC0-last GMR이 동등 쪽으로 치우친 칸은 경계 {n}칸 중 이 칸뿐이며 세 분석 모형 모두 같다. M1이 M0보다 높은 것은 새 편향이 아니라 표준오차 보정 때문이다: 불편 참조가 M0 {r0}에서 M1 {r1}로 오르고, 불편 참조의 시험 간 SD / 시험 내 SE가 M0 {s0}, M1 {s1}이다. 분해 표는 {n20}회 통과율의 차이(%p)이며, 셋째 자리까지 적어야 M0에서도 행의 합이 맞는다.
    같은 칸의 AUC0-inf + Cmax(M1 / M0): 규칙 A (i) {ai1} / {ai0}, A (ii) {aii1} / {aii0}, A (iii) {aiii1} / {aiii0}, A (iv) {aiv1} / {aiv0}, 규칙 B {bb1} / {bb0}, 규칙 C (i) {ci1} / {ci0}, C (ii) {cii1} / {cii0}, C (iii) {ciii1} / {ciii0}, C (iv) {civ1} / {civ0}. M1에서 규칙 A (i)~(iv)와 B는 모두 보수적, 규칙 C (i)은 명목, C (ii)~(iv)는 초과다. 이 칸의 NCA AUC0-inf GMR 편향(M1, criteria/criteria_bias.csv)은 규칙 A (i) {bai}, (ii) {baii}, (iii) {baiii}, (iv) {baiv}, 규칙 B {bb}로 모두 1에서 먼 쪽(보수적 쪽)이고, 규칙 C는 (i) {bci}, (ii) {bcii}, (iii) {bciii}, (iv) {bciv}로 모두 동등 쪽(1 방향)이다. 그림의 AUC0-inf + Cmax 묶음은 세트 (i)~(iv)가 모두 있는 criteria/criteria_g2_type1.csv에서 그렸다(type1_models.csv에는 세트 (i)·(ii)만 있다).
    경계 {n}칸 전체(M1), 점추정 {nom} 초과 칸(괄호: Wilson 하한 > {nom}인 초과 칸): 규칙 A (i) {nai}칸({wai}칸), A (ii) {naii}칸({waii}칸), B {nbB}칸({wbB}칸), 통계분석계획 제안의 규칙 C (i) {nci}칸({wci}칸; 이 칸, {ci1}, 명목). 보고서 요약은 규칙 C를 세트 (ii)로 인용한다: C (ii) {ncii}칸(이 칸, {cii1}). {n}칸 전체로는 AUC0-inf 구성이 더 많은 칸에서 {nom}를 넘는다.
    주의: M1의 불편 참조(참 AUC0-inf 단독)는 점추정으로 경계 {n}칸 중 {kpt}칸에서 {nom}를 넘고, 그중 초과(Wilson 하한 > {nom})는 흡수 속도 감소 칸 {kaw}칸(2016 모델 {ka16}, 2020 모델 {ka20})이다. 그 칸에서는 Cmax가 모든 시험에서 불통과해 AUC0-last + Cmax가 {kap2}다.
    결과 전 등록한 기대(보고서 Table 5-16): '{exp_c}', 결과와 일치 여부 {exp_ok}.
    개연성 관련 사실(보고서 6.2절): 바이오시밀러 후보는 참조 면역글로불린 G4(IgG4) 항체와 아미노산 서열이 같다. 이 칸은 흡수와 소실은 그대로 두고 말초 분포용적만 ×{m20}(2020 모델) 또는 ×{m16}(2016 모델)로 바꾼 가정이다. 해석은 하지 않고 사실만 적는다.
    관련 보고서: 요약(Synopsis), 3.7절, 5.4절, 5.9절(Table 5-15, Table 5-16, Figure 5-9), 6.2절, 6.3절, 부록 D; 예상 질의 Q7; DECISIONS D-048.
