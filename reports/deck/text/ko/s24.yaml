S24:
  kicker: "제안의 실행 · 예상 질의와 답 (상위 다섯 문항)"
  title: "예상 질의 상위 다섯 문항에 모의 결과와 문헌으로 답한다: 경계 1종 오류가 {nom}를 넘는 {e1}칸은 SAP에 공개한다"
  qa:
    - id: "Q1"
      q: "FDA 2016 가이던스는 AUC0-inf를 요구한다. 왜 AUC0-last인가?"
      a: "참 꼬리는 작고(참 외삽 중앙값 {ext}, 2016 모델) NCA AUC0-inf는 세트 (i)로도 {fi}가 신뢰 기준 미달이다. AUC0-inf(규칙 A (i)) + Cmax는 {ncell}칸 중 {ga}칸이 {nom}를 넘는다(M1). 원개발사 문헌도 말단 반감기를 계산하지 않았다(Kovalenko 2020, Cohen 2022)."
    - id: "Q7"
      q: "경계 1종 오류는? 왜 한 칸이 {nom}를 넘나?"
      a: "AUC0-last + Cmax(M1): {ncell}칸 중 보수적 {c1}칸, 초과 {e1}칸({r1}). 초과 칸은 2020 모델 말초 분포용적 ×{mult} 칸으로 {p2ci}이며, AUC0-last GMR이 1 쪽으로 {bias} 치우친 결과다. M0에서는 {m0}(명목)."
    - id: "Q19 · Q11"
      q: "adjusted R² ≥ {r2i}은 Phoenix 기준인가? AUC0-inf는 어떻게 보고하나?"
      a: "아니다. Phoenix의 λz 기준은 사용자가 넣는 선택 항목이고 미달은 표시만 한다. {r2i}(미달 {fi})은 SAP 관행의 하한, {r2iii}(미달 {fiii})은 공개 SAP에 흔하다. 세트 (i)을 정의로 두고 {r2iii} 충족 인원을 병기해 이차 평가변수로만 보고한다."
    - id: "Q4 · Q3"
      q: "말단 채혈을 늘리거나 Day {last} 뒤로 연장하면?"
      a: "절벽은 중앙값 {len}일이라 Day {dd} 매일 채혈로도 절벽에 {k3}점 이상 잡히는 대상자가 {pct}다. 참 농도는 중앙값 Day {day16}에 LLOQ에 닿고 Day {d58} 뒤 LLOQ 위는 {a16}뿐이다(2016 모델). 두 모델 모두 사전 규정 채혈 추가 규칙을 충족하지 않았다."
    - id: "Q12 · Q17"
      q: "검정력은 충분한가? 체중 층을 분석 모형에 넣는가?"
      a: "CV {cvb}%, 참 GMR {g}, 평가 가능 {n}명: M1 {p43}(M0 {p43m0}), CV {cvs}%에서 {p50}. 층을 넣은 M1은 SE가 시험 간 변동과 맞는다(SD/SE M0 {sd0}, M1 {sd1}). 목표 검정력과 주분석 모형은 의뢰자가 정한다."
  notes: |
    예상 질의응답 문서(regulatory/src/FDA_questions.Rmd)에서 임상약리·임상개발 검토에 가장 중요한 다섯 문항을 골라 한국어로 줄였다. 예비 문항: Q6(Cmax 과대 예측, 다른 제형), Q18(분석법 정량한계), Q20(연구 체중 범위 밖), Q5(말단 모델의 신뢰성). FDA_questions의 Q1, Q8, Q9는 M0 수(oc/g2_rules_flags.csv)를 인쇄하지만, 이 슬라이드의 M1 수는 oc_models/type1_models.csv에서 읽었다.
    Q1(보고서 5.2절, 5.3절, 5.4절): 참 외삽 중앙값 {ext}(p95 {p95}), NCA 외삽 중앙값 {nca}로 NCA가 꼬리를 과대 추정한다. 미달: 세트 (i) {fi}, 세트 (iii) {fiii}. AUC0-inf + Cmax의 {nom} 초과 칸(M1): 규칙 A (i) {ga}칸(M0 {ga0}칸), 사전 규정 기준인 규칙 A (ii) {gaii}칸, 최대 {gaiimax}.
    Q7(5.4절, 5.9절, 6.2절): 초과 칸은 참 AUC0-inf 비 {tgt}, 2020 모델 말초 분포용적 ×{mult}(같은 비를 2016 모델에서 만들려면 ×{m16})이다. M1 {p2ci}(시험 {ntr}회), 사전 규정 시험 수에서는 {pre}. M0 {m0ci}. 원인(M1): AUC0-last GMR 편향 {bias}(1 쪽)로 비편향 참조 {ref}에서 AUC0-last 단독 {al}로 오르고, Cmax 항은 {cm}%p다. 모든 칸에서 통제된다고 말하지 않고 이 칸을 SAP에 공개한다(SAP 제안 7절 확정).
    Q19·Q11(3.4절, 5.3절, 6.3절): Phoenix WinNonlin의 Lambda Z Acceptance Criteria는 사용자가 넣는 선택 항목이며 미달 프로파일은 표시(Not_Accepted)될 뿐 제외되지 않는다(Certara Phoenix 8.2 문서). 공개 SAP NCT04117607, NCT04441905, NCT04700163은 {r2iii}을 쓴다(NCT04700163은 검색 발췌 확인). 세트 (iv)(span 포함) 미달은 {fiv}다. AUC0-inf는 두 분석군(λz 산출 전원, 기준 충족자)으로 보고하고 동등성 판정에 쓰지 않는다.
    Q4·Q3(5.1절, 5.3절, 5.7절, 6.4절): 절벽 길이 중앙값 {len}일(2016 모델). Day {dd} 매일 채혈에서 절벽에 {k3}점 이상: 명목일 {pct}, 방문 허용창 적용 {pctw}. 참 농도의 LLOQ 도달 중앙값 Day {day16}(2016 모델), Day {day20}(2020 모델); Day {d58} 뒤 LLOQ 위 {a16}, {a20}. 채혈 추가 판정 규칙 (a)~(d)는 두 모델 모두 충족되지 않았다(기준 (a), (b)는 M0로 계산; (c), (d)는 대상자 수준).
    Q12·Q17(5.9절, 5.11절): CV {cvb}% M1 {p43}, M0 {p43m0}; CV {cvs}% M1 {p50}, M0 {p50m0}(참 GMR {g}, 평가 가능 {n}명). 검정력 {tg}%에 필요한 평가 가능 인원: CV {cvb}% M1 {nb1}, M0 {nb0}; CV {cvs}% M1 {ns1}, M0 {ns0}(슬라이드 22). 근거 지침: ICH E9 5.7절(층화 요인은 분석에 반영), FDA 2023 공변량 보정 가이던스. 같은 시험에서 M1과 M0의 P2 경계 1종 오류 차이는 {pc}%p(평균 {pcm}%p), 동일 제품 검정력(2016 모델) M1 {pw1}, M0 {pw0}. 목표 검정력, 표본 수, 주분석 모형은 의뢰자 결정 사항이다.
    관련 보고서: 3.4절, 5.1절~5.4절, 5.9절, 5.11절, 6.2절~6.4절; 예상 질의 문서 Q1, Q3, Q4, Q7, Q11, Q12, Q17, Q19.
