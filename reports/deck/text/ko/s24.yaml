S24:
  kicker: "제안의 실행 · 임상약리·임상개발 예상 질의와 답 (상위 다섯 묶음, 여덟 문항; 번호는 예상 질의 문서 기준)"
  title: "예상 질의에 모의 결과와 문헌으로 답하고(목표 검정력·주분석 모형은 의뢰자 결정), 경계 1종 오류 초과 {e1}칸(M1, Wilson 하한 > {nom})은 SAP에 공개한다"
  qa:
    - id: "Q1"
      q: "왜 FDA 2016 가이던스의 AUC0-inf가 아닌가?"
      a: "AUC0-inf + Cmax(규칙 A (i), M1)는 {ncell}칸 중 {ga}칸에서 점추정이, {gal}칸에서 Wilson 하한이 {nom}를 넘는다. 참 외삽 중앙값이 {ext}(2016 모델)라 AUC0-last가 AUC0-inf를 거의 다 담고, 원개발사 모집단 PK 분석도 의미 있는 말단 반감기를 계산할 수 없다고 보았다(Kovalenko 2020)."
    - id: "Q3 · Q4"
      q: "채혈을 Day {last} 뒤로 늘리거나 말단에 추가하면?"
      a: "2016 모델에서 참 농도의 LLOQ 도달은 중앙값 Day {day16}, Day {d58} 뒤 LLOQ 위는 {a16}다. 절벽(길이 중앙값 {len}일)에 {k3}점 이상 드는 대상자는 매일 채혈로도 명목일 {pct}, 허용창 반영 {pctw}이고, 결과 보고 전 정한 기준 (a)~(d)를 충족한 일정은 없다(두 모델, (a)·(b)는 M0)."
    - id: "Q7"
      q: "경계 1종 오류는? 왜 한 칸이 {nom}를 넘나?"
      a: "AUC0-last + Cmax(M1)는 {ncell}칸 {r1}이고 {e1}칸만 초과(Wilson 하한 > {nom}): 2020 모델 V2 ×{mult} 칸, {p2ci}. AUC0-last GMR이 동등 쪽(1 방향)으로 {bias} 치우친 결과다. M0는 {m0}(명목: Wilson 구간이 {nom} 포함). 이 칸은 SAP에 공개한다."
    - id: "Q11 · Q19"
      q: "AUC0-inf 보고는? R² ≥ {r2i}은 Phoenix 기준?"
      a: "2차 평가변수로, 두 분석군(λz 산출 전원, 기준 충족자)에서 보고한다. Phoenix에는 기본 기준이 없다: 선택 항목이고 미달은 표시만 한다. 정의는 세트 (i)(외삽 ≤ {exi}%, adjusted R² ≥ {r2i}: 관행 범위의 하한)이고 세트 (iii)(≥ {r2iii})도 함께 제시한다. 미달은 각각 {fi}, {fiii}(두 모델)."
    - id: "Q12 · Q17"
      q: "검정력 충분성과 체중 층 반영은?"
      a: "CV {cvb}%, 참 GMR {g}, 평가 가능 {n}명: M1 {p43}(M0 {p43m0}), CV {cvs}%에서 {p50}. 체중 층을 넣은 M1은 표준오차가 실제 시험 간 변동과 맞는다(M0는 약간 커서 보수적). 목표 검정력과 주분석 모형은 의뢰자가 정한다."
  notes: |
    예상 질의응답 문서(regulatory/src/FDA_questions.Rmd)에서 임상약리·임상개발 검토에 가장 중요한 다섯 묶음(여덟 문항: Q1, Q3, Q4, Q7, Q11, Q12, Q17, Q19)을 골라 한국어로 줄였다. 문항 번호는 그 문서의 번호이고, 한 묶음에 두 문항을 묶은 곳은 번호 순으로 적었다. 예비 문항: Q6(Cmax 과대 예측, 다른 제형), Q18(분석법 정량한계), Q20(연구 체중 범위 밖), Q5(말단 모델의 신뢰성). FDA_questions의 Q1, Q8, Q9는 M0 수(oc/g2_rules_flags.csv)를 인쇄하지만, 이 슬라이드의 M1 수는 oc_models/type1_models.csv에서 읽었다. 칸 수는 두 기준으로 센다: 점추정 {nom} 초과 칸, Wilson 95% 구간 분류(보수적: Wilson 상한 < {nom}, 명목: Wilson 구간이 {nom} 포함, 초과: Wilson 하한 > {nom}).
    Q1(보고서 5.2절, 5.3절, 5.4절): 참 외삽 중앙값 {ext}(p95 {p95}), NCA 외삽 중앙값 {nca}로 NCA가 꼬리를 과대 추정한다. 미달(두 모델): 세트 (i) {fi}, 세트 (iii) {fiii}. AUC0-inf + Cmax(M1): 규칙 A (i)는 점추정 {nom} 초과 {ga}칸, Wilson 하한 > {nom} {gal}칸(M0 점추정 초과 {ga0}칸); 사전 명시 원래 정의인 세트 (ii)의 규칙 A (ii)는 점추정 초과 {gaii}칸, 최대 {gaiimax}. 원개발사 관행(예상 질의 Q1): 원개발사의 모집단 PK 분석은 의미 있는 말단 반감기를 계산할 수 없다고 결론지었고(Kovalenko 2020), 공개된 기기 비교 연구도 같은 이유로 AUC0-inf를 계산하지 않았다(Cohen 2022).
    Q3·Q4(5.1절, 5.3절, 5.7절, 6.4절): 참 농도의 LLOQ 도달 중앙값 Day {day16}(2016 모델), Day {day20}(2020 모델); Day {d58} 뒤 LLOQ 위 {a16}, {a20}. 절벽 길이 중앙값 {len}일(두 모델). Day {dd} 매일 채혈에서 절벽에 {k3}점 이상(두 모델, 1일 정의): 명목일 {pct}, 방문 허용창 반영 {pctw}(슬라이드 10과 같은 값). 방문 허용창은 모든 시험 수준 분석에 반영된다. 결과 보고 전 정한 채혈 일정 결정 규칙(기준 (a)~(d), 보고서 3.9절)을 충족한 후보 채혈 일정은 두 모델 모두 없었다(기준 (a), (b)는 M0로 계산; (c), (d)는 대상자 수준). 이 규칙은 첫 일정 모의를 돌린 뒤, 결과를 보고하기 전에 규정했다(사전 규정 기록부 regulatory/tables/prespecification_register.csv, 커밋 c018729). 그래서 사전 규정이라 부르지 않는다.
    Q7(5.4절, 5.9절, 6.2절): 초과 칸은 참 AUC0-inf 비 {tgt}, 2020 모델 말초 분포용적 ×{mult}(같은 비를 2016 모델에서 만들려면 ×{m16})이다. M1 {p2ci}(시험 {ntr}회), 사전 규정 시험 수에서는 {pre}. M0 {m0ci}(명목). 원인(M1): AUC0-last GMR 편향 {bias}(동등 쪽, 1 방향)로 비편향 참조 {ref}에서 AUC0-last 단독 {al}로 오르고, Cmax 항은 {cm}%p다. 모든 칸에서 통제된다고 말하지 않고 이 칸을 SAP에 공개한다(SAP 제안 7절 확정).
    Q11·Q19(3.4절, 5.3절, 6.3절): AUC0-inf는 두 분석군(λz 산출 전원, 기준 충족자)으로 보고하고 동등성 판정에 쓰지 않는다. Phoenix WinNonlin의 Lambda Z Acceptance Criteria는 사용자가 넣는 선택 항목이며 미달 프로파일은 표시(Not_Accepted)될 뿐 제외되지 않는다(Certara Phoenix 8.2 문서). adjusted R² {r2i}은 관행 범위의 하한이다(SAP 제안 2절, 예상 질의 Q19). 공개 SAP NCT04117607, NCT04441905, NCT04700163은 {r2iii}을 쓴다(NCT04700163은 검색 발췌 확인). 미달 비율 {fi}, {fiii}는 각각 세트 (i), 세트 (iii)(adjusted R² ≥ {r2iii}와 외삽 ≤ {exiii}%) 값이고, 세트 (iv)(span 포함) 미달은 {fiv}다.
    Q12·Q17(5.9절, 5.11절): CV {cvb}% M1 {p43}, M0 {p43m0}; CV {cvs}% M1 {p50}, M0 {p50m0}(참 GMR {g}, 평가 가능 {n}명). 검정력 {tg}%에 필요한 평가 가능 인원: CV {cvb}% M1 {nb1}, M0 {nb0}; CV {cvs}% M1 {ns1}, M0 {ns0}(슬라이드 22). 층을 넣은 M1의 SE: 불편 참조의 시험 간 SD / 시험 내 SE가 M0 {sd0}, M1 {sd1}이다. M0는 모든 시나리오에서 SD가 SE보다 작아(SE가 약간 큼) 보수적이다. 근거 지침: ICH E9 5.7절(층화 요인은 분석에 반영), FDA 2023 공변량 보정 가이던스. 같은 시험에서 M1과 M0의 P2 경계 1종 오류 차이는 {pc}%p(평균 {pcm}%p), 동일 제품 검정력(2016 모델) M1 {pw1}, M0 {pw0}. 목표 검정력, 표본 수, 주분석 모형은 의뢰자 결정 사항이다.
    관련 보고서: 3.4절, 5.1절~5.4절, 5.9절, 5.11절, 6.2절~6.4절; 예상 질의 문서 Q1, Q3, Q4, Q7, Q11, Q12, Q17, Q19.
