A4:
  kicker: "부록 A4 · NCA 엔진 규칙과 신뢰 기준 세트"
  title: "Phoenix는 λz 신뢰 기준을 정하지 않는다(사용자 선택 항목): 기준은 SAP 관행 범위의 네 세트로 정의했다"
  rules_label: "NCA 엔진 규칙 (Phoenix WinNonlin 호환)"
  rules:
    - "**정량한계 미만(BLQ) 처리**(Phoenix가 자동으로 하지 않아 NCA 전에 적용): 첫 정량값 전 {z}, 정량값 사이 결측, 마지막 정량값 뒤 제외, 두 번 연속 BLQ 뒤의 정량값 결측"
    - "**AUC0-last**: 실제 채혈 시각, linear-up log-down 사다리꼴"
    - "**λz (Best Fit)**: Cmax 뒤 마지막 {mp}점 이상 창 중 기울기 양수 창을 빼고 adjusted R² 최대 창. 차이 {tol} 미만이면 점이 많은 창"
    - "**AUC0-inf** = AUCINF_obs = AUC0-last + Clast/λz"
    - "**미달자 처리**(AUC0-inf를 검정할 때): 규칙 A 제외, 규칙 B λz 산출 가능 전원 포함, 규칙 C AUC0-last 대입"
  engine: "λz 선택 창 일치(이 엔진·NonCompart {nc}·PKNCA {pk} 쌍별; Theoph, Indometh, 모의 {nsim}개). 최대 상대 차이 {mx}"
  sets_label: "λz 신뢰 기준 세트 (모두 λz 산출 가능 전제)"
  table:
    head: ["세트", "adjusted R² ≥", "외삽 ≤", "span ≥", "지위"]
  none: "없음"
  status:
    i: "사후 추가"
    ii: "사전 명시 (원래 정의)"
    iii: "사전 등록 (v1.0.1)"
    iv: "사전 등록 (v1.0.1)"
  phoenix:
    - "**Phoenix WinNonlin은 λz 신뢰 기준을 정하지 않는다.** Lambda Z Acceptance Criteria(Rules 탭)는 사용자가 넣는 선택 항목(최소 adjusted R², 최대 외삽 %, 최소 span)이다. 넣지 않으면 적용되지 않고, 미충족 프로파일도 제외가 아니라 표시(flag)만 된다(Certara Phoenix 8.2 NCA 문서)."
    - "그래서 세트는 SAP 관행이다: {r2i}은 한 관행이고, 공개 SAP NCT04117607, NCT04441905, NCT04700163은 {r2iii}을 쓴다(span 요건은 일부)."
  notes: |
    NCA 엔진은 Phoenix WinNonlin 규칙을 재현하며 참조 구현 NonCompart {nc}, PKNCA {pk}과 비교해 검증했다(Theoph {nth}개, Indometh {nin}개, 모의 두필루맙 {nsim}개 프로파일). 세 구현의 λz 선택 창은 {lz} 일치했고 파라미터 최대 상대 차이는 {mx}다(모든 비교 통과).
    BLQ 처리는 Phoenix가 자동으로 하지 않으므로 NCA 전에 적용한다. λz: 후보 창은 Cmax 뒤 양의 농도 마지막 {mp}점 이상, 가중치 없는 로그 선형 회귀, 기울기 양수 창 제외, adjusted R² 최대 창(차이 {tol} 미만이면 점이 많은 창). Cmax 뒤 양의 농도가 {mp}점 미만이면 λz 산출 불가다.
    세트 (i)은 adjusted R² ≥ {r2i}, 외삽 ≤ {ex}%이고 세트 (ii)는 여기에 span ≥ {sp2}를 더한다(span = λz 창 길이 / 반감기). 세트 (ii)가 원래 사전 명시한 정의이고 엔진의 기본 표시(flag)도 이것이다. 세트 (i)은 첫 결과 뒤 추가한 사후 정의로, 문서에서는 세트 (ii)와 함께 먼저 보고했다. 세트 (iii)(adjusted R² ≥ {r2iii})와 세트 (iv)(여기에 span ≥ {sp4})는 v1.0.1 사전 등록 4절에서 더했다(보고서 부록 D).
    규칙 A, B, C는 AUC0-inf가 동등성 검정에 들어갈 때 미달자를 다루는 방식이며, 각각 SAP에 사전 명시할 수 있는 서로 다른 평가변수를 정의한다.
    공개 SAP 근거: NCT04117607은 adjusted R² {r2iii} 이상과 span 요건(반감기 배수), tmax 뒤 최소 점 수를, NCT04441905는 adjusted R² {r2iii} 이상과 최소 점 수를, NCT04700163은 adjusted R² {r2iii} 초과를 요구한다. NCT04700163은 사전 등록 파일에는 이 분석 환경에서 미확인으로, 보고서 3.4절에는 레지스트리 문서를 열 수 없어 웹 검색 발췌로 확인했다고 적혀 있다.
    Phoenix 사실의 출처는 Certara Phoenix 8.2 NCA 문서이며, 사전 등록 4절(facts_for_documents), 보고서 3.4절, FDA 질의응답 Q19에 같은 서술이 있다.
    관련 보고서: 3.4절, 4.1절, 부록 D, 부록 H(용어); FDA 질의응답 Q19.
