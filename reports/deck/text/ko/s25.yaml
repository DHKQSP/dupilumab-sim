S25:
  kicker: "한계 · 결론을 읽을 때 주의할 점"
  title: "곡선 모양과 Km 고정 가정은 민감도 분석으로 확인했으나, 실제 Phoenix와의 대조와 담당자의 독립 품질 점검(QC)은 아직 하지 않았다"
  left_label: "모델 한계 (보고서 6.5절에 기재)"
  right_label: "검증 절차의 한계"
  table:
    head: ["한계", "확인한 결과", "결론에 대한 영향 · 조치"]
    col1:
      - "정량한계 아래 곡선 모양(관측 불가), Km {km} mg/L 고정(개인 간 변동 없음)"
      - "Cmax 과대예측"
      - "{d200} mg({c175} mg/mL) 제형의 빠른 흡수 미재현"
      - "항약물항체(ADA) 운용 특성 미반영"
    col2:
      - "양 군 Km ×{k}, Vmax ×{v}: 창 포착률 {thr}% 미만 대상자는 모든 변형에서 {lt80}. 시험군 Km ×{im}: 참 AUC0-inf 비 {kr}"
      - "모의/관측 Cmax {gc16}(2016 모델), {gc20}(2020 모델). 최대 과대 {c27}%, {c20}%는 {d600} mg({d300} mg × 2) 자료; {d300} mg 자료만이면 {c300}%, {c20b}%"
      - "관측 tmax {to}일 대 모의 {ts}일({d300} mg 관측 {t300}일). AUC0-last 모의/관측 {a16}(2016 모델), {a20}(2020 모델)"
      - "유사 하위군 민감도만(대상자 {frac}%, 투여 후 {onset}일부터 ke ×{kem}): 참 외삽 중앙값 {e1}%, 나머지 {e0}%"
    col3:
      - "스트레스 테스트를 뺀 변형에서 창 포착률 5백분위수 {cov95}% 이상. 결합 차이는 AUC로 검출되지 않음"
      - "AUC0-last + Cmax 판정의 1종 오류·검정력은 모의 Cmax를 그대로 썼다. 과대예측의 영향은 따로 평가하지 않음(보고서 한계)"
      - "시험 제형 {d300} mg({c150} mg/mL, {v2} mL)은 흡수 시점과 노출이 재현됨. 두 제품 제형 확인 필요"
      - "하위군 창 포착률 {thr}% 미만 대상자 {alt}%. 통계분석계획(SAP)에 ADA 처리 기술"
  card_nca:
    - "**비구획 분석(NCA) 엔진: 실제 Phoenix와 대조하지 않았다**"
    - "NonCompart·PKNCA와만 대조했다(λz 창 {lz} 일치, 최대 상대 차이 {mx})."
    - "보고서 한계 목록에 없는 __새 항목__이다."
  card_qc:
    - "**담당자의 독립 품질 점검(QC): 대기**"
    - "검증 기록의 결과 칸은 '{qc}'(의뢰자 검토 대기), 서명 페이지는 공란이다."
    - "AI 코딩 도우미로 작성했으므로 담당자가 수치는 추적표와, 본문은 결과 파일과 한 줄씩 대조해야 한다."
  notes: |
    곡선 모양: 정량한계 아래 말단 곡선은 관측할 수 없고, Km은 두 모델 모두 {km} mg/L로 고정되어 개인 간 변동이 없다(2016 모델 문헌은 고정값, 2020 모델 문헌은 profiling으로 정한 고정값). 양 군 공통 Km ×{k}에서 참 외삽 중앙값 {kmed}, {pl}백분위수 {kp95}이고, Vmax 변형(×{v})의 {pl}백분위수는 {vp95}다. 관측 노출과 맞지 않는 Vmax ×{sv} 스트레스 테스트에서만 {pl}백분위수가 {sp95}, 창 포착률 {thr}% 미만이 {slt}로 올라간다. 표의 창 포착률 5백분위수(= 100 - 참 외삽 {pl}백분위수)는 스트레스 테스트를 뺀 모든 변형과 두 모델 기본값에서 가장 작은 값이다. Vmax ×{v80} 변형도 노출 확인(gate) 범위 밖이지만 스트레스 테스트로 표시되지 않았고, 이 변형을 빼도 값은 같다.
    Km 역산: 시험군 Km ×{im}에서도 참 AUC0-inf 비는 {kr} 안에서만 움직인다. 사전 규정 목표 비 중 도달 가능한 것은 {tr}뿐이고 Km ×{r16}(2016 모델), ×{r20}(2020 모델)에서 닿는다. 결합 차이는 PK 평가변수가 아니라 비교 분석적 평가로 입증해야 한다.
    Cmax: 연구 제형 자료 {ng}개의 모의/관측 Cmax는 {gc16}(2016 모델), {gc20}(2020 모델)이다. 보고서 요약의 '최대 {c27}% 과대예측'은 2016 모델의 {d600} mg 자료 값이다. 2020 모델의 최대 {c20}%도 {d600} mg 자료 값이며, {d300} mg 자료만 보면 2016 모델 {c300}%, 2020 모델 {c20b}%다. 보고서는 Cmax 자체의 운용 특성을 이 보고서의 대상이 아니라고 적었고(6.5절), 경계 1종 오류와 검정력(P2: AUC0-last + Cmax 동시 통과)은 모의한 Cmax를 그대로 썼다. 과대예측이 Cmax 판정 결과에 주는 영향의 방향은 평가하지 않았다. 요약 문장의 {c27}%는 보고서 본문에 직접 쓴 표현이며 추적값은 범위 {gc16}이다.
    {d200} mg({c175} mg/mL) 자료는 연구 제형이 아니어서 외부 점검으로만 보고했다. 이 자료의 모의/관측 Cmax는 {ce16}(2016 모델), {ce20}(2020 모델)이다.
    ADA 유사 하위군: 중앙값 tlast {tl1}일(나머지 {tl0}일)이다. 가정 목록(B10)의 조치는 참조약의 건강인 ADA 발생률 검토와 SAP 기술이다.
    NCA 엔진: 검증 범위는 NonCompart·PKNCA 두 참조 구현뿐이고 results/nca_engine에 Phoenix 출력이 없다. 보고서 3.4절은 'Phoenix 규칙 재현'이라고만 적었으며, Phoenix 미대조는 보고서 6.5절과 부록 B 어디에도 한계로 적혀 있지 않다. 제출 전 대표 프로파일 일부를 실제 Phoenix로 돌려 λz 창과 AUC0-inf를 대조하는 것을 제안한다(프로젝트 미실시).
    독립 QC: verification_qc 표의 해당 행 결과가 '{qc}'(의뢰자 검토 대기)이다. 보고서 문서 관리 문구는 AI 코딩 도우미의 도움으로 작성되었으며 자격 있는 의뢰자 인력의 검토, 독립 QC, 승인이 필요하다고 적었다.
    그 밖에 보고서가 적은 한계: 문헌 모델(개인 자료 없음, 모수 불확실성 층 없음, B08), λz 수동 검토 미모의(B11), 중도 탈락 미모의(arm당 평가 가능 {n_arm}명 가정).
    관련 보고서: 요약(주요 한계), 3.4절, 4.1절, 4.2절, Table 4-1, 5.2절, Table 5-2, 5.6절, 6.5절, 부록 B(B07, B10, B12), 부록 C.
