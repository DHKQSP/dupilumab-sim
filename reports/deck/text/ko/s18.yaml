S18:
  kicker: "논거 ③ 보충 · 표적 매개 소실 Km과 PK 평가변수"
  title: "시험약의 표적 매개 소실 Km을 {m}배로 바꿔도 참 AUC0-inf 비는 {r}(두 모델)에 머물러 Km 차이는 PK로 검출되지 않는다"
  fig:
    xlab: "시험약 Km 배율 (대조약 대비, 로그 눈금)"
    ylab: "참 AUC0-inf 비 (시험약 / 대조약)"
    reach: "빈 표식: 목표 {t} 도달 ×{m16} / ×{m20}"
    band: "동등성 범위"
  table:
    head: ["시험약 기전\n(배율: 2016 모델 / 2020 모델)", "참 비 {lo} 도달", "참 비 {hi} 도달"]
    none: "도달 못함"
    caption:
      - "기전별 참 AUC0-inf 비가 동등 경계에 닿는 배율"
      - "공통 가상 대상자 {n}명 기준. 도달 못함: 탐색 범위 끝까지 닿지 않음(Km {km}, 다른 기전 {oth})"
    mech:
      F: "생체이용률 F"
      ka: "흡수 속도 ka"
      ke: "선형 소실 ke"
      Vmax: "표적 매개 소실 용량 Vmax"
      V2: "말초 분포용적 V2"
      Km: "표적 매개 소실 Km"
  bullets:
    - "사전 규정 목표 비 {nt}개({tr}) 가운데 Km 변화로 닿는 목표는 {t} 하나다: 2016 모델 ×{m16}, 2020 모델 ×{m20}."
    - "참 AUC0-inf 비는 2016 모델 {r16}, 2020 모델 {r20}이고, 참 Cmax 비는 {cm}(두 모델)이다."
    - "Km은 결합 친화도 자체가 아닌 Michaelis-Menten 근사 상수이며, 두 모델 모두 개인간 변동 없이 고정되어 있다(보고서 6.5절)."
  analytic:
    - "**결합 유사성은 분석적 유사성 평가가 담당한다**"
    - "결합 동역학과 기능 분석으로 입증한다(보고서 5.6절, 의뢰자 입장). 어떤 AUC 평가변수를 골라도 Km 차이는 PK로 검출되지 않는다(검출력 차이 없음)."
  notes: |
    방법: 시험약 arm의 Km만 곱하고 대조약은 그대로 두어 참 AUC0-inf 비를 계산했다(공통 가상 대상자 {ntruth}명, 체중 {wt} kg, 잔차 없는 모델 적분). 그림의 곡선은 선별 {nscr}명으로 계산한 로그 간격 배율이고, 도달 목표(빈 표식)는 {ntruth}명으로 확인한 값이다. {ntruth}명으로 확인한 범위 끝 값은 제목과 요점에 적었다(그림에서는 도달 표식과 겹쳐 뺐다). 탐색 범위는 {m}배다. 그림에는 Km 곡선만 그렸고, 다른 기전(F, ka, ke, Vmax, V2)이 경계에 닿는 배율은 표에 있다.
    범위 끝의 참 AUC0-inf 비: 2016 모델 {a16d}(가장 작은 배율), {a16u}(가장 큰 배율); 2020 모델 {a20d}, {a20u}. 제목의 범위는 두 모델을 합친 것이며 2020 모델만의 상한은 {a20u}다.
    참 Cmax 비(범위 끝과 도달 행, 두 모델) {cm}: 가장 작은 배율에서 2016 모델 {c16d}, 2020 모델 {c20d}; 가장 큰 배율에서 2016 모델 {c16u}, 2020 모델 {c20u}.
    도달 가능한 목표 {t}의 배율은 ×{r16}(2016 모델), ×{r20}(2020 모델)이다. 동등성 경계에는 어느 방향으로도 닿지 않으므로 Km 경계 시나리오는 없다. 다른 기전(F, ka, ke, Vmax, V2)은 표와 같이 ×{olo}~×{ohi} 사이의 배율에서 경계에 닿는다. '도달 못함'은 탐색 범위(Km {kmr2}, 다른 기전 {oth}) 끝에서도 목표에 닿지 않았다는 뜻이다.
    해석 주의: Km은 Michaelis-Menten 근사 상수이며 결합 친화도 그 자체가 아니다. 두 모델 모두 Km은 개인간 변동 없이 고정되어 있다(보고서 6.5절). 보고서 5.6절은 Km을 표적 결합 상수로 부르고, Km 차이가 어떤 PK 평가변수로도 검출되지 않는다고 결론짓는다.
    '결합 유사성은 분석적 유사성 평가가 담당한다'는 모의 결과가 아니라 보고서 5.6절과 예상 질의 Q10의 의뢰자 입장이다.
    관련 보고서: 3.7절, 5.4절(Table 5-8), 5.6절, 6.5절, 7절; 예상 질의 Q10.
