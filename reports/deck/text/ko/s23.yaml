S23:
  kicker: "제안의 실행 · 통계분석계획(SAP) 제안 요지"
  title: "SAP 제안: 1차는 AUC0-last + Cmax(주분석 M1), AUC0-inf는 세트 (i) 기준 이차 평가변수, 규칙 B 공동 1차는 FDA 요구 시 대응안"
  cards:
    primary:
      head: "1차 평가변수: AUC0-last + Cmax"
      body:
        - "주분석 **M1**(투여군 + 무작위배정 체중 층). 민감도: M0(층 없음), M2(log 체중)"
        - "경계 1종 오류 M1 **{r1}**(보수적 {c1}칸, 초과 {e1}칸), M0 {r0}"
        - "**확인 대기**: SAP 문안의 주분석 모형은 아직 'M0 또는 M1, 의뢰자 선택'이다."
    secondary:
      head: "이차 평가변수: AUC0-inf (동등성 판정에 쓰지 않음)"
      body:
        - "신뢰 기준 **세트 (i)**: adjusted R² ≥ {r2i}, 외삽 ≤ {exi}%, span 기준 없음"
        - "두 분석군 보고: λz 산출 전원, 기준 충족자 (제외자의 수, 체중, AUC0-last 병기)"
        - "adjusted R² ≥ {r2iii} 충족 인원 병기: 미달 **{fiii}** (세트 (i) {fi})"
    sens:
      head: "민감도 분석"
      body:
        - "**규칙 C**(기준 미달자에 AUC0-last 대입), 세트 (i): 경계 1종 오류 최댓값 M0 {gc0}, M1 **{gc1}**"
        - "**항약물항체(ADA) 상태별**: 투여 후 ADA 양성자를 두 군에서 빼고 주분석 반복 (이 분석의 운영 특성은 미산출: 모의하지 않음)"
    fallback:
      head: "대응안: FDA가 AUC0-inf 공동 1차를 요구할 때만"
      body:
        - "AUC0-last + AUC0-inf(**규칙 B**: λz 산출 전원, 기준 미달자는 표시·목록화) + Cmax"
        - "경계 1종 오류 M1 **{fb1}**. AUC0-last를 빼면(AUC0-inf + Cmax) {ncell}칸 중 {gbn}칸이 {nom} 초과"
  notes: |
    SAP 제안 문안(regulatory/sap_text_proposals_en.md, v1.0.1 의뢰자 검토용 초안, 미승인) 1절부터 7절까지의 요지다. 수치는 SAP 문서와 같은 결과 파일, 같은 행 조건으로 읽었다.
    1차(1절): M1은 투여군과 무작위배정 체중 층({wt} kg를 {split} kg 기준 두 층)을 고정 효과로 둔 로그 척도 분산분석이다. 근거: ICH E9 5.7절(층화 요인은 분석에 반영)과 FDA 2023 공변량 보정 가이던스(보정 모형은 층 변수를 포함). M0에서는 참값 기준 시험 간 log GMR SD가 시험 내 SE보다 작다(SD/SE {sd0}; M1 {sd1}). 동일 제품 검정력(2016 모델): M1 {pw1}, M0 {pw0}. 경계 최댓값 칸(2020 모델 말초 분포용적 증가): M1 {p2m1}, M0 {p2m0}.
    주분석 모형: 이 슬라이드 묶음은 M1을 주분석 기준으로 둔다(검토 방향). SAP 문안은 '[M0 or M1, to be selected by the sponsor]'이고 7절 상태는 의뢰자 결정 대기다. 확정되면 SAP 문안을 고쳐야 한다.
    이차(2절): λz 산출 {lz}, 세트 (i) 충족 {ri}(두 모델). 세트 (i) 제외자는 유지자보다 무겁고(2016 모델 {wd16} kg, 2020 모델 {wd20} kg) 참 AUC0-inf가 낮다(제외/유지 기하평균비 {gr16}, {gr20}): 무작위 탈락이 아니므로 두 분석군과 제외자 특성을 함께 보고한다. 공개 SAP(NCT04117607, NCT04441905, NCT04700163)는 adjusted R² {r2iii}을 쓴다. NCT04700163은 사전 등록 문서에 '이 환경에서 확인 못함', SAP 문안에 '검색 발췌로 확인'으로 기록이 엇갈리므로 조심해서 인용한다.
    민감도(2절, 4절): 규칙 C 세트 (i) 최댓값은 P2 최댓값과 같은 칸에서 M0 {gc0ci}, M1 {gc1ci}다. M1에서 {ncell}칸 중 점추정 {nom} 초과 {gco1}칸, Wilson 하한 {nom} 초과 {gcl1}칸. 보고서 요약과 6.3절의 규칙 C 값(M0 {gcii0}, M1 {gcii1})은 세트 (ii)(span 기준 포함) 값이라 여기서 쓰지 않는다.
    ADA(4절): Day 1 투여 전과 Day {ada} 채혈, 주분석은 ADA 상태와 무관하게 전원, 민감도 분석은 투여 후 ADA 양성자를 두 군에서 뺀다. 이 민감도 분석은 모의하지 않았다(운영 특성 미산출; 예상 질의 Q15의 한계). 참고로 ADA 유사 소집단 모의(대상자의 {adaf}, Day {onset} 이후 선형 소실 {kem}배; 가정)에서 tlast 중앙값은 {tl1}일(나머지 {tl0}일), 참 외삽 중앙값은 {ex1}(나머지 {ex0})였다.
    대응안(3절): 규칙 B는 λz 산출 전원을 쓰므로 제외가 {exb16}(2016 모델), {exb20}(2020 모델)뿐이다. AUC0-last를 공동 1차로 남기면 세 평가변수 판정의 경계 1종 오류는 M1 {fb1}(최대 {fbm1}), M0 {fb0}이다. AUC0-last 없이 AUC0-inf(규칙 B) + Cmax면 M1 {gbn}칸(최대 {gbm1}), M0 {gbn0}칸이 {nom}를 넘는다. M1에서 규칙 A 민감도 {fa1}, 규칙 C 민감도 {fc1}. 동일 제품 검정력 M1 {pwb1}(P2 {pw1}).
    결정 상태(SAP 7절): AUC0-inf 이차 평가변수, 대응안, {nom} 초과 칸 공개, CV 가정은 확정. 신뢰 기준(세트 (i) + adjusted R² {r2iii} 인원 병기)은 제안(의뢰자 확인). 주분석 모형, 분석법 정량한계, 목표 검정력과 표본 수는 의뢰자 결정 대기.
    관련 보고서: 5.9절, 6.2절, 6.3절, 7절; SAP 제안 1절부터 7절까지; 예상 질의 Q9, Q11, Q15, Q17.
