A5:
  kicker: "부록 A5 · 견고성: 체중 범위와 아토피 모집단 (근거 아님)"
  title: "체중이 무거울수록 AUC0-inf 신뢰 기준 미달이 늘지만, 세트 (iii) 미달 환자에서도 창 포착률은 {z} 이상이다"
  not_evidence: "**평가변수 선택의 근거가 아니다.** 근거는 시험 모집단(건강인 {wt} kg, 체중 층화 배정)뿐이다. 이 점검은 체중이 연구 범위를 벗어날 때 결론이 달라지는지 본다(보고서 부록 I)."
  fig:
    ylab: "세트 (i) 신뢰 가능 AUC0-inf 비율 (%)"
    xlab: "균일 체중 구간 (kg)"
    study: "연구 체중 범위 {wt} kg"
    extrap: "{k} kg 이상:\n모델 외삽 가능성"
  bullets:
    - "균일 체중 구간 {brng} kg(2016 모델): 세트 (i) 신뢰 비율은 무거운 구간일수록 낮다({hi} → {lo}). 참 외삽 비율 중앙값은 {wmed}, 창 포착률 {thr}% 미만 대상자는 구간마다 {wcov} 이하"
    - "평균 체중이 높은 모집단(스트레스 시험)의 모의 시험에서 세트 (ii) 탈락자는 유지자보다 {dw} kg 무겁다(세 모델 변형)"
  atopic_label: "아토피 피부염 성인 체중 분포 (문헌 요약 기반 가정 분포)"
  card_fail: "2016 모델의 AUC0-inf 신뢰 기준 미달(세트 (i) / (iii)). 세 모델 변형에서 {ri} / {riii}"
  card_cov: "세트 (iii) 미달 환자의 창 포착률 최솟값(세 모델 변형, 내림). 중앙값 {med}"
  card_wt: "연구 체중 범위 밖 비율: {k60} kg 미만 {b60}, {k90} kg 초과 {a90}(로그정규, 평균 {m} kg, SD {s} kg)"
  notes: |
    이 슬라이드는 평가변수 선택의 근거가 아니다. 근거는 시험 모집단(건강인 {wt} kg, 체중 층화 배정, 보고서 5.2절~5.4절)뿐이며, 연구 범위 밖 체중과 아토피 피부염 성인 체중 분포의 결과는 스폰서 결정으로 부록의 견고성 점검으로 옮겼다(커밋 bae3574; 분석은 바뀌지 않고 보고 위치만 바뀜, 보고서 부록 D).
    균일 체중 구간(구간당 {nb}명): 무거운 구간일수록 세트 (i) 신뢰 비율이 낮아진다. 2020 모델은 {hi20} → {lo20}이다. 모델 개발 자료의 체중 범위는 보고되지 않아 {k130} kg 이상 구간(그림의 점선 오른쪽)의 결과는 외삽일 수 있다(아토피 주 분포의 {p130}%). 창 포착률 {thr}% 미만 대상자 비율(2016 모델)은 구간마다 {wcov} 이하다.
    아토피 피부염 성인 체중 분포는 Kamal 2022, Kovalenko 2021, NCT03389893의 요약에서 만든 가정 분포(자리표시자)다(로그정규, {tr} kg 절단). 3상 원자료 체중은 분석 환경에서 확인할 수 없었다. 이 분포에서 {k100} kg 초과는 {a100}이다.
    미달은 무거운 환자에 몰린다: 2016 모델 세트 (i) 미달은 {k60} kg 미만 {b60i}, {k100} kg 초과 {b100i}. 민감도 체중 분포 두 개에서는 세트 (i) {sens_i}, 세트 (iii) {sens_iii}다.
    세 모델 변형: 2016 모델, 2020 모델(Model 1), 2016 모델에 성인 3상 공변량(Kovalenko 2020: 선형 소실에 BMI, 중심 분포 용적에 체중)을 넣은 변형. 카드의 범위와 최솟값은 이 셋에 걸친 값이다. 창 포착률은 참 AUC0-tlast(투여~마지막 정량 채혈) / 참 AUC0-inf다. 최솟값은 내림해 적었다.
    평균 체중이 높은 모집단(스트레스 시험, 보고서 부록 I)의 모의 시험: 탈락자는 엔진의 기본 신뢰 표시, 곧 세트 (ii)를 못 넘은 대상자이며, 체중 차이 {dw} kg은 세 모델 변형, 시나리오, arm 전체의 범위다.
    아토피 분포의 모의 시험(arm당 인원은 본 시험과 같음, 시나리오당 {ntr}회, M0): AUC0-last GMR 편향 {bl}, AUC0-inf 규칙 A 세트 (i) 편향 {bai}; AUC0-last + Cmax와 AUC0-inf + Cmax(규칙 A 세트 (i))의 판정 일치 {ag}; Vmax 증가 시나리오(VM125)에서 세트 (i) 미달 비율의 arm 간 차이(시험 - 대조) {ad}%p.
    관련 보고서: 5.8절, 부록 I(Table I-1, Table I-2, Figure I-1, Figure I-2), 부록 B; FDA 질의응답 Q16, Q20.
