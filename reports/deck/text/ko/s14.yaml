S14:
  kicker: "논거 ② 판정이 AUC0-inf 처리 규칙에 좌우된다"
  title: "처리 규칙에 따라 판정이 달라진다: AUC0-inf + Cmax의 1종 오류 점추정이 {nom}를 넘는 경계 칸이 규칙 A·B는 {ab}칸, 규칙 C는 {c}칸이다"
  table:
    head: ["규칙 · 기준 세트", "점추정 > {nom} 칸, M1 (M0)", "Wilson 하한 > {nom} 칸, M1 (M0)", "최대 (M1)", "AUC0-inf GMR 편향 (M1)", "1 쪽 편향 칸 (M1)"]
    rows:
      A_i: "A 미달자 제외 · (i)"
      A_ii: "A · (ii) 지침 기본값"
      A_iii: "A · (iii)"
      A_iv: "A · (iv)"
      B: "B λz 산출 전원"
      C: "C 미달자에 AUC0-last 대입 · (i)~(iv)"
  bullets:
    - "**규칙 C만 AUC0-last + Cmax에 가깝다.** 네 세트 모두 {c}칸만 점추정이 {nom}를 넘고, 그 칸은 AUC0-last + Cmax({p2})도 가장 높은 2020 모델 V2 칸이다."
    - "규칙 A·B는 AUC0-inf GMR이 참 비보다 1 쪽으로 치우친 칸이 많고, 1종 오류가 최대 {abmax}에 이른다."
    - "규칙 C는 AUC0-last를 섞은 평가변수라 이차 평가변수 AUC0-inf의 민감도 분석으로만 둔다."
  inst:
    def: "**판정 불안정**: 같은 시험의 통과·불통과가 비교한 변형 사이에서 갈리는 시험의 비율이다. 경계 {ncell}칸 중 ka 감소 {nka}칸은 Cmax가 늘 불통과라 {zero}이고, 정보가 있는 칸은 {ninf}칸이다."
    card1: "{nvar}가지 변형 전체, M1 중앙값. 최대 {max}; M0는 중앙값 {m0}, 최대 {m0max}"
    card2: "규칙 C 안에서 세트만 바꿀 때, M1 중앙값. 최대 {max}; 규칙 A 안에서는 {a}, 최대 {amax}"
  notes: |
    처리 규칙: A는 기준 세트 미달자를 분석에서 뺀다(세트 (ii)는 사전 규정한 지침 기본값). B는 λz가 산출된 모든 대상자를 쓴다. C는 미달자에 AUC0-last를 대입한다. 기준 세트 정의는 슬라이드 9. Phoenix는 λz 신뢰 기준을 기본으로 적용하지 않는다(보고서 3.4절).
    자료: 시험 모집단 재생성 시험(건강인 {wt} kg, 체중 층화 배정, arm당 {n_arm}명), 경계 칸당 {reps}회(2020 모델 V2 칸은 {n20}회). 같은 시험에 {nvar}가지 변형을 모두 적용했다.
    칸 수 두 가지: '점추정 > {nom}'는 통과율 점추정이 {nom}를 넘는 칸, 'Wilson 하한 > {nom}'는 Wilson 95% 구간 하한까지 넘는 칸(초과로 분류)이다. M1에서 두 수가 다른 예: A (i) {ai_pt}칸 대 {ai_lo}칸, B {b_pt}칸 대 {b_lo}칸, C (i) {ci_pt}칸 대 {ci_lo}칸.
    규칙 C 세트별 최대(M1, 모두 2020 모델 V2 증가 칸): C (i) {ci}, 명목; C (ii) {cii}; C (iii) {ciii}; C (iv) {civ}. C (ii)~(iv)는 초과로 분류된다. 같은 칸에서 AUC0-last + Cmax는 {p2}다. C (iv)는 AUC0-last + Cmax보다 높다. M0에서 규칙 C의 세트별 최대는 {c0}다. '규칙 C만 1종 오류를 통제한다'고 쓰지 않는다(DECISIONS D-060).
    규칙 A·B 최대(M1): A (ii)는 2020 모델 Vmax 감소 칸 {aii}, B는 2016 모델 Vmax 증가 칸 {b}. M0: A (ii) {aii0}, B {b0}.
    편향: 참 AUC0-inf 비 {tgt} 경계에서 GMR 기하평균이 1 쪽으로 치우치면(하한 {t1}에서 양, 상한 {t2}에서 음) 통과가 쉬워진다. 보고서 5.4절은 원인을 외삽 편향(절벽 앞 λz로 붙인 꼬리)과 선택 편향(규칙 A의 제외)으로 설명한다. 규칙 A·B의 가장 큰 편향은 ka 감소 칸에 있는데, 이 칸은 Cmax가 늘 불통과라 1종 오류에 영향이 없다. ka 칸을 빼면(M1) A (ii) {aii_b14}, B {b_b14}. M0 편향은 M1과 거의 같다(A (ii) {aii_b0}, 규칙 C {c_b0}).
    판정 불안정: 비교한 변형 중 하나라도 통과하고 하나라도 불통과인 시험의 비율. 16칸의 중앙값과 최대로 보고한다(DECISIONS D-058). M1에서 같은 세트 안 규칙 A·B·C 사이: 세트 (i) {r_i}, (ii) {r_ii}, (iii) {r_iii}, (iv) {r_iv}(중앙값). 정보가 있는 {ninf}칸만의 {nvar}가지 변형 중앙값은 {i14}다.
    동일 제품(경계 밖)에서도 {nvar}가지 사이 판정이 갈리는 시험이 {s00}(두 모델, M1)이다. 규칙 A 안 세트 간 {s00a}, 세트 (i) 안 규칙 간 {s00r}이며, 규칙 A (iv)의 동일 제품 검정력은 {pw4}다.
    M1 편향·불안정 값은 보고서에 인쇄되지 않았다(보고서는 M0). 같은 결과 파일에서 analysis_model=='M1'로 읽었다.
    관련 보고서: 3.4절, 3.13절, 5.4절(Table 5-12, Figure 5-8은 M0), 6.1절, 6.3절, 7절; FDA 질의 Q8, Q9, Q19; DECISIONS D-058, D-060.
