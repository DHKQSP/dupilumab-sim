S14:
  kicker: "논거 ② 판정이 AUC0-inf 처리 규칙에 좌우된다"
  title: "처리 규칙에 따라 판정이 달라진다: AUC0-inf + Cmax의 1종 오류 점추정이 {nom}를 넘는 경계 칸이 규칙 A (i)~(iv)·B는 {ab}칸, 규칙 C는 세트마다 {c}칸이다(M1)"
  table:
    head: ["규칙 · 기준 세트", "점추정 > {nom} 칸\nM1 (M0)", "Wilson 하한 > {nom} 칸\nM1 (M0)", "1종 오류\n최대 (M1)", "AUC0-inf\nGMR 편향 (M1)", "동등 쪽 편향 칸\n(M1, {ncell}칸 중)"]   # \n: 표 칸 안 줄바꿈
    rows:
      A_i: "A (i) 제외"
      A_ii: "A (ii) 사전 명시"
      A_iii: "A (iii) 제외"
      A_iv: "A (iv) 제외"
      B: "B λz 산출 전원"
      C_i: "C (i) AUC0-last 대입"
  bullets:
    - "**규칙 C만 AUC0-last + Cmax에 가깝다.** 네 세트 모두 점추정 > {nom} 칸은 AUC0-last + Cmax도 가장 높은({p2}) 2020 모델 V2 증가 칸 하나뿐이며, 여기서 세트 (i)은 {ci}(명목), (ii) {cii}, (iii) {ciii}, (iv) {civ}는 초과다."
    - "규칙 A·B에서는 AUC0-inf GMR이 참 비보다 동등 쪽({one} 방향)으로 치우친 칸이 많고 최대 1종 오류가 {abmax}에 이른다(동등 쪽: 하한에서 양, 상한에서 음의 편향)."
    - "규칙 C는 AUC0-last를 섞은 평가변수라 2차 평가변수 AUC0-inf의 민감도 분석으로만 둔다."
  inst:
    def:
      - "**판정 불안정**: 변형 사이에서 통과·불통과가 갈리는 시험의 비율"
      - "변형 {nvar}가지: 규칙 A·C × 네 세트 + 규칙 B"
      - "ka 감소 {nka}칸: Cmax 늘 불통과, 불안정 {zero}"
    card1: "판정 불안정, {nvar}가지 변형 전체: M1 {ncell}칸 중앙값(ka 칸 제외 {i14}). 최대 {max}; M0 중앙값 {m0}, 최대 {m0max}"
    card2: "판정 불안정, 규칙 C 안에서 세트만 바꿀 때(M1 {ncell}칸 중앙값). 최대 {max}; 규칙 A 안에서는 중앙값 {a}, 최대 {amax}"
  notes: |
    처리 규칙: A는 기준 세트 미달자를 분석에서 뺀다(세트 (ii)는 사전 명시한 원래 정의). B는 λz가 산출된 모든 대상자를 쓴다. C는 미달자에 AUC0-last를 대입한다. 기준 세트 정의는 슬라이드 9. Phoenix는 λz 신뢰 기준을 기본으로 적용하지 않고, 지침도 세트를 정하지 않는다(보고서 3.4절).
    자료: 시험 모집단 재생성 시험(건강인 {wt} kg, 체중 층화 배정, arm당 {n_arm}명), 경계 칸당 {reps}회(2020 모델 V2 칸은 {n20}회). 같은 시험에 {nvar}가지 변형을 모두 적용했다. 표는 규칙 A 네 세트, 규칙 B, 그리고 SAP 제안의 규칙 C 세트 (i)을 싣고, 규칙 C 세트 (ii)~(iv)는 아래에 세트별로 적는다.
    칸 수 두 가지: '점추정 > {nom}'는 통과율 점추정이 {nom}를 넘는 칸, 'Wilson 하한 > {nom}'는 Wilson 95% 구간 하한까지 넘는 칸(초과로 분류)이다. M1에서 두 수가 다른 예: A (i) {ai_pt}칸 대 {ai_lo}칸, B {b_pt}칸 대 {b_lo}칸, C (i) {ci_pt}칸 대 {ci_lo}칸.
    규칙 C 세트별(M1 (M0)): 점추정 > {nom} 칸 (i) {c1_pt}, (ii) {c2_pt}, (iii) {c3_pt}, (iv) {c4_pt}; Wilson 하한 > {nom} 칸 (i) {c1_lo}, (ii) {c2_lo}, (iii) {c3_lo}, (iv) {c4_lo}; AUC0-inf GMR 편향(M1) (i) {c1_b}, (ii) {c2_b}, (iii) {c3_b}, (iv) {c4_b}; 동등 쪽 편향 칸(M1) (i) {c1_t}, (ii) {c2_t}, (iii) {c3_t}, (iv) {c4_t}.
    규칙 C 세트별 최대(M1, 모두 2020 모델 V2 증가 칸): C (i) {ci}, 명목; C (ii) {cii}; C (iii) {ciii}; C (iv) {civ}. C (ii)~(iv)는 초과로 분류된다. 같은 칸에서 AUC0-last + Cmax는 {p2}다. C (iii)과 C (iv)는 AUC0-last + Cmax보다 높다. M0에서 규칙 C의 세트별 최대는 (i) {c0_1}, (ii) {c0_2}, (iii) {c0_3}, (iv) {c0_4}다. 보고서 요약(Synopsis)의 규칙 C 값은 세트 (ii)이고, 이 덱은 SAP 제안과 같은 세트 (i)을 인용한다. '규칙 C만 1종 오류를 통제한다'고 쓰지 않는다(DECISIONS D-060).
    규칙 A·B 최대(M1): A (ii)는 2020 모델 Vmax 감소 칸 {aii}, B는 2016 모델 Vmax 증가 칸 {b}. M0: A (ii) {aii0}, B {b0}.
    편향: 시험마다 구한 AUC0-inf GMR의 기하평균을 참 AUC0-inf 비와 비교한 차이(%)다. 참 비 {tgt} 경계에서 GMR 기하평균이 동등 쪽({one} 방향)으로 치우치면(하한 {t1}에서 양, 상한 {t2}에서 음) 통과가 쉬워진다. 보고서 5.4절은 원인을 외삽 편향(절벽 앞 λz로 붙인 꼬리)과 선택 편향(규칙 A의 제외)으로 설명한다. 규칙 A·B의 가장 큰 편향은 ka 감소 칸에 있는데, 이 칸은 Cmax가 늘 불통과라 1종 오류에 영향이 없다. ka 칸을 빼면(M1) A (ii) {aii_b14}, B {b_b14}. M0 편향은 M1과 거의 같다(A (ii) {aii_b0}, 규칙 C (i) {c_b0}).
    판정 불안정: 비교한 변형 중 하나라도 통과하고 하나라도 불통과인 시험의 비율. 경계 {ncell}칸의 중앙값과 최대로 보고한다(DECISIONS D-058). 중앙값에는 늘 {zero}인 ka 감소 {nka}칸이 들어 있고, 정보가 있는 {ninf}칸만의 {nvar}가지 변형 중앙값은 {i14}다. M1에서 같은 세트 안 규칙 A·B·C 사이: 세트 (i) {r_i}, (ii) {r_ii}, (iii) {r_iii}, (iv) {r_iv}(중앙값).
    동일 제품(경계 밖)에서도 {nvar}가지 사이 판정이 갈리는 시험이 {s00}(두 모델, M1)이다. 규칙 A 안 세트 간 {s00a}, 세트 (i) 안 규칙 간 {s00r}이며, 규칙 A (iv)의 동일 제품 검정력은 {pw4}다.
    M1 편향·불안정 값은 보고서에 인쇄되지 않았다(보고서는 M0). 같은 결과 파일에서 analysis_model=='M1'로 읽었다.
    관련 보고서: 3.4절, 3.13절, 5.4절(Table 5-12, Figure 5-8은 M0), 6.1절, 6.3절, 7절; FDA 질의 Q8, Q9, Q19; DECISIONS D-058, D-060.
