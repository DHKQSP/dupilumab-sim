S26:
  kicker: "결론 이후 · 남은 결정과 다음 단계"
  title: "제안은 그대로이며, 확정에는 LLOQ·설계값·분석 모형·목표 검정력의 의뢰자 결정과 결과 버전 고정, 자문 질의 문안 준비가 남았다"
  row1: "의뢰자 결정 (보고서 7절, 부록 B)"
  cards:
    lloq:
      - "**분석법 정량한계(LLOQ)**"
      - "현재 {lloq} mg/L(원개발사 값, 가정)"
      - "{grid} mg/L에서(2016 모델): 창 포착률 {thr}% 미만 대상자 {cov}, 경계 {nc}칸의 1종 오류 {p2}(M1)"
      - "→ 검증 분석법 값으로 재생성"
    design:
      - "**잠정 설계값(모두 가정)**"
      - "첫 채혈: 투여 후 {h0}시간"
      - "방문 허용: ±{h1}시간~±{d3}일"
      - "체중: 평균 {wm} kg, SD {wsd} kg"
      - "층 경계: {split} kg"
      - "→ 시험계획서 값으로 재생성"
    model:
      - "**주분석 모형과 SAP 문안**"
      - "제안: 주분석 M1(체중 층 포함)"
      - "병기: M0(층 없음)"
      - "보고서와 SAP 문안은 선택을 의뢰자 결정으로 남김"
      - "→ 의뢰자가 정하면 SAP 문안에 반영"
    power:
      - "**목표 검정력과 n**"
      - "arm당 평가 가능 {n_arm}명, 무작위배정 {n_rand}명"
      - "CV {cv}%, 참 GMR {g}: 검정력 {pw1}(M1)"
      - "목표 {tg90}%: 평가 가능 {n90}명, {tg85}%: {n85}명(arm당, M1)"
      - "→ 목표 검정력 선택"
    tag_none:
      - "**후속 작업 · 결과 버전 고정: 미완료**"
      - "담당자가 {tag} 릴리스 표시(태그)를 올려야 한다. 올리면 결과 파일 묶음과 해시(무결성 확인값)가 자동 생성된다."
    tag_done:
      - "**후속 작업 · 결과 버전 고정: 완료**"
      - "{tag} 릴리스 작업이 만든 결과 파일 묶음과 해시(무결성 확인값)를 확인한다."
    bpd:
      - "**후속 작업 · 자문 질의 문안: 미작성**"
      - "바이오시밀러 개발(BPD) 미팅·과학자문용 질의 초안이 프로젝트에 없다. 다음 단계로 작성한다."
    proposal:
      - "**제안 (변동 없음)**"
      - "공동 1차 평가변수: AUC0-last + Cmax"
      - "이차 평가변수: AUC0-inf(λz 신뢰 기준 사전 명시)"
  notes: |
    분석법 LLOQ: config/assay.yaml의 값 {lloq} mg/L는 상태 '{lloq_st}'이며, 모델 개발 자료(Clot 2021, 원개발사 분석법)의 LLOQ를 빌린 자리표시자다. 같은 대상자로 {grid} mg/L를 모의했을 때 창 포착률 {thr}% 미만 대상자는 {cov}(2016 모델), 세트 (i) 신뢰 비율은 {r02}(가장 낮은 LLOQ) · {r078}(현재) · {r05}(가장 높은 LLOQ)였다. 카드의 경계 1종 오류는 AUC0-last + Cmax(P2: 두 평가변수 동시 통과) 값으로 {p2}(M1), {p2m0}(M0)이며, 2016 모델의 경계 {nc}칸(F 감소, Vmax 감소, Vmax 증가), 칸당 {nt}회 결과다(보고서 5.10절). 2020 모델의 시험 수준 LLOQ 결과는 없다. 값이 정해지면 그 파일 한 곳만 바꾸고 전체를 다시 만든다.
    잠정 설계값(모두 config 상태 assumption, 확정 전 가정): 첫 채혈은 Day 1 투여 후 {t1}일({h0}시간; Cmax 채혈에만 영향), 방문 허용 범위 투여 후 {a1}일까지 ±{h1}시간, {a2}일까지 ±{h2}시간, 이후 ±{d3}일(모든 시험 수준 분석에 반영), 체중 분포 정규(평균 {wm} kg, SD {wsd} kg, {wt} kg 절단), 남성 비율 {sex}, 층 경계 {split} kg(층 안 1:1).
    분석 모형: 이 결과 보고는 M1(무작위배정 체중 층 포함)을 주분석으로 두고 M0(층 미포함, 합동 t 검정)를 병기했다. 보고서와 SAP 문안 제안은 두 모형을 모두 보고하고 선택을 의뢰자 결정으로 남겼다(보고서 5.9절, 6.5절; SAP 제안 7절 '의뢰자 결정 대기'). 의뢰자가 M1 채택을 결정하면 SAP 문안에 반영한다.
    목표 검정력과 n: arm당 무작위배정 {n_rand}명, 평가 가능 {n_arm}명(중도 탈락 미모의). 카드의 n은 모두 arm당 평가 가능 인원이다. CV {cv}%, 참 GMR {g}에서 P2 검정력은 {pw0}(M0), {pw1}(M1)이다. 목표 {tg90}%에 필요한 평가 가능 n은 {n90_0}(M0), {n90}(M1), 목표 {tg85}%는 {n85_0}(M0), {n85}(M1)이다. CV {cv50}%이면 목표 {tg90}%에 {n90_50}명(M1)이 필요하다(보고서 5.11절).
    결과 버전 고정({tag} 태그): DECISIONS D-061 기록 기준으로 릴리스 대상 커밋은 e1d73b4였고, 이 작업 환경의 git 프록시가 태그 push를 거부했다. 담당자가 로컬에서 태그를 만들어 push하면 릴리스 워크플로가 소스 아카이브, 규제 패키지 묶음, 해시 목록(무결성 확인값)을 만든다. 표지와 바닥글의 {tag}는 결과 버전 이름이며, 태그는 그 버전의 파일을 고정하는 표시다. 이 결과 보고 덱을 커밋하고 패키지를 다시 만들면 릴리스 대상 커밋이 바뀌므로 태그 전에 대상을 다시 정해야 한다.
    BPD·과학자문 질의 문안: 저장소에는 예상 심사 질의응답(FDA_questions), SAP 문안 제안, 영문 요약만 있고, 의뢰자가 규제기관에 보낼 질의 초안은 없다. 보고서 7절 결론과 예상 질의응답을 바탕으로 작성하는 것이 다음 단계다.
    제출 전 조치(규제 패키지 안내 문서): 가정 목록 해소, 추적표 대조와 사람의 독립 QC 및 서명, FDA·ICH 참고문헌 문구 재확인, 최종 커밋의 깨끗한 트리에서 재생성.
    관련 보고서: 3.2절, 3.3절, 5.9절, 5.10절, 5.11절, 6.5절, 7절, 부록 B(B01~B06).
  notes_tag_done: |
    {tag} 태그가 로컬 저장소에 있다. 릴리스 워크플로가 만든 소스 아카이브, 규제 패키지 묶음, 해시 목록을 확인한다.
    분석법 LLOQ {lloq} mg/L(상태 '{lloq_st}'), 격자 {grid} mg/L: 창 포착률 {thr}% 미만 {cov}, 세트 (i) 신뢰 비율 {r02} · {r078} · {r05}, AUC0-last + Cmax 경계 1종 오류 {p2}(M1), {p2m0}(M0)(2016 모델, 경계 {nc}칸, 칸당 {nt}회).
    잠정 설계값(모두 가정): 첫 채혈 Day 1 투여 후 {t1}일({h0}시간), 방문 허용 범위 투여 후 {a1}일까지 ±{h1}시간, {a2}일까지 ±{h2}시간, 이후 ±{d3}일, 체중 정규(평균 {wm} kg, SD {wsd} kg, {wt} kg 절단), 남성 비율 {sex}, 층 경계 {split} kg.
    주분석 모형: 의뢰자 결정 대기(이 덱의 제안: M1, M0 병기).
    목표 검정력과 n: arm당 무작위배정 {n_rand}명, 평가 가능 {n_arm}명. CV {cv}%, 참 GMR {g}: {pw0}(M0), {pw1}(M1). 목표 {tg90}%: {n90_0}(M0), {n90}(M1); {tg85}%: {n85_0}(M0), {n85}(M1); CV {cv50}%, 목표 {tg90}%: {n90_50}(M1).
    관련 보고서: 3.2절, 3.3절, 5.9절, 5.10절, 5.11절, 6.5절, 7절, 부록 B(B01~B06).
