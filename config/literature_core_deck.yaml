ema_be_guideline_80pct:
  status: "search excerpt"      # not yet compared with the full text
  verification: "Two web-search summaries (2026-09-29) quoting the EMA guideline PDF on ema.europa.eu (guideline-investigation-bioequivalence-rev1_en.pdf); the page is blocked by the analysis-environment egress proxy. The guideline addresses bioequivalence of generic (mainly immediate-release) products; it is cited here as the conventional adequacy threshold for AUC0-t, not as a biosimilar requirement. Compare with the original before external use."
  title: "Guideline on the Investigation of Bioequivalence"
  reference: "CPMP/EWP/QWP/1401/98 Rev. 1/Corr"
  year: 2010
  excerpt: "AUC(0-t) should cover at least 80% of AUC(0-inf). Subjects should not be excluded from the statistical analysis if AUC(0-t) covers less than 80% of AUC(0-inf), but if the percentage is less than 80% in more than 20% of the observations then the validity of the study may need to be discussed."
  coverage_min_pct: 80
  observations_share_pct: 20
