# 개체간 변동(IIV)·잔차 오차·파라미터 불확실성(RSE)
# 출처: FDA Clinical Pharmacology Review, BLA 761055 (Dupixent), Table 4.6.6 – 4.6.7
#   상태: [PENDING] — 표 미제공. 사용자 제공 후 값 입력 (SPEC Q2). 값을 채우면 status를 confirmed로 바꾼다.
# 형태(SPEC §3.5): P_i = P * exp(eta), eta ~ N(0, omega^2);  F: logit-normal
#   omega는 SD(로그 척도). %CV로 보고된 경우 omega = sqrt(log(1 + CV^2)) 로 변환하고 원값을 note에 남긴다.
source: "FDA Clinical Pharmacology Review, BLA 761055, Table 4.6.6-4.6.7 (쪽수 확인 필요)"
status: pending

iiv:
  Vc:   {omega: null, status: pending, source: "BLA 761055 Table 4.6.6"}
  ke:   {omega: null, status: pending, source: "BLA 761055 Table 4.6.6"}
  k12:  {omega: null, status: pending, source: "BLA 761055 Table 4.6.6", note: "표에 없으면 0으로 두고 기록"}
  k21:  {omega: null, status: pending, source: "BLA 761055 Table 4.6.6", note: "표에 없으면 0으로 두고 기록"}
  F:    {omega: null, status: pending, source: "BLA 761055 Table 4.6.6", note: "logit 척도 SD"}
  Vmax: {omega: null, status: pending, source: "BLA 761055 Table 4.6.6"}
  ka:   {omega: null, status: pending, source: "BLA 761055 Table 4.6.6", note: "표에 없으면 0"}
  Km:   {omega: 0,    status: confirmed, source: "SPEC §3.5: 기본 고정, 민감도 K2에서만 부여"}
omega_correlation: null   # 상관행렬 제공 시 파라미터 순서대로 행렬 입력, 없으면 대각

residual:
  # y = C * (1 + eps_p) + eps_a,  eps_p ~ N(0, sigma_prop^2), eps_a ~ N(0, sigma_add^2)
  sigma_prop: {value: null, unit: fraction, status: pending, source: "BLA 761055 Table 4.6.7"}
  sigma_add:  {value: null, unit: mg/L,     status: pending, source: "BLA 761055 Table 4.6.7"}

uncertainty:
  # 바깥층 몬테카를로용. 분산-공분산 행렬(로그 척도)이 있으면 covariance에 입력, 없으면 rse(%)로 대각 근사
  covariance: null
  rse_pct:
    Vc:   {value: null, status: pending, source: "BLA 761055 Table 4.6.6 (RSE%)"}
    ke:   {value: null, status: pending, source: "BLA 761055 Table 4.6.6 (RSE%)"}
    k12:  {value: null, status: pending, source: "BLA 761055 Table 4.6.6 (RSE%)"}
    k21:  {value: null, status: pending, source: "BLA 761055 Table 4.6.6 (RSE%)"}
    F:    {value: null, status: pending, source: "BLA 761055 Table 4.6.6 (RSE%)"}
    Vmax: {value: null, status: pending, source: "BLA 761055 Table 4.6.6 (RSE%)"}
    ka:   {value: null, status: pending, source: "보정 결과의 프로파일 우도 또는 부트스트랩으로 산출"}
