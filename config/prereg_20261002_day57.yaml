# "Day 57 이후 정량 가능 비율: 모델은 그대로, 몬테카를로 + 파라미터 불확실성" 지시(2026-10-02, 초안 모드)와 추가 지시(A 기존 결과 재현, B ①② 모델 불확실성 범위)의 사전 등록 (D-066).
# 동결 규칙: 이 파일을 커밋한 뒤에 계산한다. 결과를 본 뒤 규칙을 바꾸면 D-066에 이유와 함께 적는다.
# 원칙(지시): 공개 모델(2020 주 모델, 2016 민감도 모델)의 구조와 추정값을 바꾸지 않는다. Km, Vmax, F를 재조정하지 않는다.
# 이 지시가 대체한다는 직전 지시("Day 57 이후 정량 가능 비율의 신뢰성 평가")는 이 세션에 도착하지 않았다. 그 지시의 1·4·5절 내용은 알 수 없어
# 이 파일은 이번 지시의 1~5절과 추가 A·B만 등록한다. 직전 지시 4절의 "새 별첨 그림 1"은 아래 deliverables에 해석을 적는다.
version: 1
registered_on: "2026-10-02"
directive: "Day 57 이후 정량 가능 비율: 모델은 그대로, 몬테카를로 + 파라미터 불확실성 (2026-10-02, draft mode) + addendum A (reproduce stored results) and B (model-uncertainty ranges for 1 and 2)"
output_dir: results/day57
scripts:
  mc: scripts/66_day57_mc.R                       # sections 1, 3 (Monte Carlo), 4, A, and all summaries
  uncertainty: scripts/67_day57_param_uncertainty.R   # section 2, section 3 nested, B (runs only when config/param_uncertainty.yaml is complete)
pk_models: [k2020, k2016]                          # display order: 2020 (primary) first
lloq_mg_L: "config/assay.yaml lloq_mg_L (0.078 mg/L = 78 ng/mL), the single study LLOQ"
day_convention: "study Day d = elapsed day d - 1 after the dose (Day 1 = dosing day), as everywhere in this project"
timepoints_study_day: [50, 57, 58, 64, 71, 85]     # elapsed 49, 56, 57, 63, 70, 84
additional_sampling_study_day: [64, 71, 85]        # section 3

section1_monte_carlo:
  population: "trial population: config/trial_design.yaml weight base (normal mean 75 kg, SD 9 kg, truncated 60-90 kg), sex ratio 0.5, no ADA; single 300 mg SC dose"
  n_subjects_per_model: 20000
  engine: "R/cliff.R cliff_subjects(model, 'base', 20000, seed, step, LLOQ, defs = c(1, 2), 'base', design), the exact call of scripts/34_cliff_analysis.R"
  seed: "config/oc_design.yaml cliff seed (20260928); subjects derive_seed(seed, model, 'base', 'subj')"
  grid: "true concentration on seq(0.05, 100, by = 0.05) elapsed days, atol 1e-10, rtol 1e-8, 1,000-subject chunks; LLOQ crossing interpolated linearly in log C between grid points"
  above_lloq_at_day: "share of subjects whose true concentration is above the LLOQ at study Day d = share with LLOQ reach time (elapsed) + 1 > d; subjects that never reach the LLOQ within 100 days count as above (none expected)"
  check_direct: "the same subjects are also solved at elapsed 49, 56, 57, 63, 70, 84 and the direct indicator C >= LLOQ is compared with the reach-time indicator (must agree for every subject)"
  interval: "Wilson 95% (R/summarize.R wilson_ci)"
  reach_day_percentiles: [0.50, 0.90, 0.95, 0.99]   # quantile type 7 on study day (elapsed + 1), as cliff_summary.csv

section2_parameter_uncertainty:
  replaces: "original-data bootstrap (not available)"
  inputs: "config/param_uncertainty.yaml: per model, the estimate and relative standard error (RSE) of every estimated parameter from Kovalenko 2020 Table 1 Model 1 and its supplementary table (2020 model) and Kovalenko 2016 Table 2 'BLQ data included' (2016 model)"
  inputs_status: "PENDING: no RSE is recorded in this repository (DECISIONS D-012 notes that no RSE or variance-covariance was ever supplied) and the papers cannot be opened in the analysis environment (every literature host is blocked by the network policy on 2026-10-02). The script stops while any parameter to be sampled has no RSE. The inputs are committed (config, then commit) before the run, as every other result-changing item."
  sampling:
    form: "lognormal around the published estimate: P_s = P_hat * exp(z * sdlog), z ~ N(0, 1), sdlog = sqrt(log(1 + RSE^2)); the published estimate is the median of the sampled values"
    covariance: "independent across parameters (no covariance is reported); stated with every result"
    iiv_and_residual: "IIV variances and the proportional residual SD are sampled the same way when their RSE is reported; otherwise they stay fixed and are listed as such"
    fixed_excluded: "parameters reported as fixed stay fixed and are labelled 'excluded from the uncertainty analysis': Km (both models), the additive residual 0.03 mg/L (both models), structural zeros (IIV of k12, k21, F, Km), the number of transit compartments (2020 model), the reference weight 75 kg, and the LLOQ"
    derived: "parameters derived from sampled ones are recomputed per set in the paper's parameterisation (2020 model: k21 = k12 / Mpc when the paper reports Mpc)"
    n_sets: 1000
    seed: "derive_seed(20261002, 'pset', model, s) for set s = 1..1000; set 0 = the published estimates (reference, reported separately)"
    pilot: "sets 1-200 first (the directive's pilot); the expected full run is above one hour, so the pilot is reported before sets 201-1000"
  per_set:
    n_subjects: 2000
    population: "as section 1 (trial population)"
    simulation: "R/mc.R run_individual_population(2000, p_s, design, 'B0', 20261002, base weights, jitter = TRUE, tag = paste('pu', model, s)) for the NCA (B), and the same subjects solved at elapsed 49, 56, 57, 63, 70, 84 for the true-concentration shares"
    outputs: ["share above the LLOQ at each study day in timepoints_study_day", "B1: share failing set (iii) (adjusted R-squared >= 0.90 and extrapolation <= 20%, the deck's definition)", "B2: 5th percentile of the true AUClast/AUCinf (coverage_true)"]
  summary: "across sets: median and 2.5th-97.5th percentiles (the directive's 'a% (95% interval b-c%)'); also the mean binomial Monte Carlo variance of a 2,000-subject set, so that the part of the interval that is Monte Carlo noise is visible"
  wording: "모델 불확실성을 반영하면 Day 58 이후 정량 가능 비율은 a%(95% 구간 b~c%)  [a = median across sets, b-c = 2.5th-97.5th percentiles; Day 58 = the first day after the last scheduled sample, Day 57]"

section3_trial_level:
  design: "config/trial_design.yaml: 117 evaluable subjects per arm (dropouts are not modelled, as in every trial run of this project), two arms, weight-stratified 1:1 allocation (R/population.R assign_arms_stratified; strata 60-75, >75-90 kg), the same weight distribution as section 1; both arms receive the same product"
  n_trials: 10000
  seed: "derive_seed(20261002, 'trial3', model, j, 'subj' | 'alloc' | arm, 'eps') for trial j"
  primary: "number of subjects per arm and per trial (234) whose true concentration is >= LLOQ at study Day 64, 71 and 85 (Day 58 shown for reference)"
  secondary: "the same count for observed concentrations (true concentration with the model's residual error, nominal time, BLQ if below the LLOQ)"
  summary: "per arm (both arms pooled, 20,000 arm-trials) and per trial: median, 95th percentile, mean, share of trials with at least one quantifiable subject, maximum"
  nested: "section 2 sets 1-200 as the outer loop x 200 trials per set (same design, seed derive_seed(20261002, 'trial3n', model, s, j, ...)); the predictive median and 95th percentile pooled over the 40,000 trials are the 'upper bound' row; runs only with section 2 inputs"

section4_label:
  label:
    text: "after the last steady-state dose, median time to non-detectable concentration (< 78 ng/mL)"
    q2w_300mg_weeks: 10
    qw_300mg_weeks: 13
    source: "Dupixent USPI section 12.3, original 2017 label (accessdata.fda.gov 761055lbl.pdf): 'After the last steady-state dose of 300 mg Q2W or 300 mg QW, the median times to non-detectable concentration (<78 ng/mL) are 10 and 13 weeks, respectively'. The current USPI pools regimens: 'ranged from 9 to 13 weeks in adults and pediatric subjects 12 to 17 years of age'."
    status: "reviewer verified, search excerpt (the label PDF cannot be opened in the analysis environment; two independent search excerpts on 2026-10-02 gave the same per-regimen values)"
  simulation:
    population: "config/population_atopic.yaml primary (lognormal mean 78 kg, SD 19 kg, truncated 40-180 kg), sex ratio 0.5, no ADA; no disease covariate (the models have none): a stated limitation"
    regimens: {Q2W: "600 mg on day 0, then 300 mg every 14 days from day 14 to day 364", QW: "600 mg on day 0, then 300 mg every 7 days from day 7 to day 364"}
    steady_state_check: "trough before the last dose within 1% of the trough one interval earlier (population median), reported"
    n_subjects: 10000
    seed: "derive_seed(20261002, 'label', model, regimen)"
    endpoint: "time from the last dose (day 364) until the true concentration first falls below 0.078 mg/L; grid 0.1 day up to 300 days after the last dose, crossing interpolated linearly in log C"
  comparison: "difference % = 100 x (model median - label median) / label median, per model and regimen"
  interpretation:
    within_20pct: "|difference| <= 20%: the tail prediction near the LLOQ agrees with external data"
    model_shorter: "difference < -20%: the share above the LLOQ after Day 58 may be underestimated; stated as a limitation only, no recalibration"
    model_longer: "difference > +20%: overestimation direction (conservative)"

addendum_A_reproduction:
  targets: "results/cliff/cliff_subjects.rds (weight base: per-subject t_lloq, both models) and results/cliff/cliff_summary.csv (lloq_studyday_median, p05, p95, lloq_after_day58_pct; stored 2.47% for the 2016 model and 4.595% for the 2020 model)"
  rule: "same model, seed and definition: per-subject t_lloq identical (maximum absolute difference 0) and summary values identical; if a value differs, report the difference and its cause"
  deck: "the deck's numbers 1-3 are not changed"

addendum_B_ranges:
  values: ["1: share failing set (iii)", "2: 5th percentile of the true AUClast/AUCinf"]
  method: "section 2 sets (1,000 x 2,000 subjects); 2.5th-97.5th percentiles across sets"
  deck: "point estimates unchanged; append '(모델 불확실성 95% 구간 x~y)' in S5 and A3a (1), S6 and B2 (2), and the S2 card 1 and 2 description lines; runs only with section 2 inputs"
  a12_line: "③ 1종·2종 오류는 파라미터 불확실성을 반영하지 않았고, 구조 민감도는 두 모델 비교로 갈음했다"

addendum_C_day57_trial_level:
  directive: "Day 57 arm당 정량 가능 인원 추가 (2026-10-02, draft mode)"
  registered_on: "2026-10-02"
  post_hoc: "added after the section 3 results were seen; study Day 57 was not in the section 3 grid (Days 58, 64, 71, 85). Registered and committed before the Day 57 computation."
  stored_data: "section 3 stored only per-arm counts at study Days 58, 64, 71 and 85 (results/day57/trials/), not per-subject concentrations, so the Day 57 counts are computed anew"
  added_timepoint_study_day: 57                    # elapsed day 56
  method: "the same 10,000 trials per model with the same seeds: derive_seed(20261002, 'trial3', model, j, 'subj' | 'alloc'), 117 subjects per arm, weight-stratified allocation; true concentration at elapsed days 56 (Day 57) and 57 (Day 58) from one rxode2 solve per 250-trial block (solve_model, the section 3 tolerances); no residual error draws (the endpoint is the true concentration; the stored section 3 eps streams are not touched)"
  check: "the Day 58 per-arm true counts equal the stored section 3 counts for every trial and arm (confirms the same subjects); any mismatch is reported with its cause"
  outputs: "per arm (both arms pooled, 20,000 arm-trials): median and 95th percentile (quantile type 7), share of arms with at least one subject at or above the LLOQ; per trial (234 subjects): median"
  comparison: "the reviewer's binomial approximation (values below, per arm); shown side by side with the difference. For reference, the binomial quantiles (qbinom) with n = 117 and p = the section 1 Day 57 share are also shown."
  reviewer_binomial_per_arm:
    k2020: {median: 6, p95: 11}                    # Kovalenko 2020
    k2016: {median: 3, p95: 7}                     # Kovalenko 2016
  script: "scripts/66_day57_mc.R modes trials57 and summary"
  output_dir: results/day57/trials57

deliverables:
  new_appendix: "the earlier directive's section 4 'new appendix figure 1' is interpreted as: share of subjects above the LLOQ by study day (Day 50-85), both models, Monte Carlo points with Wilson intervals and the section 2 band; the section 3 table (quantifiable subjects per arm) attached. Built after the section 2 run."
  limitation_line: "Km은 공개 모델에서 고정값(0.01 mg/L)이라 불확실성 분석에 포함되지 않는다(FDA BLA 761055 리뷰가 검토한 모델 구조)"
  reply_sentence: "공개 모델을 그대로 써서 개인차와 모델 불확실성을 모두 반영하면, Day 57 이후 정량 가능한 대상자는 a%(95% 구간 b~c%), 우리 시험에서 arm당 중앙값 n명(95번째 백분위수 m명)이다. [a, b-c: section 2 Day 58; n, m: section 3 Day 58 per arm, nested run when available]"
