# 제품 차이 시나리오 설계 원칙과 경계 1종 오류 분석 (검토 의견 2026-09-24 §3–§4, D-040).
# 사전 고정: 이 파일은 결과를 만들기 전에 커밋한다. 보고서는 이 파일을 커밋한 해시를 적는다(scripts/30–33이 읽는다).
# 기존 임의 배율 시나리오(config/scenarios.yaml의 F085, VM150 등)는 "예비 탐색"으로 강등한다.
version: 1
prespecified_on: "2026-09-24"

# 3-1 정답(추정 대상) 정의
estimand:
  quantity: "시험약/대조약 모집단 기하평균비 = exp(mean(log X_T,i) - mean(log X_R,i))"
  auc: "모델 적분 AUC0-inf(잔차 없음): AUC 상태를 400일까지 적분, 400일 잔여량/투여량 > 1e-6이면 경고"
  cmax: "모델 Cmax(잔차 없음, 연속 시간): 0-40일 0.25일 간격 격자 최대점 주변 3점 포물선 보간"
  population:
    n_subjects: 200000
    paired_crn: "같은 가상 대상자(공통 난수)에 대조약 파라미터와 시험약 파라미터를 각각 적용해 짝지어 추정"
    weight: base            # trial_design.yaml weight.base (정규 75, SD 9, 절단 60-90 kg)
    sex_ratio_male: 0.5
  judge: "AUC0-inf 참값 비가 0.80-1.25 안이면 '범위 안'(규제기관 1차 지표를 심판으로; AUClast가 아님)"
  overall_true_equivalence: "참 AUC0-inf 비와 참 Cmax 비가 모두 0.80-1.25 안"
  dose_mg: 300

# 3-2 기전 범위(전수, 양방향): 시험군 고정효과 배율
mechanisms:
  F:    {parameter: F,    range: [0.1, 10],   note: "상한은 시험군 F <= 1 (배율 <= 1/F_ref)로 절단"}
  ka:   {parameter: ka,   range: [0.1, 10],   note: "Model 1은 흡수 구획 ka(MTT 불변)"}
  ke:   {parameter: ke,   range: [0.1, 10],   note: "선형 소실(FcRn 경로)"}
  Vmax: {parameter: Vmax, range: [0.1, 10],   note: "표적 매개 소실 용량(내재화)"}
  Km:   {parameter: Km,   range: [0.01, 100], note: "결합(MM 근사 상수)"}
  V2:   {parameter: V2,   range: [0.1, 10],   note: "말초 분포용적. 구획 간 청소율 Q = k12*Vc 고정 -> k21 / 배율"}
directions: [down, up]      # down: 배율 [하한, 1], up: 배율 [1, 상한]
targets: [0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.05, 1.11, 1.18, 1.25, 1.33, 1.43]
boundary_targets: [0.80, 1.25]
inversion:
  method: "로그 배율 이분법. (1) 20,000명(200,000명의 앞부분)으로 방향별 구간 끝 참값 비 계산 -> 목표가 구간 안이면 이분법(허용 오차 0.02%)
    (2) 200,000명으로 참값 비 재계산, 목표의 +-0.1% 밖이면 200,000명으로 이분법을 이어 +-0.1% 이내까지"
  tolerance_rel: 0.001
  screening_subjects: 20000
  screening_tolerance_rel: 0.0002
  max_iter: 60
  unreachable: "구간 끝에서도 목표에 닿지 않으면 '도달 불가'와 구간 끝의 참값 비(AUC0-inf, Cmax)를 보고"
models: [k2016, k2020]

# 3-5 시험 반복
trials:
  n_per_arm: 117
  schedule: B0
  weight: base
  method: pooled_t
  reps_boundary: 10000      # 참값 0.80, 1.25 (기전·방향·모델별)
  reps_identity: 10000      # 참값 1.00 (동일 제품, 모델별)
  reps_other: 2000          # 나머지 목표값
  batch: 500                # 체크포인트 단위
  master_seed: 20260923     # 제품 시나리오 시험과 같은 시드 규칙(동일 제품 시험은 products 실행과 같은 난수)

# 3-4 평가 대상 구성 (pass = 구성 안의 모든 평가변수가 90% CI 80.00-125.00% 안)
configurations:
  P2:  {label: "제안: AUClast + Cmax",                       endpoints: [AUClast, Cmax]}
  F3A: {label: "fallback: AUClast + Cmax + AUCinf(규칙 A)",   endpoints: [AUClast, Cmax, AUCinf_A]}
  F3B: {label: "fallback: AUClast + Cmax + AUCinf(규칙 B)",   endpoints: [AUClast, Cmax, AUCinf_B]}
  F3C: {label: "fallback: AUClast + Cmax + AUCinf(규칙 C)",   endpoints: [AUClast, Cmax, AUCinf_C]}
  G2:  {label: "가이드라인 기본: AUCinf(규칙 A) + Cmax",       endpoints: [AUCinf_A, Cmax]}
  AUClast_only: {label: "참고: AUClast 단독", endpoints: [AUClast]}
  AUCinf_only:  {label: "참고: AUCinf(규칙 A) 단독", endpoints: [AUCinf_A]}
aucinf_rules:
  A: "신뢰 플래그(Rsq_adjusted < 0.80, AUC_%Extrap_obs > 20, span ratio < 2) 또는 λz 산출 불가 대상 제외"
  B: "λz 산출 가능 전원 포함"
  C: "플래그 또는 λz 산출 불가 대상은 AUCinf 자리에 AUClast 대입"

# 3-3 무작위 다변량 제품 공간
random_space:
  n_products: 20000
  design: latin_hypercube          # 각 차원 20,000 층, 층 안 균등 -> 로그 균등 변환, 차원별 독립 순열
  distribution: log_uniform
  ranges: {F: [0.80, 1.25], ka: [0.67, 1.50], ke: [0.80, 1.25], Vmax: [0.67, 1.50], Km: [0.2, 5], V2: [0.90, 1.11]}
  truth_subjects: 1000             # 제품별 참값: 모든 제품이 같은 1,000명(공통 난수) 사용. 200,000명 대비 편차이며 제품별 참값의 MC 표준오차를 함께 보고
  trials_per_product: 1
  models: [k2016, k2020]
  lhs_seed: 20260927
  truth_seed: 20260927
  trial_master_seed: 20260926     # 제품 i = 시험 i
  bins_log_width: 0.02             # 참값 비(log) 구간 폭
  smoothing: "로지스틱 회귀, 자연 3차 스플라인(df = 6) of log(참 AUC0-inf 비), 구성별"
  near_boundary: {low: [0.75, 0.85], high: [1.18, 1.33]}
  risks:
    consumer: "참값 범위 밖 제품 중 통과 비율(전체, 경계 근처: 0.75 <= 참값 < 0.80 또는 1.25 < 참값 <= 1.33)"
    producer: "참값 범위 안 제품 중 불통과 비율(전체, 경계 근처: 0.80 <= 참값 <= 0.85 또는 1.18 <= 참값 <= 1.25)"

truth_seed: 20260924               # 역산용 200,000명 공통 난수 대상자: derive_seed(truth_seed, "truth200k", model)

# §2 절벽 채혈 분석(결과 생성 전 고정)
cliff:
  definition_days: [1, 2]          # 순간 반감기 ln2 / (-d ln C/dt) < 1일(주), < 2일(민감도), tmax 이후 처음 기준 미만이 된 시점부터 LLOQ 도달까지
  lloq: 0.078
  grid_step_day: 0.05              # 참 농도 격자 0-100일. d ln C/dt는 ODE 상태값으로 정확히 계산(수치 미분 아님), 교차 시점은 격자 사이 선형 보간
  derivative: "dC/dt = (ka*흡수구획 - (ke + k12)*central + k21*periph - Vmax*C/(Km + C)*Vc) / Vc"
  n_subjects: 20000
  weights: {base: base, obese_110_130: {dist: uniform, trunc: [110, 130]}, obese_90_110: {dist: uniform, trunc: [90, 110]}, obese_130_150: {dist: uniform, trunc: [130, 150]}}
  schedules:
    current: [0.25, 1, 3, 5, 7, 10, 14, 21, 28, 35, 42, 49, 56]
    plus_39_46: [38, 45]
    plus_39_46_53: [38, 45, 52]
    plus_32_39_46_53: [31, 38, 45, 52]
    plus_40_47: [39, 46]
    daily_29_57: "28..56 매일(경과일)"
  timing: [nominal, windowed]      # 명목일, 방문 허용창(trial_design.yaml sampling_window_days)
  seed: 20260928
