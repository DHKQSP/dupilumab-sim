# 파라미터 불확실성 입력(사전 등록 config/prereg_20261002_day57.yaml section2, D-066): 논문의 추정값과 상대 표준오차(RSE).
# 상태: 미입력. 이 저장소에는 RSE가 기록된 적이 없고(D-012: 지시서가 RSE·분산-공분산을 주지 않음), 분석 환경에서는 논문을 열 수 없다
# (2026-10-02: NCBI, Europe PMC, Wiley, ResearchGate, Semantic Scholar, Crossref, doi.org, archive.org 모두 네트워크 정책으로 차단).
# 채우는 법: 각 항목에 rse(비율, 예: 12.3% → 0.123)를 넣는다. 논문이 RSE를 보고하지 않은 항목은 not_reported: true로 적는다(그 항목은 고정).
# 고정으로 보고된 항목(fixed: true)은 바꾸지 않는다. 추정값(estimate)은 모델 config와 같아야 하며 scripts/67이 대조한다.
# 입력을 채운 뒤 이 파일을 커밋하고 나서 scripts/67을 실행한다(동결 규칙).
