# 단계 1 검증 설계 — 출처: Clot 2021, Int Immunopharmacol (study PKM14160)  [서지·표·쪽수 PENDING, SPEC Q7]
# 투여 Day 1, 채혈 Day 2·4·8·11·15·22·29·36·43·50·57 → 투여 후 경과일로 변환 (DECISIONS D-003)
study: PKM14160_Clot2021
route: SC
n_per_arm: 8
dose_mg_default: 300
lloq_mg_L: 0.078
sample_days_post_dose: [1, 3, 7, 10, 14, 21, 28, 35, 42, 49, 56]
targets:
  - {dose_mg: 300, auc_ratio_pct: 98.0, tlast_median_day: 42, tlast_range_day: [28, 49], source: "Clot 2021 (PENDING 표·쪽수)"}
  - {dose_mg: 200, auc_ratio_pct: 94.6, tlast_median_day: 28, tlast_range_day: null, source: "Clot 2021 (PENDING 표·쪽수)"}
  - {dose_mg: 600, auc_ratio_pct: 98.1, tlast_median_day: 56, tlast_range_day: null, source: "Clot 2021 (PENDING 표·쪽수)"}
tolerances:
  auc_ratio_abs_pct: 1.5     # NCA 기반 비율의 허용 절대오차(%p) — DEV-가정, 확인 필요
  tlast_median_exact: true   # 주간 채혈이므로 중앙값은 정확히 일치해야 함
variability_checks:
  li2020:   {dose_mg: 300, metric: AUClast, cv_pct_range: [35, 51], source: "Li 2020 Table 3 (서지·쪽수 PENDING)"}
  cohen2022: {dose_mg: 200, metric: AUClast, log_sd: 0.49, tolerance_abs: 0.10, source: "Cohen 2022 (서지·표·쪽수 PENDING)"}
