# 추가 지시 2026-09-26(임상약리 결정 반영과 잔여 분석)의 사전 등록 (D-053).
# 동결 규칙: 결과를 바꾸는 항목은 이 파일에 적고 커밋한 뒤에 실행한다. 절마다 그 절의 결과를 만들기 전에 커밋하며,
# 절별 등록 시점은 이 파일의 git 이력(git log -p config/prereg_20260926.yaml)으로 확인한다. 등록 뒤 바꾼 항목은 이 파일에 "변경"으로 남긴다.
# 기존 사전 고정 파일(config/oc_design.yaml, 커밋 779e068)은 바꾸지 않는다. 시드 규칙·역산 배율·평가변수 정의는 그 파일과 같다.
version: 1
registered_on: "2026-09-25"   # 실제 등록일(git 커밋 시각 기준). 지시문 표기일은 2026-09-26
directive: "추가 지시 2026-09-26"
release_after_completion: v1.0.1

# ---------------------------------------------------------------------------------------------------------------------
# §1 분석 모형 재판정 (근거: ICH E9 5.7 층화 무작위배정 인자를 분석에서 고려, FDA 2023 공변량 보정 가이던스)
section1:
  question: "log 척도 pooled t(M0)와 체중 층 보정 ANOVA(M1)·log 체중 ANCOVA(M2)에서 경계 1종 오류, 분류, 시험 간 SD / 시험 안 SE, 검정력이 어떻게 달라지는가"
  analysis_models_run: [M0, M1, M2]
  analysis_models:
    M0: {label: "pooled two-sample t on the log scale (current)", formula: "log(Y) ~ treatment", df: "n_R + n_T - 2", role: "current analysis; reference"}
    M1: {label: "log-scale ANOVA with treatment and body-weight stratum", formula: "log(Y) ~ treatment + stratum",
         stratum: "randomization stratum recorded at allocation: 60-75 kg and >75-90 kg (trial_design.yaml stratification.split_kg = 75; right-closed)",
         df: "n_R + n_T - 3", role: "primary-analysis candidate (stratification factor of the randomization in the model)"}
    M2: {label: "log-scale ANCOVA with treatment and log body weight", formula: "log(Y) ~ treatment + log(WT)", df: "n_R + n_T - 3", role: "sensitivity"}
  common:
    ci: "90% two-sided t interval for the treatment effect on the log scale, back-transformed; pass = interval within 80.00-125.00%"
    subjects: "per endpoint the same evaluable subjects as M0 (rule A excludes flagged subjects; the models are fitted to the subjects with a positive value)"
    no_interaction: "no treatment x stratum or treatment x weight interaction"
    not_estimable: "if the design matrix is singular (for example a stratum empty within an endpoint's evaluable set) the model is not estimable and the endpoint counts as not passing, as for M0 with fewer than 2 subjects per arm; the count is reported"
    implementation: "closed-form normal equations (R/oc_models.R be_models_fast), checked against lm/confint in tests/testthat/test-oc-models.R"
  pk_models: [k2016, k2020]
  master_seed: 20260923            # oc_design.yaml trials$master_seed (같은 값이어야 한다; scripts/44가 검사)
  scenarios:
    identity: S00
    boundary: "the 8 boundary cells per PK model: results/oc/inversion_<model>_*.csv reachable rows at targets 0.80 and 1.25 (same multipliers as scripts/31, 40, 42)"
    products:
      F097: {F: 0.97}              # config/scenarios.yaml F097(시험군 F × 0.97)
  trials: [1, 10000]               # 모든 시나리오 시험 1-10,000 (oc_design.yaml reps_boundary)
  extension:
    config: P2
    threshold_pct: 5
    analysis_models: [M0, M1]
    to: 20000
    rule: "D-048 rule applied per analysis model: if the Wilson 95% interval of the P2 boundary type I error at the pre-fixed 10,000 trials includes 5% (lo <= 5 <= hi) under M0 or under M1, the boundary cell is extended to trials 10,001-20,000 (single-cell scenario list, same seeds); all three analysis models are then reported at 20,000 trials, with the 10,000-trial values alongside"
  verification:
    - "M0 regenerated for S00 and the 8 boundary cells equals results/oc/oc_rejudge_be_<model>.csv.gz for all 8 endpoints and trials 1-10,000 (relative difference <= 1e-6 on GMR and CI because the stored file has 7 significant digits; pass, n_R, n_T identical)"
    - "M0 of an extended cell equals results/oc/oc_trials_ext_be_<model>.csv.gz where that file has the cell (k2020 V2_up_080, trials 10,001-20,000); otherwise trial 10,000 regenerated with the single-cell list equals the stored row"
    - "M0 of F097 equals the stored product runs for the 6 original endpoints: k2016 results/trials5000/products5000_be_raw_base.csv.gz trials 1-5,000; k2020 results/trials/products_be_raw_struct2020.csv.gz trials 1-500 (relative difference <= 1e-12)"
    - "any mismatch stops the run before writing"
  configurations: [P2, G2_Aii, G2_Ai, G2_B, G2_Cii, G2_Ci, F3A, F3B, F3C, AUClast_only, AUCinf_true_only]
  configuration_endpoints:
    P2: [AUClast, Cmax]
    G2_Aii: [AUCinf_A, Cmax]
    G2_Ai: [AUCinf_Ai, Cmax]
    G2_B: [AUCinf_B, Cmax]
    G2_Cii: [AUCinf_C, Cmax]
    G2_Ci: [AUCinf_Ci, Cmax]
    F3A: [AUClast, Cmax, AUCinf_A]
    F3B: [AUClast, Cmax, AUCinf_B]
    F3C: [AUClast, Cmax, AUCinf_C]
    AUClast_only: [AUClast]
    AUCinf_true_only: [AUCinf_true]
  outputs:
    type1: "boundary type I error = pass % at the 16 boundary cells, per analysis model and configuration, Wilson 95% interval"
    classification: "Wilson 95% interval versus 5%: upper < 5 conservative, lower > 5 exceeding, otherwise nominal (R/oc_interpret.R classify_type1)"
    paired_change: "M1 minus M0 and M2 minus M0 in pass % on the same trials, paired 95% interval"
    sd_se: "between-trial SD of the log GMR / median within-trial SE, per cell, endpoint and analysis model (se taken directly from the fit)"
    power: "pass % in S00 (identical products) and F097, per configuration and analysis model, Wilson 95% interval; paired change versus M0"
    decomposition: "P2 - 5 = (AUCinf_true only - 5) + (AUClast only - AUCinf_true only) + (P2 - AUClast only), percentage points, per cell and analysis model"
    bias: "mean log GMR minus log true ratio (AUC endpoints versus the true AUC0-inf ratio, Cmax versus the true Cmax ratio), Monte Carlo 95% interval"
  expectations_recorded_before_results:   # 사용자 예상(지시문), 결과 전에 기록. 결과와 대조해 보고한다
    - "under M1 the unbiased reference (AUCinf_true only) is close to 5% and the SD/SE ratio is close to 1"
    - "P2 rises slightly under M1 compared with M0"
    - "the Model 1 (k2020) V2 x2.28 cell may reach about 5.6% under M1 (exceeding)"
  expectation_checks:              # 변경(추가) 2026-09-25: section1 실행 시작 뒤, 어떤 section1 결과도 읽기 전에 판정 기준을 수치로 적음
    e1_cell_range_pct: [4.0, 6.0]  # M1 불편 참조: 16칸 합산 Wilson 구간이 5% 포함, 칸별 점추정이 이 범위 안
    e1_sd_se_range: [0.97, 1.03]   # M1 AUCinf_true의 SD/SE: 칸마다 이 범위 안(10,000회에서 SD의 95% 표본 변동 약 +-1.4%)
    e2_min_cells_up: 14            # P2 M1 - M0 > 0인 칸이 16칸 중 이 수 이상
    e2_max_mean_rise_pp: 1.5       # "소폭": 평균 상승이 0 초과, 이 값(%p) 이하
    e3_expected_pct: 5.6           # Model 1 V2 x2.28 칸의 M1 P2
    e3_tolerance_pp: 0.3           # 점추정이 5.6 +- 0.3% 안이면 일치(분류는 함께 보고)
  reporting_rule: "if any P2 cell has a point estimate above 5% under any analysis model, the first paragraph of the conclusions states for each such cell: mechanism and direction, multiplier, size (pass %), Wilson 95% interval, analysis model, and the quantitative cause (bias of the AUClast GMR toward 1 in % and the decomposition terms in percentage points); plausibility is stated as facts only (the mechanism requires a peripheral volume of distribution at least about 2-fold that of the reference for an IgG4 antibody with the same amino acid sequence)"
  decision_owner: "the choice of the primary analysis model is the sponsor's; the report shows M0 and M1 side by side"
  out_dir: results/oc_models
  scripts: [scripts/44_oc_models.R, scripts/45_oc_models_summary.R]

# ---------------------------------------------------------------------------------------------------------------------
# §2 LLOQ 범위 민감도 (등록 2026-09-25, 이 절의 결과 생성 전). 연구 LLOQ의 단일 출처는 config/assay.yaml(D-054).
# 공개: 코드 개발 중 시험 1·2(k2016)와 400명 점검, 절벽 도달일 중앙값(LLOQ 0.02·0.078·0.5)을 보았다. 설계(격자·지표·시나리오·시험 수)는 지시문이 정했다.
section2:
  question: "스폰서 분석법 LLOQ가 0.078 mg/L와 다를 때 AUClast 포착, AUC0-inf 산출 가능성·신뢰성, 절벽 채혈, 경계 1종 오류가 어떻게 달라지는가"
  lloq_grid_mg_L: [0.02, 0.05, 0.078, 0.1, 0.2, 0.5]   # config/assay.yaml lloq_sensitivity_mg_L와 같아야 한다(scripts/46이 검사)
  reference_lloq_mg_L: 0.078                           # 쌍대 비교 기준(현재 연구 LLOQ)
  censoring: "same subjects, sampling times and residual draws (y_raw) re-censored at each LLOQ with the simulation rule: pre-dose or y_raw < LLOQ is BLQ; NCA BLQ handling unchanged"
  residual_variants:
    - fixed     # 1차: 잔차 모형 그대로(가산 SD 0.03 mg/L, 모델 개발 자료 LLOQ 0.078에서 추정)
    - scaled    # 2차(지시 외 추가): 가산 잔차 SD x (LLOQ / 0.078), LLOQ에서의 상대 정밀도 유지. 같은 시드로 잔차를 다시 뽑고 배율 1에서 저장 y_raw 재현을 검사
  residual_rationale: "with the fixed additive SD of 0.03 mg/L a noise-only sample reads at or above 0.02 mg/L with probability about 25%, so a low LLOQ under the fixed variant also tests the residual assumption; the scaled variant keeps the precision at the LLOQ constant"
  individual:
    pk_models: [k2016, k2020]
    population: "scripts/10 populations: variants base (k2016) and struct2020 (k2020), 20,000 subjects, 60-90 kg, tags ind_base and ind_struct2020, master seed 20260923, all schedule_analysis schedules drawn on the union grid; B0 analysed"
    metrics: [extrap_true_median, extrap_true_p95, coverage_lt80_pct, extrap_median, extrap_p95, extrap_gt20_pct, reliable_no_span_pct, reliable_pct, lambda_fail_pct, tlast_median, tlast_p05, tlast_p95, quant_at_last_pct, tlast_planned_distribution]
    paired_changes: "versus LLOQ 0.078 within residual variant: reliability (i) and (ii), lambda-z failure, coverage below 80%, NCA extrapolation above 20% (paired proportion differences, 95% interval)"
    verification: "fixed variant at 0.078 reproduces results/individual/individual_<variant>.csv row B0 (relative 1e-9) and results/individual/nca_<variant>_20000.rds B0 (subject level, exact)"
    cliff: "cliff populations of scripts/34 (seed 20260928, base weight, 20,000 subjects per model), schedule current (B0), nominal and windowed times, cliff-start definitions 1 and 2 days; cliff end = time the true concentration reaches each LLOQ; share of subjects with 1 or more, 2 or more, 3 or more samples in the cliff; the 0.078 rows reproduce results/cliff/cliff_subjects.rds and cliff_points.csv exactly"
  trial:
    pk_model: k2016                  # 주 모델(D-023)
    scenarios: [S00, Vmax_up_080, Vmax_down_125, F_down_080]   # 경계: Vmax 양방향, F 하향 + 동일 제품(검정력)
    trials: [1, 5000]
    analysis_models: [M0, M1]
    endpoints: [Cmax, AUClast, AUCinf_A, AUCinf_B, AUCinf_true]
    configurations: [P2, G2_Aii, G2_B, AUClast_only, AUCinf_true_only]
    outputs: "boundary type I error (Wilson 95%) and paired change versus LLOQ 0.078 (same trials, same analysis model and residual variant); power in S00; drop counts (lambda-z, flags) and median tlast per arm"
    verification: "M0, fixed variant, LLOQ 0.078 equals results/oc/oc_rejudge_be_k2016.csv.gz for trials 1-5,000 (relative 1e-6, pass and n identical); scaled variant at 0.078 equals fixed (bit-identical y_raw check in every trial)"
  out_dir: results/lloq
  scripts: [scripts/46_lloq_sensitivity.R]

# ---------------------------------------------------------------------------------------------------------------------
# §3 표본 수 표 (등록 2026-09-25, 이 절의 결과 생성 전).
# 공개: 코드 조사 중 저장된 20,000명 B0 자료에서 입력값(분산 분해)을 계산했고, 분석식의 원형을 n = 117에서 저장된 경험 검정력과 대조했다. 격자의 검정력·필요 n은 계산하지 않았다.
section3:
  target: "P2 joint power (AUClast and Cmax both with 90% CI within 80.00-125.00%)"
  grid:
    auclast_cv_pct: [35, 40, 43, 46, 50, 52]      # 총 개체 간 CV(로그 정규: sigma^2 = log(1 + CV^2); 로그 정규에서 산술 SD/평균과 같은 정의)
    true_gmr: [0.90, 0.95, 1.00]
    n_evaluable_per_arm: [100, 117, 130, 140]
  base_cv_pct: 43                                  # 프로토콜 가정(Syneos 제안). 민감도 50
  sensitivity_cv_pct: 50
  cv_sources:
    - "Li 2020 Table 3 (p. 750), 300 mg arms: SD/mean 35.4-51.4% (6 arms), pooled 42.0% (config/design_clot2021.yaml arm_checks_300mg)"
    - "Cohen 2022: log SD 0.49 (CV about 52%), 200 mg, different presentation, device comparison (config/design_clot2021.yaml)"
    - "protocol assumption 43% (Syneos proposal)"
    - "PK models, 60-90 kg, B0, 20,000 subjects: AUClast log-CV 40.3% (2016 model), 42.8% (Model 1)"
  inputs_from_simulation:
    source: "results/individual/nca_base_20000.rds (primary, 2016 model) and nca_struct2020_20000.rds (sensitivity), schedule B0"
    estimated: "OLS slopes of log AUClast and log Cmax on log body weight; total SD of log Cmax; total correlation of log AUClast and log Cmax; computed by scripts/47 and written to results/sample_size/ss_inputs.csv"
    cmax_cv: "held at the simulated value (primary); sensitivity: Cmax log SD = (simulated ratio of Cmax to AUClast log SD) x AUClast log SD"
    correlation: "total correlation of log AUClast and log Cmax held at the simulated value"
  data_generating_model: "log Y = mu + tau x T + beta x (log WT - mean) + e for AUClast and Cmax; WT ~ normal(75, 9) truncated 60-90 kg; stratum WT > 75; 1:1 allocation within stratum (odd leftovers alternated); e bivariate normal with variances total minus beta^2 Var(log WT) and covariance matching the total correlation"
  cmax_gmr: "equal to the AUClast GMR (primary, conservative); sensitivity: log Cmax ratio = k x log AUC ratio with k from the F-down inversion scenarios (about 0.72)"
  methods:
    analytic: "bivariate normal rectangle for the two treatment estimators with the standard error fixed at its expectation: M1 uses the within-stratum variance for the estimator and the SE (df 2n - 3); M0 uses the within-stratum variance for the estimator (stratified allocation) and the total variance for the SE (df 2n - 2)"
    statistical_mc: "subject-level simulation of the data-generating model, 5,000 trials per grid cell (all 72 cells), M0 and M1 on the same trials; seed derive_seed(20260926, 'samplesize', input model, CV, GMR, n)"
    pk_model_check: "PK-model trials at n = 117 and the models' natural CV: S00 and F097 from section1 (10,000 trials), plus F_down_090 and F_down_095 (true AUC0-inf ratio 0.90 and 0.95), 5,000 trials each, both PK models, M0/M1/M2 with the operating-characteristic seeds; M0 verified against results/oc/oc_trials_be_<model>.csv.gz trials 1-2,000; compared with the analytic power at the same inputs and true ratios"
  n_needed: "smallest evaluable n per arm (integer) with analytic P2 power at least 90% and at least 85%, per CV, GMR, analysis model and input set; randomized n per arm = ceiling(n x 130 / 117)"
  out_dir: results/sample_size
  scripts: [scripts/47_sample_size.R]

# =====================================================================================================================
# 두 번째 추가 지시(표기일 2026-09-26): λz 신뢰 기준 관행값 민감도, 아토피 성인 체중 분포. 등록 2026-09-25, 이 절들의 결과 생성 전.
# 원칙: 저장된 대상자 수준 NCA를 먼저 쓰고, 체중 분포 변경분만 새로 모의한다. 시험 수준 기준 세트 (iii)·(iv)는 section1이 재생성하는
# 같은 경계·S00·F097 시험에서 함께 계산한다(section1 main 실행을 시험 1부터 다시 시작; section1 산출은 결정적이며 재시작 전 부분 산출과 같은지 검사).
section4:
  question: "λz 신뢰 기준을 SAP 관행 범위(adjusted R-squared 0.80 또는 0.90, span 요구 여부)로 바꿀 때 미달 비율, 미달의 비무작위성, AUC0-inf 규칙 A/B/C의 편향·경계 1종 오류, 판정 안정성이 어떻게 달라지는가"
  facts_for_documents:
    - "Phoenix WinNonlin: Lambda Z Acceptance Criteria on the Rules tab are optional user entries (minimum Rsq_adjusted, maximum AUC_%Extrap_obs or _pred, span); profiles not meeting them are flagged (Accepted / Not_Accepted), not excluded; no acceptance values are applied unless entered (Certara Phoenix 8.2 NCA documentation)"
    - "0.80 is a statistical-analysis-plan convention; 0.90, sometimes with a span of at least 3 half-lives, is common in public SAPs (NCT04117607: Rsq_adjusted at least 0.90 and span at least 3.0, verified; NCT04441905: Rsq_adjusted at least 0.90, verified; NCT04700163: as cited by the sponsor, not verified in this environment)"
  criteria_sets:                     # R/criteria.R CRIT_SETS (λz 산출 가능 전제)
    i:   {adj_r2_min: 0.80, extrap_max_pct: 20}
    ii:  {adj_r2_min: 0.80, extrap_max_pct: 20, span_ratio_min: 2}
    iii: {adj_r2_min: 0.90, extrap_max_pct: 20}
    iv:  {adj_r2_min: 0.90, extrap_max_pct: 20, span_ratio_min: 3}
  individual:
    sources: ["results/individual/nca_base_20000.rds (2016 model)", "results/individual/nca_struct2020_20000.rds (Model 1)", "section5 atopic populations (new simulation)"]
    schedule: B0
    metrics:
      - "failure share per set, split into lambda-z not estimable and estimable but failing, and the expected number per arm of 117"
      - "failing versus retained: mean body weight, geometric mean AUClast, median true extrapolated share"
      - "in failing subjects: AUClast / true AUC0-inf (median, 5th percentile)"
  trial:
    endpoints_added: [AUCinf_Aiii, AUCinf_Aiv, AUCinf_Ciii, AUCinf_Civ]
    analysis_models: [M0, M1]
    runs: "section1 regeneration (S00, 8 boundary cells, F097; trials 1-10,000 and the extension cells), output results/oc_models/oc_models_crit_be_<model>.csv.gz"
    configurations: "G2 (AUC0-inf + Cmax) for rule A under sets i to iv, rule B, rule C under sets i to iv"
    outputs:
      - "boundary type I error per configuration and analysis model (Wilson 95%), classification"
      - "bias of the AUC0-inf GMR per rule and set against the true AUC0-inf ratio"
      - "decision instability: share of trials in which the G2 decision changes (a) across all 9 rule-set variants, (b) across rules A, B, C within a set, (c) across sets within rule A and within rule C"
  restart_check: "section1 main runs restarted from trial 1 with the added endpoints; for the trials completed before the restart the section1 rows must be identical (est, se, pass, n) to the partial output of the first run (results/oc_models/restart_identity_check.csv)"
  reporting: "the failure share under set (i) is stated as the lower end of the conventional range, with the larger share under set (iii) given as numbers"
  scripts: [scripts/44_oc_models.R, scripts/51_criteria_sets.R]

section5:
  question: "아토피 피부염 성인 환자 체중 분포에서 신뢰할 수 있는 AUC0-inf를 얻지 못하는 비율, 그 체중 의존성, AUClast의 총노출 포착"
  population_config: config/population_atopic.yaml     # 분포 정의와 출처(자리표시자)
  distributions: [primary, sens_nct03389893, sens_75_18]
  weight_table: "shares within 60-90 kg, below 60 kg, above 90 kg, above 100 kg for each distribution: analytic (untruncated and truncated) and simulated; independent reference for the primary distribution untruncated: 16.5% below 60, 23.7% above 90, 12.4% above 100, 40.2% outside 60-90"
  model_variants: [base, struct2020, k2016_bmi_vc0817]
  individual:
    n_subjects: 20000
    dose_mg: 300
    schedule: B0
    seed: "master 20260923, tag atopic_<distribution> (same subjects across model variants)"
    metrics: "Pillar 1 (true extrapolated share, coverage below 80%), by weight band (below 60, 60-90, above 90, above 100 kg); section4 criteria-set failure shares and non-randomness; AUClast / true AUC0-inf in failing subjects"
  trial:
    distribution: primary
    n_per_arm: 117
    trials: 2000
    scenarios: [S00, F090, KE120, VM125, KM10]
    seed: "master 20260923 (operating-characteristic seed rule); stratified allocation with strata from the truncation range split at 75 kg"
    analysis_models: [M0, M1]
    endpoints: "Cmax, AUClast, AUC0-inf under rules A and C for sets i to iv and rule B, true AUC0-inf"
    truth: "true AUC0-inf and Cmax ratios per scenario in 20,000 subjects of the primary distribution (common random numbers, reference versus test parameters)"
    outputs: "bias per endpoint; agreement of the decision of AUClast + Cmax with each AUC0-inf configuration; difference between arms (test minus reference) in the share failing each criteria set, mean over trials with 95% interval"
  stress_test: "the earlier population normal(100, 20) kg truncated 60-150 kg (scripts/25) is reported as a stress test, not as a population estimate"
  phase3_data: "FDA BLA 761055 clinical pharmacology review and EMA Dupixent EPAR (2017) population PK sections could not be accessed from the analysis environment (egress blocked); the distribution stays a placeholder and the check is listed as a sponsor request"
  scripts: [scripts/52_atopic_population.R]

section6:
  directive: "정정 지시 2026-09-26: 근거 모집단 원칙과 시험 내 분석 보완"
  principle: "The case for not using AUC0-inf rests only on the trial population that demonstrates equivalence (healthy adults, 60-90 kg, randomization stratified by body weight). Patient-population and out-of-range body-weight results are not evidence; they are robustness checks in an appendix."
  demotion: "section5 (adult atopic dermatitis) results move to the appendix 'Robustness across body weight' with the 40-150 kg bands and the mean-100-kg population; no atopic number or sentence is cited in the synopsis, results, discussion, conclusions, SAP text or FDA question bodies; the phase 3 body-weight request is withdrawn; the atopic distribution stays an appendix placeholder with its sources"
