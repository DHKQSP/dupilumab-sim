  s2_1_failure_by_set:
    individual: "stored subject-level NCA, results/individual/nca_base_20000.rds (2016 model) and nca_struct2020_20000.rds (Model 1), schedule B0: per criteria set (i)-(iv) the share failing with Wilson 95% interval, split into lambda-z not estimable and estimable but failing; reasons both hierarchical (not estimable, then adjusted R-squared below the set threshold, then extrapolation above 20%, then span below the set threshold) and as non-exclusive flag shares"
