    public_saps: "NCT04117607 (adjusted R-squared at least 0.90, span at least 3.0 half-lives, at least 3 points after tmax; verified), NCT04441905 (adjusted R-squared at least 0.90, at least 3 points; verified), NCT04700163 (adjusted R-squared above 0.90, otherwise AUC(INF) and other terminal parameters excluded from summaries and statistical analysis; verified from a web-search excerpt, the site being blocked)"
