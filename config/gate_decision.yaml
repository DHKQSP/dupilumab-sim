# 단계 1 gate 판정 기록 (검토 의견 3차, 2026-09-23). 키 이름은 YAML 불리언 예약어를 피한다(D-021).
# 보고서(report/report.Rmd)는 decision_option 이 1 또는 2일 때 단계 2 이후 결과를 렌더링한다.
decision_option: 1
primary_model: kovalenko2016_blq
sensitivity_models: [kovalenko2020_model1]
decided_by: "reviewer, sponsor approved (Donghyun Kim)"
decision_date: "2026-09-23"
gate_scope: "study presentation only (300 mg as 2 mL of 150 mg/mL; 600 mg as 2 x 300 mg)"
