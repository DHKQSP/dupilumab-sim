# 기본 모델 고정효과 — 출처: Kovalenko P, et al. CPT Pharmacometrics Syst Pharmacol. 2016;5(11):617-624,
#   Table 2, "BLQ data included" 열. (검토 종합 지시서 2026-09-23 §2로 확정)
# 내부 이름 ↔ 논문 표기: Vc=V2, k12=k23, k21=k32. 단위: 시간 day, 양 mg, 용적 L, 농도 mg/L, 체중 kg.
model_id: k2016_2cmt_linMM_ka
units: {time: day, amount: mg, volume: L, conc: mg/L, weight: kg}
theta:
  Vc:   {value: 2.74,   unit: L,         status: confirmed, source: "Kovalenko 2016 Table 2 (V2, BLQ included)", note: "체중 공변량 기준값(75 kg)"}
  ke:   {value: 0.0459, unit: 1/day,     status: confirmed, source: "Kovalenko 2016 Table 2"}
  k12:  {value: 0.0652, unit: 1/day,     status: confirmed, source: "Kovalenko 2016 Table 2 (k23)"}
  k21:  {value: 0.129,  unit: 1/day,     status: confirmed, source: "Kovalenko 2016 Table 2 (k32)"}
  ka:   {value: 0.254,  unit: 1/day,     status: confirmed, source: "Kovalenko 2016 Table 2", note: "보정하지 않음(지시서 §1). scripts/01_calibrate_ka.R은 보관용"}
  Vmax: {value: 0.968,  unit: mg/L/day,  status: confirmed, source: "Kovalenko 2016 Table 2", note: "농도 단위 → 양 기준 식에서 Vc 곱함 (D-002)"}
  Km:   {value: 0.01,   unit: mg/L,      status: confirmed, source: "Kovalenko 2016 Table 2 (고정)", fixed: true}
  F:    {value: 0.607,  unit: fraction,  status: confirmed, source: "Kovalenko 2016 Table 2"}
covariates:
  WT_on_Vc:
    form: "Vc_i = Vc * (WT/WT_ref)^theta_WT"
    theta_WT: {value: 0.705, status: confirmed, source: "Kovalenko 2016 Table 2 (지시서 §2)"}
    WT_ref:   {value: 75, unit: kg, status: confirmed, source: "Kovalenko 2016 (지시서 §2: V2 = 2.74 × (WT/75)^0.705)"}
lloq_mg_L: {value: 0.078, status: confirmed, source: "Clot 2021 §2.4; 지시서 §2"}
